<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイバーダイス</title>
    <style>
        body { 
            margin: 0; padding: 20px; font-family: monospace; 
            background-color: #0f172a; color: #00f3ff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box;
        }
        h1 { margin: 0 0 20px 0; font-size: 2rem; text-shadow: 0 0 10px #00f3ff; }
        .dice-box { 
            width: 120px; height: 120px; border: 4px solid #00f3ff; border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            font-size: 4rem; font-weight: bold; background: #050814;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); margin-bottom: 30px;
        }
        .controls { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px; }
        input { 
            padding: 12px; border: 1px solid #475569; border-radius: 6px; 
            background: #1e293b; color: white; text-align: center; font-size: 1.2rem;
        }
        button { 
            padding: 15px; background: #00f3ff; color: #000; border: none; 
            border-radius: 8px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        .result { font-size: 1.2rem; margin-top: 15px; text-align: center; height: 30px; }
    </style>
</head>
<body>

    <h1>CYBER DICE</h1>
    <div class="dice-box" id="dice-display">?</div>
    
    <div class="controls">
        <label style="color:#94a3b8; font-size:0.9rem; text-align:center;">賭け金 (CR)</label>
        <input type="number" id="bet-amount" value="100" min="10">
        <button onclick="rollDice()">ROLL (偶数で2倍!)</button>
    </div>

    <div class="result" id="result-msg">賭け金を入力してROLLしてください。</div>

    <script>
        function rollDice() {
            const bet = parseInt(document.getElementById('bet-amount').value, 10);
            if (isNaN(bet) || bet <= 0) return alert("正しい金額を入力してください");

            // TODO: ここで親画面(main.html)に「所持金を減らす」リクエストを送る必要があります。
            // 現在は演出のみのモックアップです。

            const diceEl = document.getElementById('dice-display');
            const msgEl = document.getElementById('result-msg');
            
            // ローリング演出
            let rolls = 0;
            const rollInterval = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
                rolls++;
                if (rolls > 15) {
                    clearInterval(rollInterval);
                    const finalNum = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = finalNum;
                    
                    if (finalNum % 2 === 0) {
                        msgEl.style.color = '#00ff66';
                        msgEl.innerText = `WIN! ${bet * 2} CR獲得!`;
                    } else {
                        msgEl.style.color = '#ff0055';
                        msgEl.innerText = `LOSE... ${bet} CR没収`;
                    }
                }
            }, 50);
        }
    </script>
</body>
</html>
