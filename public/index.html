<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 2px; }
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; }
        
        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; }
        
        #sidebar { position: absolute; top: 20px; left: 20px; width: 250px; background: rgba(15,23,42,0.8); border-left: 3px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto;}
        .money { font-size: 1.5rem; color: #00ffff; font-weight: bold; }

        #minimap-container { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(2,6,23,0.8); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        #minimap { width: 100%; height: 100%; }

        #interaction-prompt { position: absolute; bottom: 20vh; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 1px solid #00ffff; padding: 10px 20px; border-radius: 20px; color: #00ffff; font-weight: bold; font-size: 1.2rem; display: none; }
        .key-btn { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }

        #controls-help { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; }

        #chat-container { position: absolute; bottom: 120px; left: 20px; width: 300px; background: rgba(15,23,42,0.8); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; }
        #chat-messages { height: 120px; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 5px; }
        #chat-messages div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        #chat-input { padding: 8px; border: none; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); color: white; outline: none; transition: 0.2s;}
        #chat-input:focus { background: rgba(0, 255, 255, 0.1); border-top: 1px solid #00ffff; }

        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password (Optional)">
            <button class="btn-primary" onclick="attemptAuth()">ENTER SYSTEM</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="sidebar">
            <div style="font-size: 0.8rem; color:#94a3b8;">ID: <span id="ui-username">---</span></div>
            <div class="money">CR: <span id="ui-money">500</span></div>
        </div>
        
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Enterでチャット開始 / 送信">
        </div>

        <div id="controls-help">
            [Click/Drag] 視点移動<br>
            [W A S D] 移動<br>
            [V] FPS/TPS切替<br>
            [F] アクション/乗降<br>
            [E]上昇 / [Q]下降 (ドローン)<br>
            [Enter] チャット切替
        </div>

        <div id="minimap-container">
            <canvas id="minimap" width="200" height="200"></canvas>
        </div>
        
        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let currentUsername = 'Guest', socket = null;
        let scene, camera, renderer, clock;
        const MAP_RADIUS = 1800; 
        
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isDragging = false, isFPS = false;
        
        let playerLocalPos = new THREE.Vector3(0, 1.5, 100); 
        let playerVelocityY = 0; 
        
        const trains = [], personalDrones = [], warpPads = [], stationAreas = []; 
        const colliders = []; // 壁の当たり判定用
        const otherPlayers = {}; 
        
        let ridingTrain = null, ridingDrone = null, localAvatar = null;
        let isWarping = false, fKeyWasPressed = false, vKeyWasPressed = false;
        let minimapCtx;
        
        let lastSentPos = new THREE.Vector3();
        let lastSentRot = 0;

        const TRAIN_BASE_SPEED = 0.08;
        const TRAIN_STOP_TIME = 5.0; 
        const TRAIN_SECTION_ANGLE = Math.PI / 2;
        const TRAIN_SECTION_MOVE_TIME = TRAIN_SECTION_ANGLE / TRAIN_BASE_SPEED; 
        const TRAIN_SECTION_TOTAL_TIME = TRAIN_SECTION_MOVE_TIME + TRAIN_STOP_TIME;
        const TRAIN_CYCLE_TIME = TRAIN_SECTION_TOTAL_TIME * 4; 

        async function attemptAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value || 'nopass';
            
            if (!username) return alert("Usernameを入力してください");

            try {
                let res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                let data = await res.json();
                
                if (!data.success) {
                    res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    data = await res.json();
                    if (!data.success) {
                        alert(data.message);
                        return;
                    }
                    res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    data = await res.json();
                }

                if (data.success) {
                    currentUsername = data.username;
                    document.getElementById('ui-username').innerText = currentUsername;
                    document.getElementById('ui-money').innerText = data.money || 500;
                    
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('ui-layer').style.display = 'block';
                    
                    try { 
                        if (typeof io !== 'undefined') {
                            socket = io({ auth: { username: currentUsername } }); 
                            setupSocketEvents();
                        }
                    } catch(e) { console.warn("Socket connection skipped.", e); }
                    
                    try { document.body.requestPointerLock(); } catch(e) {}
                    initThreeJS();
                } else {
                    alert("ログインに失敗しました");
                }
            } catch (err) {
                console.error(err);
                currentUsername = username;
                document.getElementById('ui-username').innerText = currentUsername;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('ui-layer').style.display = 'block';
                try { document.body.requestPointerLock(); } catch(e) {}
                initThreeJS();
            }
        }

        function updateRidingState() {
            if (!socket) return;
            const config = {
                ridingTrainIndex: ridingTrain ? trains.indexOf(ridingTrain) : -1,
                ridingDroneIndex: ridingDrone ? personalDrones.indexOf(ridingDrone) : -1
            };
            socket.emit('changeAvatarConfig', config);
        }

        function setupSocketEvents() {
            if (!socket) return;

            socket.on('initData', (data) => {
                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (info.username !== currentUsername && !otherPlayers[info.id]) {
                        addOtherPlayer(info);
                    }
                });
            });

            socket.on('newPlayer', (info) => {
                if (info.username !== currentUsername && !otherPlayers[info.id]) {
                    addOtherPlayer(info);
                }
            });

            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    otherPlayers[info.id].position.set(info.x, info.y, info.z);
                    otherPlayers[info.id].rotation.y = info.rotation;
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            });

            socket.on('chatMessage', (data) => {
                const msg = document.createElement('div');
                msg.innerHTML = `<strong style="color:#00ffff">${data.username}</strong>: ${data.text}`;
                document.getElementById('chat-messages').appendChild(msg);
                document.getElementById('chat-messages').scrollTop = 9999;
            });

            socket.on('avatarChanged', (data) => {
                if (otherPlayers[data.id] && data.avatar) {
                    otherPlayers[data.id].userData.ridingTrainIndex = data.avatar.ridingTrainIndex !== undefined ? data.avatar.ridingTrainIndex : -1;
                    otherPlayers[data.id].userData.ridingDroneIndex = data.avatar.ridingDroneIndex !== undefined ? data.avatar.ridingDroneIndex : -1;
                }
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x0a2a4a);
            scene.fog = new THREE.FogExp2(0x0a2a4a, 0.0006); 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 4000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x223355, 1.5));
            const hemiLight = new THREE.HemisphereLight(0x00ffff, 0xff00ff, 0.8);
            hemiLight.position.set(0, 1000, 0);
            scene.add(hemiLight);

            createEnvironment();
            createLandmarkTower();
            createMonorails();
            createDrones();
            createEntertainmentRoom(); // 地下エンタメ空間
            
            localAvatar = createAvatarMesh();
            scene.add(localAvatar);

            minimapCtx = document.getElementById('minimap').getContext('2d');
            clock = new THREE.Clock();
            
            setupInputHandlers();
            animate();
        }

        function createAvatarMesh(colorHex = 0x00ffff, username = null) {
            const group = new THREE.Group();
            const s = 2.5; 
            
            const bodyMat = new THREE.MeshStandardMaterial({color: colorHex, roughness: 0.2, metalness: 0.8});
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8*s, 1.2*s, 0.5*s), bodyMat);
            body.position.y = 0.6*s;
            
            const headMat = new THREE.MeshStandardMaterial({color: 0xffcc99});
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6*s, 0.6*s, 0.6*s), headMat);
            head.position.y = 1.5*s;
            
            const visorMat = new THREE.MeshBasicMaterial({color: 0x000000});
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.65*s, 0.2*s, 0.65*s), visorMat);
            visor.position.y = 1.5*s;
            
            group.add(body, head, visor);

            if (username) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(username, 128, 40);
                const tex = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.y = 2.2 * s; 
                sprite.scale.set(12, 3, 1);
                group.add(sprite);
            }

            return group;
        }

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(0x0284c7, info.username); 
            mesh.position.set(info.x, info.y, info.z);
            mesh.rotation.y = info.rotation;
            
            if (info.avatar) {
                mesh.userData.ridingTrainIndex = info.avatar.ridingTrainIndex !== undefined ? info.avatar.ridingTrainIndex : -1;
                mesh.userData.ridingDroneIndex = info.avatar.ridingDroneIndex !== undefined ? info.avatar.ridingDroneIndex : -1;
            } else {
                mesh.userData.ridingTrainIndex = -1;
                mesh.userData.ridingDroneIndex = -1;
            }

            scene.add(mesh);
            otherPlayers[info.id] = mesh;
        }

        function createEnvironment() {
            const ground = new THREE.Mesh(new THREE.CircleGeometry(MAP_RADIUS, 64), new THREE.MeshStandardMaterial({ color: 0x050a15, roughness: 0.9 }));
            ground.rotation.x = -Math.PI / 2; scene.add(ground);

            const gridHelper = new THREE.GridHelper(MAP_RADIUS * 2, 200, 0x00ffff, 0x020617);
            gridHelper.position.y = 0.1;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.2;
            scene.add(gridHelper);

            const roadMat = new THREE.MeshStandardMaterial({color: 0x1a1a24});
            const lineMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.8});
            
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const roadGrp = new THREE.Group();
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(80, MAP_RADIUS), roadMat);
                plane.rotation.x = -Math.PI/2; plane.position.z = MAP_RADIUS/2; plane.position.y = 0.15; roadGrp.add(plane);
                const line = new THREE.Mesh(new THREE.PlaneGeometry(4, MAP_RADIUS), lineMat);
                line.rotation.x = -Math.PI/2; line.position.z = MAP_RADIUS/2; line.position.y = 0.2; roadGrp.add(line);
                roadGrp.rotation.y = angle; scene.add(roadGrp);
            }

            // 四隅の巨大施設
            const corners = [
                {x: 1000, z: 1000, type: 'mall', color: 0x00ffff},
                {x: -1000, z: 1000, type: 'dome', color: 0xff00ff}, // 使用せずエンタメドームは南東へ
                {x: 1000, z: -1000, type: 'ent_dome', color: 0xffff00}, // エンタメドーム
                {x: -1000, z: -1000, type: 'drone_port', color: 0xff0000} // ドローン発着場
            ];

            corners.forEach(c => {
                const group = new THREE.Group();
                group.position.set(c.x, 0, c.z);
                const lookAngle = Math.atan2(-c.x, -c.z); 

                if (c.type === 'drone_port') {
                    // 大改装：巨大ドローンステーション
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(250, 280, 50, 6), new THREE.MeshStandardMaterial({color: 0x221111, roughness: 0.5, metalness: 0.6}));
                    base.position.y = 25;
                    group.add(base);
                    // コリジョン登録
                    colliders.push({ type: 'circle', x: c.x, z: c.z, radius: 250 });

                    const ring = new THREE.Mesh(new THREE.TorusGeometry(200, 5, 16, 64), new THREE.MeshBasicMaterial({color: 0xff0000, transparent:true, opacity:0.8}));
                    ring.rotation.x = Math.PI/2; ring.position.y = 52;
                    group.add(ring);
                    
                    const radar = new THREE.Mesh(new THREE.CylinderGeometry(20, 40, 300, 8), new THREE.MeshStandardMaterial({color: 0x111111}));
                    radar.position.y = 150;
                    group.add(radar);

                    // 4つの発着パッド
                    for(let i=0; i<4; i++) {
                        const angle = i * Math.PI/2;
                        const padX = Math.cos(angle) * 160;
                        const padZ = Math.sin(angle) * 160;
                        const subPad = new THREE.Mesh(new THREE.CylinderGeometry(40, 30, 10, 16), new THREE.MeshStandardMaterial({color: 0x331111}));
                        subPad.position.set(padX, 55, padZ);
                        group.add(subPad);
                        const subRing = new THREE.Mesh(new THREE.RingGeometry(25, 35, 32), new THREE.MeshBasicMaterial({color: 0xff4400, side: THREE.DoubleSide}));
                        subRing.rotation.x = -Math.PI/2; subRing.position.set(padX, 60.1, padZ);
                        group.add(subRing);
                        
                        // Hマーク
                        const hMat = new THREE.MeshBasicMaterial({color: 0xffffff});
                        const hGrp = new THREE.Group();
                        hGrp.add(new THREE.Mesh(new THREE.BoxGeometry(4, 2, 20), hMat).position.set(-8, 0, 0));
                        hGrp.add(new THREE.Mesh(new THREE.BoxGeometry(4, 2, 20), hMat).position.set(8, 0, 0));
                        hGrp.add(new THREE.Mesh(new THREE.BoxGeometry(12, 2, 4), hMat).position.set(0, 0, 0));
                        hGrp.position.set(padX, 60.2, padZ);
                        group.add(hGrp);
                    }

                    // エントランスゲート
                    const gateGroup = new THREE.Group();
                    const gateLeg1 = new THREE.Mesh(new THREE.BoxGeometry(10, 50, 10), new THREE.MeshStandardMaterial({color: 0x333333}));
                    gateLeg1.position.set(-40, 25, 0);
                    const gateLeg2 = new THREE.Mesh(new THREE.BoxGeometry(10, 50, 10), new THREE.MeshStandardMaterial({color: 0x333333}));
                    gateLeg2.position.set(40, 25, 0);
                    const gateTop = new THREE.Mesh(new THREE.BoxGeometry(90, 10, 10), new THREE.MeshBasicMaterial({color: 0xff0000}));
                    gateTop.position.set(0, 55, 0);
                    gateGroup.add(gateLeg1, gateLeg2, gateTop);
                    gateGroup.position.set(0, 0, 280); 
                    group.add(gateGroup);
                    
                } else if (c.type === 'ent_dome') {
                    // エンタメドームに大改装
                    const dome = new THREE.Mesh(new THREE.SphereGeometry(250, 32, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color: 0x222211, roughness: 0.2, metalness: 0.8}));
                    group.add(dome);
                    colliders.push({ type: 'circle', x: c.x, z: c.z, radius: 250 });

                    const wireDome = new THREE.Mesh(new THREE.SphereGeometry(255, 16, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshBasicMaterial({color: 0xffff00, wireframe: true, transparent:true, opacity:0.3}));
                    group.add(wireDome);

                    // 道に面した入り口
                    const gateGroup = new THREE.Group();
                    const gateArch = new THREE.Mesh(new THREE.TorusGeometry(50, 5, 16, 32, Math.PI), new THREE.MeshBasicMaterial({color: 0xffff00}));
                    gateArch.position.set(0, 0, 0);
                    gateGroup.add(gateArch);
                    gateGroup.position.set(0, 0, 255);
                    group.add(gateGroup);

                    // エンタメ空間へのワープ
                    createWarpPad(c.x + Math.sin(lookAngle)*230, 0, c.z + Math.cos(lookAngle)*230, 0xffff00, 5000, 1.5, -5000, "エンタメ空間へ");
                    
                } else {
                    // モールなど
                    const b = new THREE.Mesh(new THREE.BoxGeometry(400, 250, 400), new THREE.MeshStandardMaterial({color: 0x111122, roughness: 0.2}));
                    b.position.y = 125;
                    const edge = new THREE.Mesh(new THREE.BoxGeometry(405, 255, 405), new THREE.MeshBasicMaterial({color: c.color, wireframe: true, transparent:true, opacity:0.3}));
                    edge.position.y = 125;
                    group.add(b, edge);
                    
                    // 回転を考慮したBoxコリジョンは複雑なため、簡略化して円形コリジョンとする
                    colliders.push({ type: 'circle', x: c.x, z: c.z, radius: 200 });

                    // エントランス
                    const gateGroup = new THREE.Group();
                    const gateMat = new THREE.MeshBasicMaterial({color: c.color});
                    const gate1 = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 10), gateMat);
                    gate1.position.set(-40, 30, 0);
                    const gate2 = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 10), gateMat);
                    gate2.position.set(40, 30, 0);
                    const gate3 = new THREE.Mesh(new THREE.BoxGeometry(90, 10, 10), gateMat);
                    gate3.position.set(0, 65, 0);
                    gateGroup.add(gate1, gate2, gate3);
                    gateGroup.position.set(0, 0, 205);
                    group.add(gateGroup);
                }

                group.rotation.y = lookAngle;
                scene.add(group);
            });
        }

        function createLandmarkTower() {
            const towerGroup = new THREE.Group();
            const TOWER_Y = 1350; 
            
            const legMat = new THREE.MeshStandardMaterial({color: 0x0f172a, roughness: 0.3, metalness: 0.8});
            const frameMat = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.2});
            const neonMat = new THREE.MeshBasicMaterial({color: 0x00ffff});
            
            // 脚の修復と結合
            const legHeight = 500; // 脚をさらに長く
            for(let i=0; i<4; i++) {
                const angle = i * Math.PI/2 + Math.PI/4; 
                
                const legGrp = new THREE.Group();
                const legGeo = new THREE.CylinderGeometry(30, 80, legHeight, 8); // 太く
                const leg = new THREE.Mesh(legGeo, legMat);
                const legFrame = new THREE.Mesh(legGeo, frameMat); 
                leg.position.y = legHeight/2;
                legFrame.position.y = legHeight/2;
                
                // 角度をつけて中央に倒れ込ませる
                leg.rotation.x = -Math.PI/12;
                legFrame.rotation.x = -Math.PI/12;
                legGrp.add(leg, legFrame);

                const radius = 120; // 中心の寄せ具合
                const px = Math.cos(angle)*radius;
                const pz = Math.sin(angle)*radius;
                legGrp.position.set(px, 0, pz);
                legGrp.rotation.y = -angle - Math.PI/2;
                towerGroup.add(legGrp);
                
                // 脚のコリジョン
                colliders.push({ type: 'circle', x: px, z: pz, radius: 40 });
            }

            // メインタワー（脚の先端からガッチリ始まるように高さを調整）
            // legHeight(500) * cos(PI/12) ≒ 480。タワー底部をこの辺りにする
            const towerBottomY = 460;
            const towerGeo = new THREE.CylinderGeometry(40, 80, TOWER_Y - towerBottomY + 50, 16);
            const tower = new THREE.Mesh(towerGeo, legMat);
            const towerFrame = new THREE.Mesh(towerGeo, frameMat);
            tower.position.y = towerBottomY + (TOWER_Y - towerBottomY)/2;
            towerFrame.position.y = tower.position.y;
            towerGroup.add(tower, towerFrame);

            for(let i=0; i<6; i++) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(90 - i*10, 3, 8, 32), neonMat);
                ring.position.y = towerBottomY + 100 + i * 150;
                ring.rotation.x = Math.PI/2;
                towerGroup.add(ring);
            }

            createWarpPad(0, 0, 0, 0x00ffff, 0, TOWER_Y + 2, 100, "展望台へ昇る");

            const obsRadius = 250;
            const floorInner = new THREE.Mesh(new THREE.CylinderGeometry(150, 150, 20, 32), new THREE.MeshStandardMaterial({color: 0x1e293b, roughness: 0.1, metalness: 0.8}));
            floorInner.position.y = TOWER_Y - 10; towerGroup.add(floorInner);

        function createMonorails() {
            const rInner = 600, rOuter = 1200, trackY = 80;
            const railMat = new THREE.MeshBasicMaterial({color: 0xcccccc});
            const neonMatCyan = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent:true, opacity:0.4});
            const neonMatPink = new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe: true, transparent:true, opacity:0.4});
            const neonMatOrange = new THREE.MeshBasicMaterial({color: 0xffaa00, wireframe: true, transparent:true, opacity:0.4});
            
            const drawTrack = (radius, isOuter) => {
                const grp = new THREE.Group();
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius, 2, 8, 128), railMat).rotateX(Math.PI/2));
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius+1, 3, 4, 128), isOuter ? neonMatPink : neonMatCyan).rotateX(Math.PI/2));
                grp.position.y = trackY; scene.add(grp);
            };
            drawTrack(rInner, false); drawTrack(rOuter, true);

            const curvePts = [];
            for (let i = 0; i <= 128; i++) {
                const a = (i / 128) * Math.PI * 2;
                const r = 900 + 300 * Math.cos(2 * a);
                curvePts.push(new THREE.Vector3(Math.cos(a) * r, trackY, Math.sin(a) * r));
            }
            const curveSpline = new THREE.CatmullRomCurve3(curvePts, true);
            const curveGeo = new THREE.TubeGeometry(curveSpline, 128, 2, 8, true);
            const curveNeonGeo = new THREE.TubeGeometry(curveSpline, 128, 3, 4, true);
            scene.add(new THREE.Mesh(curveGeo, railMat));
            scene.add(new THREE.Mesh(curveNeonGeo, neonMatOrange));

            const addStation = (radius, angle) => {
                const rotY = -angle; 
                const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
                const group = new THREE.Group();
                
                const pWidth = 60, pDepth = 150;
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 2, pDepth), new THREE.MeshStandardMaterial({color: 0x334455})).translateY(-1));
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 2, pDepth), new THREE.MeshStandardMaterial({color: 0x222233})).translateY(20));
                
                const glass = new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3, side:THREE.DoubleSide});
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 15), glass).rotateY(Math.PI/2).translateZ(-pWidth/2).translateY(7.5));
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 15), glass).rotateY(Math.PI/2).translateZ(pWidth/2).translateY(7.5));

                group.position.set(x, trackY, z); group.rotation.y = rotY; scene.add(group);

                const dirX = Math.cos(angle), dirZ = Math.sin(angle);
                const offset = (radius === rInner) ? -20 : 20; 
                
                createWarpPad(x + dirX*offset, trackY, z + dirZ*offset, 0xff00ff, x + dirX*30, 1.5, z + dirZ*30, "地上へ");
                createWarpPad(x + dirX*30, 1, z + dirZ*30, 0x00ffff, x + dirX*offset, trackY+1.5, z + dirZ*offset, "駅ホームへ");

                stationAreas.push({ x, z, angle: rotY, width: pWidth, depth: pDepth });
            };

            for(let i=0; i<4; i++) {
                addStation(rInner, i * Math.PI/2);
                addStation(rOuter, i * Math.PI/2);
            }

            const spawnTrain = (radius, initAngle, type) => {
                const carColor = type === 'curve' ? 0xffaa00 : (type === 'outer' ? 0xff00ff : 0x00ffff);
                const car = new THREE.Group();
                car.add(new THREE.Mesh(new THREE.BoxGeometry(14, 2, 40), new THREE.MeshStandardMaterial({color: 0x111122})));
                car.add(new THREE.Mesh(new THREE.BoxGeometry(14, 2, 40), new THREE.MeshStandardMaterial({color: 0x111122})).translateY(18));
                
                const wGlass = new THREE.MeshStandardMaterial({color: carColor, transparent:true, opacity:0.3, side:THREE.DoubleSide});
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(40, 16), wGlass).rotateY(Math.PI/2).translateZ(-7).translateY(9));
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(10, 16), wGlass).rotateY(Math.PI/2).translateZ(7).translateY(9).translateX(15));
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(10, 16), wGlass).rotateY(Math.PI/2).translateZ(7).translateY(9).translateX(-15));
                
                scene.add(car);
                trains.push({ mesh: car, radius, angle: initAngle, speed: 0.08, state: 'moving', timer: 0, type: type, justDeparted: false });
            };
            
            spawnTrain(rInner, 0, 'inner'); spawnTrain(rInner, Math.PI, 'inner');
            spawnTrain(rOuter, Math.PI/2, 'outer'); spawnTrain(rOuter, Math.PI*1.5, 'outer');
            spawnTrain(null, Math.PI/4, 'curve'); spawnTrain(null, Math.PI*1.25, 'curve'); 
        }

        function createDrones() {
            // ドローン発着場 (-1000, -1000) のパッドの上に並べる
            const cX = -1000, cZ = -1000, hY = 60; // パッドの高さ
            
            const positions = [];
            for(let i=0; i<4; i++) {
                const angle = i * Math.PI/2;
                // パッドの中心座標を計算
                const px = cX + Math.cos(angle) * 160;
                const pz = cZ + Math.sin(angle) * 160;
                positions.push({x: px, z: pz, rot: -angle});
            }
            
            positions.forEach(pos => {
                const grp = new THREE.Group();
                grp.add(new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 3, 8), new THREE.MeshStandardMaterial({color: 0x222222})));
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(10, 1, 8, 16), new THREE.MeshBasicMaterial({color: 0x00ffff})).rotateX(Math.PI/2));
                grp.position.set(pos.x, hY + 1.5, pos.z);
                grp.rotation.y = pos.rot;
                scene.add(grp);
                personalDrones.push(grp);
            });
        }

        function setupInputHandlers() {
            window.addEventListener('keydown', e => {
                const chatInput = document.getElementById('chat-input');
                if (e.key === 'Enter') {
                    if (document.activeElement === chatInput) {
                        if (chatInput.value.trim() !== '') {
                            if (socket) {
                                socket.emit('chatMessage', chatInput.value);
                            } else {
                                const msg = document.createElement('div');
                                msg.innerHTML = `<strong>${currentUsername}</strong>: ${chatInput.value}`;
                                document.getElementById('chat-messages').appendChild(msg);
                                document.getElementById('chat-messages').scrollTop = 9999;
                            }
                            chatInput.value = '';
                        }
                        chatInput.blur(); 
                    } else {
                        chatInput.focus(); 
                    }
                    return; 
                }
                if (document.activeElement !== chatInput) keysPressed[e.key.toLowerCase()] = true;
            });

            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
            
            const canvas = document.getElementById('canvas-container');
            canvas.addEventListener('mousedown', () => { isDragging = true; try { document.body.requestPointerLock(); } catch(e){} });
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            
            document.addEventListener('mousemove', e => {
                if (isLocked || isDragging) {
                    cameraYaw -= e.movementX * 0.002;
                    cameraPitch -= e.movementY * 0.002;
                    cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                }
            });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }

        function updateMinimap() {
            if (!minimapCtx) return;
            const ctx = minimapCtx;
            ctx.clearRect(0, 0, 200, 200);
            
            ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(100, 100, 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(136, 204, 255, 0.4)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(100, 100, (600/MAP_RADIUS)*100, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(100, 100, (1200/MAP_RADIUS)*100, 0, Math.PI*2); ctx.stroke();

            const px = 100 + (playerLocalPos.x / MAP_RADIUS) * 100;
            const py = 100 + (playerLocalPos.z / MAP_RADIUS) * 100;
            ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.sin(cameraYaw)*12, py - Math.cos(cameraYaw)*12); ctx.stroke();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            const vPressed = keysPressed['v'];
            if (vPressed && !vKeyWasPressed) { isFPS = !isFPS; }
            vKeyWasPressed = vPressed;

            const fPressed = keysPressed['f'];
            let tryInteract = fPressed && !fKeyWasPressed;
            fKeyWasPressed = fPressed;

            // 列車の絶対時間同期
            const nowSec = Date.now() / 1000;
            trains.forEach(t => {
                const timeOffset = (t.initialAngle / TRAIN_SECTION_ANGLE) * TRAIN_SECTION_TOTAL_TIME;
                const currentT = (nowSec + timeOffset) % TRAIN_CYCLE_TIME;
                
                const currentSection = Math.floor(currentT / TRAIN_SECTION_TOTAL_TIME);
                const timeInSection = currentT % TRAIN_SECTION_TOTAL_TIME;
                
                let newAngle = currentSection * TRAIN_SECTION_ANGLE;
                
                if (timeInSection < TRAIN_SECTION_MOVE_TIME) {
                    newAngle += timeInSection * TRAIN_BASE_SPEED;
                    t.state = 'moving';
                } else {
                    newAngle += TRAIN_SECTION_ANGLE;
                    t.state = 'stopped';
                }
                
                t.angle = newAngle % (Math.PI * 2);

                let r = t.radius;
                let dr = 0;
                if (t.type === 'curve') {
                    r = 900 + 300 * Math.cos(2 * t.angle);
                    dr = -600 * Math.sin(2 * t.angle);
                    t.radius = r;
                }
                const pt = new THREE.Vector3(Math.cos(t.angle) * r, 80, Math.sin(t.angle) * r);
                
                const dx = dr * Math.cos(t.angle) - r * Math.sin(t.angle);
                const dz = dr * Math.sin(t.angle) + r * Math.cos(t.angle);
                const rot = Math.atan2(dx, dz);

                t.mesh.position.copy(pt); t.mesh.rotation.y = rot;
            });

            // インタラクション判定
            let promptText = "", interactTarget = null;
            
            if (ridingDrone) {
                promptText = "ドローンから降りる";
                if (tryInteract) { ridingDrone = null; playerLocalPos.y += 2; updateRidingState(); }
            } else if (ridingTrain) {
                const pt = ridingTrain.mesh.position;
                playerLocalPos.set(pt.x, pt.y + 2, pt.z); 

                let canAlight = false;
                let nearestStation = null;
                for (let st of stationAreas) {
                    if (Math.hypot(pt.x - st.x, pt.z - st.z) < 60) {
                        canAlight = true; nearestStation = st; break;
                    }
                }

                if (canAlight) {
                    promptText = "駅で降りる";
                    if (tryInteract) {
                        const offset = (ridingTrain.radius === 600) ? -20 : 20;
                        const dirX = Math.cos(nearestStation.angle);
                        const dirZ = Math.sin(nearestStation.angle);
                        playerLocalPos.set(nearestStation.x + dirX*offset, 81.5, nearestStation.z + dirZ*offset);
                        ridingTrain = null;
                        updateRidingState();
                    }
                } else {
                    promptText = "走行中... (駅で降りられます)";
                }
            } else if (!isWarping) {
                let foundInteract = false;
                for (let t of trains) {
                    if (t.state === 'stopped' && Math.abs(playerLocalPos.y - t.mesh.position.y) < 15 && playerLocalPos.distanceTo(t.mesh.position) < 40) {
                        promptText = "列車に乗る"; 
                        interactTarget = () => { ridingTrain = t; updateRidingState(); };
                        foundInteract = true;
                        break;
                    }
                }

                if (!foundInteract) {
                    for (let w of warpPads) {
                        if (playerLocalPos.distanceTo(w.mesh.position) < 15 && Math.abs(playerLocalPos.y - w.mesh.position.y) < 10) {
                            promptText = w.label; 
                            interactTarget = () => { 
                                isWarping = true; 
                                playerLocalPos.copy(w.target); 
                                setTimeout(() => { isWarping = false; playerVelocityY = 0; }, 500); 
                            }; 
                            foundInteract = true;
                            break;
                        }
                    }
                }

                if (!foundInteract) {
                    for (let i = 0; i < personalDrones.length; i++) {
                        const d = personalDrones[i];
                        if (playerLocalPos.distanceTo(d.position) < 15 && Math.abs(playerLocalPos.y - d.position.y) < 10) {
                            
                            let isOccupied = false;
                            Object.values(otherPlayers).forEach(p => {
                                if (p.userData.ridingDroneIndex === i) isOccupied = true;
                            });

                            if (!isOccupied) {
                                promptText = "ドローンに乗る"; 
                                interactTarget = () => { ridingDrone = d; playerLocalPos.copy(d.position); playerLocalPos.y += 4; updateRidingState(); }; 
                                break;
                            }
                        }
                    }
                }
                
                if (interactTarget && tryInteract) interactTarget();
            }

            const promptEl = document.getElementById('interaction-prompt');
            if (promptText) { document.getElementById('prompt-text').innerText = promptText; promptEl.style.display = 'block'; }
            else promptEl.style.display = 'none';

            // WASD移動とコリジョン
            if (!isWarping && !ridingTrain && document.activeElement !== document.getElementById('chat-input')) {
                const speed = (keysPressed['shift'] ? 120 : 50) * delta;
                
                const fwd = new THREE.Vector3();
                camera.getWorldDirection(fwd);
                fwd.y = 0; fwd.normalize();
                const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
                
                let mv = new THREE.Vector3();
                if (keysPressed['w']) mv.add(fwd);
                if (keysPressed['s']) mv.sub(fwd);
                if (keysPressed['a']) mv.sub(right); 
                if (keysPressed['d']) mv.add(right); 
                if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed);

                let nextPos = new THREE.Vector3(playerLocalPos.x + mv.x, playerLocalPos.y, playerLocalPos.z + mv.z);

                // --- 物理コリジョン（壁・建物） ---
                if (!ridingDrone && !ridingTrain && !isWarping) {
                    let y = playerLocalPos.y;
                    
                    // 展望台ドームの壁
                    if (Math.abs(y - 1350) < 20) {
                        const dist = Math.hypot(nextPos.x, nextPos.z);
                        if (dist > 245) { 
                            const angle = Math.atan2(nextPos.z, nextPos.x);
                            nextPos.x = Math.cos(angle) * 245;
                            nextPos.z = Math.sin(angle) * 245;
                        }
                    } 
                    // 駅ホームの壁
                    else if (Math.abs(y - 80) < 20) {
                        let currentSt = null;
                        for (let st of stationAreas) {
                            const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                            const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                            const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) {
                                currentSt = st; break;
                            }
                        }
                        
                        if (currentSt) {
                            const dx = nextPos.x - currentSt.x, dz = nextPos.z - currentSt.z;
                            const cos = Math.cos(-currentSt.angle), sin = Math.sin(-currentSt.angle);
                            let lx = dx * cos - dz * sin;
                            let lz = dx * sin + dz * cos;
                            
                            const hw = currentSt.width/2 - 1.5; 
                            const hd = currentSt.depth/2 - 1.5;
                            
                            if (lx > hw) lx = hw;
                            if (lx < -hw) lx = -hw;
                            if (lz > hd) lz = hd;
                            if (lz < -hd) lz = -hd;
                            
                            const cosInv = Math.cos(currentSt.angle), sinInv = Math.sin(currentSt.angle);
                            nextPos.x = currentSt.x + lx * cosInv - lz * sinInv;
                            nextPos.z = currentSt.z + lx * sinInv + lz * cosInv;
                        }
                    }
                    // 地上の巨大施設の壁
                    else if (y < 20) {
                        for (let col of colliders) {
                            if (col.type === 'circle') {
                                const dist = Math.hypot(nextPos.x - col.x, nextPos.z - col.z);
                                if (dist < col.radius) {
                                    const angle = Math.atan2(nextPos.z - col.z, nextPos.x - col.x);
                                    nextPos.x = col.x + Math.cos(angle) * col.radius;
                                    nextPos.z = col.z + Math.sin(angle) * col.radius;
                                }
                            }
                        }
                        // エンタメ地下空間の壁
                        if (nextPos.x > 4900 && nextPos.x < 5100 && nextPos.z > -5100 && nextPos.z < -4900) {
                            if(nextPos.x < 4905) nextPos.x = 4905;
                            if(nextPos.x > 5095) nextPos.x = 5095;
                            if(nextPos.z < -5095) nextPos.z = -5095;
                            if(nextPos.z > -4905) nextPos.z = -4905;
                        }
                    }
                }
                
                if (ridingDrone) {
                    let nextY = playerLocalPos.y;
                    if (keysPressed['e']) nextY += 60 * delta; 
                    if (keysPressed['q']) nextY -= 60 * delta; 
                    nextY = Math.max(1, nextY);
                    playerLocalPos.set(nextPos.x, nextY, nextPos.z);
                    ridingDrone.position.copy(playerLocalPos); ridingDrone.position.y -= 4;
                } else {
                    playerLocalPos.x = nextPos.x;
                    playerLocalPos.z = nextPos.z;
                }
            }

            // 重力と落下処理
            if (!ridingDrone && !ridingTrain && !isWarping) {
                let groundY = 1.5; 
                
                if (Math.abs(playerLocalPos.y - 1350) < 20 && Math.hypot(playerLocalPos.x, playerLocalPos.z) < 245) {
                    groundY = 1350;
                } else if (Math.abs(playerLocalPos.y - 80) < 20) {
                    let onStation = false;
                    for (let st of stationAreas) {
                        const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                        const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                        const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                        if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) {
                            onStation = true; break;
                        }
                    }
                    if (onStation) groundY = 80;
                } else if (playerLocalPos.x > 4900 && playerLocalPos.z < -4900) {
                    groundY = 0.1; // エンタメ空間床
                }

                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 40 * delta; 
                    playerLocalPos.y += playerVelocityY * delta;
                    if (playerLocalPos.y <= groundY) {
                        playerLocalPos.y = groundY;
                        playerVelocityY = 0;
                    }
                } else {
                    playerLocalPos.y = groundY;
                    playerVelocityY = 0;
                }
            }

            // 自キャラアバターの更新と通信
            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.visible = !isFPS;
                
                if (ridingTrain) {
                    localAvatar.rotation.y = ridingTrain.mesh.rotation.y;
                } else if (!isWarping && !ridingDrone && document.activeElement !== document.getElementById('chat-input')) {
                    if (keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d']) {
                        let targetYaw = cameraYaw;
                        if (keysPressed['s']) targetYaw += Math.PI;
                        else if (keysPressed['a']) targetYaw += Math.PI/2;
                        else if (keysPressed['d']) targetYaw -= Math.PI/2;
                        localAvatar.rotation.y = targetYaw;
                    } else {
                        localAvatar.rotation.y = cameraYaw;
                    }
                }

                if (socket) {
                    const distSq = lastSentPos.distanceToSquared(playerLocalPos);
                    const rotDiff = Math.abs(lastSentRot - localAvatar.rotation.y);
                    if (distSq > 0.05 || rotDiff > 0.05) {
                        socket.emit('playerMovement', {
                            x: playerLocalPos.x,
                            y: playerLocalPos.y,
                            z: playerLocalPos.z,
                            rotation: localAvatar.rotation.y
                        });
                        lastSentPos.copy(playerLocalPos);
                        lastSentRot = localAvatar.rotation.y;
                    }
                }
            }

            Object.values(otherPlayers).forEach(mesh => {
                if (mesh.userData.ridingTrainIndex >= 0) {
                    const t = trains[mesh.userData.ridingTrainIndex];
                    if (t) {
                        mesh.position.set(t.mesh.position.x, t.mesh.position.y + 2, t.mesh.position.z);
                        mesh.rotation.y = t.mesh.rotation.y;
                    }
                }
                if (mesh.userData.ridingDroneIndex >= 0) {
                    const d = personalDrones[mesh.userData.ridingDroneIndex];
                    if (d) {
                        d.position.copy(mesh.position);
                        d.position.y -= 4; 
                    }
                }
            });

            // カメラの追従
            const camTarget = playerLocalPos.clone();
            if (isFPS) {
                camera.position.copy(camTarget); camera.position.y += 1.6 * 2.5;
            } else {
                const offset = new THREE.Vector3(Math.sin(cameraYaw)*35, 20 + Math.sin(cameraPitch)*20, Math.cos(cameraYaw)*35);
                camera.position.copy(camTarget).add(offset);
                camTarget.y += 4; 
            }
            const lookDir = new THREE.Vector3(-Math.sin(cameraYaw) * Math.cos(cameraPitch), Math.sin(cameraPitch), -Math.cos(cameraYaw) * Math.cos(cameraPitch));
            camera.lookAt(camera.position.clone().add(lookDir));

            updateMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
