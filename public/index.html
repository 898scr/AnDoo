<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 2px; }
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; }
        
        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; }
        
        #sidebar { position: absolute; top: 20px; left: 20px; width: 250px; background: rgba(15,23,42,0.8); border-left: 3px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto;}
        .money { font-size: 1.5rem; color: #00ffff; font-weight: bold; }

        #minimap-container { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(2,6,23,0.8); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        #minimap { width: 100%; height: 100%; }

        #interaction-prompt { position: absolute; bottom: 20vh; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); border: 2px solid #00ffff; padding: 10px 20px; border-radius: 20px; color: #00ffff; font-weight: bold; font-size: 1.2rem; display: none; box-shadow: 0 0 15px rgba(0,255,255,0.5);}
        .key-btn { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }

        #controls-help { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; }

        #chat-container { position: absolute; bottom: 120px; left: 20px; width: 300px; background: rgba(15,23,42,0.8); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; }
        #chat-messages { height: 120px; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 5px; }
        #chat-messages div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        #chat-input { padding: 8px; border: none; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); color: white; outline: none; transition: 0.2s;}
        #chat-input:focus { background: rgba(0, 255, 255, 0.1); border-top: 1px solid #00ffff; }

        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password (Optional)">
            <button class="btn-primary" onclick="attemptAuth()">ENTER SYSTEM</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="sidebar">
            <div style="font-size: 0.8rem; color:#94a3b8;">ID: <span id="ui-username">---</span></div>
            <div class="money">CR: <span id="ui-money">500</span></div>
            <div style="font-size: 0.8rem; color:#94a3b8; margin-top:5px;">株: <span id="ui-stocks">0</span> 株</div>
        </div>
        
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Enterでチャット開始 / 送信">
        </div>

        <div id="controls-help">
            [Click/Drag] 視点移動<br>
            [W A S D] 移動<br>
            [V] FPS/TPS切替<br>
            [F] アクション/購入/乗降<br>
            [E]上昇 / [Q]下降 (ドローン)<br>
            [Enter] チャット切替
        </div>

        <div id="minimap-container">
            <canvas id="minimap" width="200" height="200"></canvas>
        </div>
        
        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let currentUsername = 'Guest', socket = null;
        let scene, camera, renderer, clock;
        const MAP_RADIUS = 2500; 
        
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isDragging = false, isFPS = false;
        
        let playerLocalPos = new THREE.Vector3(0, 1.5, 100); 
        let playerVelocityY = 0; 
        
        // プレイヤーのステータスと持ち物
        let currentCR = 500;
        let currentStocks = 0;
        let playerColor = 0x00ffff;
        let playerAccessory = 'none';
        let playerSpeedMult = 1.0;

        const trains = [], personalDrones = [], warpPads = [], stationAreas = []; 
        const otherPlayers = {}; 
        
        let ridingTrain = null, ridingDrone = null, localAvatar = null;
        let isWarping = false, fKeyWasPressed = false, vKeyWasPressed = false;
        let minimapCtx;
        
        let lastSentPos = new THREE.Vector3();
        let lastSentRot = 0;

        // --- ミニゲーム・経済用変数 ---
        const interactables = []; // { pos, radius, label, action }
        const slotMachines = [];
        let hockeyPuck = null;
        let hockeyPuckVel = new THREE.Vector3();

        let currentStockPrice = 100;
        let stockHistory = Array(50).fill(100);
        const stockCanvas = document.createElement('canvas');
        stockCanvas.width = 512; stockCanvas.height = 256;
        const stockCtx = stockCanvas.getContext('2d');
        const stockTex = new THREE.CanvasTexture(stockCanvas);

        // --- モノレール同期定数 ---
        const TRAIN_BASE_SPEED = 0.12; // 速度アップ
        const TRAIN_STOP_TIME = 4.0; 
        const TRAIN_SECTION_ANGLE = Math.PI / 2;

        function updateCR(amt) {
            currentCR += amt;
            document.getElementById('ui-money').innerText = currentCR;
        }

        function addChatMessage(sender, text) {
            const msg = document.createElement('div');
            msg.innerHTML = `<strong style="color:${sender==='SYSTEM'?'#ff00ff':'#00ffff'}">${sender}</strong>: ${text}`;
            document.getElementById('chat-messages').appendChild(msg);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        async function attemptAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value || 'nopass';
            if (!username) return alert("Usernameを入力してください");

            try {
                let res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                let data = await res.json();
                if (!data.success) {
                    res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                    data = await res.json();
                    if (!data.success) return alert(data.message);
                    res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                    data = await res.json();
                }

                if (data.success) {
                    currentUsername = data.username;
                    currentCR = data.money || 500;
                    document.getElementById('ui-username').innerText = currentUsername;
                    document.getElementById('ui-money').innerText = currentCR;
                    
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('ui-layer').style.display = 'block';
                    
                    try { if (typeof io !== 'undefined') { socket = io({ auth: { username: currentUsername } }); setupSocketEvents(); } } catch(e) { console.warn("Socket skip"); }
                    try { document.body.requestPointerLock(); } catch(e) {}
                    initThreeJS();
                } else alert("ログイン失敗");
            } catch (err) {
                // ローカルテスト用フォールバック
                currentUsername = username;
                document.getElementById('ui-username').innerText = currentUsername;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('ui-layer').style.display = 'block';
                try { document.body.requestPointerLock(); } catch(e) {}
                initThreeJS();
            }
        }

        function updateAvatarAppearance() {
            if (!localAvatar) return;
            // 体の色の更新
            localAvatar.children[0].material.color.setHex(playerColor);
            
            // アクセサリの表示切り替え
            localAvatar.children.forEach(child => {
                if (child.userData.isAccessory) {
                    child.visible = (child.userData.accType === playerAccessory);
                }
            });

            if (socket) {
                socket.emit('changeAvatarConfig', {
                    color: playerColor,
                    accessory: playerAccessory,
                    ridingTrainIndex: ridingTrain ? trains.indexOf(ridingTrain) : -1,
                    ridingDroneIndex: ridingDrone ? personalDrones.indexOf(ridingDrone) : -1
                });
            }
        }

        function setupSocketEvents() {
            if (!socket) return;
            socket.on('initData', (data) => {
                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info);
                });
            });
            socket.on('newPlayer', (info) => { if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info); });
            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    otherPlayers[info.id].position.set(info.x, info.y, info.z);
                    otherPlayers[info.id].rotation.y = info.rotation;
                }
            });
            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
            });
            socket.on('chatMessage', (data) => addChatMessage(data.username, data.text));
            socket.on('avatarChanged', (data) => {
                if (otherPlayers[data.id] && data.avatar) {
                    const mesh = otherPlayers[data.id];
                    mesh.userData.ridingTrainIndex = data.avatar.ridingTrainIndex !== undefined ? data.avatar.ridingTrainIndex : -1;
                    mesh.userData.ridingDroneIndex = data.avatar.ridingDroneIndex !== undefined ? data.avatar.ridingDroneIndex : -1;
                    if (data.avatar.color) mesh.children[0].material.color.setHex(data.avatar.color);
                    if (data.avatar.accessory) {
                        mesh.children.forEach(child => {
                            if (child.userData.isAccessory) child.visible = (child.userData.accType === data.avatar.accessory);
                        });
                    }
                }
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x051024);
            scene.fog = new THREE.FogExp2(0x051024, 0.0004); 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 8000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x223355, 1.5));
            const hemiLight = new THREE.HemisphereLight(0x00ffff, 0xff00ff, 0.8);
            hemiLight.position.set(0, 1000, 0);
            scene.add(hemiLight);

            createEnvironment();
            createUndergroundRooms();
            createLandmarkTower();
            createMonorails();
            createDrones();
            
            localAvatar = createAvatarMesh(playerColor);
            updateAvatarAppearance();
            scene.add(localAvatar);

            minimapCtx = document.getElementById('minimap').getContext('2d');
            clock = new THREE.Clock();
            
            setupInputHandlers();
            
            // 株価の自動変動ループ（デモ用）
            setInterval(() => {
                currentStockPrice = Math.max(10, Math.floor(currentStockPrice * (1 + (Math.random()-0.5)*0.3)));
                stockHistory.push(currentStockPrice);
                stockHistory.shift();
                updateStockChart();
            }, 5000);

            animate();
        }

        function createAvatarMesh(colorHex = 0x00ffff, username = null) {
            const group = new THREE.Group();
            const s = 2.5; 
            
            const bodyMat = new THREE.MeshStandardMaterial({color: colorHex, roughness: 0.2, metalness: 0.8});
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8*s, 1.2*s, 0.5*s), bodyMat);
            body.position.y = 0.6*s;
            
            const headMat = new THREE.MeshStandardMaterial({color: 0xffcc99});
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6*s, 0.6*s, 0.6*s), headMat);
            head.position.y = 1.5*s;
            
            const visorMat = new THREE.MeshBasicMaterial({color: 0x000000});
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.65*s, 0.2*s, 0.65*s), visorMat);
            visor.position.y = 1.5*s;
            
            group.add(body, head, visor);

            // アクセサリ: 猫耳
            const earGeo = new THREE.ConeGeometry(0.2*s, 0.4*s, 4);
            const earL = new THREE.Mesh(earGeo, bodyMat); earL.position.set(-0.2*s, 1.9*s, 0);
            const earR = new THREE.Mesh(earGeo, bodyMat); earR.position.set(0.2*s, 1.9*s, 0);
            const catEars = new THREE.Group(); catEars.add(earL, earR);
            catEars.userData = { isAccessory: true, accType: 'cat_ears' };
            catEars.visible = false;
            group.add(catEars);

            // アクセサリ: ハット
            const hatGrp = new THREE.Group();
            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.4*s, 0.4*s, 0.1*s, 16), new THREE.MeshStandardMaterial({color:0x222222})).translateY(1.8*s));
            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25*s, 0.25*s, 0.5*s, 16), new THREE.MeshStandardMaterial({color:0x111111})).translateY(2.1*s));
            hatGrp.userData = { isAccessory: true, accType: 'hat' };
            hatGrp.visible = false;
            group.add(hatGrp);

            if (username) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(username, 128, 40);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
                sprite.position.y = 2.4 * s; sprite.scale.set(12, 3, 1);
                group.add(sprite);
            }
            return group;
        }

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(0x0284c7, info.username); 
            mesh.position.set(info.x, info.y, info.z);
            mesh.rotation.y = info.rotation;
            if (info.avatar) {
                mesh.userData.ridingTrainIndex = info.avatar.ridingTrainIndex !== undefined ? info.avatar.ridingTrainIndex : -1;
                mesh.userData.ridingDroneIndex = info.avatar.ridingDroneIndex !== undefined ? info.avatar.ridingDroneIndex : -1;
                if(info.avatar.color) mesh.children[0].material.color.setHex(info.avatar.color);
                if(info.avatar.accessory) {
                    mesh.children.forEach(c => { if(c.userData.isAccessory) c.visible = (c.userData.accType === info.avatar.accessory); });
                }
            } else {
                mesh.userData.ridingTrainIndex = -1; mesh.userData.ridingDroneIndex = -1;
            }
            scene.add(mesh);
            otherPlayers[info.id] = mesh;
        }

        function createEnvironment() {
            const ground = new THREE.Mesh(new THREE.CircleGeometry(MAP_RADIUS, 64), new THREE.MeshStandardMaterial({ color: 0x050a15, roughness: 0.9 }));
            ground.rotation.x = -Math.PI / 2; scene.add(ground);

            const gridHelper = new THREE.GridHelper(MAP_RADIUS * 2, 200, 0x00ffff, 0x020617);
            gridHelper.position.y = 0.1; gridHelper.material.transparent = true; gridHelper.material.opacity = 0.2;
            scene.add(gridHelper);

            const roadMat = new THREE.MeshStandardMaterial({color: 0x1a1a24});
            const lineMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.8});
            
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const roadGrp = new THREE.Group();
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(80, MAP_RADIUS), roadMat);
                plane.rotation.x = -Math.PI/2; plane.position.z = MAP_RADIUS/2; plane.position.y = 0.15; roadGrp.add(plane);
                const line = new THREE.Mesh(new THREE.PlaneGeometry(4, MAP_RADIUS), lineMat);
                line.rotation.x = -Math.PI/2; line.position.z = MAP_RADIUS/2; line.position.y = 0.2; roadGrp.add(line);
                roadGrp.rotation.y = angle; scene.add(roadGrp);
            }

            // 四隅の巨大施設（すべて円柱に統一し、入り口を道へ向ける）
            const corners = [
                {x: 1300, z: 1300, col: 0x00ffff, name: "mall", label: "モールへ入る", target: new THREE.Vector3(0, 1.5, 5000)}, 
                {x: -1300, z: 1300, col: 0xff00ff, name: "dome", label: "エンタメドームへ", target: new THREE.Vector3(0, 1.5, -5000)},
                {x: 1300, z: -1300, col: 0x00ff00, name: "stock", label: "証券取引所へ", target: new THREE.Vector3(5000, 1.5, 0)}, 
                {x: -1300, z: -1300, col: 0xff0000, name: "drone", label: "発着パッドへ昇る", target: new THREE.Vector3(-1300, 60.5, -1300)}
            ];

            corners.forEach(c => {
                const group = new THREE.Group();
                const lookAngle = Math.atan2(-c.x, -c.z); // 原点方向の角度
                
                // コリジョン用（壁）のデータ登録
                stationAreas.push({ type: 'wall', x: c.x, z: c.z, radius: 200 });

                if (c.name === "mall") {
                    // モール: 3層の豪華なガラスシリンダー
                    for(let i=0; i<3; i++) {
                        const r = 200 - i*20;
                        const floor = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 60, 32), new THREE.MeshStandardMaterial({color: 0x112233, roughness: 0.2}));
                        floor.position.y = 30 + i*60;
                        const glass = new THREE.Mesh(new THREE.CylinderGeometry(r+2, r+2, 40, 32), new THREE.MeshStandardMaterial({color: 0x00ffff, transparent: true, opacity: 0.4, side: THREE.DoubleSide}));
                        glass.position.y = 30 + i*60;
                        group.add(floor, glass);
                    }
                } else if (c.name === "dome") {
                    // ドーム: ワイヤーフレーム付きの半球
                    const dome = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color: 0x1a0524, roughness: 0.2}));
                    const wire = new THREE.Mesh(new THREE.SphereGeometry(202, 16, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshBasicMaterial({color: c.col, wireframe: true, transparent:true, opacity:0.3}));
                    group.add(dome, wire);
                } else if (c.name === "stock") {
                    // 証券所: ウォール街風の重厚なシリンダービル群
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(200, 200, 100, 32), new THREE.MeshStandardMaterial({color: 0x051a05}));
                    base.position.y = 50;
                    const tower = new THREE.Mesh(new THREE.CylinderGeometry(100, 100, 300, 16), new THREE.MeshStandardMaterial({color: 0x112211}));
                    tower.position.y = 200;
                    const neon = new THREE.Mesh(new THREE.CylinderGeometry(102, 102, 290, 16), new THREE.MeshBasicMaterial({color: c.col, wireframe: true, transparent:true, opacity:0.3}));
                    neon.position.y = 200;
                    group.add(base, tower, neon);
                } else if (c.name === "drone") {
                    // 発着場: 上空の巨大デッキと、4つの発着パッド
                    const deck = new THREE.Mesh(new THREE.CylinderGeometry(180, 150, 20, 32), new THREE.MeshStandardMaterial({color: 0x221111}));
                    deck.position.y = 50; 
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 60, 16), new THREE.MeshStandardMaterial({color: 0x111111}));
                    pillar.position.y = 30;
                    group.add(deck, pillar);

                    // 4つの発着パッドを追加（コリジョンとしても機能させる）
                    for(let i=0; i<4; i++) {
                        const pa = i * Math.PI/2 + Math.PI/4;
                        const px = Math.cos(pa) * 100, pz = Math.sin(pa) * 100;
                        const pad = new THREE.Mesh(new THREE.CylinderGeometry(40, 30, 5, 16), new THREE.MeshStandardMaterial({color: 0x332222}));
                        pad.position.set(px, 62.5, pz);
                        const ring = new THREE.Mesh(new THREE.RingGeometry(35, 40, 32), new THREE.MeshBasicMaterial({color: 0xff0000, side: THREE.DoubleSide})).rotateX(-Math.PI/2);
                        ring.position.set(px, 65.1, pz);
                        group.add(pad, ring);
                        
                        // パッドの歩行判定を追加
                        stationAreas.push({ type: 'circle', x: c.x + px, z: c.z + pz, radius: 40, y: 65 });
                    }
                    createWarpPad(0, 65, 0, c.col, c.x + Math.sin(lookAngle)*250, 1.5, c.z + Math.cos(lookAngle)*250, "地上へ降りる");
                }

                // 共通のゲート（コリジョンの外側に配置）
                const gateGroup = new THREE.Group();
                const gateMat = new THREE.MeshStandardMaterial({color: 0x333333});
                const gL = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 10), gateMat); gL.position.set(-40, 30, 0);
                const gR = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 10), gateMat); gR.position.set(40, 30, 0);
                const gT = new THREE.Mesh(new THREE.BoxGeometry(90, 10, 10), new THREE.MeshBasicMaterial({color: c.col})); gT.position.set(0, 65, 0);
                gateGroup.add(gL, gR, gT);
                
                // コリジョン半径(200)より少し外側にゲートとワープを置く
                const gateRadius = 230; 
                gateGroup.position.set(0, 0, gateRadius); // ローカルZ軸プラス方向に配置
                
                createWarpPad(0, 0, gateRadius + 20, c.col, c.target.x, c.target.y, c.target.z, c.label);

                group.position.set(c.x, 0, c.z);
                group.rotation.y = lookAngle + Math.PI; // ゲートが原点を向くように回転
                scene.add(group);
            });
        }

        function createUndergroundRooms() {
            // --- モールルーム (0, 1.5, 5000) ---
            const mallGrp = new THREE.Group();
            mallGrp.position.set(0, 0, 5000);
            mallGrp.add(new THREE.Mesh(new THREE.CircleGeometry(300, 64), new THREE.MeshStandardMaterial({color: 0x051a24})).rotateX(-Math.PI/2));

        function updateStockChart() {
            stockCtx.fillStyle = '#0a1a0a'; stockCtx.fillRect(0, 0, 512, 256);

            const min = Math.max(0, Math.min(...stockHistory) - 20);
            const max = Math.max(...stockHistory) + 20;
            const range = max - min || 1;
            
            stockHistory.forEach((val, i) => {
                const px = (i / (stockHistory.length - 1)) * 512;
                const py = 256 - ((val - min) / range) * 256;
                if (i === 0) stockCtx.moveTo(px, py);
                else stockCtx.lineTo(px, py);
            });
            stockCtx.stroke();
            stockTex.needsUpdate = true;
        }

        function createMonorails() {
            const rInner = 600, rOuter = 1200, trackY = 80;
            const railMat = new THREE.MeshBasicMaterial({color: 0xcccccc});
            const neonMatCyan = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent:true, opacity:0.4});
            const neonMatPink = new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe: true, transparent:true, opacity:0.4});
            const neonMatOrange = new THREE.MeshBasicMaterial({color: 0xffaa00, wireframe: true, transparent:true, opacity:0.4});
            
            const drawTrack = (radius, isOuter) => {
                const grp = new THREE.Group();
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius, 2, 8, 128), railMat).rotateX(Math.PI/2));
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius+1, 3, 4, 128), isOuter ? neonMatPink : neonMatCyan).rotateX(Math.PI/2));
                grp.position.y = trackY; scene.add(grp);
            };
            drawTrack(rInner, false); drawTrack(rOuter, true);

            // 完璧なピーナッツ軌道
            const curvePts = [];
            for (let i = 0; i <= 128; i++) {
                const a = (i / 128) * Math.PI * 2;
                const r = 900 - 300 * Math.cos(4 * a); // 全ての駅を通過する数式
                curvePts.push(new THREE.Vector3(Math.cos(a) * r, trackY, Math.sin(a) * r));
            }
            const curveSpline = new THREE.CatmullRomCurve3(curvePts, true);
            scene.add(new THREE.Mesh(new THREE.TubeGeometry(curveSpline, 256, 2, 8, true), railMat));
            scene.add(new THREE.Mesh(new THREE.TubeGeometry(curveSpline, 256, 3, 4, true), neonMatOrange));

            const addStation = (radius, angle) => {
                const rotY = -angle; 
                const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
                const group = new THREE.Group();
                
                const pWidth = 60, pDepth = 150;
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 2, pDepth), new THREE.MeshStandardMaterial({color: 0x334455})).translateY(-1));
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 2, pDepth), new THREE.MeshStandardMaterial({color: 0x222233})).translateY(20));
                
                const glass = new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3, side:THREE.DoubleSide});
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 15), glass).rotateY(Math.PI/2).translateZ(-pWidth/2).translateY(7.5));
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 15), glass).rotateY(Math.PI/2).translateZ(pWidth/2).translateY(7.5));

                group.position.set(x, trackY, z); group.rotation.y = rotY; scene.add(group);

                const dirX = Math.cos(angle), dirZ = Math.sin(angle);
                const offset = (radius === rInner) ? -20 : 20; 
                
                createWarpPad(x + dirX*offset, trackY, z + dirZ*offset, 0xff00ff, x + dirX*30, 1.5, z + dirZ*30, "地上へ");
                createWarpPad(x + dirX*30, 1, z + dirZ*30, 0x00ffff, x + dirX*offset, trackY+1.5, z + dirZ*offset, "駅ホームへ");

                stationAreas.push({ type: 'rect', x, z, angle: rotY, width: pWidth, depth: pDepth, y: trackY });
            };

            for(let i=0; i<4; i++) {
                addStation(rInner, i * Math.PI/2);
                // 外周の駅は45度ずらして施設の目の前に
                addStation(rOuter, i * Math.PI/2 + Math.PI/4); 
            }

            const spawnTrain = (radius, initAngle, type) => {
                const carColor = type === 'curve' ? 0xffaa00 : (type === 'outer' ? 0xff00ff : 0x00ffff);
                const car = new THREE.Group();
                car.add(new THREE.Mesh(new THREE.BoxGeometry(14, 2, 40), new THREE.MeshStandardMaterial({color: 0x111122})));
                car.add(new THREE.Mesh(new THREE.BoxGeometry(14, 2, 40), new THREE.MeshStandardMaterial({color: 0x111122})).translateY(18));
                
                const wGlass = new THREE.MeshStandardMaterial({color: carColor, transparent:true, opacity:0.3, side:THREE.DoubleSide});
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(40, 16), wGlass).rotateY(Math.PI/2).translateZ(-7).translateY(9));
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(10, 16), wGlass).rotateY(Math.PI/2).translateZ(7).translateY(9).translateX(15));
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(10, 16), wGlass).rotateY(Math.PI/2).translateZ(7).translateY(9).translateX(-15));
                
                scene.add(car);
                trains.push({ mesh: car, radius, initialAngle: initAngle, angle: initAngle, type: type });
            };
            
            spawnTrain(rInner, 0, 'inner'); spawnTrain(rInner, Math.PI, 'inner');
            spawnTrain(rOuter, Math.PI/4, 'outer'); spawnTrain(rOuter, Math.PI*1.25, 'outer');
            spawnTrain(null, 0, 'curve'); spawnTrain(null, Math.PI, 'curve'); 
        }

        function updateMinimap() {
            if (!minimapCtx) return;
            const ctx = minimapCtx;
            ctx.clearRect(0, 0, 200, 200);
            
            ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(100, 100, 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(136, 204, 255, 0.4)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(100, 100, (600/MAP_RADIUS)*100, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(100, 100, (1200/MAP_RADIUS)*100, 0, Math.PI*2); ctx.stroke();

            const px = 100 + (playerLocalPos.x / MAP_RADIUS) * 100;
            const py = 100 + (playerLocalPos.z / MAP_RADIUS) * 100;
            ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.sin(cameraYaw)*12, py - Math.cos(cameraYaw)*12); ctx.stroke();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            const vPressed = keysPressed['v'];
            if (vPressed && !vKeyWasPressed) { isFPS = !isFPS; updateAvatarAppearance(); }
            vKeyWasPressed = vPressed;

            const fPressed = keysPressed['f'];
            let tryInteract = fPressed && !fKeyWasPressed;
            fKeyWasPressed = fPressed;

            const nowSec = Date.now() / 1000;

            // --- 列車の絶対時間同期とイージング（加減速） ---
            trains.forEach(t => {
                const totalCycleTime = (Math.PI*2) / TRAIN_BASE_SPEED; // 1周の時間
                const timeOffset = (t.initialAngle / (Math.PI*2)) * totalCycleTime;
                const currentT = (nowSec + timeOffset) % totalCycleTime;
                
                // サイン波を使って滑らかな加減速を計算（0〜2PIの動きを滑らかにする）
                const progress = currentT / totalCycleTime; 
                // 簡易的なイージング: 完全に止まる時間を挟む
                // 1周を4区間に分け、各駅で停車させるロジック
                const section = Math.floor(progress * 4);
                const sectionProgress = (progress * 4) % 1;
                
                // 停止時間を設ける (sectionProgress が 0.8 以上なら停止)
                let easeProgress = 0;
                if (sectionProgress < 0.8) {
                    // 0〜0.8を0〜1に正規化し、サインカーブで滑らかに
                    const p = sectionProgress / 0.8;
                    easeProgress = (1 - Math.cos(p * Math.PI)) / 2;
                } else {
                    easeProgress = 1.0; 
                }

                t.angle = (section * Math.PI/2) + easeProgress * (Math.PI/2);

                let r = t.radius;
                let dr = 0;
                if (t.type === 'curve') {
                    // ピーナッツ軌道 (全駅通過)
                    // 内周駅(600) と 外周駅(1200, 45度ズレ) を滑らかに繋ぐ数式
                    r = 900 - 300 * Math.cos(4 * t.angle);
                    dr = 1200 * Math.sin(4 * t.angle);
                    t.radius = r;
                }
                const pt = new THREE.Vector3(Math.cos(t.angle) * r, 80, Math.sin(t.angle) * r);
                
                const dx = dr * Math.cos(t.angle) - r * Math.sin(t.angle);
                const dz = dr * Math.sin(t.angle) + r * Math.cos(t.angle);
                const rot = Math.atan2(dx, dz);

                t.mesh.position.copy(pt); t.mesh.rotation.y = rot;
            });

            // --- ミニゲーム状態の更新 ---
            slotMachines.forEach(m => {
                if (m.state === 'spinning') {
                    m.timer -= delta;
                    m.mesh.material.color.setHex(Math.random() * 0xffffff);
                    if (m.timer <= 0) {
                        m.state = 'idle';
                        const r1 = Math.floor(Math.random()*5);
                        const r2 = Math.floor(Math.random()*5);
                        const r3 = Math.floor(Math.random()*5);
                        if (r1 === r2 && r2 === r3) {
                            m.mesh.material.color.setHex(0xff0000); 
                            updateCR(100);
                            addChatMessage("CASINO", `🎰 777! 大当たり！(+100 CR)`);
                        } else {
                            m.mesh.material.color.setHex(0x555555); 
                            addChatMessage("CASINO", "ハズレ...");
                        }
                    }
                }
            });

            if (hockeyPuck) {
                hockeyPuck.position.add(hockeyPuckVel.clone().multiplyScalar(delta));
                hockeyPuckVel.multiplyScalar(0.99); // 摩擦
                
                // テーブル壁反射 (X: ±45, Z: -5000 ± 95)
                if (Math.abs(hockeyPuck.position.x) > 45) { hockeyPuckVel.x *= -1; hockeyPuck.position.x = Math.sign(hockeyPuck.position.x) * 45; }
                if (Math.abs(hockeyPuck.position.z + 5000) > 95) { hockeyPuckVel.z *= -1; hockeyPuck.position.z = -5000 + Math.sign(hockeyPuck.position.z + 5000) * 95; }
            }

            // --- ドローンの自動帰還 ---
            personalDrones.forEach((d, i) => {
                let isOccupied = false;
                if (ridingDrone === d) isOccupied = true;
                Object.values(otherPlayers).forEach(p => { if (p.userData.ridingDroneIndex === i) isOccupied = true; });
                if (!isOccupied && d.mesh.position.distanceTo(d.initialPos) > 1) {
                    d.mesh.position.lerp(d.initialPos, 0.5 * delta);
                }
            });

            // --- インタラクション判定 ---
            let promptText = "", interactTarget = null;
            
            if (ridingDrone) {
                promptText = "ドローンから降りる";
                if (tryInteract) { ridingDrone = null; playerLocalPos.y += 2; updateAvatarAppearance(); }
            } else if (ridingTrain) {
                const pt = ridingTrain.mesh.position;
                playerLocalPos.set(pt.x, pt.y + 2, pt.z); 

                let canAlight = false; let nearestStation = null;
                for (let st of stationAreas) {
                    if (st.type === 'rect' && Math.hypot(pt.x - st.x, pt.z - st.z) < 60) { canAlight = true; nearestStation = st; break; }
                }

                if (canAlight) {
                    promptText = "駅で降りる";
                    if (tryInteract) {
                        const offset = (ridingTrain.radius === 600) ? -20 : 20;
                        const dirX = Math.cos(nearestStation.angle), dirZ = Math.sin(nearestStation.angle);
                        playerLocalPos.set(nearestStation.x + dirX*offset, 81.5, nearestStation.z + dirZ*offset);
                        ridingTrain = null; updateAvatarAppearance();
                    }
                } else promptText = "走行中... (駅で降りられます)";
            } else if (!isWarping) {
                let foundInteract = false;
                
                // 動的アイテム (列車)
                for (let t of trains) {
                    // 駅停車時(速度がほぼ0)の判定
                    if (Math.abs(t.angle % (Math.PI/2)) < 0.05 && Math.abs(playerLocalPos.y - t.mesh.position.y) < 15 && playerLocalPos.distanceTo(t.mesh.position) < 40) {
                        promptText = "列車に乗る"; interactTarget = () => { ridingTrain = t; updateAvatarAppearance(); };
                        foundInteract = true; break;
                    }
                }

                // 動的アイテム (ドローン)
                if (!foundInteract) {
                    for (let i = 0; i < personalDrones.length; i++) {
                        const d = personalDrones[i];
                        if (playerLocalPos.distanceTo(d.mesh.position) < 15 && Math.abs(playerLocalPos.y - d.mesh.position.y) < 10) {
                            let isOccupied = false;
                            Object.values(otherPlayers).forEach(p => { if (p.userData.ridingDroneIndex === i) isOccupied = true; });
                            if (!isOccupied) {
                                promptText = "ドローンに乗る"; 
                                interactTarget = () => { ridingDrone = d; playerLocalPos.copy(d.mesh.position); playerLocalPos.y += 4; updateAvatarAppearance(); }; 
                                foundInteract = true; break;
                            }
                        }
                    }
                }

                // 汎用インタラクションリスト (ワープ、ショップ、ゲーム)
                if (!foundInteract) {
                    for (let item of interactables) {
                        if (playerLocalPos.distanceTo(item.pos) < item.radius && Math.abs(playerLocalPos.y - item.pos.y) < 15) {
                            promptText = item.label; interactTarget = item.action; break;
                        }
                    }
                }
                
                if (interactTarget && tryInteract) interactTarget();
            }

            const promptEl = document.getElementById('interaction-prompt');
            if (promptText) { document.getElementById('prompt-text').innerText = promptText; promptEl.style.display = 'block'; }
            else promptEl.style.display = 'none';

            // --- 移動とコリジョン（壁判定） ---
            if (!isWarping && !ridingTrain && document.activeElement !== document.getElementById('chat-input')) {
                const speed = (keysPressed['shift'] ? 150 : 60) * playerSpeedMult * delta; // 速度アップ対応
                
                const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
                const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
                
                let mv = new THREE.Vector3();
                if (keysPressed['w']) mv.add(fwd);
                if (keysPressed['s']) mv.sub(fwd);
                if (keysPressed['a']) mv.sub(right); 
                if (keysPressed['d']) mv.add(right); 
                if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed);

                let nextPos = new THREE.Vector3(playerLocalPos.x + mv.x, playerLocalPos.y, playerLocalPos.z + mv.z);

                if (!ridingDrone && !ridingTrain && !isWarping) {
                    let y = playerLocalPos.y;
                    
                    // 展望台ガラス床の落下防止（半径245）
                    if (Math.abs(y - 1350) < 20) {
                        const dist = Math.hypot(nextPos.x, nextPos.z);
                        if (dist > 245) { 
                            const angle = Math.atan2(nextPos.z, nextPos.x);
                            nextPos.x = Math.cos(angle) * 245; nextPos.z = Math.sin(angle) * 245;
                        }
                    } 
                    // 駅ホームの落下防止
                    else if (Math.abs(y - 80) < 20) {
                        let currentSt = null;
                        for (let st of stationAreas) {
                            if (st.type !== 'rect') continue;
                            const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                            const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                            const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { currentSt = st; break; }
                        }
                        
                        if (currentSt) {
                            const dx = nextPos.x - currentSt.x, dz = nextPos.z - currentSt.z;
                            const cos = Math.cos(-currentSt.angle), sin = Math.sin(-currentSt.angle);
                            let lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            const hw = currentSt.width/2 - 1.5, hd = currentSt.depth/2 - 1.5;
                            if (lx > hw) lx = hw; if (lx < -hw) lx = -hw; if (lz > hd) lz = hd; if (lz < -hd) lz = -hd;
                            const cosInv = Math.cos(currentSt.angle), sinInv = Math.sin(currentSt.angle);
                            nextPos.x = currentSt.x + lx * cosInv - lz * sinInv; nextPos.z = currentSt.z + lx * sinInv + lz * cosInv;
                        }
                    }
                    // 四隅巨大施設の壁コリジョン (半径200の円柱)
                    for (let st of stationAreas) {
                        if (st.type === 'wall' && Math.abs(y) < 300) {
                            if (Math.hypot(nextPos.x - st.x, nextPos.z - st.z) < st.radius + 2) {
                                const angle = Math.atan2(nextPos.z - st.z, nextPos.x - st.x);
                                nextPos.x = st.x + Math.cos(angle) * (st.radius + 2);
                                nextPos.z = st.z + Math.sin(angle) * (st.radius + 2);
                            }
                        }
                    }
                }
                
                if (ridingDrone) {
                    let nextY = playerLocalPos.y;
                    if (keysPressed['e']) nextY += 80 * delta; 
                    if (keysPressed['q']) nextY -= 80 * delta; 
                    nextY = Math.max(1, nextY);
                    playerLocalPos.set(nextPos.x, nextY, nextPos.z);
                    ridingDrone.mesh.position.copy(playerLocalPos); ridingDrone.mesh.position.y -= 4;
                } else {
                    playerLocalPos.x = nextPos.x; playerLocalPos.z = nextPos.z;
                }
            }

            // --- 重力と床判定 ---
            if (!ridingDrone && !ridingTrain && !isWarping) {
                let groundY = 1.5; 
                
                if (Math.abs(playerLocalPos.y - 1350) < 20 && Math.hypot(playerLocalPos.x, playerLocalPos.z) < 245) groundY = 1350;
                else {
                    for (let st of stationAreas) {
                        if (st.type === 'circle' && Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z) < st.radius && Math.abs(playerLocalPos.y - st.y) < 20) {
                            groundY = st.y; break;
                        }
                        if (st.type === 'rect' && Math.abs(playerLocalPos.y - st.y) < 20) {
                            const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                            const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                            const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { groundY = st.y; break; }
                        }
                    }
                }

                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 40 * delta; 
                    playerLocalPos.y += playerVelocityY * delta;
                    if (playerLocalPos.y <= groundY) { playerLocalPos.y = groundY; playerVelocityY = 0; }
                } else {
                    playerLocalPos.y = groundY; playerVelocityY = 0;
                }
            }

            // 自キャラ更新
            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.visible = !isFPS;
                if (ridingTrain) localAvatar.rotation.y = ridingTrain.mesh.rotation.y;
                else if (!isWarping && !ridingDrone && document.activeElement !== document.getElementById('chat-input')) {
                    if (keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d']) {
                        let targetYaw = cameraYaw;
                        if (keysPressed['s']) targetYaw += Math.PI; else if (keysPressed['a']) targetYaw += Math.PI/2; else if (keysPressed['d']) targetYaw -= Math.PI/2;
                        localAvatar.rotation.y = targetYaw;
                    } else localAvatar.rotation.y = cameraYaw;
                }

                if (socket) {
                    const distSq = lastSentPos.distanceToSquared(playerLocalPos);
                    const rotDiff = Math.abs(lastSentRot - localAvatar.rotation.y);
                    if (distSq > 0.05 || rotDiff > 0.05) {
                        socket.emit('playerMovement', { x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, rotation: localAvatar.rotation.y });
                        lastSentPos.copy(playerLocalPos); lastSentRot = localAvatar.rotation.y;
                    }
                }
            }

            // 他プレイヤーの同期反映
            Object.values(otherPlayers).forEach(mesh => {
                if (mesh.userData.ridingTrainIndex >= 0) {
                    const t = trains[mesh.userData.ridingTrainIndex];
                    if (t) { mesh.position.set(t.mesh.position.x, t.mesh.position.y + 2, t.mesh.position.z); mesh.rotation.y = t.mesh.rotation.y; }
                }
                if (mesh.userData.ridingDroneIndex >= 0) {
                    const d = personalDrones[mesh.userData.ridingDroneIndex];
                    if (d) { d.mesh.position.copy(mesh.position); d.mesh.position.y -= 4; }
                }
            });

            // カメラ追従
            const camTarget = playerLocalPos.clone();
            if (isFPS) {
                camera.position.copy(camTarget); camera.position.y += 1.6 * 2.5;
            } else {
                const offset = new THREE.Vector3(Math.sin(cameraYaw)*35, 20 + Math.sin(cameraPitch)*20, Math.cos(cameraYaw)*35);
                camera.position.copy(camTarget).add(offset); camTarget.y += 4; 
            }
            const lookDir = new THREE.Vector3(-Math.sin(cameraYaw) * Math.cos(cameraPitch), Math.sin(cameraPitch), -Math.cos(cameraYaw) * Math.cos(cameraPitch));
            camera.lookAt(camera.position.clone().add(lookDir));

            updateMinimap();
            renderer.render(scene, camera);
        }
    </script>
