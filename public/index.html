<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 2px; }
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; }
        .btn-success { background: transparent; border: 1px solid #f472b6; color: #f472b6; }
        .btn-success:hover { background: rgba(244, 114, 182, 0.2); }
        
        #password-container { display: none; } /* Admin password hidden by default */

        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; }
        
        #sidebar { position: absolute; top: 20px; left: 20px; width: 250px; background: rgba(15,23,42,0.8); border-left: 3px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto;}
        .money { font-size: 1.5rem; color: #00ffff; font-weight: bold; }

        #admin-panel { display: none; position: absolute; top: 20px; right: 20px; width: 250px; background: rgba(40, 10, 50, 0.85); border-right: 3px solid #ff00ff; padding: 15px; border-radius: 8px 0 0 8px; pointer-events: auto; }
        #admin-panel h3 { color: #ff00ff; margin-top: 0; font-size: 1.1rem; }
        #admin-panel input { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; background: #000; color: #fff; border: 1px solid #ff00ff; }
        #admin-panel button { width: 100%; padding: 8px; background: #ff00ff; color: #000; font-weight: bold; border: none; cursor: pointer; margin-bottom: 8px; }

        #stats-panel { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); border: 1px solid #334155; padding: 10px; border-radius: 8px; font-family: monospace; color: #00ffff; pointer-events: auto; }

        #minimap-container { position: absolute; bottom: 80px; right: 20px; width: 150px; height: 150px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(2,6,23,0.8); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        #minimap { width: 100%; height: 100%; }

        #interaction-prompt { position: absolute; bottom: 20vh; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); border: 2px solid #00ffff; padding: 10px 20px; border-radius: 20px; color: #00ffff; font-weight: bold; font-size: 1.2rem; display: none; box-shadow: 0 0 15px rgba(0,255,255,0.5);}
        .key-btn { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }

        #controls-help { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; }

        #chat-container { position: absolute; bottom: 120px; left: 20px; width: 320px; background: rgba(15,23,42,0.8); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; }
        #chat-messages { height: 150px; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 5px; }
        #chat-messages div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        .chat-input-row { display: flex; }
        #chat-input { flex-grow: 1; padding: 8px; border: none; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); color: white; outline: none; }
        #btn-send-money { width: 40px; background: #00ffff; color: #000; border: none; cursor: pointer; font-weight: bold; }

        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: auto; }
        
        #fade-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; z-index: 90; display: none; opacity: 0; transition: opacity 0.5s; pointer-events: none;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <input type="text" id="username" placeholder="Username" required>
            <div id="password-container">
                <input type="password" id="password" placeholder="Admin Password (Optional)">
            </div>
            <button class="btn-primary" onclick="attemptAuth(false)">LOGIN</button>
            <button class="btn-success" onclick="attemptAuth(true)">REGISTER</button>
            <div id="auth-msg" style="color:#00ffff; text-align:center; font-size:0.8rem; margin-top:10px;"></div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="sidebar">
            <div style="font-size: 0.8rem; color:#94a3b8;">ID: <span id="ui-username">---</span> <span id="ui-admin-badge" style="color:#ff00ff; display:none;">[ADMIN]</span></div>
            <div class="money">CR: <span id="ui-money">500</span></div>
            <div style="font-size: 0.8rem; color:#94a3b8; margin-top:5px;">株: <span id="ui-stocks">0</span> 株</div>
        </div>
        
        <div id="admin-panel">
            <h3>Admin Controls</h3>
            <label style="font-size:0.8rem; color:#aaa;">Speed Multiplier:</label>
            <input type="number" id="admin-speed" value="3.0" step="0.5">
            <button onclick="applyAdminSpeed()">Apply Speed</button>
            
            <label style="font-size:0.8rem; color:#aaa;">Set CR:</label>
            <input type="number" id="admin-cr" value="10000">
            <button onclick="applyAdminCR()">Set CR</button>
            
            <label style="font-size:0.8rem; color:#aaa;">Fly Mode (No Gravity):</label>
            <input type="checkbox" id="admin-fly" style="width:auto; margin-bottom:15px;"> Enable<br>

            <input type="text" id="admin-target" placeholder="Target Username">
            <button onclick="adminGrant()" style="background:#00ffff;">GRANT ADMIN</button>
            <button onclick="adminBan()" style="background:#ff0000; color:#fff;">BAN USER</button>
            <button onclick="adminUnban()" style="background:#aaaaaa; color:#000;">UNBAN</button>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Enterでチャット開始 / 送信">
                <button id="btn-send-money" title="送金する" onclick="promptSendMoney()">💸</button>
            </div>
        </div>

        <div id="stats-panel">
            FPS: <span id="ui-fps">60</span> | PING: <span id="ui-ping">--</span>ms<br>
            <span style="font-size:0.7rem; color:#888;">(Respawns below Y:-200)</span>
        </div>

        <div id="controls-help">
            [Click/Drag] 視点移動<br>
            [W A S D] 移動<br>
            [V] FPS/TPS切替<br>
            [F] アクション/購入/乗降<br>
            [E]上昇 / [Q]下降 (ドローン/Fly)<br>
            [Enter] チャット切替
        </div>

        <div id="minimap-container">
            <canvas id="minimap" width="200" height="200"></canvas>
        </div>
        
        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>
    
    <div id="fade-overlay"></div>
    <div id="canvas-container"></div>

    <script>
        // --- 擬似データベース (localStorage) ---
        let usersDb = JSON.parse(localStorage.getItem('hakuyarc_users')) || {};
        function saveUserDb() { localStorage.setItem('hakuyarc_users', JSON.stringify(usersDb)); }

        let currentUsername = 'Guest', socket = null;
        let isAdmin = false;
        
        // 3D環境
        let scene, camera, renderer, clock;
        const MAP_RADIUS = 2000; // 島のサイズ
        
        // プレイヤー状態
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isDragging = false, isFPS = false;
        let playerLocalPos = new THREE.Vector3(0, 1.5, 100); 
        let playerVelocityY = 0; 
        
        let currentCR = 500;
        let currentStocks = 0;
        let playerColor = 0x00ffff;
        let playerAccessory = 'none';
        let playerSpeedMult = 1.0;

        // オブジェクト管理
        const trains = [], personalDrones = [], warpPads = [], stationAreas = []; 
        const otherPlayers = {}; 
        const returnPads = {}; // 地下から地上へ戻る座標
        const interactables = []; 
        
        // ミニゲーム関連
        const slotMachines = [];
        let hockeyPuck = null, hockeyPuckVel = new THREE.Vector3();
        let craneGameData = { state: 'idle', clawPos: 0, timer: 0 };
        let miniGameFocus = null; // ゲーム中カメラを固定する的

        // 株価
        let currentStockPrice = 100;
        let stockHistory = Array(50).fill(100);
        const stockCanvas = document.createElement('canvas');
        stockCanvas.width = 512; stockCanvas.height = 256;
        const stockCtx = stockCanvas.getContext('2d');
        const stockTex = new THREE.CanvasTexture(stockCanvas);

        // 乗り物・システム
        const TRAIN_BASE_SPEED = 0.12; 
        const TRAIN_STOP_TIME = 4.0; 
        let ridingTrain = null, ridingDrone = null, localAvatar = null;
        let isWarping = false, fKeyWasPressed = false, vKeyWasPressed = false;
        let minimapCtx;
        
        let lastSentPos = new THREE.Vector3();
        let lastSentRot = 0;

        // FPS/Ping
        let frameCount = 0, lastTime = performance.now();
        let pingStart = 0;

        document.getElementById('username').addEventListener('input', (e) => {
            const val = e.target.value;
            if (val === '898scr' || val === '898sct') {
                document.getElementById('password-container').style.display = 'block';
            } else {
                document.getElementById('password-container').style.display = 'none';
                document.getElementById('password').value = '';
            }
        });

        function updateCR(amt) {
            currentCR += amt;
            document.getElementById('ui-money').innerText = currentCR;
            if (usersDb[currentUsername]) { usersDb[currentUsername].cr = currentCR; saveUserDb(); }
        }

        function addChatMessage(sender, text) {
            const msg = document.createElement('div');
            msg.innerHTML = `<strong style="color:${sender==='SYSTEM'?'#ff00ff':(sender==='ADMIN'?'#ffaa00':'#00ffff')}">${sender}</strong>: ${text}`;
            document.getElementById('chat-messages').appendChild(msg);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        async function attemptAuth(isRegister) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username) return alert("Usernameを入力してください");

            if (isRegister) {
                if (usersDb[username]) return document.getElementById('auth-msg').innerText = "その名前は既に使われています";
                usersDb[username] = { cr: 500, stocks: 0, color: 0x00ffff, accessory: 'none', isBanned: false, isAdmin: false };
                saveUserDb();
                document.getElementById('auth-msg').innerText = "登録完了！ LOGINしてください";
                return;
            }

            if (!usersDb[username]) {
                document.getElementById('auth-msg').innerText = "アカウントが見つかりません。REGISTERしてください";
                return;
            }
            if (usersDb[username].isBanned) {
                document.getElementById('auth-msg').innerText = "このアカウントはBANされています";
                return;
            }

            // アドミン権限チェック
            isAdmin = usersDb[username].isAdmin || ( (username === '898scr' || username === '898sct') && password === 'admin' );

            currentUsername = username;
            currentCR = usersDb[username].cr || 500;
            currentStocks = usersDb[username].stocks || 0;
            playerColor = usersDb[username].color !== undefined ? usersDb[username].color : 0x00ffff;
            playerAccessory = usersDb[username].accessory || 'none';

            document.getElementById('ui-username').innerText = currentUsername;
            document.getElementById('ui-money').innerText = currentCR;
            document.getElementById('ui-stocks').innerText = currentStocks;
            if (isAdmin) {
                document.getElementById('ui-admin-badge').style.display = 'inline';
                document.getElementById('admin-panel').style.display = 'block';
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';

            // ソケット通信
            try { 
                if (typeof io !== 'undefined') { 
                    socket = io({ auth: { username: currentUsername } }); 
                    setupSocketEvents(); 
                } 
            } catch(e) { console.warn("Socket skip (Local Mode)"); }

            try { document.body.requestPointerLock(); } catch(e) {}
            initThreeJS();
        }

        function applyAdminSpeed() { playerSpeedMult = parseFloat(document.getElementById('admin-speed').value) || 1.0; }
        function applyAdminCR() {
            const val = parseInt(document.getElementById('admin-cr').value);
            if (!isNaN(val)) {
                currentCR = val; document.getElementById('ui-money').innerText = currentCR;
                if(usersDb[currentUsername]){ usersDb[currentUsername].cr = currentCR; saveUserDb(); }
            }
        }
        function adminBan() {
            const target = document.getElementById('admin-target').value.trim();
            if(usersDb[target]) {
                usersDb[target].isBanned = true; saveUserDb();
                addChatMessage("ADMIN", `${target} をBANしました`);
                if (socket) socket.emit('chatMessage', `/sys_ban ${target}`);
            }
        }
        function adminUnban() {
            const target = document.getElementById('admin-target').value.trim();
            if(usersDb[target]) {
                usersDb[target].isBanned = false; saveUserDb();
                addChatMessage("ADMIN", `${target} のBANを解除しました`);
            }
        }
        function adminGrant() {
            const target = document.getElementById('admin-target').value.trim();
            if(usersDb[target]) {
                usersDb[target].isAdmin = true; saveUserDb();
                addChatMessage("ADMIN", `${target} にAdmin権限を付与しました`);
                if (socket) socket.emit('chatMessage', `/sys_grant ${target}`);
            }
        }
        function promptSendMoney() {
            const target = prompt("送金先のUsernameを入力してください:");
            if (!target || !usersDb[target]) return alert("ユーザーが見つかりません");
            const amt = parseInt(prompt(`いくら送金しますか？ (所持CR: ${currentCR})`));
            if (isNaN(amt) || amt <= 0 || amt > currentCR) return alert("無効な金額です");
            
            updateCR(-amt);
            usersDb[target].cr = (usersDb[target].cr || 0) + amt;
            saveUserDb();
            addChatMessage("SYSTEM", `${target} に ${amt}CR 送金しました`);
        }

        function updateAvatarAppearance() {
            if (!localAvatar) return;
            localAvatar.children[0].material.color.setHex(playerColor);
            localAvatar.children.forEach(child => {
                if (child.userData.isAccessory) child.visible = (child.userData.accType === playerAccessory);
            });
            if (usersDb[currentUsername]) {
                usersDb[currentUsername].color = playerColor;
                usersDb[currentUsername].accessory = playerAccessory;
                saveUserDb();
            }
            if (socket) {
                socket.emit('changeAvatarConfig', {
                    color: playerColor,
                    accessory: playerAccessory,
                    ridingTrainIndex: ridingTrain ? trains.indexOf(ridingTrain) : -1,
                    ridingDroneIndex: ridingDrone ? personalDrones.indexOf(ridingDrone) : -1
                });
            }
        }

        function setupSocketEvents() {
            if (!socket) return;
            setInterval(() => { pingStart = performance.now(); socket.emit('ping'); }, 2000);
            socket.on('pong', () => { document.getElementById('ui-ping').innerText = Math.round(performance.now() - pingStart); });

            socket.on('initData', (data) => {
                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info);
                });
            });
            socket.on('newPlayer', (info) => { if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info); });
            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    otherPlayers[info.id].position.set(info.x, info.y, info.z);
                    otherPlayers[info.id].rotation.y = info.rotation;
                }
            });
            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
            });
            socket.on('chatMessage', (data) => {
                // 裏コマンドによる強制同期処理
                if (data.text.startsWith('/sys_ban ') && data.text.split(' ')[1] === currentUsername) {
                    alert("あなたは管理者によってBANされました。");
                    location.reload();
                }
                if (data.text.startsWith('/sys_grant ') && data.text.split(' ')[1] === currentUsername) {
                    isAdmin = true;
                    if(usersDb[currentUsername]) { usersDb[currentUsername].isAdmin = true; saveUserDb(); }
                    document.getElementById('ui-admin-badge').style.display = 'inline';
                    document.getElementById('admin-panel').style.display = 'block';
                    addChatMessage("SYSTEM", "あなたは管理者に昇格しました！");
                }
                if (!data.text.startsWith('/sys_')) {
                    addChatMessage(data.username, data.text);
                }
            });
            socket.on('avatarChanged', (data) => {
                if (otherPlayers[data.id] && data.avatar) {
                    const mesh = otherPlayers[data.id];
                    mesh.userData.ridingTrainIndex = data.avatar.ridingTrainIndex !== undefined ? data.avatar.ridingTrainIndex : -1;
                    mesh.userData.ridingDroneIndex = data.avatar.ridingDroneIndex !== undefined ? data.avatar.ridingDroneIndex : -1;
                    if (data.avatar.color !== undefined) mesh.children[0].material.color.setHex(data.avatar.color);
                    if (data.avatar.accessory) {
                        mesh.children.forEach(child => {
                            if (child.userData.isAccessory) child.visible = (child.userData.accType === data.avatar.accessory);
                        });
                    }
                }
            });
        }

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(info.color || 0x00ffff, info.username);
            mesh.position.set(info.x, info.y, info.z);
            scene.add(mesh);
            otherPlayers[info.id] = mesh;
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x050a1a);
            scene.fog = new THREE.FogExp2(0x050a1a, 0.0003); 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 8000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.6; // より明るく
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x445588, 2.5));
            const hemiLight = new THREE.HemisphereLight(0x88ffff, 0xff88ff, 1.8);
            hemiLight.position.set(0, 1000, 0);
            scene.add(hemiLight);

            createEnvironment();
            createUndergroundRooms();
            createLandmarkTower();
            createMonorails();
            createDrones();
            
            localAvatar = createAvatarMesh(playerColor);
            updateAvatarAppearance();
            scene.add(localAvatar);

            minimapCtx = document.getElementById('minimap').getContext('2d');
            clock = new THREE.Clock();
            
            setupInputHandlers();
            
            setInterval(() => {
                currentStockPrice = Math.max(10, Math.floor(currentStockPrice * (1 + (Math.random()-0.5)*0.3)));
                stockHistory.push(currentStockPrice);
                stockHistory.shift();
                updateStockChart();
            }, 5000);

            animate();
        }

        function createAvatarMesh(colorHex = 0x00ffff, username = null) {
            const group = new THREE.Group();
            const s = 2.5; 
            
            const bodyMat = new THREE.MeshStandardMaterial({color: colorHex, roughness: 0.2, metalness: 0.8});
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8*s, 1.2*s, 0.5*s), bodyMat);
            body.position.y = 0.6*s;
            
            const headMat = new THREE.MeshStandardMaterial({color: 0xffcc99});
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6*s, 0.6*s, 0.6*s), headMat);
            head.position.y = 1.5*s;
            
            const visorMat = new THREE.MeshBasicMaterial({color: 0x000000});
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.65*s, 0.2*s, 0.65*s), visorMat);
            visor.position.y = 1.5*s;
            
            group.add(body, head, visor);

            const earGeo = new THREE.ConeGeometry(0.2*s, 0.4*s, 4);
            const earL = new THREE.Mesh(earGeo, bodyMat); earL.position.set(-0.2*s, 1.9*s, 0);
            const earR = new THREE.Mesh(earGeo, bodyMat); earR.position.set(0.2*s, 1.9*s, 0);
            const catEars = new THREE.Group(); catEars.add(earL, earR);
            catEars.userData = { isAccessory: true, accType: 'cat_ears' };
            catEars.visible = false;
            group.add(catEars);

            const hatGrp = new THREE.Group();
            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.4*s, 0.4*s, 0.1*s, 16), new THREE.MeshStandardMaterial({color:0x222222})).translateY(1.8*s));
            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25*s, 0.25*s, 0.5*s, 16), new THREE.MeshStandardMaterial({color:0x111111})).translateY(2.1*s));
            hatGrp.userData = { isAccessory: true, accType: 'hat' };
            hatGrp.visible = false;
            group.add(hatGrp);

            const hpGrp = new THREE.Group();
            const band = new THREE.Mesh(new THREE.TorusGeometry(0.45*s, 0.08*s, 8, 16, Math.PI), new THREE.MeshStandardMaterial({color:0x111111}));
            band.position.set(0, 1.8*s, 0);
            const earPadL = new THREE.Mesh(new THREE.CylinderGeometry(0.2*s, 0.2*s, 0.15*s), new THREE.MeshStandardMaterial({color:0x333333}));
            earPadL.rotation.z = Math.PI/2; earPadL.position.set(-0.45*s, 1.5*s, 0);
            const earPadR = earPadL.clone(); earPadR.position.x = 0.45*s;
            hpGrp.add(band, earPadL, earPadR);
            hpGrp.userData = { isAccessory: true, accType: 'headphone' };
            hpGrp.visible = false;
            group.add(hpGrp);

            if (username) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(username, 128, 40);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
                sprite.position.y = 2.4 * s; sprite.scale.set(12, 3, 1);
                group.add(sprite);
            }
            return group;
        }

        function createEnvironment() {
            // 本島
            const ground = new THREE.Mesh(new THREE.CircleGeometry(MAP_RADIUS, 64), new THREE.MeshStandardMaterial({ color: 0x050a15, roughness: 0.9 }));
            ground.rotation.x = -Math.PI / 2; scene.add(ground);

            const gridHelper = new THREE.GridHelper(MAP_RADIUS * 2, 200, 0x00ffff, 0x020617);
            gridHelper.position.y = 0.1; gridHelper.material.transparent = true; gridHelper.material.opacity = 0.2;
            scene.add(gridHelper);

            // 落下判定用ウォール (島の境界)
            stationAreas.push({ type: 'wall', x: 0, z: 0, radius: MAP_RADIUS, height: 2000, inverse: true });

            // 空のサイバーキューブエフェクト
            const cubeGeo = new THREE.BoxGeometry(4, 4, 4);
            const cubeMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.5, wireframe: true});
            for(let i=0; i<300; i++){
                const c = new THREE.Mesh(cubeGeo, cubeMat);
                c.position.set((Math.random()-0.5)*MAP_RADIUS*2, 200 + Math.random()*1500, (Math.random()-0.5)*MAP_RADIUS*2);
                scene.add(c);
                // アニメーション用に配列化等も可能だが今回は静的配置＋ゆっくり降下させる
                c.userData.fallSpeed = 10 + Math.random()*20;
                stationAreas.push({ mesh: c, type: 'effect_cube' }); // アニメループで処理するため一時保存
            }

            // 島を覆う巨大バリア
            const barrier = new THREE.Mesh(
                new THREE.SphereGeometry(MAP_RADIUS + 100, 64, 32, 0, Math.PI*2, 0, Math.PI/2),
                new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.05, wireframe: true})
            );
            scene.add(barrier);

            // 放射状の道路
            const roadMat = new THREE.MeshStandardMaterial({color: 0x1a1a24});
            const lineMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.8});
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const roadGrp = new THREE.Group();
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(80, MAP_RADIUS), roadMat);
                plane.rotation.x = -Math.PI/2; plane.position.z = MAP_RADIUS/2; plane.position.y = 0.15; roadGrp.add(plane);
                const line = new THREE.Mesh(new THREE.PlaneGeometry(4, MAP_RADIUS), lineMat);
                line.rotation.x = -Math.PI/2; line.position.z = MAP_RADIUS/2; line.position.y = 0.2; roadGrp.add(line);
                roadGrp.rotation.y = angle; scene.add(roadGrp);
            }

            const dist = 1800; // 施設の配置距離
            const corners = [
                {x: Math.cos(Math.PI/4)*dist, z: Math.sin(Math.PI/4)*dist, col: 0x00ffff, name: "mall", label: "モールへ入る", target: new THREE.Vector3(0, -998.5, 5000)}, 
                {x: Math.cos(3*Math.PI/4)*dist, z: Math.sin(3*Math.PI/4)*dist, col: 0xff00ff, name: "dome", label: "エンタメドームへ", target: new THREE.Vector3(0, -998.5, -5000)},
                {x: Math.cos(7*Math.PI/4)*dist, z: Math.sin(7*Math.PI/4)*dist, col: 0x00ff00, name: "stock", label: "証券取引所へ", target: new THREE.Vector3(5000, -998.5, 0)}, 
                {x: Math.cos(5*Math.PI/4)*dist, z: Math.sin(5*Math.PI/4)*dist, col: 0xff0000, name: "drone", label: "発着デッキへ昇る", target: new THREE.Vector3(Math.cos(5*Math.PI/4)*dist, 66.5, Math.sin(5*Math.PI/4)*dist)}
            ];

            corners.forEach(c => {
                const group = new THREE.Group();
                const lookAngle = Math.atan2(-c.x, -c.z); // 中心を向く角度
                
                if (c.name === "drone") {
                    stationAreas.push({ type: 'wall', x: c.x, z: c.z, radius: 120, height: 60 });
                } else {
                    stationAreas.push({ type: 'wall', x: c.x, z: c.z, radius: 300, height: 300 });
                }

                // --- 建物の外観生成 ---
                if (c.name === "mall") {
                    for(let i=0; i<3; i++) {
                        const r = 300 - i*40;
                        const floor = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 5, 32), new THREE.MeshStandardMaterial({color: 0x112233, roughness: 0.2}));
                        floor.position.y = 2.5 + i*80;
                        const glass = new THREE.Mesh(new THREE.CylinderGeometry(r-5, r-5, 75, 32), new THREE.MeshStandardMaterial({color: 0x00ffff, transparent: true, opacity: 0.2, side: THREE.DoubleSide}));
                        glass.position.y = 42.5 + i*80;
                        const core = new THREE.Mesh(new THREE.CylinderGeometry(60, 60, 75, 16), new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true}));
                        core.position.y = 42.5 + i*80;
                        group.add(floor, glass, core);
                    }
                } else if (c.name === "dome") {
                    const dome = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color: 0x1a0524, roughness: 0.2}));
                    const wire = new THREE.Mesh(new THREE.SphereGeometry(302, 16, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshBasicMaterial({color: c.col, wireframe: true, transparent:true, opacity:0.3}));
                    group.add(dome, wire);
                } else if (c.name === "stock") {
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(320, 320, 20, 16), new THREE.MeshStandardMaterial({color: 0x052405}));
                    base.position.y = 10;
                    group.add(base);
                    for(let i=0; i<8; i++){
                        const ang = i * Math.PI/4;
                        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 200, 8), new THREE.MeshStandardMaterial({color: 0x114411}));
                        pillar.position.set(Math.cos(ang)*270, 120, Math.sin(ang)*270);
                        group.add(pillar);
                    }
                    const roof = new THREE.Mesh(new THREE.CylinderGeometry(330, 300, 40, 16), new THREE.MeshStandardMaterial({color: 0x052405}));
                    roof.position.y = 240;
                    const outScreen = new THREE.Mesh(new THREE.CylinderGeometry(200, 200, 150, 32), new THREE.MeshBasicMaterial({map: stockTex, transparent: true, opacity: 0.8, side: THREE.DoubleSide}));
                    outScreen.position.y = 120;
                    group.add(roof, outScreen);
                } else if (c.name === "drone") {
                    const deck = new THREE.Mesh(new THREE.CylinderGeometry(320, 260, 10, 32), new THREE.MeshStandardMaterial({color: 0x221111}));
                    deck.position.y = 60; 
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(80, 120, 55, 16), new THREE.MeshStandardMaterial({color: 0x111111}));
                    pillar.position.y = 27.5;
                    group.add(deck, pillar);

                    stationAreas.push({ type: 'circle', x: c.x, z: c.z, radius: 320, y: 65 });

                    for(let i=0; i<8; i++) {
                        const pa = i * Math.PI/4 + lookAngle + Math.PI;
                        const px = c.x + Math.cos(pa) * 200;
                        const pz = c.z + Math.sin(pa) * 200;
                        
                        const lpx = Math.cos(i * Math.PI/4) * 200;
                        const lpz = Math.sin(i * Math.PI/4) * 200;

                        const pad = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 2, 16), new THREE.MeshStandardMaterial({color: 0x442222}));
                        pad.position.set(lpx, 66, lpz);
                        const ring = new THREE.Mesh(new THREE.RingGeometry(35, 40, 32), new THREE.MeshBasicMaterial({color: 0xff0000, side: THREE.DoubleSide})).rotateX(-Math.PI/2);
                        ring.position.set(lpx, 67.1, lpz);
                        group.add(pad, ring);
                        
                        stationAreas.push({ type: 'circle', x: px, z: pz, radius: 40, y: 67 });
                    }
                }

                // ゲートの生成
                const gateGroup = new THREE.Group();
                const gateMat = new THREE.MeshStandardMaterial({color: 0x333333});
                const gL = new THREE.Mesh(new THREE.BoxGeometry(15, 80, 15), gateMat); gL.position.set(-60, 40, 0);
                const gR = new THREE.Mesh(new THREE.BoxGeometry(15, 80, 15), gateMat); gR.position.set(60, 40, 0);
                const gT = new THREE.Mesh(new THREE.BoxGeometry(135, 15, 15), new THREE.MeshBasicMaterial({color: c.col})); gT.position.set(0, 87.5, 0);
                gateGroup.add(gL, gR, gT);
                
                const gateRadius = 330; 
                gateGroup.position.set(0, 0, gateRadius); // group内のローカルで中心から外側へ配置
                group.add(gateGroup);

                // ワープパッドの絶対座標（建物の中心から大通り側へ）
                const padX = c.x + Math.sin(lookAngle) * (gateRadius + 50);
                const padZ = c.z + Math.cos(lookAngle) * (gateRadius + 50);
                
                // 帰還用に座標を保存しておく
                returnPads[c.name] = { x: padX, z: padZ };

                createWarpPad(padX, 0, padZ, c.col, c.target.x, c.target.y, c.target.z, c.label);

                if (c.name === "drone") {
                    createWarpPad(c.x, 65, c.z, c.col, padX, 1.5, padZ, "地上へ降りる");
                }

                // 建物自体をワールド座標に配置して、原点方向を向かせる
                group.position.set(c.x, 0, c.z);
                group.rotation.y = lookAngle; // 正面を向くように修正
                scene.add(group);
            });
        }

        function createUndergroundRooms() {
            const UNDER_Y = -1000; // 完全に地下へ

            const mallGrp = new THREE.Group();
            mallGrp.position.set(0, UNDER_Y, 5000);
            
            // 1階床
            mallGrp.add(new THREE.Mesh(new THREE.CircleGeometry(600, 64), new THREE.MeshStandardMaterial({color: 0x0a1520, roughness: 0.3})).rotateX(-Math.PI/2));
            // 2階床 (ドーナツ型)
            mallGrp.add(new THREE.Mesh(new THREE.RingGeometry(300, 600, 64), new THREE.MeshStandardMaterial({color: 0x051a24})).rotateX(-Math.PI/2).translateZ(-60));
            stationAreas.push({ type: 'circle', x: 0, z: 5000, radius: 600, y: UNDER_Y + 60, minRadius: 300 });

            // 天井と壁 (両面描画で透け防止)
            const mallCeiling = new THREE.Mesh(new THREE.CircleGeometry(600, 64), new THREE.MeshStandardMaterial({color: 0x051a24, side: THREE.DoubleSide}));
            mallCeiling.rotation.x = Math.PI/2; mallCeiling.position.y = 150;
            const mallWall = new THREE.Mesh(new THREE.CylinderGeometry(600, 600, 150, 64, 1, true), new THREE.MeshStandardMaterial({color: 0x0a2a4a, side: THREE.DoubleSide}));
            mallWall.position.y = 75;
            mallGrp.add(mallCeiling, mallWall);
            
            // 照明
            const mallLight = new THREE.PointLight(0x00ffff, 2, 2000);
            mallLight.position.set(0, 100, 0);
            mallGrp.add(mallLight);

            // 1階と2階をつなぐ螺旋スロープ
            const slopeGeo = new THREE.TorusGeometry(300, 30, 16, 64, Math.PI*1.5);
            const slope = new THREE.Mesh(slopeGeo, new THREE.MeshStandardMaterial({color: 0x112233}));
            slope.rotation.x = Math.PI/2; slope.position.y = 30;
            mallGrp.add(slope);
            // コリジョン用としてスロープを特殊管理
            stationAreas.push({ type: 'slope', x: 0, z: 5000, radius: 300, width: 30, topY: UNDER_Y + 60, bottomY: UNDER_Y, angleEnd: Math.PI*1.5 });

            const createDisplayArea = (x, y, z, label) => {
                const area = new THREE.Group();
                area.position.set(x, y, z);
                // 床直置きを避けて高さを確保
                const counter = new THREE.Mesh(new THREE.BoxGeometry(200, 5, 40), new THREE.MeshStandardMaterial({color: 0x113344, transparent:true, opacity:0.9}));
                counter.position.set(0, 2.5, 0);
                for(let i=0; i<3; i++) {
                    const px = -60 + i*60;
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(15, 20, 2, 16), new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x005555}));
                    base.position.set(px, 6, 0);
                    area.add(base);
                }
                area.add(counter);
                return area;
            };

            const colorArea = createDisplayArea(0, 0, -150, "Colors (1F)");
            mallGrp.add(colorArea);
            const accArea = createDisplayArea(0, 60, -450, "Accessories (2F)");
            mallGrp.add(accArea);
            const speedArea = createDisplayArea(400, 60, 0, "Boosts (2F)");
            speedArea.rotation.y = -Math.PI/2;
            mallGrp.add(speedArea);

            const addShopItem = (x, y, z, color, name, price, type, val, areaGrp, displayIndex) => {
                const itemY = 18; 
                const item = new THREE.Mesh(new THREE.OctahedronGeometry(8), new THREE.MeshBasicMaterial({color, wireframe: true}));
                item.position.set(-60 + displayIndex*60, itemY, 0); 
                areaGrp.add(item);
                
                // インタラクト用座標はグローバル
                let gx = x, gz = 5000 + z;
                if(areaGrp === speedArea) { gx = 400; gz = 5000 + (-60 + displayIndex*60); }
                
                interactables.push({ pos: new THREE.Vector3(gx, UNDER_Y + y + 1.5, gz), radius: 30, label: `購入: ${name} (${price}CR)`, action: () => {
                    if (currentCR < price) return addChatMessage("SYSTEM", "CRが足りません");
                    updateCR(-price);
                    if (type === 'color') playerColor = val;
                    if (type === 'acc') playerAccessory = val;
                    if (type === 'speed') playerSpeedMult = val;
                    updateAvatarAppearance();
                    addChatMessage("SYSTEM", `${name} を購入・装備しました！`);
                }});
            };
            
            // 1F
            addShopItem(0, 0, -150, 0xff0000, "レッドカラー", 50, 'color', 0xff0000, colorArea, 0);
            addShopItem(0, 0, -150, 0xff00ff, "マゼンタカラー", 50, 'color', 0xff00ff, colorArea, 1);
            addShopItem(0, 0, -150, 0xffff00, "イエローカラー", 50, 'color', 0xffff00, colorArea, 2);
            // 2F
            addShopItem(0, 60, -450, 0xffa500, "猫耳アクセサリ", 100, 'acc', 'cat_ears', accArea, 0);
            addShopItem(0, 60, -450, 0x00ff00, "シルクハット", 100, 'acc', 'hat', accArea, 1);
            addShopItem(0, 60, -450, 0x00ffff, "ヘッドホン", 100, 'acc', 'headphone', accArea, 2);
            // 2F
            addShopItem(400, 60, 0, 0xffffff, "スピード x1.2", 200, 'speed', 1.2, speedArea, 0);
            addShopItem(400, 60, 0, 0xffffff, "スピード x1.5", 300, 'speed', 1.5, speedArea, 1);
            addShopItem(400, 60, 0, 0xffffff, "スピード x2.0", 500, 'speed', 2.0, speedArea, 2);

            // 帰還ワープパッド
            createWarpPad(0, UNDER_Y, 5300, 0x00ffff, returnPads.mall.x, 1.5, returnPads.mall.z, "地上へ戻る");
            scene.add(mallGrp);

            // --- カジノ（ドーム）ルーム ---

            casinoGrp.position.set(0, UNDER_Y, -5000);
            casinoGrp.add(new THREE.Mesh(new THREE.CircleGeometry(500, 64), new THREE.MeshStandardMaterial({color: 0x150510})).rotateX(-Math.PI/2));
            
            const casinoCeiling = new THREE.Mesh(new THREE.CircleGeometry(500, 64), new THREE.MeshStandardMaterial({color: 0x050103, side: THREE.DoubleSide}));
            casinoCeiling.rotation.x = Math.PI/2; casinoCeiling.position.y = 150;
            const casinoWall = new THREE.Mesh(new THREE.CylinderGeometry(500, 500, 150, 64, 1, true), new THREE.MeshStandardMaterial({color: 0x1a0524, side: THREE.DoubleSide}));
            casinoWall.position.y = 75;
            casinoGrp.add(casinoCeiling, casinoWall);

            const casinoLight = new THREE.PointLight(0xff00ff, 2, 2000);
            casinoLight.position.set(0, 100, 0);
            casinoGrp.add(casinoLight);

            // クレーンゲーム機
            const craneGrp = new THREE.Group();

            cBody.position.y = 25;
            const cGlass = new THREE.Mesh(new THREE.BoxGeometry(50, 60, 50), new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3}));
            cGlass.position.y = 80;
            const cArm = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 40), new THREE.MeshStandardMaterial({color: 0x888888}));
            cArm.position.set(0, 90, 0); // アーム
            craneGameData.armMesh = cArm;
            craneGrp.add(cBody, cGlass, cArm);
            craneGrp.position.set(-200, 0, -200);
            casinoGrp.add(craneGrp);

            interactables.push({ pos: new THREE.Vector3(-200, UNDER_Y + 1.5, -5200), radius: 60, label: "クレーンゲーム (100CR)", action: () => {
                if (craneGameData.state === 'idle') {
                    if (currentCR < 100) return addChatMessage("SYSTEM", "CRが不足しています");
                    updateCR(-100);
                    craneGameData.state = 'moving';
                    // カメラフォーカス
                    miniGameFocus = { 
                        pos: new THREE.Vector3(-200, UNDER_Y + 80, -5130), 
                        target: new THREE.Vector3(-200, UNDER_Y + 80, -5200) 
                    };
                    addChatMessage("CASINO", "もう一度 Fキー でストップ！");
                } else if (craneGameData.state === 'moving') {
                    craneGameData.state = 'dropping';
                    addChatMessage("CASINO", "アーム降下中...");
                    setTimeout(() => {
                        // 判定 (-10 から +10 の間なら当たり)
                        if (Math.abs(craneGameData.clawPos) < 10) {
                            addChatMessage("CASINO", "🎉 景品ゲット！ (謎のアクセサリを獲得しました)");
                            playerAccessory = 'hat'; updateAvatarAppearance();
                        } else {
                            addChatMessage("CASINO", "失敗...");
                        }
                        craneGameData.state = 'idle';
                        miniGameFocus = null; // カメラフォーカス解除
                    }, 2000);
                }

            const slotCarpet = new THREE.Mesh(new THREE.CircleGeometry(150, 32), new THREE.MeshBasicMaterial({color: 0x330000, transparent:true, opacity:0.5}));
            slotCarpet.rotation.x = -Math.PI/2; slotCarpet.position.set(-250, 0.1, 0); casinoGrp.add(slotCarpet);

                screen.rotation.y = Math.PI/2; screen.position.set(7.6, 20, 0);
                mGrp.add(body, screen);
                mGrp.position.set(-250, 0, sz);
                casinoGrp.add(mGrp);

                const machineData = { mesh: screen, state: 'idle', timer: 0 };
                slotMachines.push(machineData);
                interactables.push({ pos: new THREE.Vector3(-230, UNDER_Y + 1.5, -5000 + sz), radius: 20, label: "スロット (10CR)", action: () => {

                    if (currentCR < 10) return addChatMessage("SYSTEM", "CRが不足");

                    machineData.state = 'spinning'; machineData.timer = 3.0;
                    miniGameFocus = {

                        target: new THREE.Vector3(-250, UNDER_Y + 20, -5000 + sz) 
                    };

            stockCeiling.rotation.x = Math.PI/2; stockCeiling.position.y = 150;

            stockWall.position.y = 75;
            stockGrp.add(stockCeiling, stockWall);

            const board = new THREE.Mesh(new THREE.BoxGeometry(200, 80, 10), new THREE.MeshStandardMaterial({color: 0x111111}));
            board.position.set(0, 60, -150); stockGrp.add(board);
            const stockScreen = new THREE.Mesh(new THREE.PlaneGeometry(190, 70), new THREE.MeshBasicMaterial({map: stockTex}));
            stockScreen.position.set(0, 60, -144); stockGrp.add(stockScreen);

            interactables.push({ pos: new THREE.Vector3(5000, UNDER_Y + 1.5, -50), radius: 30, label: "株を購入/売却", action: () => {
                const action = prompt(`現在の株価: ${currentStockPrice}CR\n[1] 買う\n[2] 売る`);
                if (action === '1') {
                    if(currentCR >= currentStockPrice) { updateCR(-currentStockPrice); currentStocks++; document.getElementById('ui-stocks').innerText = currentStocks; saveUserDb(); addChatMessage("SYSTEM", "購入しました"); }
                } else if (action === '2') {
                    if(currentStocks > 0) { updateCR(currentStockPrice); currentStocks--; document.getElementById('ui-stocks').innerText = currentStocks; saveUserDb(); addChatMessage("SYSTEM", "売却しました"); }
                }
            }});

            createWarpPad(0, UNDER_Y, 150, 0x00ff00, returnPads.stock.x, 1.5, returnPads.stock.z, "地上へ戻る");
            scene.add(stockGrp);
        }

        function createLandmarkTower() {
            const towerGroup = new THREE.Group();
            const TOWER_Y = 1350; 
            
            const legMat = new THREE.MeshStandardMaterial({color: 0x0f172a, roughness: 0.3, metalness: 0.8});
            const frameMat = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.2});
            
            // 展望台のひょろさを解消するため、足を太く
            const legHeight = 500;
            for(let i=0; i<4; i++) {
                const angle = i * Math.PI/2 + Math.PI/4; 
                
                const legGrp = new THREE.Group();
                const legGeo = new THREE.CylinderGeometry(50, 150, legHeight, 16); // 太くした
                const leg = new THREE.Mesh(legGeo, legMat);
                const legFrame = new THREE.Mesh(legGeo, frameMat); 
                leg.position.y = legHeight/2; legFrame.position.y = legHeight/2;
                leg.rotation.x = -Math.PI/6; legFrame.rotation.x = -Math.PI/6;
                legGrp.add(leg, legFrame);

                const radius = 300; 
                legGrp.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
                legGrp.rotation.y = -angle - Math.PI/2;
                towerGroup.add(legGrp);
                
                stationAreas.push({ type: 'wall', x: Math.cos(angle)*radius, z: Math.sin(angle)*radius, radius: 150, height: 500 });
            }

            const towerGeo = new THREE.CylinderGeometry(150, 250, TOWER_Y - 400, 32);
            const tower = new THREE.Mesh(towerGeo, legMat);
            const towerFrame = new THREE.Mesh(towerGeo, frameMat);
            tower.position.y = 400 + (TOWER_Y - 400) / 2;

            // 中腹のエネルギーリング

            floorInner.position.y = TOWER_Y - 10; towerGroup.add(floorInner);
            const floorTopInner = new THREE.Mesh(new THREE.PlaneGeometry(obsRadius*2, obsRadius*2), new THREE.MeshStandardMaterial({color: 0x020617}));

            floorGlass.position.y = TOWER_Y + 40; towerGroup.add(floorGlass);

            const ceil = new THREE.Mesh(new THREE.BoxGeometry(obsRadius*2 + 4, 10, obsRadius*2 + 4), new THREE.MeshStandardMaterial({color: 0x1e293b}));

            // 展望台中央のエネルギーコア
            const coreGrp = new THREE.Group();
            coreGrp.add(new THREE.Mesh(new THREE.OctahedronGeometry(40, 0), new THREE.MeshBasicMaterial({color: 0xffaa00})));
