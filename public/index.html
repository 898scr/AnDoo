<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #050510; color: #fff; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1a0b2e 0%, #050510 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(10, 20, 35, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 40px rgba(0, 255, 255, 0.3); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px #00ffff;}
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ff00ff; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; transition: 0.3s;}
        .panel input:focus { box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0088ff); color: #000; } .btn-primary:hover { box-shadow: 0 0 20px #00ffff; }
        .btn-success { background: transparent; border: 1px solid #ff00ff !important; color: #ff00ff; } .btn-success:hover { background: rgba(255,0,255,0.2); box-shadow: 0 0 20px #ff00ff; }
        .error-msg { color: #ff0055; font-size: 0.9rem; text-align: center; min-height: 20px; font-weight: bold;}

        #sidebar { display: none; position: absolute; top: 0; left: 0; width: 280px; height: 100vh; background: linear-gradient(180deg, rgba(10,10,25,0.9) 0%, rgba(0,0,0,0.8) 100%); border-right: 1px solid #00ffff; z-index: 10; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 20px; box-shadow: 5px 0 20px rgba(0,255,255,0.1);}
        .sidebar-section { border-bottom: 1px solid rgba(0,255,255,0.3); padding-bottom: 15px; }
        .sidebar-section h3 { margin: 0 0 10px 0; font-size: 0.85rem; color: #ff00ff; text-transform: uppercase; letter-spacing: 1px;}
        .user-username { font-size: 1.2rem; font-weight: bold; color: #fff; word-break: break-all; text-shadow: 0 0 5px #fff;}
        .money { font-size: 1.8rem; color: #00ffff; font-weight: bold; margin-top: 5px; text-shadow: 0 0 10px #00ffff;}
        
        #minimap-container { position: absolute; bottom: 20px; right: 20px; z-index: 10; width: 200px; height: 200px; border-radius: 50%; border: 2px solid #00ffff; background: rgba(10, 10, 25, 0.8); box-shadow: 0 0 20px rgba(0,255,255,0.4); overflow: hidden; display: none; }
        #minimap { width: 100%; height: 100%; }

        /* マウスロック用UI */
        #crosshair { display: none; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(0, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 30; pointer-events: none; box-shadow: 0 0 10px #00ffff; }
        #lock-instruction { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); border: 1px solid #ff00ff; padding: 10px 20px; border-radius: 20px; color: #fff; font-weight: bold; z-index: 20; pointer-events: none; text-shadow: 0 0 5px #ff00ff; }

        #interaction-prompt { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 1px solid #00ffff; padding: 10px 25px; border-radius: 30px; color: #00ffff; font-weight: bold; font-size: 1.2rem; z-index: 20; display: none; pointer-events: none;}
        .key-btn { display: inline-block; background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; font-family: monospace;}

        #chat-container { position: absolute; bottom: 20px; left: 300px; z-index: 10; width: 350px; background: rgba(10, 10, 25, 0.8); border-radius: 8px; border: 1px solid rgba(255,0,255,0.5); display: none; flex-direction: column;}
        #chat-header { background: rgba(255, 0, 255, 0.2); padding: 8px 12px; font-weight: bold; color: #ff00ff; font-size: 0.9rem;}
        #chat-messages { height: 150px; overflow-y: auto; padding: 10px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 5px; }
        .chat-msg { padding: 4px; color: #ddd;}
        .chat-msg .name { font-weight: bold; color: #00ffff; margin-right: 5px;}
        #chat-input-area { display: flex; padding: 10px; border-top: 1px solid rgba(255,0,255,0.5); }
        #chat-input { flex-grow: 1; padding: 8px; border-radius: 4px; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(0,255,255,0.3);}

        .chat-bubble { position: absolute; background: rgba(255,255,255,0.9); color: #000; padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; pointer-events: none; transform: translate(-50%, -100%); z-index: 20; opacity: 0; transition: 0.2s;}
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <div id="auth-error" class="error-msg"></div>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button class="btn-primary" onclick="attemptAuth('/api/login')">ENTER SYSTEM</button>
            <button class="btn-success" onclick="attemptAuth('/api/register')">REGISTER</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-section">
            <h3>Identity</h3>
            <div class="user-username" id="ui-username">---</div>
            <div class="money">CR: <span id="ui-money">0</span></div>
        </div>
        <div class="sidebar-section">
            <h3>Controls</h3>
            <p style="font-size: 0.8rem; color:#aaa; line-height:1.6;">
                [Click] 画面ロック (視点操作)<br>
                [W, A, S, D] 移動<br>
                [V] FPS / TPS 切替<br>
                [E] アクション・乗降<br>
                [Space/Shift] ドローン上下<br>
                [Esc] マウスロック解除
            </p>
        </div>
    </div>

    <div id="lock-instruction">画面をクリックして視点操作を開始</div>
    <div id="crosshair"></div>
    <div id="minimap-container"><canvas id="minimap"></canvas></div>
    <div id="interaction-prompt"><span class="key-btn">E</span><span id="prompt-text">アクション</span></div>

    <div id="chat-container">
        <div id="chat-header">💬 HAKUYARC COMMS</div>
        <div id="chat-messages"></div>
        <div id="chat-input-area"><input type="text" id="chat-input" placeholder="メッセージ (Enterで送信)"></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let currentUsername = null, socket = null;
        let scene, camera, renderer, clock;
        const otherPlayers = {}, chatBubbles = {};
        let localPlayerMesh = null, interactionTarget = null;
        
        // カメラ・移動系
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isFPS = false;
        let playerLocalPos = new THREE.Vector3();
        
        // オブジェクト管理
        const warps = [], trains = [], personalDrones = [];
        let ridingTrain = null, ridingDrone = null;
        const RING_INNER = 500, RING_OUTER = 800;

        async function attemptAuth(endpoint) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('auth-error');
            if (!username || !password) { errorEl.innerText = '入力してください'; return; }
            
            try {
                const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (data.success) {
                    if (endpoint === '/api/login') {
                        currentUsername = data.username;
                        document.getElementById('ui-username').innerText = currentUsername;
                        document.getElementById('ui-money').innerText = data.money || 0;
                        startGame();
                    } else { errorEl.style.color = '#00ffff'; errorEl.innerText = data.message; }
                } else { errorEl.style.color = '#ff0055'; errorEl.innerText = data.message; }
            } catch(e) { errorEl.innerText = '通信エラー'; }
        }

        function startGame() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('chat-container').style.display = 'flex';
            document.getElementById('minimap-container').style.display = 'block';
            document.getElementById('lock-instruction').style.display = 'block';

            socket = io({ auth: { username: currentUsername } });
            initThreeJS();
            setupSocketEvents();
            setupInputControls();
        }

        function setupInputControls() {
            const canvasEl = document.getElementById('canvas-container');
            
            // マウスロック
            canvasEl.addEventListener('click', () => {
                if (!document.pointerLockElement) document.body.requestPointerLock();
            });
            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
                document.getElementById('lock-instruction').style.display = isLocked ? 'none' : 'block';
                document.getElementById('crosshair').style.display = (isLocked && isFPS) ? 'block' : 'none';
            });
            document.addEventListener('mousemove', (e) => {
                if (isLocked) {
                    cameraYaw -= e.movementX * 0.002;
                    cameraPitch -= e.movementY * 0.002;
                    // ピッチ（上下）の制限
                    cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                }
            });

            // キーボード
            window.addEventListener('keydown', e => { 
                const key = e.key.toLowerCase();
                keysPressed[key] = true; 
                if(key === 'e') executeInteraction(); 
                if(key === 'v') {
                    isFPS = !isFPS;
                    document.getElementById('crosshair').style.display = (isLocked && isFPS) ? 'block' : 'none';
                    if(localPlayerMesh) localPlayerMesh.visible = !isFPS; // FPS時は自分を隠す
                }
                // チャット入力へのフォーカス
                if(key === 't' && !isLocked) document.getElementById('chat-input').focus();
            });
            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);

            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && e.target.value.trim()) { 
                    socket.emit('chatMessage', e.target.value.trim()); 
                    e.target.value = ''; 
                }
            });
        }

        function createAvatarMesh(colorHex) {
            const grp = new THREE.Group();
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1), new THREE.MeshStandardMaterial({ color: colorHex })).translateY(1.0)); 
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xffcc99 })).translateY(2.6)); 
            return grp;
        }

        function createNameLabel(name) {
            const cvs = document.createElement('canvas'); cvs.width = 256; cvs.height = 64; const ctx = cvs.getContext('2d');
            ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff'; ctx.fillText(name, 128, 32);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cvs), transparent: true, depthTest: false }));
            sprite.scale.set(3, 0.75, 1); sprite.position.y = 4.0; sprite.renderOrder = 999; 
            return sprite;
        }

        function createRideableDrone(x, y, z) {
            const grp = new THREE.Group();
            grp.add(new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 1, 16), new THREE.MeshStandardMaterial({color: 0x222233})));
            const shield = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.3}));
            shield.position.set(0, 2, 0); grp.add(shield);
            grp.position.set(x, y, z); scene.add(grp);
            personalDrones.push({ mesh: grp });
        }

        function initTrains() {
            const trainConfigs = [
                {r: RING_INNER, y: 30, angle: 0, speed: 0.15, c: 0x00ffff}, 
                {r: RING_OUTER, y: 30, angle: Math.PI, speed: -0.1, c: 0xff00ff}
            ];

            trainConfigs.forEach(cfg => {
                const trk = new THREE.Mesh(new THREE.TorusGeometry(cfg.r, 2, 8, 128), new THREE.MeshStandardMaterial({color: 0x8899aa}));
                trk.rotation.x = Math.PI/2; trk.position.y = cfg.y - 2; scene.add(trk);

                const grp = new THREE.Group();
                grp.add(new THREE.Mesh(new THREE.BoxGeometry(10, 1, 34), new THREE.MeshStandardMaterial({color: 0x222})));
                const glass = new THREE.MeshBasicMaterial({color: cfg.c, transparent:true, opacity:0.3, side: THREE.DoubleSide});
                grp.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 9, 34), glass).translateY(5).translateX(-4.8));
                grp.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 9, 10), glass).translateY(5).translateX(4.8).translateZ(12));
                grp.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 9, 10), glass).translateY(5).translateX(4.8).translateZ(-12));
                scene.add(grp);
                trains.push({ r: cfg.r, y: cfg.y, angle: cfg.angle, speed: cfg.speed, state: 'moving', timer: 0, mesh: grp, justDeparted: false });
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a); 
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.0015); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x222233, 1.5));
            const hemi = new THREE.HemisphereLight(0x00ffff, 0xff00ff, 0.8); hemi.position.set(0, 500, 0); scene.add(hemi);

            // 地面と都市
            scene.add(new THREE.Mesh(new THREE.CircleGeometry(2000, 64), new THREE.MeshStandardMaterial({color: 0x050505})).rotateX(-Math.PI/2));
            const grid = new THREE.GridHelper(4000, 100, 0x004466, 0x001122); grid.position.y = 0.1; scene.add(grid);

            // 放射状の道
            const roadMat = new THREE.MeshBasicMaterial({color: 0x00aaff, transparent:true, opacity:0.2, blending: THREE.AdditiveBlending});
            for(let i=0; i<4; i++) {
                const rPlane = new THREE.Mesh(new THREE.PlaneGeometry(4000, 60), roadMat);
                rPlane.rotation.x = -Math.PI/2; rPlane.rotation.z = i * Math.PI/4; rPlane.position.y = 0.2; scene.add(rPlane);
            }
            scene.add(new THREE.Mesh(new THREE.RingGeometry(RING_INNER-30, RING_INNER+30, 64), roadMat).rotateX(-Math.PI/2).translateZ(0.2));
            scene.add(new THREE.Mesh(new THREE.RingGeometry(RING_OUTER-30, RING_OUTER+30, 64), roadMat).rotateX(-Math.PI/2).translateZ(0.2));

            // 中央タワー
            const cGroup = new THREE.Group();
            cGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(150, 250, 400, 32), new THREE.MeshStandardMaterial({color: 0x111})).translateY(200)); 
            const beam = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 4000, 16), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending}));
            beam.position.y = 2000; cGroup.add(beam);
            scene.add(cGroup);

            // 軽量化されたビル群（インスタンシング）
            const bGeo = new THREE.BoxGeometry(1, 1, 1);
            const bMat = new THREE.MeshStandardMaterial({color: 0x0f0f1f});
            const bData = [];
            for(let r=300; r<1800; r+=80) {
                const count = Math.floor(2 * Math.PI * r / 80);
                for(let i=0; i<count; i++) {
                    const th = (i/count)*2*Math.PI;
                    const x = r*Math.cos(th), z = r*Math.sin(th);
                    // 道を避ける判定
                    let aMod = Math.abs((th % (Math.PI/4)) + (th<0?Math.PI/4:0)) % (Math.PI/4);
                    if (aMod > Math.PI/8) aMod = Math.PI/4 - aMod; 
                    if (r * Math.sin(aMod) < 40) continue; 
                    if (Math.abs(r - RING_INNER) < 40 || Math.abs(r - RING_OUTER) < 40) continue;
                    
                    bData.push({x, y: 100+Math.random()*150, z});
                }
            }
            const iMesh = new THREE.InstancedMesh(bGeo, bMat, bData.length);
            const dummy = new THREE.Object3D();
            bData.forEach((d, i) => { dummy.position.set(d.x, d.y/2, d.z); dummy.scale.set(60, d.y, 60); dummy.updateMatrix(); iMesh.setMatrixAt(i, dummy.matrix); });
            scene.add(iMesh);

            initTrains();
            createRideableDrone(200, 1, 200);
            createRideableDrone(-200, 1, 200);

            clock = new THREE.Clock();
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
            animate();
        }

        function setupSocketEvents() {
            socket.on('initData', (d) => {
                Object.keys(d.players).forEach(id => {
                    const info = d.players[id];
                    if (id === socket.id) {
                        localPlayerMesh = createAvatarMesh(0x00ffff);
                        localPlayerMesh.position.set(info.x, info.y, info.z);
                        localPlayerMesh.add(createNameLabel(info.username));
                        scene.add(localPlayerMesh);
                        if(isFPS) localPlayerMesh.visible = false;
                    } else {
                        const m = createAvatarMesh(0xff00ff); m.position.set(info.x, info.y, info.z);
                        m.add(createNameLabel(info.username)); scene.add(m); otherPlayers[id] = m;
                    }
                });
            });
            socket.on('newPlayer', (info) => {
                const m = createAvatarMesh(0xff00ff); m.position.set(info.x, info.y, info.z);
                m.add(createNameLabel(info.username)); scene.add(m); otherPlayers[info.id] = m;
            });
            socket.on('playerMoved', (i) => { if (otherPlayers[i.id]) { otherPlayers[i.id].position.set(i.x, i.y, i.z); otherPlayers[i.id].rotation.y = i.rotation; } });
            socket.on('playerDisconnected', (id) => { if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; } });
            
            socket.on('chatMessage', (msg) => {
                const msgs = document.getElementById('chat-messages'); const div = document.createElement('div'); div.className = 'chat-msg';
                div.innerHTML = `<span class="name">${msg.username}:</span> ${msg.text}`; msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
                
                // 吹き出し表示
                if (!chatBubbles[msg.id]) { const b = document.createElement('div'); b.className = 'chat-bubble'; document.body.appendChild(b); chatBubbles[msg.id] = { el: b, t: null }; }
                const bubble = chatBubbles[msg.id];
                bubble.el.innerText = msg.text; bubble.el.style.opacity = '1';
                if (bubble.t) clearTimeout(bubble.t);
                bubble.t = setTimeout(() => { bubble.el.style.opacity = '0'; }, 5000);
            });
        }

        function executeInteraction() {
            if(!interactionTarget || !localPlayerMesh) return;
            if (interactionTarget.type === 'drone') {
                if(ridingDrone) ridingDrone = null;
                else { ridingDrone = interactionTarget.data; playerLocalPos.set(0, 1.5, 0); }
            }
            interactionTarget = null; document.getElementById('interaction-prompt').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (localPlayerMesh) {
                // カメラ基準の方向ベクトル
                const forward = new THREE.Vector3(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
                const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
                let move = new THREE.Vector3();
                
                if(!isLocked && document.activeElement !== document.getElementById('chat-input')) {
                    // 入力フォーカスがない時のWASD
                    if(keysPressed['w'] || keysPressed['arrowup']) move.add(forward);
                    if(keysPressed['s'] || keysPressed['arrowdown']) move.sub(forward);
                    if(keysPressed['a'] || keysPressed['arrowleft']) move.add(right);
                    if(keysPressed['d'] || keysPressed['arrowright']) move.sub(right);
                } else if (isLocked) {
                    if(keysPressed['w']) move.add(forward);
                    if(keysPressed['s']) move.sub(forward);
                    if(keysPressed['a']) move.add(right);
                    if(keysPressed['d']) move.sub(right);
                }
                
                const speed = keysPressed['shift'] ? 45 : 15;

                if (ridingDrone) {
                    if(move.lengthSq() > 0) { move.normalize(); ridingDrone.mesh.position.addScaledVector(move, 60 * delta); }
                    if(keysPressed[' ']) ridingDrone.mesh.position.y += 30 * delta;
                    if(keysPressed['shift']) ridingDrone.mesh.position.y -= 30 * delta;
                    if(ridingDrone.mesh.position.y < 2) ridingDrone.mesh.position.y = 2;
                    
                    localPlayerMesh.position.copy(playerLocalPos.clone().applyMatrix4(ridingDrone.mesh.matrixWorld));
                    localPlayerMesh.rotation.y = Math.atan2(forward.x, forward.z);
                } else {
                    if(move.lengthSq() > 0) {
                        move.normalize();
                        localPlayerMesh.position.addScaledVector(move, speed * delta);
                        if(localPlayerMesh.position.y < 0) localPlayerMesh.position.y = 0;
                        if(!isFPS) localPlayerMesh.rotation.y = Math.atan2(move.x, move.z); // TPS時は進行方向を向く
                    } else if (isFPS) {
                        localPlayerMesh.rotation.y = cameraYaw; // 止まっていてもカメラの方を向く
                    }
                }

                socket.emit('playerMovement', { x: localPlayerMesh.position.x, y: localPlayerMesh.position.y, z: localPlayerMesh.position.z, rotation: localPlayerMesh.rotation.y });

                // インタラクションチェック
                interactionTarget = null; document.getElementById('interaction-prompt').style.display = 'none';
                if(ridingDrone) {
                    interactionTarget = { type: 'drone', data: ridingDrone }; 
                    document.getElementById('prompt-text').innerText = "ドローンを降りる"; document.getElementById('interaction-prompt').style.display = 'block';
                } else {
                    for(let d of personalDrones) {
                        if(localPlayerMesh.position.distanceTo(d.mesh.position) < 8) {
                            interactionTarget = { type: 'drone', data: d }; document.getElementById('prompt-text').innerText = "ドローンに乗る"; document.getElementById('interaction-prompt').style.display = 'block'; break;
                        }
                    }
                }

                // カメラ追従 (FPS / TPS)
                if (isFPS) {
                    camera.position.set(localPlayerMesh.position.x, localPlayerMesh.position.y + 2.5, localPlayerMesh.position.z);
                    camera.rotation.set(cameraPitch, cameraYaw, 0, 'YXZ');
                } else {
                    const dist = 25; const camY = localPlayerMesh.position.y + dist * Math.sin(cameraPitch) + 4;
                    const xz = dist * Math.cos(cameraPitch); 
                    const camX = localPlayerMesh.position.x - xz * Math.sin(cameraYaw); 
                    const camZ = localPlayerMesh.position.z - xz * Math.cos(cameraYaw);
                    
                    camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.2); 
                    camera.lookAt(localPlayerMesh.position.x, localPlayerMesh.position.y + 2, localPlayerMesh.position.z);
                }
                
                // ミニマップと吹き出し更新
                updateMinimap();
                const updateBubble = (id, pos) => {
                    if (chatBubbles[id] && chatBubbles[id].el.style.opacity === '1') {
                        const v = new THREE.Vector3(pos.x, pos.y + 6, pos.z).project(camera);
                        if (v.z > 1) { chatBubbles[id].el.style.display = 'none'; return; }
                        chatBubbles[id].el.style.display = 'block'; chatBubbles[id].el.style.left = `${(v.x * .5 + .5) * window.innerWidth}px`; chatBubbles[id].el.style.top = `${(v.y * -.5 + .5) * window.innerHeight - 20}px`;
                    }
                };
                updateBubble(socket.id, localPlayerMesh.position);
                for(let id in otherPlayers) if (otherPlayers[id]) updateBubble(id, otherPlayers[id].position);
            }

            // モノレールの運行
            for(let train of trains) {
                train.angle += train.speed * delta;
                train.mesh.position.set(train.r * Math.cos(train.angle), train.y, train.r * Math.sin(train.angle)); 
                train.mesh.rotation.y = -train.angle; 
            }

            renderer.render(scene, camera);
        }

        function updateMinimap() {
            const cvs = document.getElementById('minimap'); const ctx = cvs.getContext('2d');
            ctx.clearRect(0,0,200,200); ctx.fillStyle = 'rgba(10,10,25,0.8)'; ctx.fillRect(0,0,200,200);
            if(!localPlayerMesh) return;
            const scale = 100/2000; ctx.save(); ctx.translate(100, 100);
            
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
            ctx.beginPath(); ctx.arc(0, 0, RING_INNER * scale, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, RING_OUTER * scale, 0, Math.PI*2); ctx.stroke();

            for(let id in otherPlayers) { if(otherPlayers[id]) { ctx.fillStyle='#ff00ff'; ctx.beginPath(); ctx.arc(otherPlayers[id].position.x*scale, otherPlayers[id].position.z*scale, 2, 0, Math.PI*2); ctx.fill(); } }
            
            ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(localPlayerMesh.position.x*scale, localPlayerMesh.position.z*scale, 4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(localPlayerMesh.position.x*scale, localPlayerMesh.position.z*scale); ctx.lineTo(localPlayerMesh.position.x*scale + Math.sin(cameraYaw)*10, localPlayerMesh.position.z*scale + Math.cos(cameraYaw)*10); ctx.stroke();
            ctx.restore();
        }
    </script>
</body>
