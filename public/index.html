<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HAKUYARC Metaverse</title>
        <style>
            body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #020205; color: #fff; }
            
            /* ログイン画面 (サイバー風) */
            #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1a0b2e 0%, #020205 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
            .panel { background: rgba(10, 10, 25, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 40px rgba(0, 255, 255, 0.3); width: 320px; backdrop-filter: blur(10px);}
            .panel h2 { margin-top: 0; color: #00ffff; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px #00ffff;}
            .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ff00ff; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; transition: 0.3s;}
            .panel input:focus { box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }
            .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
            .btn-primary { background: linear-gradient(90deg, #00ffff, #0088ff); color: #000; } .btn-primary:hover { box-shadow: 0 0 20px #00ffff; }
            .btn-success { background: transparent; border: 1px solid #ff00ff !important; color: #ff00ff; } .btn-success:hover { background: rgba(255,0,255,0.2); box-shadow: 0 0 20px #ff00ff; }
            .error-msg { color: #ff0055; font-size: 0.9rem; text-align: center; min-height: 20px; }

            /* サイドバー */
            #sidebar { display: none; position: absolute; top: 0; left: 0; width: 280px; height: 100vh; background: linear-gradient(180deg, rgba(10,10,25,0.9) 0%, rgba(0,0,0,0.8) 100%); border-right: 1px solid #00ffff; z-index: 10; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 20px; box-shadow: 5px 0 20px rgba(0,255,255,0.1);}
            .sidebar-section { border-bottom: 1px solid rgba(0,255,255,0.3); padding-bottom: 15px; }
            .sidebar-section h3 { margin: 0 0 10px 0; font-size: 0.85rem; color: #ff00ff; text-transform: uppercase; letter-spacing: 1px;}
            .user-email { font-size: 1.2rem; font-weight: bold; color: #fff; word-break: break-all; text-shadow: 0 0 5px #fff;}
            .money { font-size: 1.8rem; color: #00ffff; font-weight: bold; margin-top: 5px; text-shadow: 0 0 10px #00ffff;}
            .market-rate { font-size: 1.4rem; color: #ff00ff; font-weight: bold; text-shadow: 0 0 10px #ff00ff;}
            .area-name { font-size: 1.1rem; color: #fff; font-weight: bold; display: flex; align-items: center; gap: 8px;}

            /* インタラクションUI (Eキー) */
            #interaction-prompt { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 1px solid #00ffff; padding: 10px 25px; border-radius: 30px; color: #00ffff; font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 10px #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.3); z-index: 20; display: none; pointer-events: none; transition: opacity 0.2s;}
            .key-btn { display: inline-block; background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; font-family: monospace;}

            /* チャット */
            #chat-container { position: absolute; bottom: 20px; left: 300px; z-index: 10; width: 350px; background: rgba(10, 10, 25, 0.8); border-radius: 8px; border: 1px solid rgba(255,0,255,0.5); display: none; flex-direction: column; box-shadow: 0 0 15px rgba(255,0,255,0.2);}
            #chat-header { background: rgba(255, 0, 255, 0.2); padding: 8px 12px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; color: #ff00ff; font-size: 0.9rem; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,0,255,0.5);}
            #chat-messages { height: 150px; overflow-y: auto; padding: 10px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 5px; }
            .chat-msg { padding: 4px; border-radius: 4px; word-wrap: break-word; color: #ddd;}
            .chat-msg .name { font-weight: bold; color: #00ffff; margin-right: 5px;}
            .chat-msg.admin .name { color: #ff0055; text-shadow: 0 0 5px #ff0055;}
            #chat-input-area { display: flex; padding: 10px; border-top: 1px solid rgba(255,0,255,0.5); }
            #chat-input { flex-grow: 1; padding: 8px; border-radius: 4px; border: 1px solid rgba(0,255,255,0.3); background: rgba(0,0,0,0.5); color: white; outline: none;}
            #chat-input:focus { border-color: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.3);}

            /* アバター上の吹き出し */
            .chat-bubble { position: absolute; background: rgba(255,255,255,0.9); color: #000; padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; white-space: nowrap; pointer-events: none; transform: translate(-50%, -100%); z-index: 20; opacity: 0; transition: opacity 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}
            .chat-bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: rgba(255,255,255,0.9) transparent transparent transparent; }

            /* モール内ショップUI */
            #boutique-panel { position: absolute; right: 20px; top: 20px; z-index: 10; background: rgba(10, 10, 25, 0.95); padding: 20px; border-radius: 12px; width: 260px; display: none; border: 1px solid #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
            #boutique-panel h3 { color: #00ffff; margin-top: 0; text-transform: uppercase; text-shadow: 0 0 10px #00ffff;}
            .color-picker-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem;}
            .color-picker-group input[type="color"] { background: none; border: none; cursor: pointer; height: 30px; width: 40px; padding: 0;}
            .accessory-select { width: 100%; padding: 8px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #00ffff; border-radius: 4px; outline: none; margin-top: 5px;}

            /* 通知 */
            #notification-container { position: absolute; top: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
            .toast { padding: 12px 20px; border-radius: 8px; font-weight: bold; background: rgba(10,10,25,0.9); border-left: 4px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); animation: slideIn 0.3s ease-out forwards, fadeOut 0.5s ease-in 3.5s forwards; opacity: 0; transform: translateX(100%); }
            .toast.success { border-color: #00ffff; color: #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.2);}
            .toast.error { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.2);}
            .toast.info { border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.2);}
            @keyframes slideIn { to { opacity: 1; transform: translateX(0); } } @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }

            #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1;}
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
    </head>
    <body>

        <div id="login-screen">
            <div class="panel">
                <h2>HAKUYARC</h2>
                <div id="auth-error" class="error-msg"></div>
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button class="btn-primary" onclick="attemptAuth('/api/login')">ENTER SYSTEM</button>
                <button class="btn-success" onclick="attemptAuth('/api/register')">REGISTER</button>
            </div>
        </div>

        <div id="sidebar">
            <div class="sidebar-section">
                <h3>Identity</h3>
                <div class="user-email" id="ui-username">---</div>
                <div class="money">CREDIT: <span id="ui-money">0</span></div>
                <div class="money" style="font-size:1.1rem; color:#fff; text-shadow: none;">STOCK: <span id="ui-stocks">0</span></div>
            </div>
            <div class="sidebar-section">
                <h3>Location</h3>
                <div class="area-name" id="ui-area">📍 SECTOR-01</div>
                <p style="font-size: 0.75rem; color:#888; margin-top:5px;">WASD: Move / Mouse: Look</p>
            </div>
        </div>

        <div id="interaction-prompt"><span class="key-btn">E</span><span id="prompt-text">アクション</span></div>

        <div id="chat-container">
            <div id="chat-header" onclick="toggleChat()"><span>💬 HAKUYARC COMMS</span><span id="chat-toggle-icon">▼</span></div>
            <div id="chat-messages"></div>
            <div id="chat-input-area"><input type="text" id="chat-input" placeholder="Message... (/admin)"></div>
        </div>

        <div id="boutique-panel">
            <h3>Cyber Avatar</h3>
            <div class="color-picker-group"><label>Suit</label><input type="color" id="color-body" value="#00ffff" onchange="updateAvatarConfig()"></div>
            <div class="color-picker-group"><label>Skin</label><input type="color" id="color-skin" value="#ffcc99" onchange="updateAvatarConfig()"></div>
            <div class="color-picker-group"><label>Visor</label><input type="color" id="color-visor" value="#ff00ff" onchange="updateAvatarConfig()"></div>
            <div class="color-picker-group"><label>ID Color</label><input type="color" id="color-name" value="#ffffff" onchange="updateAvatarConfig()"></div>
            <div style="margin-top: 10px;">
                <label style="font-size:0.9rem;">Hardware</label>
                <select id="select-accessory" class="accessory-select" onchange="updateAvatarConfig()">
                    <option value="none">None</option>
                    <option value="headphones">Audio Gear</option>
                    <option value="cyberGlasses">Holo Visor</option>
                    <option value="catEars">Neko Ears</option>
                    <option value="hat">Top Hat</option>
                </select>
            </div>
        </div>

        <div id="notification-container"></div>
        <div id="canvas-container"></div>

        <script>
            THREE.Object3D.prototype.setPos = function(x,y,z){this.position.set(x,y,z); return this;};
            THREE.Object3D.prototype.setRot = function(x,y,z){this.rotation.set(x,y,z); return this;};

            let currentUsername = null, socket = null, adminSpeedMult = 1.0;
            let scene, camera, renderer, clock, trackSpline;
            const MAP_SIZE = 2000, ISLAND_RADIUS = 1000;
            const otherPlayers = {}, coinsMap = {}, chatBubbles = {};
            let localPlayerMesh = null, isWarping = false, currentZone = 'outskirts';
            
            const keysPressed = {};
            let cameraYaw = 0, cameraPitch = 0, isDragging = false, previousMousePosition = { x: 0, y: 0 };
            const cameraRaycaster = new THREE.Raycaster();
            
            const gridCollisions = {}, warpPads = [], monorailCars = [];
            let stockChartCanvas, stockChartCtx, stockChartTex, stockHistory = [];
            let interactionTarget = null;

            const instanceData = { mat1: [], mat2: [], mat3: [], matSky: [], bases: [], entrances: [], neons: { cyan: [], magenta: [], yellow: [] } };

            function createTexture(type) {
                const cvs = document.createElement('canvas'); cvs.width = 128; cvs.height = 128; const ctx = cvs.getContext('2d');
                ctx.fillStyle = type === 'sky' ? '#020205' : (type === 1 ? '#050508' : (type === 2 ? '#080510' : '#050a10')); ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = type === 'sky' ? '#00ffff' : '#ff00ff';
                if (type === 'sky') { for(let i=0; i<128; i+=16) for(let j=0; j<128; j+=32) if(Math.random()>0.2) ctx.fillRect(i+2, j+4, 12, 24); }
                else if (type === 1) { for(let i=8; i<128; i+=24) for(let j=8; j<128; j+=32) if(Math.random()>0.3) ctx.fillRect(i, j, 12, 20); }
                else if (type === 2) { for(let j=8; j<128; j+=32) { ctx.fillStyle = Math.random()>0.5 ? '#00ffff' : '#ff00ff'; ctx.fillRect(0, j, 128, 4); } }
                const tex = new THREE.CanvasTexture(cvs); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.magFilter = THREE.NearestFilter; return tex;
            }

            const mats = { 
                mat1: new THREE.MeshStandardMaterial({map: createTexture(1), roughness: 0.8}), 
                mat2: new THREE.MeshStandardMaterial({map: createTexture(2), roughness: 0.8}), 
                mat3: new THREE.MeshStandardMaterial({map: createTexture(3), roughness: 0.8}), 
                matSky: new THREE.MeshStandardMaterial({map: createTexture('sky'), roughness: 0.5, metalness: 0.5}) 
            };

            function addCollisionBox(x, z, width, depth) {
                const minX = x - width/2, maxX = x + width/2, minZ = z - depth/2, maxZ = z + depth/2;
                for(let gx = Math.floor(minX/100); gx <= Math.floor(maxX/100); gx++) {
                    for(let gz = Math.floor(minZ/100); gz <= Math.floor(maxZ/100); gz++) {
                        const key = `${gx},${gz}`;
                        if (!gridCollisions[key]) gridCollisions[key] = [];
                        gridCollisions[key].push({ minX, maxX, minZ, maxZ });
                    }
                }
            }

            function addTeleporter(x, y, z, color, tX, tY, tZ, label) {
                const group = new THREE.Group();
                group.position.set(x, y + 0.1, z);
                const ring = new THREE.Mesh(new THREE.RingGeometry(3, 4, 32), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
                ring.rotation.x = Math.PI / 2; group.add(ring);
                const beam = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 20, 16, 1, true), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.2, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
                beam.position.y = 10; group.add(beam);
                scene.add(group); warpPads.push({ mesh: group, target: new THREE.Vector3(tX, tY, tZ), label, colorHex: color });
            }

            function createNameLabel(name, color) {
            const cvs = document.createElement('canvas'); cvs.width = 512; cvs.height = 128; const ctx = cvs.getContext('2d');
            ctx.font = 'bold 64px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 10; ctx.strokeStyle = '#000000'; ctx.strokeText(name, 256, 64);
            ctx.fillStyle = color; ctx.fillText(name, 256, 64);
            const tex = new THREE.CanvasTexture(cvs);
            const spriteMat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(3, 0.75, 1); // サイズを小さく洗練
            sprite.position.y = 5.5; // 頭上の高い位置へ
            sprite.renderOrder = 999; 
            return sprite;
        }

            function createAvatarMesh(config) {
                const grp = new THREE.Group();
                grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1), new THREE.MeshStandardMaterial({ color: config.body, metalness:0.3, roughness:0.7 })).setPos(0, 1.0, 0)); 
                grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: config.skin })).setPos(0, 2.6, 0)); 
                grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: config.visor })).setPos(0, 2.7, 0.55)); 
                
                if (config.accessory === 'hat') {
                    grp.add(new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x111 })).setPos(0, 3.3, 0));
                    grp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x111 })).setPos(0, 4.0, 0));
                } else if (config.accessory === 'catEars') {
                    const ear = new THREE.MeshStandardMaterial({ color: config.body }), geo = new THREE.ConeGeometry(0.3, 0.8, 4);
                    grp.add(new THREE.Mesh(geo, ear).setPos(-0.4, 3.4, 0).setRot(0, 0, Math.PI/8));
                    grp.add(new THREE.Mesh(geo, ear).setPos(0.4, 3.4, 0).setRot(0, 0, -Math.PI/8));
                } else if (config.accessory === 'headphones') {
                    const hpMat = new THREE.MeshStandardMaterial({ color: 0x222, metalness:0.8 });
                    const pad = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16); pad.rotateZ(Math.PI/2);
                    grp.add(new THREE.Mesh(pad, hpMat).setPos(0.65, 2.6, 0));
                    grp.add(new THREE.Mesh(pad, hpMat).setPos(-0.65, 2.6, 0));
                    grp.add(new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.1, 8, 16, Math.PI), hpMat).setPos(0, 2.6, 0));
                } else if (config.accessory === 'cyberGlasses') {
                    const glassMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });
                    grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.4, 0.1), glassMat).setPos(0, 2.7, 0.65));
                }
                return grp;
            }

            async function attemptAuth(endpoint) {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (data.success) {
                    if(endpoint === '/api/login') {
                        currentUsername = data.username;
                        document.getElementById('ui-username').innerText = currentUsername;
                        document.getElementById('ui-money').innerText = data.money;
                        document.getElementById('ui-stocks').innerText = data.stocks;
                        startGame(); 
                    } else { document.getElementById('auth-error').style.color = '#00ffff'; document.getElementById('auth-error').innerText = data.message; }
                } else { document.getElementById('auth-error').style.color = '#ff0055'; document.getElementById('auth-error').innerText = data.message; }
            }

            function showNotification(type, text) {
                const container = document.getElementById('notification-container');
                const toast = document.createElement('div'); toast.className = `toast ${type}`; toast.innerText = text;
                container.appendChild(toast); setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 4000);
            }

            let chatVisible = true;
            function toggleChat() {
                chatVisible = !chatVisible;
                document.getElementById('chat-messages').style.display = chatVisible ? 'flex' : 'none'; 
                document.getElementById('chat-input-area').style.display = chatVisible ? 'flex' : 'none';
                document.getElementById('chat-toggle-icon').innerText = chatVisible ? '▼' : '▲';
            }

            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { const text = e.target.value.trim(); if (text) { socket.emit('chatMessage', text); e.target.value = ''; } }
            });

            function showBubble(playerId, text) {
                if (!chatBubbles[playerId]) {
                    const b = document.createElement('div'); b.className = 'chat-bubble'; document.body.appendChild(b); chatBubbles[playerId] = { element: b, timer: null };
                }
                const bubble = chatBubbles[playerId];
                bubble.element.innerText = text; bubble.element.style.opacity = '1';
                if (bubble.timer) clearTimeout(bubble.timer);
                bubble.timer = setTimeout(() => { bubble.element.style.opacity = '0'; }, 5000);
            }

            function updateBubbles() {
                const updatePos = (id, pos, yOffset) => {
                    if (chatBubbles[id] && chatBubbles[id].element.style.opacity === '1') {
                        const v = new THREE.Vector3(pos.x, pos.y + yOffset, pos.z); v.project(camera);
                        if (v.z > 1) { chatBubbles[id].element.style.display = 'none'; return; }
                        chatBubbles[id].element.style.display = 'block';
                        chatBubbles[id].element.style.left = `${(v.x * .5 + .5) * window.innerWidth}px`;
                        chatBubbles[id].element.style.top = `${(v.y * -.5 + .5) * window.innerHeight - 20}px`;
                    }
                };
                if (localPlayerMesh && localPlayerMesh.mesh) updatePos(socket.id, localPlayerMesh.mesh.position, 6); 
                for (let id in otherPlayers) {
                    if (otherPlayers[id] && otherPlayers[id].mesh) updatePos(id, otherPlayers[id].mesh.position, 6);
                }
            }

            function updateAvatarConfig() {
                const cfg = { body: document.getElementById('color-body').value, skin: document.getElementById('color-skin').value, visor: document.getElementById('color-visor').value, nameColor: document.getElementById('color-name').value, accessory: document.getElementById('select-accessory').value };
                socket.emit('changeAvatarConfig', cfg);
            }

            function applyAvatarConfig(meshData, config, username) {
                if(!meshData || !meshData.mesh) return; 
                const nm = createAvatarMesh(config); 
                nm.position.copy(meshData.mesh.position); nm.rotation.copy(meshData.mesh.rotation);
                const nl = createNameLabel(username, config.nameColor); nm.add(nl); 
                scene.remove(meshData.mesh); scene.add(nm); 
                meshData.mesh = nm; meshData.label = nl;
            }

            function createStarfield() {
                const geo = new THREE.BufferGeometry(); const count = 6000;
                const positions = new Float32Array(count * 3); const colors = new Float32Array(count * 3);
                for(let i=0; i<count*3; i+=3) {
                    positions[i] = (Math.random() - 0.5) * 4000;
                    positions[i+1] = Math.random() * 2000;
                    positions[i+2] = (Math.random() - 0.5) * 4000;
                    const c = new THREE.Color(Math.random()>0.5 ? 0x00ffff : 0xff00ff);
                    colors[i] = c.r; colors[i+1] = c.g; colors[i+2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({ size: 5, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
                scene.add(new THREE.Points(geo, mat));
            }

            function createAvenues() {
                const roadMat = new THREE.MeshStandardMaterial({ color: 0x05050a, roughness: 0.9 });
                const ewRoad = new THREE.Mesh(new THREE.PlaneGeometry(1900, 60), roadMat); ewRoad.rotation.x = -Math.PI/2; ewRoad.position.set(0, 0.2, -130); scene.add(ewRoad);
                const nsRoad = new THREE.Mesh(new THREE.PlaneGeometry(60, 1900), roadMat); nsRoad.rotation.x = -Math.PI/2; nsRoad.position.set(-135, 0.2, 0); scene.add(nsRoad);
                
                const lineMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.6, blending: THREE.AdditiveBlending});
                scene.add(new THREE.Mesh(new THREE.PlaneGeometry(1900, 1), lineMat).setPos(0, 0.25, -130).setRot(-Math.PI/2,0,0));
                scene.add(new THREE.Mesh(new THREE.PlaneGeometry(1, 1900), lineMat).setPos(-135, 0.25, 0).setRot(-Math.PI/2,0,0));
            }

            function createMonorailSystem() {
                const pts = [
                    new THREE.Vector3(-135, 90, -600), new THREE.Vector3(-135, 90, -500), new THREE.Vector3(-135, 90, -400),
                    new THREE.Vector3(300, 90, -130), new THREE.Vector3(400, 90, -130), new THREE.Vector3(500, 90, -130),
                    new THREE.Vector3(-135, 90, 300), new THREE.Vector3(-135, 90, 400), new THREE.Vector3(-135, 90, 500),
                    new THREE.Vector3(-700, 90, -130), new THREE.Vector3(-600, 90, -130), new THREE.Vector3(-500, 90, -130)
                ];

            function generateCity() {
                const bs = 40;
                for (let x = -960; x < 960; x += bs) {
                    for (let z = -960; z < 960; z += bs) {
                        const bx = x + bs/2, bz = z + bs/2, dist = Math.hypot(bx, bz);
                        if (dist > ISLAND_RADIUS - 40 || (Math.abs(bx) < 80 && Math.abs(bz) < 80)) continue; 
                        if (bx > -450 && bx < -250 && bz > -350 && bz < -150) continue;
                        if (bx > 280 && bx < 420 && bz > -190 && bz < -70) continue;
                        if ((bz > -170 && bz < -90) || (bx > -165 && bx < -105)) continue; 
                        
                        let nearSt = false; for(let i=0; i<12; i++) if(Math.hypot(bx - trackSpline.getPoint(i/12).x, bz - trackSpline.getPoint(i/12).z) < 60) nearSt = true;
                        if(nearSt) continue;

                        instanceData.bases.push({x: bx, y: 0.5, z: bz, sx: bs - 8, sy: 1, sz: bs - 8});
                        const split = Math.random() > 0.5; const c = split ? 4 : 1; const ss = split ? (bs-12)/2 : bs-12;
                        for (let i = 0; i < c; i++) {
                            const fX = bx + (split ? (i%2===0 ? -ss/2 : ss/2) : 0), fZ = bz + (split ? (i<2 ? -ss/2 : ss/2) : 0);
                            let bh = 20 + Math.random()*60; if(dist<400) bh+=40;
                            const isSky = (!split && dist>150 && dist<500 && Math.random()<0.3); if(isSky) bh = 150 + Math.random()*100;
                            const mk = isSky ? 'matSky' : `mat${Math.floor(Math.random()*3)+1}`;
                            
                            instanceData[mk].push({x: fX, y: bh/2+1, z: fZ, sx: ss, sy: bh, sz: ss});
                            addCollisionBox(fX, fZ, ss, ss);
                            
                            if(!split) instanceData.entrances.push({x: fX+(ss/2)-1, y: 3, z: fZ, sx: 6, sy: 4, sz: ss-4});
                            if(bh>80 && Math.random()>0.5) {
                                const cols = ['cyan', 'magenta', 'yellow'];
                                instanceData.neons[cols[Math.floor(Math.random()*cols.length)]].push({x: fX+ss/2, y: bh/2, z: fZ, sx: 2, sy: 30+Math.random()*40, sz: 8});
                            }
                        }
                    }
                }

                const dummy = new THREE.Object3D(), boxGeo = new THREE.BoxGeometry(1, 1, 1);
                const buildIMesh = (mat, data) => {
                    if(data.length===0) return; const mesh = new THREE.InstancedMesh(boxGeo, mat, data.length);
                    data.forEach((d, i) => { dummy.position.set(d.x, d.y, d.z); dummy.scale.set(d.sx||1, d.sy||1, d.sz||1); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix); });
                    scene.add(mesh);
                };
                buildIMesh(mats.mat1, instanceData.mat1); buildIMesh(mats.mat2, instanceData.mat2); buildIMesh(mats.mat3, instanceData.mat3); buildIMesh(mats.matSky, instanceData.matSky);
                buildIMesh(new THREE.MeshStandardMaterial({color: 0x111}), instanceData.bases); buildIMesh(new THREE.MeshStandardMaterial({color: 0x050505}), instanceData.entrances);
                
                for(let c in instanceData.neons) {
                    const hex = c==='cyan'?0x00ffff:c==='magenta'?0xff00ff:0xffff00;
                    const m = new THREE.InstancedMesh(boxGeo, new THREE.MeshBasicMaterial({color: hex, blending:THREE.AdditiveBlending, transparent:true, opacity:0.8}), instanceData.neons[c].length);
                    instanceData.neons[c].forEach((d, i) => { dummy.position.set(d.x, d.y, d.z); dummy.scale.set(d.sx, d.sy, d.sz); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); });
                    scene.add(m);
                }
            }

            function updateStockChart(price) {
                stockHistory.push(price); if(stockHistory.length > 20) stockHistory.shift();
                stockChartCtx.fillStyle = '#0a0a0f'; stockChartCtx.fillRect(0, 0, 512, 256);
                stockChartCtx.strokeStyle = '#222'; stockChartCtx.lineWidth = 2; for(let i=0; i<5; i++) { stockChartCtx.beginPath(); stockChartCtx.moveTo(0, i*50+28); stockChartCtx.lineTo(512, i*50+28); stockChartCtx.stroke(); }
                if(stockHistory.length > 1) {
                    stockChartCtx.strokeStyle = '#00ffff'; stockChartCtx.lineWidth = 4; stockChartCtx.beginPath();
                    const step = 512 / 19, maxP = Math.max(10, ...stockHistory) * 1.2;
                    stockHistory.forEach((p, i) => { const x = i * step, y = 256 - (p / maxP) * 200 - 20; if(i === 0) stockChartCtx.moveTo(x, y); else stockChartCtx.lineTo(x, y); });
                    stockChartCtx.stroke();
                }
                stockChartCtx.fillStyle = '#fff'; stockChartCtx.font = 'bold 36px sans-serif'; stockChartCtx.fillText(`CURRENT: ${price} CR`, 20, 50);
                if(stockChartTex) stockChartTex.needsUpdate = true;
            }

            function checkCollisions(nextX, nextZ, currentY) {
                if (currentY > 300 || (currentY > 70 && currentY < 130)) return { canMoveX: true, canMoveZ: true };
                let canX = true, canZ = true; const r = 1.5;
                for (let gx = Math.floor((nextX-r)/100); gx <= Math.floor((nextX+r)/100); gx++) {
                    for (let gz = Math.floor((nextZ-r)/100); gz <= Math.floor((nextZ+r)/100); gz++) {
                        const boxes = gridCollisions[`${gx},${gz}`] || [];
                        for (let b of boxes) {
                            if (nextX+r > b.minX && nextX-r < b.maxX && nextZ+r > b.minZ && nextZ-r < b.maxZ) {
                                if (!localPlayerMesh || !localPlayerMesh.mesh) continue;
                                const cX = localPlayerMesh.mesh.position.x, cZ = localPlayerMesh.mesh.position.z;
                                if (cX+r <= b.minX || cX-r >= b.maxX) canX = false;
                                if (cZ+r <= b.minZ || cZ-r >= b.maxZ) canZ = false;
                                if (!canX && !canZ) return { canMoveX: false, canMoveZ: false };
                            }
                        }
                    }
                }
                return { canMoveX: canX, canMoveZ: canZ };
            }

            function checkInteractions() {
                if (!localPlayerMesh || !localPlayerMesh.mesh || isWarping) return;
                interactionTarget = null; document.getElementById('interaction-prompt').style.display = 'none';
                for (let pad of warpPads) {
                    if (localPlayerMesh.mesh.position.distanceTo(pad.mesh.position) < 5.0 && Math.abs(localPlayerMesh.mesh.position.y - pad.mesh.position.y) < 3) {
                        interactionTarget = pad;
                        document.getElementById('prompt-text').innerText = `${pad.label}`;
                        document.getElementById('interaction-prompt').style.display = 'block';
                        break;
                    }
                }
            }
            
            function executeInteraction() {
                if(!interactionTarget || isWarping || !localPlayerMesh || !localPlayerMesh.mesh) return;
                isWarping = true; document.getElementById('interaction-prompt').style.display = 'none';
                showNotification('info', `WARP ENGAGED: ${interactionTarget.label}`);
                setTimeout(() => { localPlayerMesh.mesh.position.copy(interactionTarget.target); isWarping = false; }, 500);
            }

            function animate() {
                requestAnimationFrame(animate); const delta = clock.getDelta();
                
                let riding = false;
                if (trackSpline && localPlayerMesh && localPlayerMesh.mesh) {
                    const stationStops = [1/12, 4/12, 7/12, 10/12];
                    for(let i = 0; i < 4; i++) {
                        let car = monorailCars[i];
                        if (car.state === 'moving') {
                            car.progress += 0.05 * delta; if (car.progress > 1) car.progress -= 1;
                            for(let stop of stationStops) { 
                                if (Math.abs(car.progress - stop) < 0.002) { car.progress = stop; car.state = 'stopped'; car.stopTimer = 5.0; break; } 
                            }
                        } else if (car.state === 'stopped') {
                            car.stopTimer -= delta; if (car.stopTimer <= 0) { car.state = 'moving'; car.progress += 0.005; }
                        }
                        const pt = trackSpline.getPoint(car.progress % 1), tangent = trackSpline.getTangent(car.progress % 1);
                        car.mesh.position.copy(pt); car.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);

                        if (Math.abs(localPlayerMesh.mesh.position.y - car.mesh.position.y) < 15) {
                            const dx = localPlayerMesh.mesh.position.x - car.mesh.position.x;
                            const dz = localPlayerMesh.mesh.position.z - car.mesh.position.z;
                            if (Math.hypot(dx, dz) < 13) {
                                riding = true; 
                                if (car.prevPos && car.prevRot !== null) { 
                                    const deltaRot = car.mesh.rotation.y - car.prevRot;
                                    const cos = Math.cos(deltaRot), sin = Math.sin(deltaRot);
                                    localPlayerMesh.mesh.position.x = car.mesh.position.x + (dx * cos - dz * sin) + (car.mesh.position.x - car.prevPos.x);
                                    localPlayerMesh.mesh.position.z = car.mesh.position.z + (dx * sin + dz * cos) + (car.mesh.position.z - car.prevPos.z);
                                }
                            }
                        }
                        car.prevPos = car.mesh.position.clone(); car.prevRot = car.mesh.rotation.y;
                    }
                }

                if (localPlayerMesh && localPlayerMesh.mesh && !isWarping) {
                    let moved = false; const speed = (keysPressed.shift ? 45 : 15) * adminSpeedMult; 
                    
                    const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
                    const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw)); 

                    let moveDir = new THREE.Vector3();
                if (keysPressed['w'] || keysPressed['arrowup']) moveDir.add(forward);
                if (keysPressed['s'] || keysPressed['arrowdown']) moveDir.sub(forward);
                if (keysPressed['a'] || keysPressed['arrowleft']) moveDir.sub(right); // 左をsubに修正
                if (keysPressed['d'] || keysPressed['arrowright']) moveDir.add(right); // 右をaddに修正

                let nextX = localPlayerMesh.mesh.position.x, nextZ = localPlayerMesh.mesh.position.z;
                    if (moveDir.lengthSq() > 0) {
                        moveDir.normalize();
                        nextX += moveDir.x * speed * delta;
                        nextZ += moveDir.z * speed * delta;
                        localPlayerMesh.mesh.rotation.y = Math.atan2(moveDir.x, moveDir.z); 
                    }

                    const col = checkCollisions(nextX, nextZ, localPlayerMesh.mesh.position.y);
                    if (col.canMoveX && moveDir.x !== 0) { localPlayerMesh.mesh.position.x = nextX; moved = true; }
                    if (col.canMoveZ && moveDir.z !== 0) { localPlayerMesh.mesh.position.z = nextZ; moved = true; }
                    if (riding) moved = true;

                    checkInteractions(); updateBubbles();

                    if (localPlayerMesh.mesh.position.x > 1950 && localPlayerMesh.mesh.position.x < 2050 && localPlayerMesh.mesh.position.z > 2000 && localPlayerMesh.mesh.position.z < 2100) { 
                        document.getElementById('boutique-panel').style.display = 'block'; document.getElementById('ui-area').innerText = '📍 BOUTIQUE'; 
                    } else if (localPlayerMesh.mesh.position.x > 1900 && localPlayerMesh.mesh.position.x < 2100 && localPlayerMesh.mesh.position.z > 1900 && localPlayerMesh.mesh.position.z < 2100) {
                        document.getElementById('boutique-panel').style.display = 'none'; document.getElementById('ui-area').innerText = '📍 MALL INTERIOR';
                    } else if (localPlayerMesh.mesh.position.x > 3900) {
                        document.getElementById('boutique-panel').style.display = 'none'; document.getElementById('ui-area').innerText = '📍 EXCHANGE';
                    } else { 
                        document.getElementById('boutique-panel').style.display = 'none'; document.getElementById('ui-area').innerText = '📍 SECTOR-01'; 
                    }

                    if (moved) socket.emit('playerMovement', { x: localPlayerMesh.mesh.position.x, y: localPlayerMesh.mesh.position.y, z: localPlayerMesh.mesh.position.z, rotation: localPlayerMesh.mesh.rotation.y });

                    const offset = new THREE.Vector3(-forward.x * 15, 10, -forward.z * 15);
                    const idealPosition = localPlayerMesh.mesh.position.clone().add(offset);
                    const target = localPlayerMesh.mesh.position.clone(); target.y += 2 + Math.sin(cameraPitch) * 10;
                    
                    const rayOrigin = localPlayerMesh.mesh.position.clone(); rayOrigin.y += 3;
                    const rayDir = new THREE.Vector3().subVectors(idealPosition, rayOrigin).normalize();
                    const rayDist = idealPosition.distanceTo(rayOrigin);
                    
                    cameraRaycaster.set(rayOrigin, rayDir);
                    const intersects = cameraRaycaster.intersectObjects(scene.children, true);
                    let finalPosition = idealPosition;
                    
                    for (let hit of intersects) {
                        if (hit.object.geometry && !hit.object.geometry.boundingBox) hit.object.geometry.computeBoundingBox();
                        if (hit.distance < rayDist && hit.object.type !== 'Sprite' && hit.object.type !== 'Points') {
                            finalPosition = rayOrigin.clone().add(rayDir.multiplyScalar(Math.max(2.0, hit.distance - 1.0)));
                            break;
                        }
                    }
                    camera.position.lerp(finalPosition, 0.2);
                    camera.lookAt(target);
                }
                renderer.render(scene, camera);
            }
        </script>
    </body>
