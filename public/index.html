<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Floating City - Metaverse</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 24px; font-weight: bold;
            background: rgba(0,0,0,0.7); padding: 20px 40px; border-radius: 10px; z-index: 10;
        }
        #controls-info {
            position: absolute; bottom: 20px; left: 20px;
            color: white; background: rgba(0,0,0,0.6); padding: 15px;
            border-radius: 8px; pointer-events: none; line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="loading">都市を生成中...</div>
    <div id="controls-info">
        [W][A][S][D] : 移動<br>
        [Shift] + 移動 : 高速ダッシュ<br>
        [左クリック] + ドラッグ : 視点移動
    </div>

<script>
// --- シーン構築と基本設定 ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // 爽やかな昼間の空
scene.fog = new THREE.Fog(0x87CEEB, 200, 1200);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(0, 150, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; // 影を有効化
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- 光源設定 ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffee, 1.2);
sunLight.position.set(300, 500, 200);
sunLight.castShadow = true;
sunLight.shadow.camera.left = -600;
sunLight.shadow.camera.right = 600;
sunLight.shadow.camera.top = 600;
sunLight.shadow.camera.bottom = -600;
sunLight.shadow.camera.far = 2000;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
scene.add(sunLight);

// --- グローバル変数・マテリアル ---
const ISLAND_RADIUS = 500;

// テクスチャ生成関数
function createBuildingTexture(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = (type === 1) ? '#cccccc' : (type === 2) ? '#a0a0a0' : '#8899aa';
    ctx.fillRect(0, 0, 64, 64);
    
    ctx.fillStyle = '#445566'; // 昼間の暗い窓
    if (type === 1) { // ドット窓
        for(let i=4; i<64; i+=12) {
            for(let j=4; j<64; j+=16) {
                if(Math.random() > 0.2) ctx.fillRect(i, j, 6, 10);
            }
        }
    } else if (type === 2) { // 横縞窓
        for(let j=4; j<64; j+=16) {
            ctx.fillRect(0, j, 64, 8);
        }
    } else { // フレームガラス
        ctx.strokeStyle = '#223344';
        ctx.lineWidth = 2;
        for(let i=0; i<=64; i+=16) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 64); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(64, i); ctx.stroke();
        }
    }
    
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

// 超高層ビル用の青いガラステクスチャ
function createSkyscraperTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#113355'; // ベースの紺色
    ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#66aadd'; // 反射する窓
    for(let i=0; i<128; i+=8) {
        for(let j=0; j<128; j+=16) {
            if(Math.random() > 0.1) ctx.fillRect(i+1, j+2, 6, 12);
        }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

const mat1 = new THREE.MeshLambertMaterial({ map: createBuildingTexture(1), color: 0xffffff });
const mat2 = new THREE.MeshLambertMaterial({ map: createBuildingTexture(2), color: 0xdddddd });
const mat3 = new THREE.MeshLambertMaterial({ map: createBuildingTexture(3), color: 0xbbccdd });
const matSky = new THREE.MeshLambertMaterial({ map: createSkyscraperTexture(), color: 0x88bbff });
const buildingMats = [mat1, mat2, mat3];

// モノレール関連の変数
let trackSpline;
const monorailCars = [];
const monorailSpeed = 0.0005; 
let monorailProgress = [0, 0.015, 0.03]; // 3両を少し離して配置

// --- マップ生成開始 ---

// 1. 自然な形状の浮島を生成
function createIsland() {
    const islandGeo = new THREE.CylinderGeometry(ISLAND_RADIUS, ISLAND_RADIUS * 0.7, 100, 64, 4);
    // 頂点を歪ませて岩肌のような自然な形にする
    const posAttribute = islandGeo.attributes.position;
    const v = new THREE.Vector3();
    for(let i=0; i < posAttribute.count; i++) {
        v.fromBufferAttribute(posAttribute, i);
        if (v.y < 40) { // 側面から底面にかけてノイズを適用
            const noise = Math.sin(v.x * 0.05) * Math.cos(v.z * 0.05) * 15;
            const noise2 = Math.sin(v.x * 0.02 + v.z * 0.02) * 20;
            v.x += (v.x / ISLAND_RADIUS) * (noise + noise2);
            v.z += (v.z / ISLAND_RADIUS) * (noise + noise2);
            v.y += Math.random() * 10 - 5;
        }
        posAttribute.setXYZ(i, v.x, v.y, v.z);
    }
    islandGeo.computeVertexNormals();
    const islandMat = new THREE.MeshLambertMaterial({ color: 0x5a4d41 }); // 岩肌の色
    const island = new THREE.Mesh(islandGeo, islandMat);
    island.position.y = -50;
    island.receiveShadow = true;
    scene.add(island);

    // 地面の土台（コンクリート）
    const groundGeo = new THREE.CircleGeometry(ISLAND_RADIUS, 64);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.1;
    ground.receiveShadow = true;
    scene.add(ground);
}

// 2. モノレール軌道と駅の生成
function createMonorailSystem() {
    // 島の外周を大きく迂回し、アップダウンのあるルート
    const points = [
        new THREE.Vector3(0, 70, -400),
        new THREE.Vector3(350, 90, -250),
        new THREE.Vector3(420, 70, 0),
        new THREE.Vector3(300, 100, 300),
        new THREE.Vector3(0, 80, 420),
        new THREE.Vector3(-350, 70, 300),
        new THREE.Vector3(-420, 90, 0),
        new THREE.Vector3(-300, 80, -300)
    ];
    trackSpline = new THREE.CatmullRomCurve3(points, true);

    // 軌道の描画
    const tubeGeo = new THREE.TubeGeometry(trackSpline, 200, 2, 8, true);
    const tubeMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
    const track = new THREE.Mesh(tubeGeo, tubeMat);
    track.castShadow = true; track.receiveShadow = true;
    scene.add(track);

    // 駅舎の生成（6箇所）
    const stationMat = new THREE.MeshLambertMaterial({ color: 0xdddddd, transparent: true, opacity: 0.8 });
    const pillarMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
    
    for (let i = 0; i < 6; i++) {
        const t = i / 6;
        const pt = trackSpline.getPoint(t);
        const tangent = trackSpline.getTangent(t);
        
        // ガラスドーム型の駅舎
        const stGeo = new THREE.CylinderGeometry(15, 15, 40, 16);
        const station = new THREE.Mesh(stGeo, stationMat);
        station.position.copy(pt);
        // 軌道の接線（進行方向）に合わせて水平に回転
        station.rotation.z = Math.PI / 2;
        const axis = new THREE.Vector3(1, 0, 0);
        station.quaternion.setFromUnitVectors(axis, tangent);
        scene.add(station);

        // 地面へ降りるエレベータータワー（柱）
        const pillarGeo = new THREE.BoxGeometry(10, pt.y, 10);
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(pt.x, pt.y / 2, pt.z);
        pillar.castShadow = true; pillar.receiveShadow = true;
        scene.add(pillar);
    }

    // 車両の生成（1両ずつ独立して3つ配置）
    const carGeo = new THREE.BoxGeometry(8, 10, 25);
    const carMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
    for(let i=0; i<3; i++) {
        const car = new THREE.Mesh(carGeo, carMat);
        car.castShadow = true;
        scene.add(car);
        monorailCars.push(car);
    }
}

// 3. ランドマークと特殊施設の生成
function createLandmarks() {
    // 【中央ランドマークタワー】(0, 0付近)
    const towerGeo = new THREE.CylinderGeometry(20, 60, 300, 16);
    const towerMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
    const tower = new THREE.Mesh(towerGeo, towerMat);
    tower.position.set(0, 150, 0);
    tower.castShadow = true; tower.receiveShadow = true;
    scene.add(tower);

    // タワー土台
    const baseGeo = new THREE.CylinderGeometry(70, 80, 20, 16);
    const baseMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.set(0, 10, 0);
    base.castShadow = true; base.receiveShadow = true;
    scene.add(base);

    // タワー入り口（エントランス）
    const entranceGeo = new THREE.BoxGeometry(30, 20, 40);
    const entranceMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const entrance = new THREE.Mesh(entranceGeo, entranceMat);
    entrance.position.set(0, 10, 60);
    scene.add(entrance);

    // 【郊外の巨大商業施設】(東側)
    const mallGeo = new THREE.BoxGeometry(160, 30, 160);
    const mallMat = new THREE.MeshLambertMaterial({ color: 0xddccaa });
    const mall = new THREE.Mesh(mallGeo, mallMat);
    mall.position.set(280, 15, -180);
    mall.castShadow = true; mall.receiveShadow = true;
    scene.add(mall);
    
    // モールのガラス屋根
    const domeGeo = new THREE.SphereGeometry(60, 16, 16, 0, Math.PI*2, 0, Math.PI/2);
    const domeMat = new THREE.MeshLambertMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6 });
    const dome = new THREE.Mesh(domeGeo, domeMat);
    dome.position.set(280, 30, -180);
    scene.add(dome);

    // 【遊園地エリア】(西側)
    const pCenterX = -200;
    const pCenterZ = 220;
    const pRadius = 130; // 敷地拡大
    
    // 遊園地の地面（カラフル）
    const parkGeo = new THREE.PlaneGeometry(pRadius*2, pRadius*2);
    const parkMat = new THREE.MeshLambertMaterial({ color: 0xee99aa });
    const parkGround = new THREE.Mesh(parkGeo, parkMat);
    parkGround.rotation.x = -Math.PI / 2;
    parkGround.position.set(pCenterX, 0.3, pCenterZ);
    parkGround.receiveShadow = true;
    scene.add(parkGround);

    // 柵（四角形）
    const fenceGeo = new THREE.BoxGeometry(pRadius*2, 10, 2);
    const fenceMat = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true });
    const fenceN = new THREE.Mesh(fenceGeo, fenceMat); fenceN.position.set(pCenterX, 5, pCenterZ - pRadius); scene.add(fenceN);
    const fenceS = new THREE.Mesh(fenceGeo, fenceMat); fenceS.position.set(pCenterX, 5, pCenterZ + pRadius); scene.add(fenceS);
    const fenceE = new THREE.Mesh(fenceGeo, fenceMat); fenceE.rotation.y = Math.PI/2; fenceE.position.set(pCenterX + pRadius, 5, pCenterZ); scene.add(fenceE);
    const fenceW = new THREE.Mesh(fenceGeo, fenceMat); fenceW.rotation.y = Math.PI/2; fenceW.position.set(pCenterX - pRadius, 5, pCenterZ); scene.add(fenceW);

    // 遊園地ゲート（南側）
    const gateGeo = new THREE.BoxGeometry(40, 20, 10);
    const gateMat = new THREE.MeshLambertMaterial({ color: 0xffcc00 });
    const gate = new THREE.Mesh(gateGeo, gateMat);
    gate.position.set(pCenterX, 10, pCenterZ + pRadius);
    scene.add(gate);

    // 観覧車
    const wheelGeo = new THREE.TorusGeometry(30, 2, 16, 32);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0xff4444 });
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.position.set(pCenterX - 40, 40, pCenterZ - 40);
    wheel.castShadow = true;
    scene.add(wheel);

    // フリーフォール
    const fallGeo = new THREE.CylinderGeometry(5, 5, 80, 8);
    const fallMat = new THREE.MeshLambertMaterial({ color: 0x33ff33 });
    const fall = new THREE.Mesh(fallGeo, fallMat);
    fall.position.set(pCenterX + 60, 40, pCenterZ - 50);
    fall.castShadow = true;
    scene.add(fall);

    // 海賊船（バイキング）
    const shipGeo = new THREE.BoxGeometry(30, 10, 15);
    const shipMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
    const ship = new THREE.Mesh(shipGeo, shipMat);
    ship.position.set(pCenterX, 15, pCenterZ + 50);
    ship.rotation.z = Math.PI / 6;
    ship.castShadow = true;
    scene.add(ship);
}

// 4. 木の生成関数
function createTree(x, y, z) {
    const trunkGeo = new THREE.CylinderGeometry(1, 1, 6, 8);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(x, y + 3, z);
    trunk.castShadow = true;

    const leavesGeo = new THREE.SphereGeometry(4, 8, 8);
    const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
    leaves.position.set(0, 4, 0);
    leaves.castShadow = true;
    
    trunk.add(leaves);
    scene.add(trunk);
}

// 5. 大通り（メインストリート）の構築
function createRoadSegment(x, z, width, length, isEW) {
    // 道路アスファルト
    const roadGeo = new THREE.PlaneGeometry(isEW ? length : width, isEW ? width : length);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.set(x, 0.4, z);
    road.receiveShadow = true;
    scene.add(road);

    // 中央分離帯
    const medianWidth = 8;
    const medianGeo = new THREE.PlaneGeometry(isEW ? length : medianWidth, isEW ? medianWidth : length);
    const medianMat = new THREE.MeshLambertMaterial({ color: 0x2d4c1e });
    const median = new THREE.Mesh(medianGeo, medianMat);
    median.rotation.x = -Math.PI / 2;
    median.position.set(x, 0.5, z);
    median.receiveShadow = true;
    scene.add(median);

    // 街路樹（交差点を避けて配置）
    const treeCount = Math.floor(length / 20);
    for(let i = 0; i < treeCount; i++) {
        const offset = (i - treeCount/2) * 20;
        const tx = isEW ? x + offset : x;
        const tz = isEW ? z : z + offset;
        // 交差点（x=135, z=-130）付近は木を植えない
        if (isEW && Math.abs(tx - 135) < 35) continue;
        if (!isEW && Math.abs(tz - (-130)) < 35) continue;
        
        // 島の外にはみ出さないかチェック
        if (Math.hypot(tx, tz) < ISLAND_RADIUS - 10) {
            createTree(tx, 0.5, tz);
        }
    }

    // 車線の白線（片側3車線 = 境界線は各2本）
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const laneOffsets = [-18, -10, 10, 18];
    laneOffsets.forEach(offset => {
        const dashLen = 4; const gapLen = 5;
        const dashCount = Math.floor(length / (dashLen + gapLen));
        for(let i=0; i<dashCount; i++) {
            const dOffset = (i - dashCount/2) * (dashLen + gapLen);
            const lx = isEW ? x + dOffset : x + offset;
            const lz = isEW ? z + offset : z + dOffset;
            
            // 交差点付近は白線を引かない
            if (isEW && Math.abs(lx - 135) < 35) continue;
            if (!isEW && Math.abs(lz - (-130)) < 35) continue;
            
            if (Math.hypot(lx, lz) < ISLAND_RADIUS - 5) {
                const lineGeo = new THREE.PlaneGeometry(isEW ? dashLen : 0.5, isEW ? 0.5 : dashLen);
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(lx, 0.45, lz);
                scene.add(line);
            }
        }
    });
}

function createAvenues() {
    // ランドマークと商業施設の間を通る、東西・南北の十字大通り
    // EW (東西): z = -130 (幅60, z:-160〜-100)
    createRoadSegment(0, -130, 60, 800, true);
    // NS (南北): x = 135  (幅60, x:105〜165)
    createRoadSegment(135, 0, 60, 800, false);
}

// 6. 市街地のビル群生成
function generateCity() {
    createAvenues(); // 先に大通りを描画

    const blockSize = 40;
    for (let x = -400; x < 400; x += blockSize) {
        for (let z = -400; z < 400; z += blockSize) {
            const bx = x + blockSize / 2;
            const bz = z + blockSize / 2;
            const dist = Math.hypot(bx, bz);

            // 島の外なら除外
            if (dist > ISLAND_RADIUS - 20) continue;

            // --- 建設禁止エリア（干渉チェック） ---
            // 1. ランドマーク (x: -70〜70, z: -70〜70)
            if (Math.abs(bx) < 70 && Math.abs(bz) < 70) continue;
            // 2. 遊園地 (x: -330〜-70, z: 90〜350)
            if (bx > -330 && bx < -70 && bz > 90 && bz < 350) continue;
            // 3. 商業施設 (x: 200〜360, z: -260〜-100)
            if (bx > 200 && bx < 360 && bz > -260 && bz < -100) continue;
            // 4. 大通り (東西: z:-165〜-95, 南北: x:100〜170)
            if (bz > -165 && bz < -95) continue;
            if (bx > 100 && bx < 170) continue;
            
            // 5. モノレール駅周辺（半径45）
            let nearStation = false;
            for(let i = 0; i < 6; i++) {
                const pt = trackSpline.getPoint(i / 6);
                if (Math.hypot(bx - pt.x, bz - pt.z) < 45) nearStation = true;
            }
            if (nearStation) continue;

            // --- 植生（公園・自然）の判定 ---
            let isPark = false;
            if (dist > 420) isPark = true; // 島の端は確実に自然
            else if (dist > 350) isPark = Math.random() < 0.7; // 郊外は自然が多い
            else if (dist > 250) isPark = Math.random() < 0.1; 
            else isPark = Math.random() < 0.02; // 中心部は稀に公園

            if (isPark) {
                const grassGeo = new THREE.PlaneGeometry(blockSize-4, blockSize-4);
                const grassMat = new THREE.MeshLambertMaterial({ color: 0x2d4c1e });
                const grass = new THREE.Mesh(grassGeo, grassMat);
                grass.rotation.x = -Math.PI / 2;
                grass.position.set(bx, 0.2, bz);
                scene.add(grass);

                const tCount = 2 + Math.floor(Math.random() * 4);
                for(let t=0; t<tCount; t++) {
                    createTree(bx + (Math.random()-0.5)*20, 0.2, bz + (Math.random()-0.5)*20);
                }
                continue;
            }

            // --- 歩道とビルの生成 ---
            const baseGeo = new THREE.BoxGeometry(blockSize - 4, 1, blockSize - 4);
            const baseMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.set(bx, 0.5, bz);
            scene.add(baseMesh);

            // ビルの密集度（1区画に1棟 or 複数棟）
            const split = Math.random() > 0.6;
            const buildings = split ? 4 : 1;
            const subSize = split ? (blockSize - 8) / 2 : blockSize - 8;

            for (let i = 0; i < buildings; i++) {
                const offsetX = split ? (i % 2 === 0 ? -subSize/2 : subSize/2) : 0;
                const offsetZ = split ? (i < 2 ? -subSize/2 : subSize/2) : 0;
                const finalX = bx + offsetX;
                const finalZ = bz + offsetZ;

                // 超高層ビルの判定
                let isSkyscraper = false;
                let bHeight = 10 + Math.random() * 40;
                if (dist < 250) bHeight += 30; // 中心部ほど高い

                if (Math.random() < 0.06 && dist < 300 && !split) {
                    isSkyscraper = true;
                    bHeight = 150 + Math.random() * 100; // 高さ150〜250
                    
                    // モノレール軌道を貫通しないかチェック
                    for(let t=0; t<=1; t+=0.02) {
                        const pt = trackSpline.getPoint(t);
                        if (Math.hypot(finalX - pt.x, finalZ - pt.z) < 40) {
                            isSkyscraper = false; // 軌道に近すぎる場合は通常ビルに降格
                            bHeight = 20 + Math.random() * 40;
                            break;
                        }
                    }
                }

                const mat = isSkyscraper ? matSky : buildingMats[Math.floor(Math.random() * buildingMats.length)];

                // メインのビル本体
                const bGeo = new THREE.BoxGeometry(subSize - 4, bHeight, subSize - 4);
                const bMesh = new THREE.Mesh(bGeo, mat);
                bMesh.position.set(finalX, bHeight / 2 + 1, finalZ);
                bMesh.castShadow = true; bMesh.receiveShadow = true;
                scene.add(bMesh);

                // エントランス（ひさし）
                if (!split) {
                    const entGeo = new THREE.BoxGeometry(10, 4, subSize);
                    const entMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
                    const entMesh = new THREE.Mesh(entGeo, entMat);
                    entMesh.position.set(finalX + (subSize/2), 3, finalZ);
                    scene.add(entMesh);
                }

                // 屋上のセットバックとアンテナ
                if (bHeight > 60) {
                    const topGeo = new THREE.BoxGeometry(subSize - 10, 10, subSize - 10);
                    const topMesh = new THREE.Mesh(topGeo, mat);
                    topMesh.position.set(finalX, bHeight + 6, finalZ);
                    topMesh.castShadow = true;
                    scene.add(topMesh);

                    if (Math.random() > 0.5) {
                        const antGeo = new THREE.CylinderGeometry(0.5, 0.5, 15);
                        const antMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                        const antMesh = new THREE.Mesh(antGeo, antMat);
                        antMesh.position.set(finalX, bHeight + 18, finalZ);
                        scene.add(antMesh);
                    }
                }
            }
        }
    }
}

// 構築実行
createIsland();
createMonorailSystem();
createLandmarks();
generateCity();

document.getElementById('loading').style.display = 'none';

// --- 操作・移動処理 (WASD + Shift) ---
const keys = { w: false, a: false, s: false, d: false, shift: false };
document.addEventListener('keydown', (e) => {
    if (e.key === 'w' || e.key === 'W') keys.w = true;
    if (e.key === 'a' || e.key === 'A') keys.a = true;
    if (e.key === 's' || e.key === 'S') keys.s = true;
    if (e.key === 'd' || e.key === 'D') keys.d = true;
    if (e.key === 'Shift') keys.shift = true;
});
document.addEventListener('keyup', (e) => {
    if (e.key === 'w' || e.key === 'W') keys.w = false;
    if (e.key === 'a' || e.key === 'A') keys.a = false;
    if (e.key === 's' || e.key === 'S') keys.s = false;
    if (e.key === 'd' || e.key === 'D') keys.d = false;
    if (e.key === 'Shift') keys.shift = false;
});

// マウスによる視点移動（OrbitControlsの簡易版）
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let cameraAngleX = 0; // 左右
let cameraAngleY = 0; // 上下

document.addEventListener('mousedown', () => { isDragging = true; });
document.addEventListener('mouseup', () => { isDragging = false; });
document.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
        cameraAngleX -= deltaMove.x * 0.005;
        cameraAngleY -= deltaMove.y * 0.005;
        // 上下の角度制限
        cameraAngleY = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraAngleY));
        
        const direction = new THREE.Vector3(
            Math.sin(cameraAngleX) * Math.cos(cameraAngleY),
            Math.sin(cameraAngleY),
            Math.cos(cameraAngleX) * Math.cos(cameraAngleY)
        );
        const target = new THREE.Vector3().copy(camera.position).add(direction);
        camera.lookAt(target);
    }
    previousMousePosition = { x: e.offsetX, y: e.offsetY };
});
camera.lookAt(0, 100, 0); // 初期視点

// --- アニメーションループ ---
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // カメラ移動処理
    const speed = keys.shift ? 150 : 40;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();

    if (keys.w) camera.position.addScaledVector(dir, speed * delta);
    if (keys.s) camera.position.addScaledVector(dir, -speed * delta);
    if (keys.a) camera.position.addScaledVector(right, -speed * delta);
    if (keys.d) camera.position.addScaledVector(right, speed * delta);

    // モノレールの移動（3両それぞれ）
    if (trackSpline) {
        for(let i = 0; i < 3; i++) {
            monorailProgress[i] += monorailSpeed;
            if (monorailProgress[i] > 1) monorailProgress[i] -= 1;
            
            const pt = trackSpline.getPoint(monorailProgress[i]);
            const tangent = trackSpline.getTangent(monorailProgress[i]);
            
            monorailCars[i].position.copy(pt);
            const axis = new THREE.Vector3(0, 0, 1);
            monorailCars[i].quaternion.setFromUnitVectors(axis, tangent);
        }
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
