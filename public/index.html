<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HAKUYARC Metaverse - Nature Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; }
        
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .panel { background: rgba(30, 41, 59, 0.9); padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 300px;}
        .panel h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        .panel input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; }
        .panel button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0ea5e9; color: white; } .btn-primary:hover { background: #0284c7; }
        .btn-success { background: #10b981; color: white; } .btn-success:hover { background: #059669; }
        
        #sidebar {
            display: none; position: absolute; top: 0; left: 0; width: 280px; height: 100vh;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border-right: 1px solid #334155; z-index: 10; padding: 20px; box-sizing: border-box;
            flex-direction: column; gap: 20px;
        }
        .sidebar-section { border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .sidebar-section h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase;}
        .user-email { font-size: 1.1rem; font-weight: bold; color: #f8fafc; word-break: break-all;}
        .money { font-size: 1.8rem; color: #fbbf24; font-weight: bold; margin-top: 5px; }

        #controls-help {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 6px;
            font-size: 0.85rem; color: #fff; line-height: 1.6; display: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: rgba(0,0,0,0.5); border-radius: 50%;
            pointer-events: none; z-index: 5; display: none; border: 1px solid rgba(255,255,255,0.8);
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1;}
        #lock-btn {
            position: absolute; top: 20px; left: 300px; z-index: 10; padding: 10px 20px;
            background: #0ea5e9; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: none;
        }
    </style>
    <!-- Three.js & BVH & Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three-mesh-bvh@0.7.3/build/index.umd.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC Metaverse</h2>
            <input type="text" id="email" placeholder="Player Name" required>
            <button class="btn-primary" onclick="startGame()">ダイブする</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-section">
            <h3>Player Info</h3>
            <div class="user-email" id="ui-email">---</div>
            <div class="money">💰 <span id="ui-money">1000</span> CR</div>
        </div>
        <div class="sidebar-section">
            <h3>System Status</h3>
            <div style="color: #10b981; font-weight: bold;">✅ BVH Engine Active</div>
            <div style="color: #10b981; font-weight: bold;">✅ SoftShadow Active</div>
        </div>
        <p style="font-size: 0.8rem; color:#94a3b8;">画面をクリックして操作開始<br>Escキーでマウスカーソルを表示</p>
    </div>

    <button id="lock-btn" onclick="document.body.requestPointerLock()">▶ 画面をロックして操作</button>
    <div id="crosshair"></div>
    <div id="controls-help">[W][A][S][D]:移動 | [Space]:ジャンプ | [Shift]:ダッシュ | [マウス]:視点</div>
    <div id="canvas-container"></div>

    <script>
        if (window.MeshBVH) {
            THREE.BufferGeometry.prototype.computeBoundsTree = window.MeshBVH.computeBoundsTree;
            THREE.BufferGeometry.prototype.disposeBoundsTree = window.MeshBVH.disposeBoundsTree;
            THREE.Mesh.prototype.raycast = window.MeshBVH.acceleratedRaycast;
        }

        let socket, currentUserEmail;
        let scene, camera, renderer, clock;
        let mapGroup, environmentGroup;
        let localAvatar = null;
        const otherPlayers = {};
        
        let mapColliders = [];
        let grassMaterial; 
        
        let playerPos = new THREE.Vector3(0, 10, 0);
        let playerVelocity = new THREE.Vector3(0, 0, 0);
        let isGrounded = false;
        let cameraYaw = 0, cameraPitch = 0;
        let isLocked = false, isFPS = false;
        const keysPressed = {};
        
        const speedWalkBase = 6.0;
        const speedRunBase = 12.0;
        const jumpForceBase = 8.0;
        const gravityBase = -20.0;

        function startGame() {
            currentUserEmail = document.getElementById('email').value || "Guest";
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('ui-email').innerText = currentUserEmail;
            document.getElementById('lock-btn').style.display = 'block';

            // Socket.io 初期化 (サーバーが存在する場合のみ動作するようエラー回避)
            if (typeof io !== 'undefined') {
                socket = io();
                socket.emit('joinGame', { username: currentUserEmail });
                
                socket.on('initData', (data) => {
                    Object.keys(data.players).forEach(id => {
                        if (id !== socket.id) addOtherPlayer(data.players[id]);
                    });
                });
                socket.on('newPlayer', (info) => addOtherPlayer(info));
                socket.on('playerMoved', (info) => {
                    if (otherPlayers[info.id]) {
                        otherPlayers[info.id].userData.targetPos = new THREE.Vector3(info.x, info.y, info.z);
                        otherPlayers[info.id].userData.targetRot = info.rotation;
                        otherPlayers[info.id].userData.isMoving = true;
                    }
                });
                socket.on('playerDisconnected', (id) => {
                    if (otherPlayers[id]) {
                        scene.remove(otherPlayers[id]);
                        delete otherPlayers[id];
                    }
                });
            }

            initThreeJS();
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.003);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            // ★ 超リアルグラフィック設定
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // ★ リアルなライティング
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x446644, 0.6);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.bias = -0.0005;
            const d = 150;
            dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.far = 500;
            scene.add(dirLight);

            mapGroup = new THREE.Group();
            scene.add(mapGroup);
            clock = new THREE.Clock();

            buildNatureMap();
            createDefaultHakuyarcAvatar(true); // 自分のアバター
            setupInputHandlers();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function buildNatureMap() {
            // 起伏のあるデコボコな地面
            const groundGeo = new THREE.PlaneGeometry(1000, 1000, 64, 64);
            const pos = groundGeo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const zHeight = Math.sin(x * 0.05) * Math.cos(y * 0.05) * 5;
                pos.setZ(i, zHeight);
            }
            groundGeo.computeVertexNormals();
            if (window.MeshBVH) groundGeo.computeBoundsTree();
            
            const matFloor = new THREE.MeshStandardMaterial({ color: 0x4a6b36, roughness: 0.9 });
            const floor = new THREE.Mesh(groundGeo, matFloor);
            floor.rotation.x = -Math.PI / 2; 
            floor.receiveShadow = true; 
            mapGroup.add(floor);
            mapColliders.push(floor);

            // ★ 10万本の揺れる草 (InstancedMesh)
            const grassCount = 100000;
            const grassGeo = new THREE.ConeGeometry(0.15, 1.2, 3);
            grassGeo.translate(0, 0.6, 0); 
            
            grassMaterial = new THREE.MeshStandardMaterial({ color: 0x5c8a42, roughness: 0.8, side: THREE.DoubleSide });
            grassMaterial.onBeforeCompile = (shader) => {
                shader.uniforms.time = { value: 0 };
                grassMaterial.userData.shader = shader;
                shader.vertexShader = `
                    uniform float time;
                    ${shader.vertexShader}
                `.replace(
                    `#include <begin_vertex>`,
                    `
                    #include <begin_vertex>
                    float wave = sin(position.x * 2.0 + position.z * 2.0 + time * 3.0) * 0.2 * position.y;
                    transformed.x += wave;
                    transformed.z += wave * 0.5;
                    `
                );
            };

            const grassMesh = new THREE.InstancedMesh(grassGeo, grassMaterial, grassCount);
            grassMesh.receiveShadow = true;
            
            const dummy = new THREE.Object3D();
            for(let i = 0; i < grassCount; i++) {
                const r = Math.random() * 200;
                const theta = Math.random() * 2 * Math.PI;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                const y = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 5;
                
                dummy.position.set(x, y, z);
                dummy.rotation.y = Math.random() * Math.PI;
                const scale = 0.5 + Math.random() * 0.8;
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                grassMesh.setMatrixAt(i, dummy.matrix);
            }
            mapGroup.add(grassMesh);

            // アスレチック用の箱
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3 });
            for(let i=0; i<10; i++){
                const box = new THREE.Mesh(new THREE.BoxGeometry(5, 5, 5), boxMat); 
                box.position.set(10 + i*6, 2.5 + i*2, -20); 
                box.castShadow = true; box.receiveShadow = true; 
                if (window.MeshBVH) box.geometry.computeBoundsTree();
                mapGroup.add(box); mapColliders.push(box);
            }
        }

        function createDefaultHakuyarcAvatar(isLocal) {
            const group = new THREE.Group();
            const matHead = new THREE.MeshStandardMaterial({ color: '#dddddd', roughness: 0.6, metalness: 0.1, flatShading: true });
            const matBody = new THREE.MeshStandardMaterial({ color: '#555555', roughness: 0.6, metalness: 0.1, flatShading: true });
            const matArm  = new THREE.MeshStandardMaterial({ color: '#222a3f', roughness: 0.6, metalness: 0.1, flatShading: true });
            const glowMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: '#00f3ff', emissiveIntensity: 2.0 });

            const baseGroup = new THREE.Group(); group.add(baseGroup);
            const tiltGroup = new THREE.Group(); tiltGroup.position.y = 0.6; baseGroup.add(tiltGroup);

            const headGroup = new THREE.Group(); headGroup.position.y = 1.4;
            const h = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), matHead); h.castShadow = true;
            const v = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.08, 0.05), glowMat); v.position.set(0, 0.02, 0.32);
            headGroup.add(h, v); tiltGroup.add(headGroup);

            const torsoGroup = new THREE.Group(); torsoGroup.position.y = 0.7;
            const t = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), matBody); t.castShadow = true;
            torsoGroup.add(t); tiltGroup.add(torsoGroup);

            const armLGroup = new THREE.Group(); armLGroup.position.set(-0.35, 1.1, 0);
            const aL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.12), matArm); aL.position.y = -0.25; aL.castShadow = true; 
            armLGroup.add(aL); tiltGroup.add(armLGroup);
            
            const armRGroup = new THREE.Group(); armRGroup.position.set(0.35, 1.1, 0);
            const aR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.12), matArm); aR.position.y = -0.25; aR.castShadow = true; 
            armRGroup.add(aR); tiltGroup.add(armRGroup);

            group.userData = { base: baseGroup, head: headGroup, tilt: tiltGroup, armL: armLGroup, armR: armRGroup, walkTime: 0, targetPos: new THREE.Vector3(), targetRot: 0, isMoving: false };
            
            if(isLocal) {
                localAvatar = group;
                scene.add(localAvatar);
            }
            return group;
        }

        function addOtherPlayer(info) {
            const mesh = createDefaultHakuyarcAvatar(false);
            mesh.position.set(info.x, info.y, info.z);
            mesh.rotation.y = info.rotation;
            scene.add(mesh);
            otherPlayers[info.id] = mesh;
        }

        function updateAvatarAnim(avatar, isMoving, grounded, delta) {
            if (!avatar) return;
            const ud = avatar.userData;
            const time = clock.getElapsedTime();
            
            ud.base.position.y = grounded ? Math.sin(time * 2) * 0.05 : 0;

            if (!grounded) {
                ud.walkTime += delta * 10; 
                ud.armL.rotation.x = -Math.PI / 3 + (Math.sin(ud.walkTime) * 0.15); 
                ud.armR.rotation.x = -Math.PI / 3 - (Math.sin(ud.walkTime) * 0.15);
            } else if (isMoving) {
                ud.walkTime += delta * 15; 
                ud.armL.rotation.x = Math.sin(ud.walkTime) * 0.4 - 0.1; 
                ud.armR.rotation.x = -Math.sin(ud.walkTime) * 0.4 - 0.1;
            } else {
                ud.walkTime = 0; 
                ud.armL.rotation.x = THREE.MathUtils.lerp(ud.armL.rotation.x, 0, 0.1); 
                ud.armR.rotation.x = THREE.MathUtils.lerp(ud.armR.rotation.x, 0, 0.1);
            }
        }

        function checkCollision(pos, moveVec, nextVelY) {
            if (mapColliders.length === 0) return { canMove: true, grounded: false, safeY: pos.y + nextVelY, headHit: false };

            const raycaster = new THREE.Raycaster();
            raycaster.firstHitOnly = true; 
            
            const baseRadius = 0.3;
            const stepHeight = 0.6;
            const headHeight = 1.6;
            
            let finalGrounded = false;
            let finalSafeY = pos.y + nextVelY; 
            let headHit = false;

            // 1. 下方向
            const downOrigin = new THREE.Vector3(pos.x, pos.y + stepHeight, pos.z);
            const downDir = new THREE.Vector3(0, -1, 0);
            raycaster.set(downOrigin, downDir);
            const downIntersects = raycaster.intersectObjects(mapColliders, false);
            
            if (downIntersects.length > 0) {
                const hit = downIntersects[0];
                if (hit.distance <= stepHeight + (stepHeight * 1.5) + Math.abs(Math.min(0, nextVelY))) {
                    finalGrounded = true; finalSafeY = hit.point.y;
                }
            }

            // 2. 上方向
            if (nextVelY > 0) {
                const upOrigin = new THREE.Vector3(pos.x, pos.y + headHeight - 0.2, pos.z);
                const upDir = new THREE.Vector3(0, 1, 0);
                raycaster.set(upOrigin, upDir);
                const upIntersects = raycaster.intersectObjects(mapColliders, false);
                if (upIntersects.length > 0 && upIntersects[0].distance < nextVelY + 0.2) {
                    headHit = true; finalSafeY = upIntersects[0].point.y - headHeight;
                }
            }

            // 3. 水平方向・斜め下 (9本 + 3本)
            let canMove = true;
            if (moveVec.lengthSq() > 0) {
                const moveDir = moveVec.clone().normalize();
                const moveDist = moveVec.length() + baseRadius;
                const rightDir = moveDir.clone().cross(new THREE.Vector3(0, 1, 0)).normalize();
                const sideOffset = baseRadius * 0.8; 

                const heights = [ pos.y + 0.2, pos.y + (headHeight * 0.5), pos.y + headHeight - 0.2 ];
                const offsets = [ rightDir.clone().multiplyScalar(-sideOffset), new THREE.Vector3(0, 0, 0), rightDir.clone().multiplyScalar(sideOffset) ];

                for (let h of heights) {
                    for (let off of offsets) {
                        const origin = new THREE.Vector3(pos.x + off.x, h, pos.z + off.z);
                        raycaster.set(origin, moveDir);
                        const hits = raycaster.intersectObjects(mapColliders, false);
                        if (hits.length > 0 && hits[0].distance < moveDist) {
                            if (hits[0].face.normal.y > 0.5) continue;
                            canMove = false; break;
                        }
                    }
                    if(!canMove) break;
                }

                if (canMove && !finalGrounded) {
                    const diagDir = moveDir.clone().add(new THREE.Vector3(0, -1, 0)).normalize();
                    const diagDist = (baseRadius * 1.5) + Math.abs(Math.min(0, nextVelY)) + moveDist;
                    for (let off of offsets) {
                        const diagOrigin = new THREE.Vector3(pos.x + off.x, pos.y + (headHeight * 0.5), pos.z + off.z);
                        raycaster.set(diagOrigin, diagDir);
                        const hits = raycaster.intersectObjects(mapColliders, false);
                        if (hits.length > 0 && hits[0].distance < diagDist) {
                            if (hits[0].face.normal.y > 0.5) continue;
                            canMove = false; break;
                        }
                    }
                }
            }

            return { canMove: canMove, grounded: finalGrounded, safeY: finalSafeY, headHit: headHit };
        }

        function setupInputHandlers() {
            window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                cameraYaw -= e.movementX * 0.002; cameraPitch -= e.movementY * 0.002;
                cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
                document.getElementById('sidebar').style.opacity = isLocked ? '0' : '1';
                document.getElementById('lock-btn').style.display = isLocked ? 'none' : 'block';
                document.getElementById('crosshair').style.display = isLocked ? 'block' : 'none';
                document.getElementById('controls-help').style.display = isLocked ? 'block' : 'none';
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isLocked) { renderer.render(scene, camera); return; }
            
            const delta = Math.min(clock.getDelta(), 0.1);

            // 風で草を揺らすシェーダーの時間更新
            if (grassMaterial && grassMaterial.userData.shader) {
                grassMaterial.userData.shader.uniforms.time.value = clock.getElapsedTime();
            }

            const speed = keysPressed['shift'] ? speedRunBase : speedWalkBase;
            const mv = new THREE.Vector3(0, 0, 0);
            const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
            const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));

            if (keysPressed['w']) mv.add(forward);
            if (keysPressed['s']) mv.sub(forward);
            if (keysPressed['a']) mv.sub(right);
            if (keysPressed['d']) mv.add(right);

            let moved = false;
            let targetAngleForMove = 0;
            if (mv.lengthSq() > 0) {
                mv.normalize().multiplyScalar(speed * delta);
                moved = true;
                targetAngleForMove = Math.atan2(mv.x, mv.z);
            }

            let nextVelocityY = 0;
            if (keysPressed[' '] && isGrounded) {
                playerVelocity.y = jumpForceBase; isGrounded = false; playerPos.y += 0.05;
            }
            playerVelocity.y += gravityBase * delta;
            nextVelocityY = playerVelocity.y * delta;
            
            let checkMoveVec = mv.clone();
            if (!moved) {
                const facing = new THREE.Vector3(-Math.sin(localAvatar.rotation.y), 0, -Math.cos(localAvatar.rotation.y));
                checkMoveVec = facing.multiplyScalar(0.1); 
            }

            const col = checkCollision(playerPos, checkMoveVec, nextVelocityY);

            if (col.headHit) playerVelocity.y = 0;
            playerPos.y = col.safeY;
            if (col.grounded) { isGrounded = true; if (playerVelocity.y < 0) playerVelocity.y = 0; } 
            else { isGrounded = false; }

            if (moved && col.canMove) { playerPos.x += mv.x; playerPos.z += mv.z; }
            if (playerPos.y < -50) { playerPos.set(0, 10, 0); playerVelocity.y = 0; } // 落下リセット

            // アバター更新
            if (localAvatar) { 
                localAvatar.position.copy(playerPos);
                updateHakuyarcAvatarAnim(localAvatar, moved, isGrounded, delta, targetAngleForMove);
                
                if(moved || !isGrounded) {
                    let yawDiff = cameraYaw + Math.PI - localAvatar.rotation.y;
                    while(yawDiff < -Math.PI) yawDiff += Math.PI * 2;
                    while(yawDiff > Math.PI) yawDiff -= Math.PI * 2;
                    if (yawDiff > 1.0) { localAvatar.rotation.y += (yawDiff - 1.0) * 0.1; localAvatar.userData.head.rotation.y = 1.0; } 
                    else if (yawDiff < -1.0) { localAvatar.rotation.y += (yawDiff + 1.0) * 0.1; localAvatar.userData.head.rotation.y = -1.0; } 
                    else { localAvatar.userData.head.rotation.y = yawDiff; }
                }
                localAvatar.userData.head.rotation.x = -cameraPitch; 

                // 通信同期
                if (moved && socket) {
                    socket.emit('playerMovement', { x: playerPos.x, y: playerPos.y, z: playerPos.z, rotation: localAvatar.rotation.y });
                }
            }

            // 他プレイヤーの補間移動
            Object.values(otherPlayers).forEach(op => {
                if(op.userData.isMoving) {
                    op.position.lerp(op.userData.targetPos, 0.2);
                    
                    let diff = op.userData.targetRot - op.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    op.rotation.y += diff * 0.2;
                    
                    updateAvatarAnim(op, true, true, delta);
                    if(op.position.distanceTo(op.userData.targetPos) < 0.1) op.userData.isMoving = false;
                } else {
                    updateAvatarAnim(op, false, true, delta);
                }
            });

            // TPSカメラ
            const headTarget = playerPos.clone(); headTarget.y += 1.6;
            const dist = 5.0;
            const hDist = Math.cos(cameraPitch) * dist; const vDist = Math.sin(cameraPitch) * dist;
            camera.position.copy(headTarget).add(new THREE.Vector3(Math.sin(cameraYaw) * hDist, -vDist, Math.cos(cameraYaw) * hDist));
            
            if (cameraPitch > 0) {
                camera.position.addScaledVector(new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw)), -cameraPitch * 3.0);
                if (camera.position.y < playerPos.y + 1.0 + (cameraPitch * 1.5)) camera.position.y = playerPos.y + 1.0 + (cameraPitch * 1.5);
            }
            if (camera.position.y < playerPos.y + 0.2) camera.position.y = playerPos.y + 0.2;
            camera.lookAt(headTarget);

            renderer.render(scene, camera);
        }
    </script>
