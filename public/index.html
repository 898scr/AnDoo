<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Loading & Collision Test</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; display: none;}
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; }
        
        #controls-help { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;}
        
        #interaction-prompt { position: absolute; bottom: 20vh; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 1px solid #00ffff; padding: 10px 20px; border-radius: 20px; color: #00ffff; font-weight: bold; font-size: 1.2rem; display: none; }
        .key-btn { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }

        #start-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(10,15,30,0.9); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index: 100;}
        #start-screen button { padding: 15px 30px; font-size: 1.2rem; background: #00ffff; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #start-screen button:hover { background: #00cccc; }

        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color:#00ffff; margin-bottom: 30px;">MAP & COLLISION TEST</h1>
        <button onclick="startGame()">画面をクリックしてスタート</button>
        <p style="margin-top: 20px; color:#aaa;">(ESCキーでマウスロック解除)</p>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="controls-help">
            [W A S D] 移動<br>
            [Shift] ダッシュ<br>
            [V] FPS/TPS切替<br>
            [F] インタラクト (ワープ)
        </div>
        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, clock;
        
        // プレイヤー状態
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isFPS = true;
        let playerLocalPos = new THREE.Vector3(0, 5, 50); // 初期位置
        let playerVelocityY = 0;
        let localAvatar = null;
        
        // マップデータ格納用
        let mapData = null;
        let isWarping = false;
        let fKeyWasPressed = false;
        let vKeyWasPressed = false;

        async function loadMapData() {
            try {
                // サーバーからJSONを取得
                const response = await fetch('/test_map.json');
                if (!response.ok) throw new Error("Map load failed");
                mapData = await response.json();
                console.log("Map Loaded:", mapData.name);
                buildSceneFromMap();
            } catch (e) {
                console.error(e);
                alert("マップデータの読み込みに失敗しました。");
            }
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 4000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();
            
            // プレイヤーアバター (TPS用)
            localAvatar = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 3, 1.5), 
                new THREE.MeshStandardMaterial({color: 0x00ffff, wireframe:true})
            );
            scene.add(localAvatar);

            setupInputHandlers();
            
            // マップ読み込み開始
            loadMapData();
        }

        function buildSceneFromMap() {
            if (!mapData) return;

            // 環境設定
            scene.background = new THREE.Color(mapData.environment.groundColor);
            scene.add(new THREE.AmbientLight(mapData.environment.ambientLight, 1.5));
            const dLight = new THREE.DirectionalLight(mapData.environment.directionalLight, 1.0);
            dLight.position.set(100, 200, 100);
            scene.add(dLight);

            // 床 (Floors) の生成
            mapData.floors.forEach(f => {
                let mesh;
                const mat = new THREE.MeshStandardMaterial({color: f.color});
                if (f.type === 'circle') {
                    mesh = new THREE.Mesh(new THREE.CircleGeometry(f.radius, 32), mat);
                    mesh.rotation.x = -Math.PI/2;
                    mesh.position.set(f.x, f.y, f.z);
                } else if (f.type === 'rect') {
                    mesh = new THREE.Mesh(new THREE.PlaneGeometry(f.width, f.depth), mat);
                    mesh.rotation.x = -Math.PI/2;
                    mesh.position.set(f.x, f.y, f.z);
                }
                if(mesh) scene.add(mesh);
            });

            // 壁 (Walls) の生成
            mapData.walls.forEach(w => {
                let mesh;
                const height = w.maxY - w.minY;
                const mat = new THREE.MeshStandardMaterial({color: w.color});
                if (w.type === 'rect') {
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(w.width, height, w.depth), mat);
                    mesh.position.set(w.x, w.minY + height/2, w.z);
                } else if (w.type === 'circle') {
                    mesh = new THREE.Mesh(new THREE.CylinderGeometry(w.radius, w.radius, height, 16), mat);
                    mesh.position.set(w.x, w.minY + height/2, w.z);
                }
                if(mesh) scene.add(mesh);
            });

            // ワープパッドの生成
            mapData.warpPads.forEach(wp => {
                const pad = new THREE.Group();
                pad.add(new THREE.Mesh(new THREE.RingGeometry(1.5, 2, 16), new THREE.MeshBasicMaterial({ color: wp.color, side: THREE.DoubleSide })).rotateX(Math.PI/2));
                pad.add(new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 5, 8, 1, true), new THREE.MeshBasicMaterial({ color: wp.color, transparent: true, opacity: 0.3, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })).translateY(2.5));
                pad.position.set(wp.x, wp.y + 0.1, wp.z);
                scene.add(pad);
                // Three.jsオブジェクト内にデータを保持させておく
                pad.userData = wp;
                wp.mesh = pad; // JSONデータ側にも参照を持たせる
            });

            animate();
        }

        function setupInputHandlers() {
            window.addEventListener('keydown', e => keysPressed[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
            
            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === document.body;
                document.getElementById('ui-layer').style.display = isLocked ? 'block' : 'none';
                if(!isLocked) document.getElementById('start-screen').style.display = 'flex';
            });
            
            document.addEventListener('mousemove', e => {
                if (isLocked) {
                    cameraYaw -= e.movementX * 0.002;
                    cameraPitch -= e.movementY * 0.002;
                    cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.body.requestPointerLock();
            if(!scene) initThreeJS();
        }

        function checkCollision(nextX, nextY, nextZ) {
            if (!mapData) return { canMove: true, adjustedX: nextX, adjustedZ: nextZ };
            
            let finalX = nextX;
            let finalZ = nextZ;

            // 壁 (Walls) との当たり判定 (スライディング処理)
            for (let w of mapData.walls) {
                // 高さが範囲内かチェック (プレイヤーの足元〜頭の高さが壁と被るか)
                if (nextY + 3 > w.minY && nextY < w.maxY) {
                    
                    if (w.type === 'rect') {
                        const hw = w.width / 2;
                        const hd = w.depth / 2;
                        
                        // 壁のローカル座標系での位置 (回転は未実装とする)
                        const dx = finalX - w.x;
                        const dz = finalZ - w.z;

                        // AABBコリジョンチェック
                        if (Math.abs(dx) < hw + 1.0 && Math.abs(dz) < hd + 1.0) { // +1.0はプレイヤーの半径（アタリ判定の大きさ）
                            // どの面からぶつかったかを判定して押し出す
                            const distLeft = dx - (-hw - 1.0);
                            const distRight = (hw + 1.0) - dx;
                            const distTop = dz - (-hd - 1.0);
                            const distBottom = (hd + 1.0) - dz;

                            const min = Math.min(Math.abs(distLeft), Math.abs(distRight), Math.abs(distTop), Math.abs(distBottom));

                            if (min === Math.abs(distLeft)) finalX = w.x - hw - 1.0;
                            else if (min === Math.abs(distRight)) finalX = w.x + hw + 1.0;
                            else if (min === Math.abs(distTop)) finalZ = w.z - hd - 1.0;
                            else if (min === Math.abs(distBottom)) finalZ = w.z + hd + 1.0;
                        }
                    } else if (w.type === 'circle') {
                        const dist = Math.hypot(finalX - w.x, finalZ - w.z);
                        const minRadius = w.radius + 1.0; // 壁の半径 + プレイヤー半径
                        if (dist < minRadius) {
                            const angle = Math.atan2(finalZ - w.z, finalX - w.x);
                            finalX = w.x + Math.cos(angle) * minRadius;
                            finalZ = w.z + Math.sin(angle) * minRadius;
                        }
                    }
                }
            }

            return { canMove: true, adjustedX: finalX, adjustedZ: finalZ };
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isLocked || !mapData) return;

            const delta = Math.min(clock.getDelta(), 0.1);

            // FPS切替
            const vPressed = keysPressed['v'];
            if (vPressed && !vKeyWasPressed) { isFPS = !isFPS; localAvatar.visible = !isFPS; }
            vKeyWasPressed = vPressed;

            const fPressed = keysPressed['f'];
            let tryInteract = fPressed && !fKeyWasPressed;
            fKeyWasPressed = fPressed;

            // 移動ベクトル計算
            const moveSpeed = (keysPressed['shift'] ? 30 : 10) * delta;
            const fwd = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
            const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
            
            let mv = new THREE.Vector3();
            if (keysPressed['w']) mv.add(fwd);
            if (keysPressed['s']) mv.sub(fwd);
            if (keysPressed['a']) mv.sub(right);
            if (keysPressed['d']) mv.add(right);
            if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(moveSpeed);

            if (!isWarping) {
                // 次の予測位置
                let nextX = playerLocalPos.x + mv.x;
                let nextZ = playerLocalPos.z + mv.z;
                
                // --- 壁の当たり判定 ---
                const collisionResult = checkCollision(nextX, playerLocalPos.y, nextZ);
                playerLocalPos.x = collisionResult.adjustedX;
                playerLocalPos.z = collisionResult.adjustedZ;

                // --- 床の当たり判定 (落下) ---
                let groundY = -5000;
                for (let f of mapData.floors) {
                    if (playerLocalPos.y >= f.y - 5 && playerLocalPos.y <= f.y + 10) { // y-5〜y+10の範囲で床をサーチ
                        let onFloor = false;
                        if (f.type === 'circle') {
                            if (Math.hypot(playerLocalPos.x - f.x, playerLocalPos.z - f.z) <= f.radius) onFloor = true;
                        } else if (f.type === 'rect') {
                            const hw = f.width / 2; const hd = f.depth / 2;
                            if (Math.abs(playerLocalPos.x - f.x) <= hw && Math.abs(playerLocalPos.z - f.z) <= hd) onFloor = true;
                        }
                        if (onFloor && f.y > groundY) groundY = f.y;
                    }
                }

                // 重力処理
                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 30 * delta; // 自由落下
                    playerLocalPos.y += playerVelocityY * delta;
                    if (playerLocalPos.y <= groundY) { playerLocalPos.y = groundY; playerVelocityY = 0; }
                } else {
                    playerLocalPos.y = groundY; playerVelocityY = 0;
                }

                // 奈落リスポーン
                if (playerLocalPos.y < -100) {
                    playerLocalPos.set(0, 5, 50); playerVelocityY = 0;
                }
            }

            // ワープパッド判定
            let promptText = "";
            let interactTarget = null;

            if (!isWarping) {
                for (let wp of mapData.warpPads) {
                    if (playerLocalPos.distanceTo(new THREE.Vector3(wp.x, wp.y, wp.z)) < 3) {
                        promptText = wp.label;
                        interactTarget = () => {
                            isWarping = true;
                            playerLocalPos.set(wp.targetX, wp.targetY, wp.targetZ);
                            setTimeout(() => { isWarping = false; }, 500);
                        };
                        break;
                    }
                }
                if (interactTarget && tryInteract) interactTarget();
            }

            // UI更新
            const promptEl = document.getElementById('interaction-prompt');
            if (promptText) {
                document.getElementById('prompt-text').innerText = promptText;
                promptEl.style.display = 'block';
            } else {
                promptEl.style.display = 'none';
            }

            // アバター位置更新
            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.position.y += 1.5; // アバターの中心を上げる
                localAvatar.rotation.y = cameraYaw;
            }

            // カメラ更新
            const camTarget = playerLocalPos.clone();
            if (isFPS) {
                camera.position.copy(camTarget);
                camera.position.y += 2.5; // 目の高さ
            } else {
                const offset = new THREE.Vector3(Math.sin(cameraYaw)*8, 3 + Math.sin(cameraPitch)*5, Math.cos(cameraYaw)*8);
                camera.position.copy(camTarget).add(offset);
                camTarget.y += 2;
            }
            
            const lookDir = new THREE.Vector3(
                -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                Math.sin(cameraPitch),
                -Math.cos(cameraYaw) * Math.cos(cameraPitch)
            );
            camera.lookAt(camera.position.clone().add(lookDir));

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
