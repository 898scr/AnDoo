<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 2px; }
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; }
        .btn-success { background: transparent; border: 1px solid #10b981; color: #10b981; }
        .btn-success:hover { background: rgba(16, 185, 129, 0.2); }
        
        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; }
        
        #sidebar { position: absolute; top: 20px; left: 20px; width: 250px; background: rgba(15,23,42,0.8); border-left: 3px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto;}
        .money { font-size: 1.5rem; color: #00ffff; font-weight: bold; }

        #admin-panel { display: none; position: absolute; top: 20px; right: 20px; width: 280px; background: rgba(30,10,40,0.85); border: 1px solid #ff00ff; padding: 15px; border-radius: 8px; pointer-events: auto; box-shadow: 0 0 20px rgba(255,0,255,0.3); }
        #admin-panel h3 { margin: 0 0 10px 0; color: #ff00ff; font-size: 1.1rem; border-bottom: 1px solid #ff00ff; padding-bottom: 5px;}
        .admin-row { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;}
        .admin-row input[type="number"], .admin-row input[type="text"] { width: 70px; background: #000; border: 1px solid #ff00ff; color: #fff; padding: 4px; border-radius: 4px;}
        .admin-row input[type="text"] { width: 110px; }
        .admin-btn { background: #ff00ff; color: #fff; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem;}
        .admin-btn.danger { background: #ff0000; }
        .admin-btn.safe { background: #00ff00; color: #000;}

        #minimap-container { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(2,6,23,0.8); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.2); pointer-events: auto;}
        #minimap { width: 100%; height: 100%; }

        #interaction-prompt { position: absolute; bottom: 20vh; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); border: 2px solid #00ffff; padding: 10px 20px; border-radius: 20px; color: #00ffff; font-weight: bold; font-size: 1.2rem; display: none; box-shadow: 0 0 15px rgba(0,255,255,0.5);}
        .key-btn { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }

        #controls-help { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; }

        #chat-container { position: absolute; bottom: 120px; left: 20px; width: 320px; background: rgba(15,23,42,0.8); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; }
        #chat-messages { height: 120px; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 5px; }
        #chat-messages div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        .chat-input-row { display: flex; border-top: 1px solid #334155; }
        #chat-input { flex-grow: 1; padding: 8px; border: none; background: rgba(0,0,0,0.5); color: white; outline: none; transition: 0.2s;}
        #chat-input:focus { background: rgba(0, 255, 255, 0.1); }
        #send-money-btn { padding: 0 10px; background: transparent; border: none; color: #facc15; font-size: 1.2rem; cursor: pointer; border-left: 1px solid #334155;}

        #perf-panel { position: absolute; bottom: 20px; right: 240px; background: rgba(0,0,0,0.6); border: 1px solid #334155; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; pointer-events: auto; display: flex; gap: 15px; align-items: center;}
        .perf-val { color: #00ffff; font-weight: bold; }
        
        #game-overlay { display: none; position: absolute; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:5; box-shadow: inset 0 0 150px rgba(0,0,0,0.9); }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <input type="text" id="username" placeholder="Username" required onkeyup="checkAdminLogin()">
            <input type="password" id="password" placeholder="Password (Optional)">
            <button class="btn-primary" onclick="attemptAuth('/api/login')">LOGIN</button>
            <button class="btn-success" onclick="attemptAuth('/api/register')">REGISTER</button>
            
            <div id="admin-pass-container" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #38bdf8;">
                <input type="password" id="admin-password" placeholder="Admin Password" style="border-color:#ff00ff;">
                <div style="font-size:0.7rem; color:#ff00ff; text-align:center;">※空欄でログインすると通常モード</div>
            </div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="game-overlay"></div>

        <div id="sidebar">
            <div style="font-size: 0.8rem; color:#94a3b8;">ID: <span id="ui-username">---</span></div>
            <div class="money">CR: <span id="ui-money">500</span></div>
            <div style="font-size: 0.8rem; color:#94a3b8; margin-top:5px;">株: <span id="ui-stocks">0</span> 株</div>
        </div>
        
        <div id="admin-panel">
            <h3>🛡️ ADMIN CONTROL</h3>
            <div class="admin-row">
                <span>Speed Mult:</span>
                <input type="number" id="admin-speed" value="3.0" step="0.5" onchange="updateAdminSpeed()">
            </div>
            <div class="admin-row">
                <span>Set CR:</span>
                <div>
                    <input type="number" id="admin-cr-val" value="10000">
                    <button class="admin-btn" onclick="updateCR(document.getElementById('admin-cr-val').value - currentCR)">SET</button>
                </div>
            </div>
            <div class="admin-row">
                <span>Target ID:</span>
                <input type="text" id="admin-target-id" placeholder="Username">
            </div>
            <div class="admin-row" style="justify-content: space-between;">
                <button class="admin-btn danger" onclick="adminUserAction('ban')">BAN</button>
                <button class="admin-btn safe" onclick="adminUserAction('unban')">UNBAN</button>
                <button class="admin-btn" onclick="adminUserAction('grant')">GRANT ADMIN</button>
            </div>
            <div class="admin-row" style="margin-top:5px;">
                <label style="cursor:pointer; color:#00ffff;"><input type="checkbox" id="admin-fly" onchange="toggleFlyMode()"> 🚁 FLY MODE (No Clip)</label>
            </div>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Enterでチャット開始 / 送信">
                <button id="send-money-btn" onclick="promptSendMoney()" title="CRを送金">💸</button>
            </div>
        </div>

        <div id="controls-help">
            [Click/Drag] 視点移動<br>
            [W A S D] 移動<br>
            [V] FPS/TPS切替<br>
            [F] アクション/購入/乗降<br>
            [E]上昇 / [Q]下降 (ドローン)<br>
            [Enter] チャット切替
        </div>

        <div id="perf-panel">
            <div>FPS: <span id="perf-fps" class="perf-val">60</span></div>
            <div>Ping: <span id="perf-ping" class="perf-val">--</span>ms</div>
        </div>

        <div id="minimap-container">
            <canvas id="minimap" width="200" height="200"></canvas>
        </div>
        
        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 擬似データベース (localStorage) ---
        let usersDb = JSON.parse(localStorage.getItem('hakuyarc_users')) || {};
        function saveUserDb() { localStorage.setItem('hakuyarc_users', JSON.stringify(usersDb)); }

        let currentUsername = 'Guest', socket = null;
        let scene, camera, renderer, clock;
        const MAP_RADIUS = 2000; 
        
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isDragging = false, isFPS = false;
        
        let playerLocalPos = new THREE.Vector3(0, 1.5, 100); 
        let playerVelocityY = 0; 
        
        let currentCR = 500;
        let currentStocks = 0;
        let playerColor = 0x00ffff;
        let playerAccessory = 'none';
        let playerSpeedMult = 1.0;

        let isAdmin = false;
        let adminFlyMode = false;

        let isGameFocusMode = false; 
        let gameFocusTarget = null;

        const trains = [], personalDrones = [], warpPads = [], stationAreas = []; 
        const otherPlayers = {}; 
        
        let ridingTrain = null, ridingDrone = null, localAvatar = null;
        let isWarping = false, fKeyWasPressed = false, vKeyWasPressed = false;
        let minimapCtx;
        
        let lastSentPos = new THREE.Vector3();
        let lastSentRot = 0;

        const interactables = []; 
        const slotMachines = [];
        let craneGames = []; 
        let hockeyPuck = null;
        let hockeyPuckVel = new THREE.Vector3();

        let currentStockPrice = 100;
        let stockHistory = Array(50).fill(100);
        const stockCanvas = document.createElement('canvas');
        stockCanvas.width = 512; stockCanvas.height = 256;
        const stockCtx = stockCanvas.getContext('2d');
        const stockTex = new THREE.CanvasTexture(stockCanvas);

        const TRAIN_BASE_SPEED = 0.12; 
        const TRAIN_STOP_TIME = 4.0; 
        const returnPads = {};

        let frames = 0, prevTime = performance.now();
        let lastPingTime = 0;

        function updateCR(amt) {
            currentCR += amt;
            document.getElementById('ui-money').innerText = currentCR;
            if (usersDb[currentUsername]) { usersDb[currentUsername].cr = currentCR; saveUserDb(); }
        }

        function addChatMessage(sender, text) {
            const msg = document.createElement('div');
            msg.innerHTML = `<strong style="color:${sender==='SYSTEM'?'#ff00ff':(sender==='CASINO'?'#facc15':'#00ffff')}">${sender}</strong>: ${text}`;
            document.getElementById('chat-messages').appendChild(msg);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        function checkAdminLogin() {
            const val = document.getElementById('username').value.trim();
            if (val === '898scr' || val === '898sct') {
                document.getElementById('admin-pass-container').style.display = 'block';
            } else {
                document.getElementById('admin-pass-container').style.display = 'none';
                document.getElementById('admin-password').value = '';
            }
        }

        function activateAdminMode() {
            isAdmin = true;
            document.getElementById('admin-panel').style.display = 'block';
            playerSpeedMult = 3.0; // デフォルトで爆速
            document.getElementById('admin-speed').value = 3.0;
        }

        function updateAdminSpeed() {
            if(!isAdmin) return;
            playerSpeedMult = parseFloat(document.getElementById('admin-speed').value) || 1.0;
        }

        function toggleFlyMode() {
            if(!isAdmin) return;
            adminFlyMode = document.getElementById('admin-fly').checked;
        }

        function promptSendMoney() {
            const target = prompt("送金先のUsernameを入力してください:");
            if (!target) return;
            if (!usersDb[target]) return alert("そのユーザーは存在しません。");
            const amt = parseInt(prompt("送金するCRを入力してください:"));
            if (isNaN(amt) || amt <= 0) return;
            if (currentCR < amt) return alert("CRが足りません。");

            updateCR(-amt);
            usersDb[target].cr += amt;
            saveUserDb();
            addChatMessage('SYSTEM', `${target} へ ${amt} CR を送金しました。`);
        }

        function adminUserAction(actionType) {
            if (!isAdmin) return;
            const target = document.getElementById('admin-target-id').value.trim();
            if (!target) return;

            if (!usersDb[target]) {
                usersDb[target] = { password: 'nopass', cr: 500, stocks: 0, color: 0x00ffff, accessory: 'none', isBanned: false, isAdminPrivileged: false };
            }

            if (actionType === 'ban') {
                usersDb[target].isBanned = true;
                addChatMessage('SYSTEM', `[ADMIN] '${target}' をBANしました。`);
            } else if (actionType === 'unban') {
                usersDb[target].isBanned = false;
                addChatMessage('SYSTEM', `[ADMIN] '${target}' のBANを解除しました。`);
            } else if (actionType === 'grant') {
                usersDb[target].isAdminPrivileged = true;
                addChatMessage('SYSTEM', `[ADMIN] '${target}' に権限を付与しました。`);
            }
            saveUserDb();
            
            // 強制同期コマンド
            if (socket) socket.emit('chatMessage', `$$SYS_CMD|${actionType}|${target}`);
        }

        async function attemptAuth(endpoint) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value || 'nopass';
            if (!username) return alert("Usernameを入力してください");

            try {
                let res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                let data = await res.json();
                
                if (data.success) {
                    if (endpoint === '/api/register') {
                        alert("登録成功！そのままログインします。");
                        return attemptAuth('/api/login');
                    }
                    currentUsername = data.username;
                    currentCR = data.money || 500;
                } else {
                    return alert(data.message);
                }
            } catch (err) {
                // ローカル環境フォールバック
                if (endpoint === '/api/register') {
                    if (usersDb[username]) return alert("既に登録されています(Local)");
                    usersDb[username] = { password, cr: 500, stocks: 0, color: 0x00ffff, accessory: 'none', isBanned: false, isAdminPrivileged: false };
                    saveUserDb();
                    alert("登録完了(Local)");
                    return attemptAuth('/api/login');
                } else {
                    if (!usersDb[username]) return alert("ユーザーが見つかりません。REGISTERから登録してください。");
                    if (usersDb[username].password !== password) return alert("パスワードが違います。");
                    if (usersDb[username].isBanned) return alert("このアカウントはBANされています。");
                    
                    currentUsername = username;
                    currentCR = usersDb[username].cr || 500;
                    currentStocks = usersDb[username].stocks || 0;
                    playerColor = usersDb[username].color !== undefined ? usersDb[username].color : 0x00ffff;
                    playerAccessory = usersDb[username].accessory || 'none';
                }
            }

            document.getElementById('ui-username').innerText = currentUsername;
            document.getElementById('ui-money').innerText = currentCR;
            document.getElementById('ui-stocks').innerText = currentStocks;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';
            
            const adminPass = document.getElementById('admin-password').value;
            if ((currentUsername === '898scr' || currentUsername === '898sct') && adminPass === 'admin') {
                activateAdminMode();
                addChatMessage('SYSTEM', '【ADMIN MODE】でアクセスしました。');
            } else if (usersDb[currentUsername] && usersDb[currentUsername].isAdminPrivileged) {
                activateAdminMode();
            }
            
            try { 
                if (typeof io !== 'undefined') { 
                    socket = io({ auth: { username: currentUsername } }); 
                    setupSocketEvents(); 
                    setInterval(() => { lastPingTime = performance.now(); socket.emit('ping'); }, 2000);
                    socket.on('pong', () => { document.getElementById('perf-ping').innerText = Math.round(performance.now() - lastPingTime); });
                } 
            } catch(e) { console.warn("Socket skip"); }
            
            try { document.body.requestPointerLock(); } catch(e) {}
            initThreeJS();
        }

        function updateAvatarAppearance() {
            if (!localAvatar) return;
            // 数値と文字列の両方に対応
            localAvatar.children[0].material.color.set(playerColor); 
            
            localAvatar.children.forEach(child => {
                if (child.userData && child.userData.isAccessory) {
                    child.visible = (child.userData.accType === playerAccessory);
                }
            });

            if (usersDb[currentUsername]) {
                usersDb[currentUsername].color = playerColor;
                usersDb[currentUsername].accessory = playerAccessory;
                saveUserDb();
            }

            if (socket) {
                socket.emit('changeAvatarConfig', {
                    color: playerColor,
                    accessory: playerAccessory,
                    ridingTrainIndex: ridingTrain ? trains.indexOf(ridingTrain) : -1,
                    ridingDroneIndex: ridingDrone ? personalDrones.indexOf(ridingDrone) : -1
                });
            }
        }

        function setupSocketEvents() {
            if (!socket) return;
            socket.on('initData', (data) => {
                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info);
                });
            });
            socket.on('newPlayer', (info) => { if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info); });
            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    otherPlayers[info.id].position.set(info.x, info.y, info.z);
                    otherPlayers[info.id].rotation.y = info.rotation;
                }
            });
            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
            });
            socket.on('chatMessage', (data) => {
                if (data.text.startsWith('$$SYS_CMD|')) {
                    const parts = data.text.split('|');
                    const cmd = parts[1];
                    const target = parts[2];
                    
                    if (!usersDb[target]) usersDb[target] = { password: 'nopass', cr: 500, stocks: 0, color: 0x00ffff, accessory: 'none', isBanned: false, isAdminPrivileged: false };
                    
                    if (cmd === 'grant') {
                        usersDb[target].isAdminPrivileged = true;
                        if (target === currentUsername) {
                            activateAdminMode();
                            addChatMessage('SYSTEM', 'ADMIN権限が付与されました。');
                        }
                    } else if (cmd === 'ban') {
                        usersDb[target].isBanned = true;
                        if (target === currentUsername) { alert('管理者にBANされました。'); window.location.reload(); }
                        for(let id in otherPlayers) {
                            if (otherPlayers[id].userData && otherPlayers[id].userData.username === target) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
                        }
                    } else if (cmd === 'unban') {
                        usersDb[target].isBanned = false;
                    }
                    saveUserDb();
                    return;
                }
                addChatMessage(data.username, data.text);
            });
            socket.on('avatarChanged', (data) => {
                if (otherPlayers[data.id] && data.avatar) {
                    const mesh = otherPlayers[data.id];
                    mesh.userData.ridingTrainIndex = data.avatar.ridingTrainIndex !== undefined ? data.avatar.ridingTrainIndex : -1;
                    mesh.userData.ridingDroneIndex = data.avatar.ridingDroneIndex !== undefined ? data.avatar.ridingDroneIndex : -1;
                    if (data.avatar.color) mesh.children[0].material.color.set(data.avatar.color);
                    if (data.avatar.accessory) {
                        mesh.children.forEach(child => {
                            if (child.userData && child.userData.isAccessory) child.visible = (child.userData.accType === data.avatar.accessory);
                        });
                    }
                }
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x020a1a);
            scene.fog = new THREE.FogExp2(0x020a1a, 0.0003);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 8000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.6;
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x556688, 3.0));
            const hemiLight = new THREE.HemisphereLight(0x88ffff, 0xff88ff, 2.0);
            hemiLight.position.set(0, 1000, 0);
            scene.add(hemiLight);

            createEnvironment();
            createUndergroundRooms();
            createLandmarkTower();
            createMonorails();
            createDrones();
            
            localAvatar = createAvatarMesh(playerColor, currentUsername);
            updateAvatarAppearance();
            scene.add(localAvatar);

            minimapCtx = document.getElementById('minimap').getContext('2d');
            clock = new THREE.Clock();
            
            setupInputHandlers();
            
            setInterval(() => {
                currentStockPrice = Math.max(10, Math.floor(currentStockPrice * (1 + (Math.random()-0.5)*0.3)));
                stockHistory.push(currentStockPrice);
                stockHistory.shift();
                updateStockChart();
            }, 5000);

            animate();
        }

        function createAvatarMesh(colorHex = 0x00ffff, username = null) {
            const group = new THREE.Group();
            const s = 2.5; 
            
            const bodyMat = new THREE.MeshStandardMaterial({color: colorHex, roughness: 0.2, metalness: 0.8});
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8*s, 1.2*s, 0.5*s), bodyMat);
            body.position.y = 0.6*s;
            
            const headMat = new THREE.MeshStandardMaterial({color: 0xffcc99});
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6*s, 0.6*s, 0.6*s), headMat);
            head.position.y = 1.5*s;
            
            const visorMat = new THREE.MeshBasicMaterial({color: 0x000000});
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.65*s, 0.2*s, 0.65*s), visorMat);
            visor.position.y = 1.5*s;
            
            group.add(body, head, visor);

            const earGeo = new THREE.ConeGeometry(0.2*s, 0.4*s, 4);
            const earL = new THREE.Mesh(earGeo, bodyMat); earL.position.set(-0.2*s, 1.9*s, 0);
            const earR = new THREE.Mesh(earGeo, bodyMat); earR.position.set(0.2*s, 1.9*s, 0);
            const catEars = new THREE.Group(); catEars.add(earL, earR);
            catEars.userData = { isAccessory: true, accType: 'cat_ears' };
            catEars.visible = false;
            group.add(catEars);

            const hatGrp = new THREE.Group();
            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.4*s, 0.4*s, 0.1*s, 16), new THREE.MeshStandardMaterial({color:0x222222})).translateY(1.8*s));

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(0x0284c7, info.username);

            mesh.rotation.y = info.rotation;
            mesh.userData.username = info.username;

            if (info.avatar) {
                mesh.userData.ridingTrainIndex = info.avatar.ridingTrainIndex !== undefined ? info.avatar.ridingTrainIndex : -1;
                mesh.userData.ridingDroneIndex = info.avatar.ridingDroneIndex !== undefined ? info.avatar.ridingDroneIndex : -1;
                if(info.avatar.color) mesh.children[0].material.color.set(info.avatar.color);
                if(info.avatar.accessory) {
                    mesh.children.forEach(c => { if(c.userData && c.userData.isAccessory) c.visible = (c.userData.accType === info.avatar.accessory); });
                }
            } else {
                mesh.userData.ridingTrainIndex = -1; mesh.userData.ridingDroneIndex = -1;

            scene.add(mesh);
            otherPlayers[info.id] = mesh;

        function createEnvironment() {

            const roadMat = new THREE.MeshStandardMaterial({color: 0x1a1a24});

            for(let i=0; i<8; i++) {

            const corners = [

                {x: Math.cos(3*Math.PI/4)*dist, z: Math.sin(3*Math.PI/4)*dist, col: 0xff00ff, name: "dome", label: "エンタメドームへ", target: new THREE.Vector3(0, -998.5, -5000)},
                {x: Math.cos(7*Math.PI/4)*dist, z: Math.sin(7*Math.PI/4)*dist, col: 0x00ff00, name: "stock", label: "証券取引所へ", target: new THREE.Vector3(5000, -998.5, 0)},

            corners.forEach(c => {
                const group = new THREE.Group();
                const lookAngle = Math.atan2(-c.x, -c.z); 
                
                if (c.name === "drone") {
                    stationAreas.push({ type: 'wall', x: c.x, z: c.z, radius: 120, height: 60 });
                } else {
                    stationAreas.push({ type: 'wall', x: c.x, z: c.z, radius: 300, height: 300 });
                }

                if (c.name === "mall") {
                    for(let i=0; i<3; i++) {
                        const r = 300 - i*40;

                        floor.position.y = 2.5 + i*80;

                        glass.position.y = 42.5 + i*80;
                        const core = new THREE.Mesh(new THREE.CylinderGeometry(60, 60, 75, 16), new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true}));
                        core.position.y = 42.5 + i*80;
                        group.add(floor, glass, core);
                    }
                } else if (c.name === "dome") {
                    const dome = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color: 0x1a0524, roughness: 0.2}));

                    }
                    const roof = new THREE.Mesh(new THREE.CylinderGeometry(330, 300, 40, 16), new THREE.MeshStandardMaterial({color: 0x052405}));

                    const outScreen = new THREE.Mesh(new THREE.CylinderGeometry(200, 200, 150, 32), new THREE.MeshBasicMaterial({map: stockTex, transparent: true, opacity: 0.8, side: THREE.DoubleSide}));

                } else if (c.name === "drone") {
                    const deck = new THREE.Mesh(new THREE.CylinderGeometry(320, 260, 10, 32), new THREE.MeshStandardMaterial({color: 0x221111}));
                    deck.position.y = 60; 
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(80, 120, 55, 16), new THREE.MeshStandardMaterial({color: 0x111111}));
                    pillar.position.y = 27.5;
                    group.add(deck, pillar);

                    stationAreas.push({ type: 'circle', x: c.x, z: c.z, radius: 320, y: 65 });

                    for(let i=0; i<8; i++) {
                        const pa = i * Math.PI/4 + lookAngle + Math.PI;

                        const pz = c.z + Math.sin(pa) * 200;
                        
                        const lpx = Math.cos(i * Math.PI/4) * 200;

                        const pad = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 2, 16), new THREE.MeshStandardMaterial({color: 0x442222}));
                        pad.position.set(lpx, 66, lpz);
                        const ring = new THREE.Mesh(new THREE.RingGeometry(35, 40, 32), new THREE.MeshBasicMaterial({color: 0xff0000, side: THREE.DoubleSide})).rotateX(-Math.PI/2);

                const gateGroup = new THREE.Group();
                const gateMat = new THREE.MeshStandardMaterial({color: 0x333333});

                const padX = c.x + Math.sin(lookAngle) * (gateRadius + 50);
                const padZ = c.z + Math.cos(lookAngle) * (gateRadius + 50);
                
                returnPads[c.name] = { x: padX, z: padZ };

                createWarpPad(padX, 0, padZ, c.col, c.target.x, c.target.y, c.target.z, c.label);

                if (c.name === "drone") {
                    createWarpPad(c.x, 65, c.z, c.col, padX, 1.5, padZ, "地上へ降りる");
                }

                group.position.set(c.x, 0, c.z);
                group.rotation.y = lookAngle; // 正面を向かせる
                scene.add(group);
            });
        }

            interactables.push({ pos: new THREE.Vector3(5000, -998.5, -50), radius: 30, label: "株を購入/売却", action: () => {
                const action = prompt(`現在の株価: ${currentStockPrice}CR\n[1] 買う\n[2] 売る\n半角数字で入力してください`);
                if (action === '1') {
                    if(currentCR >= currentStockPrice) { updateCR(-currentStockPrice); currentStocks++; document.getElementById('ui-stocks').innerText = currentStocks; addChatMessage("SYSTEM", "株を購入しました"); }
                    else addChatMessage("SYSTEM", "CRが足りません");
                } else if (action === '2') {
                    if(currentStocks > 0) { updateCR(currentStockPrice); currentStocks--; document.getElementById('ui-stocks').innerText = currentStocks; addChatMessage("SYSTEM", "株を売却しました"); }
                    else addChatMessage("SYSTEM", "株を持っていません");

            }});

        }

        function createLandmarkTower() {
            const towerGroup = new THREE.Group();
            const TOWER_Y = 1350; 
            
            const legMat = new THREE.MeshStandardMaterial({color: 0x0f172a, roughness: 0.3, metalness: 0.8});
            const frameMat = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.2});
            
            const legHeight = 500;
            for(let i=0; i<4; i++) {
                const angle = i * Math.PI/2 + Math.PI/4; 
                const legGrp = new THREE.Group();
                // 足の太さを3倍に
                const legGeo = new THREE.CylinderGeometry(50, 150, legHeight, 16); 
                const leg = new THREE.Mesh(legGeo, legMat);
                const legFrame = new THREE.Mesh(legGeo, frameMat); 
                leg.position.y = legHeight/2; legFrame.position.y = legHeight/2;
                leg.rotation.x = -Math.PI/6; legFrame.rotation.x = -Math.PI/6;
                legGrp.add(leg, legFrame);

                const radius = 300; 
                legGrp.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
                legGrp.rotation.y = -angle - Math.PI/2;
                towerGroup.add(legGrp);
                stationAreas.push({ type: 'circle', x: Math.cos(angle)*radius, z: Math.sin(angle)*radius, radius: 100, y: 0 });
            }

            // タワー本体の太さを約3倍に
            const towerGeo = new THREE.CylinderGeometry(150, 250, TOWER_Y - 400, 32);
            const tower = new THREE.Mesh(towerGeo, legMat);
            const towerFrame = new THREE.Mesh(towerGeo, frameMat);
            tower.position.y = 400 + (TOWER_Y - 400) / 2;
            towerFrame.position.y = 400 + (TOWER_Y - 400) / 2;
            towerGroup.add(tower, towerFrame);

            // リング装飾
            const midRing = new THREE.Mesh(new THREE.TorusGeometry(350, 15, 32, 64), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.8}));
            midRing.rotation.x = Math.PI/2; midRing.position.y = 800; towerGroup.add(midRing);

            const obsRadius = 350; // 展望台の半径も大きく
            const floorInner = new THREE.Mesh(new THREE.CylinderGeometry(200, 150, 20, 32), new THREE.MeshStandardMaterial({color: 0x1e293b, roughness: 0.1, metalness: 0.8}));
            floorInner.position.y = TOWER_Y - 10; towerGroup.add(floorInner);
            const floorTopInner = new THREE.Mesh(new THREE.CircleGeometry(200, 32), new THREE.MeshStandardMaterial({color: 0x020617}));
            floorTopInner.rotation.x = -Math.PI/2; floorTopInner.position.y = TOWER_Y; towerGroup.add(floorTopInner);
            const floorGlass = new THREE.Mesh(new THREE.RingGeometry(200, obsRadius, 64), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide}));
            floorGlass.rotation.x = -Math.PI/2; floorGlass.position.y = TOWER_Y; towerGroup.add(floorGlass);

            const domeMat = new THREE.MeshStandardMaterial({color: 0x00ffff, transparent: true, opacity: 0.1, roughness: 0.0, metalness: 0.5, side: THREE.DoubleSide});
            const dome = new THREE.Mesh(new THREE.SphereGeometry(obsRadius, 64, 32, 0, Math.PI*2, 0, Math.PI/2), domeMat);
            dome.position.y = TOWER_Y; towerGroup.add(dome);

            const coreGrp = new THREE.Group();
            coreGrp.add(new THREE.Mesh(new THREE.OctahedronGeometry(60, 2), new THREE.MeshBasicMaterial({color: 0xffaa00})));
            coreGrp.add(new THREE.Mesh(new THREE.OctahedronGeometry(65, 2), new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true})));
            coreGrp.position.y = TOWER_Y + 80; towerGroup.add(coreGrp);

            const beam = new THREE.Mesh(new THREE.CylinderGeometry(80, 80, 5000, 32), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending}));
            beam.position.y = 2500; towerGroup.add(beam);

            createWarpPad(0, 0, 0, 0x00ffff, 0, TOWER_Y + 2, 120, "展望台へ昇る");
            createWarpPad(0, TOWER_Y, 200, 0xff00ff, 0, 1.5, 120, "地上へ戻る");

            scene.add(towerGroup);
        }

        function updateStockChart() {
            stockCtx.fillStyle = '#0a1a0a'; stockCtx.fillRect(0, 0, 512, 256);
            stockCtx.strokeStyle = '#00ff00'; stockCtx.lineWidth = 4; stockCtx.beginPath();
            const min = Math.max(0, Math.min(...stockHistory) - 20);
            const max = Math.max(...stockHistory) + 20;
            const range = max - min || 1;
            stockHistory.forEach((val, i) => {
                const px = (i / (stockHistory.length - 1)) * 512;
                const py = 256 - ((val - min) / range) * 256;
                if (i === 0) stockCtx.moveTo(px, py); else stockCtx.lineTo(px, py);
            });
            stockCtx.stroke(); stockTex.needsUpdate = true;
        }

        // 以下、アニメーション処理...
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            frames++;
            if (performance.now() - prevTime >= 1000) {
                document.getElementById('perf-fps').innerText = frames;
                frames = 0; prevTime = performance.now();
            }

            const vPressed = keysPressed['v'];
            if (vPressed && !vKeyWasPressed) { isFPS = !isFPS; updateAvatarAppearance(); }
            vKeyWasPressed = vPressed;

            const fPressed = keysPressed['f'];
            let tryInteract = fPressed && !fKeyWasPressed;
            fKeyWasPressed = fPressed;

            const nowSec = Date.now() / 1000;

            trains.forEach(t => {
                const stopInterval = (Math.PI * 2) / t.numStops;
                const moveTime = stopInterval / TRAIN_BASE_SPEED;
                const sectionTotalTime = moveTime + TRAIN_STOP_TIME;
                const totalCycleTime = sectionTotalTime * t.numStops;
                const timeOffset = (t.initialAngle / stopInterval) * sectionTotalTime;
                const currentT = (nowSec + timeOffset) % totalCycleTime;
                
                const section = Math.floor(currentT / sectionTotalTime);
                const timeInSection = currentT % sectionTotalTime;
                
                let easeProgress = 0;
                if (timeInSection < moveTime) {
                    const p = timeInSection / moveTime;
                    easeProgress = (1 - Math.cos(p * Math.PI)) / 2; 
                    t.state = 'moving';
                } else { easeProgress = 1.0; t.state = 'stopped'; }

                t.angle = (section * stopInterval) + easeProgress * stopInterval;

                let r = t.radius; let dr = 0;
                if (t.type === 'curve') {
                    r = 900 - 300 * Math.cos(4 * t.angle); 
                    dr = 1200 * Math.sin(4 * t.angle);
                    t.radius = r;
                }
                const pt = new THREE.Vector3(Math.cos(t.angle) * r, 80, Math.sin(t.angle) * r);
                const dx = dr * Math.cos(t.angle) - r * Math.sin(t.angle);
                const dz = dr * Math.sin(t.angle) + r * Math.cos(t.angle);
                const rot = Math.atan2(dx, dz);
                t.mesh.position.copy(pt); t.mesh.rotation.y = rot;
            });

            slotMachines.forEach(m => {
                if (m.state === 'spinning') {
                    m.timer -= delta;
                    m.mesh.material.color.setHex(Math.random() * 0xffffff);
                    if (m.timer <= 0) {
                        m.state = 'idle';
                        if (Math.random() > 0.8) {
                            m.mesh.material.color.setHex(0xff0000); updateCR(100); addChatMessage("CASINO", `🎰 777! 大当たり！(+100 CR)`);
                        } else {
                            m.mesh.material.color.setHex(0x555555); addChatMessage("CASINO", "ハズレ...");
                        }
                    }
                }
            });

            if (hockeyPuck) {
                hockeyPuck.position.add(hockeyPuckVel.clone().multiplyScalar(delta));
                hockeyPuckVel.multiplyScalar(0.99); 
                if (hockeyPuck.position.x < 210) { hockeyPuckVel.x *= -1; hockeyPuck.position.x = 210; }
                if (hockeyPuck.position.x > 290) { hockeyPuckVel.x *= -1; hockeyPuck.position.x = 290; }
                if (hockeyPuck.position.z < -5080) { hockeyPuckVel.z *= -1; hockeyPuck.position.z = -5080; }
                if (hockeyPuck.position.z > -4920) { hockeyPuckVel.z *= -1; hockeyPuck.position.z = -4920; }
            }

            personalDrones.forEach((d, i) => {
                let isOccupied = false;
                if (ridingDrone === d) { isOccupied = true; d.state = 'ridden'; d.idleTime = 0; }
                Object.values(otherPlayers).forEach(p => { if (p.userData.ridingDroneIndex === i) { isOccupied = true; d.state = 'ridden'; d.idleTime = 0; } });
                
                if (!isOccupied) {
                    if (d.state === 'ridden') { d.state = 'idle'; d.idleTime = 0; }
                    d.idleTime += delta;
                    if (d.idleTime > 30 && d.mesh.position.distanceTo(d.initialPos) > 1 && d.state !== 'returning') d.state = 'returning';
                    if (d.state === 'returning') {
                        if (d.mesh.position.y < 800 && Math.hypot(d.mesh.position.x - d.initialPos.x, d.mesh.position.z - d.initialPos.z) > 10) {
                            d.mesh.position.y += 100 * delta; 
                        } else if (Math.hypot(d.mesh.position.x - d.initialPos.x, d.mesh.position.z - d.initialPos.z) > 10) {
                            const dir = new THREE.Vector3(d.initialPos.x - d.mesh.position.x, 0, d.initialPos.z - d.mesh.position.z).normalize();
                            d.mesh.position.add(dir.multiplyScalar(200 * delta));
                        } else {
                            d.mesh.position.x = d.initialPos.x; d.mesh.position.z = d.initialPos.z;
                            if (d.mesh.position.y > d.initialPos.y) d.mesh.position.y -= 100 * delta;
                            else { d.mesh.position.y = d.initialPos.y; d.state = 'idle'; d.idleTime = 0; }
                        }
                    }
                }
            });

            let promptText = "", interactTarget = null;
            if (ridingDrone) {
                promptText = "ドローンから降りる";
                if (tryInteract) { ridingDrone = null; playerLocalPos.y += 2; updateAvatarAppearance(); }
            } else if (ridingTrain) {
                const pt = ridingTrain.mesh.position;
                playerLocalPos.set(pt.x, pt.y + 2, pt.z); 
                let canAlight = false; let nearestStation = null;
                for (let st of stationAreas) {
                    if (st.type === 'rect' && Math.hypot(pt.x - st.x, pt.z - st.z) < 60) { canAlight = true; nearestStation = st; break; }
                }
                if (canAlight) {
                    promptText = "駅で降りる";
                    if (tryInteract) {
                        const isOuter = nearestStation.x * nearestStation.x + nearestStation.z * nearestStation.z > 1000 * 1000;
                        const offset = isOuter ? 40 : -20; 
                        const dirX = Math.cos(nearestStation.angle), dirZ = Math.sin(nearestStation.angle);
                        playerLocalPos.set(nearestStation.x + dirX*offset, 81.5, nearestStation.z + dirZ*offset);
                        ridingTrain = null; updateAvatarAppearance();
                    }
                } else promptText = "走行中... (駅で降りられます)";
            } else if (!isWarping) {
                let foundInteract = false;
                for (let t of trains) {
                    if (t.state === 'stopped' && Math.abs(playerLocalPos.y - t.mesh.position.y) < 15 && playerLocalPos.distanceTo(t.mesh.position) < 40) {
                        promptText = "列車に乗る"; interactTarget = () => { ridingTrain = t; updateAvatarAppearance(); };
                        foundInteract = true; break;
                    }
                }
                if (!foundInteract) {
                    for (let i = 0; i < personalDrones.length; i++) {
                        const d = personalDrones[i];
                        if (playerLocalPos.distanceTo(d.mesh.position) < 15 && Math.abs(playerLocalPos.y - d.mesh.position.y) < 10) {
                            let isOccupied = false;
                            Object.values(otherPlayers).forEach(p => { if (p.userData.ridingDroneIndex === i) isOccupied = true; });
                            if (!isOccupied) {
                                promptText = "ドローンに乗る"; 
                                interactTarget = () => { ridingDrone = d; playerLocalPos.copy(d.mesh.position); playerLocalPos.y += 4; updateAvatarAppearance(); }; 
                                foundInteract = true; break;
                            }
                        }
                    }
                }
                if (!foundInteract) {
                    for (let item of interactables) {
                        if (playerLocalPos.distanceTo(item.pos) < item.radius && Math.abs(playerLocalPos.y - item.pos.y) < 15) {
                            promptText = item.label; interactTarget = item.action; break;
                        }
                    }
                }
                if (interactTarget && tryInteract) interactTarget();
            }

            const promptEl = document.getElementById('interaction-prompt');
            if (promptText) { document.getElementById('prompt-text').innerText = promptText; promptEl.style.display = 'block'; }
            else promptEl.style.display = 'none';

            if (!isWarping && !ridingTrain && !isGameFocusMode && document.activeElement !== document.getElementById('chat-input')) {
                const speed = (keysPressed['shift'] ? 200 : 80) * playerSpeedMult * delta; 
                const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
                const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
                
                let mv = new THREE.Vector3();
                if (keysPressed['w']) mv.add(fwd);
                if (keysPressed['s']) mv.sub(fwd);
                if (keysPressed['a']) mv.sub(right); 
                if (keysPressed['d']) mv.add(right); 
                if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed);

                let nextPos = new THREE.Vector3(playerLocalPos.x + mv.x, playerLocalPos.y, playerLocalPos.z + mv.z);

                if (!ridingDrone && !ridingTrain && !isWarping && !adminFlyMode) {
                    let y = playerLocalPos.y;
                    
                    if (Math.abs(y - 1350) < 20) {
                        const dist = Math.hypot(nextPos.x, nextPos.z);
                        if (dist > 345) { 
                            const angle = Math.atan2(nextPos.z, nextPos.x);
                            nextPos.x = Math.cos(angle) * 345; nextPos.z = Math.sin(angle) * 345;
                        }
                    } 
                    else if (Math.abs(y - 80) < 20) {
                        let currentSt = null;
                        for (let st of stationAreas) {
                            if (st.type !== 'rect') continue;
                            const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                            const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                            const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { currentSt = st; break; }
                        }
                        if (currentSt) {
                            const dx = nextPos.x - currentSt.x, dz = nextPos.z - currentSt.z;
                            const cos = Math.cos(-currentSt.angle), sin = Math.sin(-currentSt.angle);
                            let lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            const hw = currentSt.width/2 - 1.5, hd = currentSt.depth/2 - 1.5;
                            if (lx > hw) lx = hw; if (lx < -hw) lx = -hw; if (lz > hd) lz = hd; if (lz < -hd) lz = -hd;
                            const cosInv = Math.cos(currentSt.angle), sinInv = Math.sin(currentSt.angle);
                            nextPos.x = currentSt.x + lx * cosInv - lz * sinInv; nextPos.z = currentSt.z + lx * sinInv + lz * cosInv;
                        }
                    }
                    
                    if (Math.abs(y - 60) < 20 && Math.hypot(playerLocalPos.x - Math.cos(5*Math.PI/4)*1800, playerLocalPos.z - Math.sin(5*Math.PI/4)*1800) < 350) {
                        let onDeck = false;
                        let deckCenter = null;
                        for (let st of stationAreas) {
                            if (st.type === 'circle' && st.y === 65) { 
                                if (Math.hypot(nextPos.x - st.x, nextPos.z - st.z) < 318) { onDeck = true; break; }
                                deckCenter = st;
                            }
                        }
                        if (!onDeck && deckCenter) {
                            const dist = Math.hypot(nextPos.x - deckCenter.x, nextPos.z - deckCenter.z);
                            if (dist > 318) {
                                const angle = Math.atan2(nextPos.z - deckCenter.z, nextPos.x - deckCenter.x);
                                nextPos.x = deckCenter.x + Math.cos(angle) * 318;
                                nextPos.z = deckCenter.z + Math.sin(angle) * 318;
                            }
                        }
                    }

                    for (let st of stationAreas) {
                        if (st.type === 'wall' && y >= 0 && y < (st.height || 300)) {
                            if (Math.hypot(nextPos.x - st.x, nextPos.z - st.z) < st.radius + 2) {
                                const angle = Math.atan2(nextPos.z - st.z, nextPos.x - st.x);
                                nextPos.x = st.x + Math.cos(angle) * (st.radius + 2);
                                nextPos.z = st.z + Math.sin(angle) * (st.radius + 2);
                            }
                        }
                    }

                    if (y < -900) {
                        if (Math.hypot(nextPos.x, nextPos.z - 5000) > 590 && Math.hypot(nextPos.x, nextPos.z - 5000) < 1000) {
                            const ang = Math.atan2(nextPos.z - 5000, nextPos.x);
                            nextPos.x = Math.cos(ang)*590; nextPos.z = 5000 + Math.sin(ang)*590;
                        }
                        if (Math.hypot(nextPos.x, nextPos.z + 5000) > 490 && Math.hypot(nextPos.x, nextPos.z + 5000) < 1000) {
                            const ang = Math.atan2(nextPos.z + 5000, nextPos.x);
                            nextPos.x = Math.cos(ang)*490; nextPos.z = -5000 + Math.sin(ang)*490;
                        }
                        if (Math.hypot(nextPos.x - 5000, nextPos.z) > 290 && Math.hypot(nextPos.x - 5000, nextPos.z) < 1000) {
                            const ang = Math.atan2(nextPos.z, nextPos.x - 5000);
                            nextPos.x = 5000 + Math.cos(ang)*290; nextPos.z = Math.sin(ang)*290;
                        }
                    }
                }
                
                if (ridingDrone || adminFlyMode) {
                    let nextY = playerLocalPos.y;
                    if (keysPressed['e']) nextY += 80 * delta; 
                    if (keysPressed['q']) nextY -= 80 * delta; 
                    nextY = Math.max(-1000, nextY);
                    playerLocalPos.set(nextPos.x, nextY, nextPos.z);
                    if (ridingDrone) { ridingDrone.mesh.position.copy(playerLocalPos); ridingDrone.mesh.position.y -= 4; }
                } else {
                    playerLocalPos.x = nextPos.x; playerLocalPos.z = nextPos.z;
                }
            }

            if (!ridingDrone && !ridingTrain && !isWarping && !adminFlyMode) {
                let groundY = -9000; 
                
                if (playerLocalPos.y > -500) { 
                    groundY = 1.5;
                    if (Math.abs(playerLocalPos.y - 1350) < 20 && Math.hypot(playerLocalPos.x, playerLocalPos.z) < 350) {
                        groundY = 1350;
                    } else {
                        for (let st of stationAreas) {
                            if (st.type === 'circle' && Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z) < st.radius && Math.abs(playerLocalPos.y - st.y) < 20) {
                                if (st.y > groundY) groundY = st.y; 
                            }
                            if (st.type === 'rect' && Math.abs(playerLocalPos.y - st.y) < 20) {
                                const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                                const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                                const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                                if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { 
                                    if (st.y > groundY) groundY = st.y; 
                                }
                            }
                        }
                    }

                    if (Math.hypot(playerLocalPos.x, playerLocalPos.z) > MAP_RADIUS + 200) groundY = -9000; 
                } else { 
                    if (Math.hypot(playerLocalPos.x, playerLocalPos.z - 5000) < 600) {
                        groundY = -1000 + 1.5;
                        if (Math.hypot(playerLocalPos.x, playerLocalPos.z - 5000) > 200 && playerLocalPos.y > -940) groundY = -940; 
                    } else if (Math.hypot(playerLocalPos.x, playerLocalPos.z + 5000) < 500) groundY = -1000 + 1.5;
                    else if (Math.hypot(playerLocalPos.x - 5000, playerLocalPos.z) < 300) groundY = -1000 + 1.5;
                }

                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 40 * delta; 
                    playerLocalPos.y += playerVelocityY * delta;
                    if (playerLocalPos.y <= groundY) { playerLocalPos.y = groundY; playerVelocityY = 0; }
                } else {
                    playerLocalPos.y = groundY; playerVelocityY = 0;
                }

                if (playerLocalPos.y < -3000) {
                    addChatMessage('SYSTEM', '奈落へ落下しました。中央広場へリスポーンします。');
                    playerLocalPos.set(0, 1.5, 100);
                    playerVelocityY = 0;
                }
            }

            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.visible = !isFPS;
                if (ridingTrain) localAvatar.rotation.y = ridingTrain.mesh.rotation.y;
                else if (!isWarping && !ridingDrone && !isGameFocusMode && document.activeElement !== document.getElementById('chat-input')) {
                    if (keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d']) {
                        let targetYaw = cameraYaw;
                        if (keysPressed['s']) targetYaw += Math.PI; else if (keysPressed['a']) targetYaw += Math.PI/2; else if (keysPressed['d']) targetYaw -= Math.PI/2;
                        localAvatar.rotation.y = targetYaw;
                    } else localAvatar.rotation.y = cameraYaw;
                }

                if (socket) {
                    const distSq = lastSentPos.distanceToSquared(playerLocalPos);
                    const rotDiff = Math.abs(lastSentRot - localAvatar.rotation.y);
                    if (distSq > 0.05 || rotDiff > 0.05) {
                        socket.emit('playerMovement', { x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, rotation: localAvatar.rotation.y });
                        lastSentPos.copy(playerLocalPos); lastSentRot = localAvatar.rotation.y;
                    }
                }
            }

            Object.values(otherPlayers).forEach(mesh => {
                if (mesh.userData.ridingTrainIndex >= 0) {
                    const t = trains[mesh.userData.ridingTrainIndex];
                    if (t) { mesh.position.set(t.mesh.position.x, t.mesh.position.y + 2, t.mesh.position.z); mesh.rotation.y = t.mesh.rotation.y; }
                }
                if (mesh.userData.ridingDroneIndex >= 0) {
                    const d = personalDrones[mesh.userData.ridingDroneIndex];
                    if (d) { d.mesh.position.copy(mesh.position); d.mesh.position.y -= 4; }
                }
            });

            if (isGameFocusMode && gameFocusTarget) {
                camera.position.lerp(gameFocusTarget, 5 * delta);
                const lookDir = new THREE.Vector3(gameFocusTarget.x, gameFocusTarget.y - 5, gameFocusTarget.z + 10);
                camera.lookAt(lookDir);
                document.getElementById('game-overlay').style.display = 'block';
            } else {
                document.getElementById('game-overlay').style.display = 'none';
                const camTarget = playerLocalPos.clone();
                if (isFPS) {
                    camera.position.copy(camTarget); camera.position.y += 1.6 * 2.5;
                } else {
                    const offset = new THREE.Vector3(Math.sin(cameraYaw)*35, 20 + Math.sin(cameraPitch)*20, Math.cos(cameraYaw)*35);
                    camera.position.copy(camTarget).add(offset); camTarget.y += 4; 
                }
                const lookDir = new THREE.Vector3(-Math.sin(cameraYaw) * Math.cos(cameraPitch), Math.sin(cameraPitch), -Math.cos(cameraYaw) * Math.cos(cameraPitch));
                camera.lookAt(camera.position.clone().add(lookDir));
            }

            updateMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
