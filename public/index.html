<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 2px; }
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; }
        .btn-success { background: transparent; border: 1px solid #00ffff; color: #00ffff; }
        .btn-success:hover { background: rgba(0, 255, 255, 0.1); }
        .error-msg { color: #f43f5e; font-size: 0.9rem; text-align: center; min-height: 20px; }

        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: rgba(0, 255, 255, 0.8); border-radius: 50%; }
        
        #sidebar { position: absolute; top: 20px; left: 20px; width: 250px; background: rgba(15,23,42,0.8); border-left: 3px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto;}
        .money { font-size: 1.5rem; color: #00ffff; font-weight: bold; }

        /* Admin用パネル */
        #admin-panel { display: none; position: absolute; top: 20px; right: 20px; width: 250px; background: rgba(20,0,10,0.9); border: 1px solid #f43f5e; padding: 15px; border-radius: 8px; pointer-events: auto;}
        #admin-panel h3 { margin: 0 0 10px 0; color: #f43f5e; font-size: 1.1rem; }
        #admin-panel input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; background:#000; color:#fff; border:1px solid #f43f5e;}
        #admin-panel button { width: 100%; padding: 8px; background: #f43f5e; color: #fff; border: none; font-weight: bold; cursor: pointer;}

        #controls-help { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; }

        #chat-container { position: absolute; bottom: 140px; left: 20px; width: 300px; background: rgba(15,23,42,0.8); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; }
        #chat-messages { height: 120px; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 5px; }
        #chat-input { padding: 8px; border: none; border-top: 1px solid #334155; background: transparent; color: white; outline: none; }

        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <div id="auth-error" class="error-msg"></div>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button class="btn-primary" onclick="attemptAuth('/api/login')">ENTER SYSTEM (ログイン)</button>
            <button class="btn-success" onclick="attemptAuth('/api/register')">REGISTER (新規登録)</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        
        <div id="sidebar">
            <div style="font-size: 0.8rem; color:#94a3b8;">ID: <span id="ui-username">---</span></div>
            <div class="money">CR: <span id="ui-money">0</span></div>
        </div>

        <div id="admin-panel">
            <h3>ADMIN PANEL</h3>
            <p style="font-size:0.75rem; color:#fbcfe8;">Zキー: 飛行切替 | E/Q: 上昇下降</p>
            <input type="text" id="ban-target" placeholder="対象ユーザー名">
            <button onclick="banUser()">BAN (追放)</button>
        </div>
        
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Message... (Enter to send)">
        </div>

        <div id="controls-help">
            [Click] 画面ロック (Esc解除)<br>
            [W A S D] 移動 | [Shift] ダッシュ<br>
            [V] FPS/TPS切替
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let currentUsername = null, socket = null, isAdmin = false;
        
        // 3D関連
        let scene, camera, renderer, clock, mapGroup;
        const otherPlayers = {};
        
        // プレイヤー状態
        const keysPressed = {};
        let cameraYaw = Math.PI, cameraPitch = 0, isLocked = false, isFPS = false;
        let playerLocalPos = new THREE.Vector3(0, 5, 50);
        let playerVelocityY = 0;
        let isFlying = false;
        let localAvatar = null;

        // マップデータ
        let mapData = { floors: [], walls: [], warpPads: [] };

        async function attemptAuth(endpoint) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(endpoint, { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ username, password }) 
                });
                const data = await res.json();
                
                if (data.success) {
                    if (endpoint === '/api/login') {
                        currentUsername = data.username;
                        isAdmin = data.isAdmin;
                        document.getElementById('ui-username').innerText = currentUsername;
                        document.getElementById('ui-money').innerText = data.cr;
                        
                        if (isAdmin) document.getElementById('admin-panel').style.display = 'block';
                        
                        startGame(); 
                    } else {
                        document.getElementById('auth-error').style.color = '#00ffff';
                        document.getElementById('auth-error').innerText = data.message;
                    }
                } else { 
                    document.getElementById('auth-error').style.color = '#f43f5e';
                    document.getElementById('auth-error').innerText = data.message; 
                }
            } catch (e) {
                document.getElementById('auth-error').style.color = '#f43f5e';
                document.getElementById('auth-error').innerText = "通信エラーが発生しました";
            }
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x0a1e3f);
            scene.fog = new THREE.FogExp2(0x0a1e3f, 0.003);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
            dirLight.position.set(100, 200, 50);
            scene.add(dirLight);

            mapGroup = new THREE.Group();
            scene.add(mapGroup);

            // ==========================================
            // ★ アバターの大改修（曲線パーツ・多色化）
            // ==========================================
            window.createAvatarMesh = function(colorHex) {
                const group = new THREE.Group();
                
                // パーツごとのマテリアル（質感・色）を定義
                const matShirt = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.8 }); 
                const matSkin = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.5 }); 
                const matPants = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 }); 
                const matShoes = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 }); 
                
                // 1. 胴体 (丸みのあるカプセル風)
                const bodyGroup = new THREE.Group();
                bodyGroup.position.y = 1.3;
                
                // 胸〜腹（シャツ） - 角を落とした円柱
                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 1.1, 16), matShirt);
                torso.position.y = 0.3;
                
                // 腰〜尻（ズボン）
                const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.44, 16, 16), matPants);
                pelvis.scale.set(1, 0.7, 0.9); // 少し平べったく
                pelvis.position.y = -0.3;
                
                bodyGroup.add(torso, pelvis);
                group.add(bodyGroup);

                // 2. 頭部 (完全な球体ベースに変更)
                const headGroup = new THREE.Group();
                headGroup.position.y = 2.15; 
                
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), matSkin);
                head.position.y = 0.4;
                
                // サイバーパンクな光るバイザー（目）
                const matVisor = new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8});
                const visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.1), matVisor);
                visor.position.set(0, 0.45, -0.42); // 顔の前面に配置
                
                headGroup.add(head, visor);
                group.add(headGroup);

                // 3. 腕 (肩を支点に。球と円柱の組み合わせ)
                const armLGroup = new THREE.Group();
                armLGroup.position.set(-0.65, 1.9, 0); 
                const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), matShirt);
                const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 12), matSkin);
                armL.position.y = -0.4; 
                const handL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), matSkin);
                handL.position.y = -0.8;
                armLGroup.add(shoulderL, armL, handL);
                group.add(armLGroup);

                const armRGroup = new THREE.Group();
                armRGroup.position.set(0.65, 1.9, 0); 
                const shoulderR = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), matShirt);
                const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 12), matSkin);
                armR.position.y = -0.4; 
                const handR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), matSkin);
                handR.position.y = -0.8;
                armRGroup.add(shoulderR, armR, handR);
                group.add(armRGroup);

                // 4. 足 (股関節を支点に)
                const legLGroup = new THREE.Group();
                legLGroup.position.set(-0.25, 0.9, 0); 
                const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.8, 12), matPants);
                legL.position.y = -0.4; 
                const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.35), matShoes); 
                shoeL.position.set(0, -0.85, -0.1);
                legLGroup.add(legL, shoeL);
                group.add(legLGroup);

                const legRGroup = new THREE.Group();
                legRGroup.position.set(0.25, 0.9, 0);
                const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.8, 12), matPants);
                legR.position.y = -0.4;
                const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.35), matShoes);
                shoeR.position.set(0, -0.85, -0.1);
                legRGroup.add(legR, shoeR);
                group.add(legRGroup);

                group.userData = { head: headGroup, armL: armLGroup, armR: armRGroup, legL: legLGroup, legR: legRGroup, walkTime: 0, movingTimer: 0 };
                return group;
            };

            localAvatar = createAvatarMesh(0x00ffff);
            scene.add(localAvatar);

            clock = new THREE.Clock();
            setupInputHandlers();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function loadMapData() {
            try {
                const res = await fetch('test_map.json');
                if (!res.ok) throw new Error();
                const data = await res.json();
                mapData = data;
                
                if (data.floors) {
                    data.floors.forEach(f => {
                        let mesh;
                        if (f.type === 'circle') mesh = new THREE.Mesh(new THREE.CircleGeometry(f.radius, 32), new THREE.MeshStandardMaterial({color: f.color}));
                        else if (f.type === 'rect') mesh = new THREE.Mesh(new THREE.BoxGeometry(f.width, 1, f.depth), new THREE.MeshStandardMaterial({color: f.color}));
                        if (mesh) {
                            if(f.type==='circle') { mesh.rotation.x = -Math.PI/2; mesh.position.set(f.x, f.y, f.z); }
                            else mesh.position.set(f.x, f.y - 0.5, f.z);
                            mapGroup.add(mesh);
                        }
                    });
                }
                
                if (data.walls) {
                    data.walls.forEach(w => {
                        const height = w.maxY - w.minY;
                        const yPos = w.minY + height / 2;
                        let mesh;
                        if (w.type === 'rect') mesh = new THREE.Mesh(new THREE.BoxGeometry(w.width, height, w.depth), new THREE.MeshStandardMaterial({color: w.color, transparent:true, opacity:0.8}));
                        else if (w.type === 'circle') mesh = new THREE.Mesh(new THREE.CylinderGeometry(w.radius, w.radius, height, 16), new THREE.MeshStandardMaterial({color: w.color}));
                        if (mesh) { mesh.position.set(w.x, yPos, w.z); mapGroup.add(mesh); }
                    });
                }
            } catch (error) {
                // ロード失敗時の緊急フロア生成
                const fallbackGround = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({color: 0x112233}));
                fallbackGround.rotation.x = -Math.PI/2;
                mapGroup.add(fallbackGround);
                mapData.floors.push({ type: 'rect', x: 0, y: 0, z: 0, width: 500, depth: 500 });
            }
        }

        async function startGame() {
            document.getElementById('login-screen').style.display = 'none';
            document.body.requestPointerLock();
            
            initThreeJS();
            await loadMapData(); 

            socket = io();
            setupSocket();
            socket.emit('joinGame');
            animate();
        }

        function setupInputHandlers() {
            window.addEventListener('keydown', e => {
                if (document.activeElement.tagName === 'INPUT') return;
                keysPressed[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
            
            document.addEventListener('click', () => {
                if (!isLocked && document.getElementById('login-screen').style.display === 'none') {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === document.body;
                document.getElementById('ui-layer').style.display = isLocked ? 'block' : 'none';
            });
            
            document.addEventListener('mousemove', e => {
                if (isLocked) {
                    cameraYaw -= e.movementX * 0.002;
                    cameraPitch -= e.movementY * 0.002;
                    // 見上げすぎ・見下ろしすぎを制限
                    cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                }
            });
        }

        function setupSocket() {
            socket.on('initData', data => { 
                Object.keys(data.players).forEach(id => {
                    if (id !== socket.id) {
                        const mesh = createAvatarMesh(data.players[id].color || 0xffffff);
                        mesh.position.set(data.players[id].x, data.players[id].y, data.players[id].z);
                        mesh.rotation.y = data.players[id].rotation;
                        scene.add(mesh);
                        otherPlayers[id] = mesh;
                    }
                });
            });

            socket.on('newPlayer', info => {
                const mesh = createAvatarMesh(info.color || 0xffffff);
                mesh.position.set(info.x, info.y, info.z);
                mesh.rotation.y = info.rotation;
                scene.add(mesh);
                otherPlayers[info.id] = mesh;
            });

            socket.on('playerMoved', info => {
                const op = otherPlayers[info.id];
                if (op) {
                    const dist = op.position.distanceTo(new THREE.Vector3(info.x, info.y, info.z));
                    if (dist > 0.05) op.userData.movingTimer = 0.1;
                    
                    op.position.set(info.x, info.y, info.z);
                    op.rotation.y = info.rotation;
                    if (info.pitch !== undefined) op.userData.targetPitch = info.pitch;
                }
            });

            socket.on('playerDisconnected', id => {
                if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
            });
        }

        function banUser() {
            if (!isAdmin) return;
            const target = document.getElementById('ban-target').value;
            if (target) {
                socket.emit('adminBan', target);
                document.getElementById('ban-target').value = "";
            }
        }

        function updateAvatarAnim(avatar, isMoving, delta, camPitch) {
            if (!avatar || !avatar.userData.head) return;
            const ud = avatar.userData;
            
            if (isMoving) {
                ud.walkTime += delta * 15; 
                const swing = Math.sin(ud.walkTime);
                ud.armL.rotation.x = swing * 0.8;
                ud.armR.rotation.x = -swing * 0.8;
                ud.legL.rotation.x = -swing * 0.8;
                ud.legR.rotation.x = swing * 0.8;
            } else {
                ud.walkTime = 0; 
                ud.armL.rotation.x = THREE.MathUtils.lerp(ud.armL.rotation.x, 0, 0.1);
                ud.armR.rotation.x = THREE.MathUtils.lerp(ud.armR.rotation.x, 0, 0.1);
                ud.legL.rotation.x = THREE.MathUtils.lerp(ud.legL.rotation.x, 0, 0.1);
                ud.legR.rotation.x = THREE.MathUtils.lerp(ud.legR.rotation.x, 0, 0.1);
            }
            ud.head.rotation.x = camPitch;
        }

        let vKeyWasPressed = false, zKeyWasPressed = false;

        function animate() {
            requestAnimationFrame(animate);
            if (!isLocked) { renderer.render(scene, camera); return; }
            const delta = Math.min(clock.getDelta(), 0.1);

            // FPS/TPS切替
            if (keysPressed['v']) {
                if(!vKeyWasPressed) { isFPS = !isFPS; vKeyWasPressed = true; }
            } else { vKeyWasPressed = false; }

            // 飛行モード切替 (Admin)
            if (isAdmin && keysPressed['z']) {
                if(!zKeyWasPressed) { isFlying = !isFlying; playerVelocityY = 0; }
                zKeyWasPressed = true;
            } else { zKeyWasPressed = false; }

            let moved = false;
            const moveSpeed = (keysPressed['shift'] ? 40 : 15) * delta;
            const fwd = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
            const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
            
            let mv = new THREE.Vector3();
            if (keysPressed['w']) mv.add(fwd);
            if (keysPressed['s']) mv.sub(fwd);
            if (keysPressed['a']) mv.sub(right); 
            if (keysPressed['d']) mv.add(right);
            
            if (mv.lengthSq() > 0) {
                mv.normalize().multiplyScalar(moveSpeed);
                moved = true;
            }

            let nextX = playerLocalPos.x + mv.x;
            let nextZ = playerLocalPos.z + mv.z;

            // コリジョン判定 (壁)
            let collidedX = false, collidedZ = false;
            for (let w of mapData.walls) {
                if (playerLocalPos.y >= w.minY && playerLocalPos.y <= w.maxY) {
                    if (w.type === 'rect') {
                        const hw = w.width / 2, hd = w.depth / 2;
                        if (Math.abs(nextX - w.x) < hw + 1.0 && Math.abs(playerLocalPos.z - w.z) < hd + 1.0) collidedX = true;
                        if (Math.abs(playerLocalPos.x - w.x) < hw + 1.0 && Math.abs(nextZ - w.z) < hd + 1.0) collidedZ = true;
                    }
                }
            }
            if (!collidedX) playerLocalPos.x = nextX;
            if (!collidedZ) playerLocalPos.z = nextZ;

            // 飛行・落下処理
            if (isFlying && isAdmin) {
                if (keysPressed['e']) { playerLocalPos.y += 20 * delta; moved = true; }
                if (keysPressed['q']) { playerLocalPos.y -= 20 * delta; moved = true; }
            } else {
                let groundY = -5000;
                for (let f of mapData.floors) {
                    if (playerLocalPos.y >= f.y - 5 && playerLocalPos.y <= f.y + 10) { 
                        let onFloor = false;
                        if (f.type === 'circle') {
                            if (Math.hypot(playerLocalPos.x - f.x, playerLocalPos.z - f.z) <= f.radius) onFloor = true;
                        } else if (f.type === 'rect') {
                            const hw = f.width / 2, hd = f.depth / 2;
                            if (Math.abs(playerLocalPos.x - f.x) <= hw && Math.abs(playerLocalPos.z - f.z) <= hd) onFloor = true;
                        }
                        if (onFloor && f.y > groundY) groundY = f.y;
                    }
                }

                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 30 * delta; 
                    playerLocalPos.y += playerVelocityY * delta;
                    moved = true;
                    if (playerLocalPos.y <= groundY) { playerLocalPos.y = groundY; playerVelocityY = 0; }
                } else {
                    playerLocalPos.y = groundY; playerVelocityY = 0;
                }

                if (playerLocalPos.y < -100) {
                    playerLocalPos.set(0, 5, 50); playerVelocityY = 0; moved = true;
                }
            }

            // アバター同期
            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.rotation.y = cameraYaw;
                updateAvatarAnim(localAvatar, moved, delta, cameraPitch);
                localAvatar.visible = !isFPS; 
            }

            Object.values(otherPlayers).forEach(op => {
                let isOpMoving = false;
                if (op.userData.movingTimer > 0) {
                    isOpMoving = true;
                    op.userData.movingTimer -= delta;
                }
                updateAvatarAnim(op, isOpMoving, delta, op.userData.targetPitch || 0);
            });

            if (moved && socket) {
                socket.emit('playerMovement', { 
                    x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, 
                    rotation: cameraYaw, pitch: cameraPitch 
                });
            }

            // ==========================================
            // ★ TPSカメラの大改修（完璧な中心フォーカス）
            // ==========================================
            
            // 注視点 (Target) をキャラクターの顔の「少し上」に設定
            const headTarget = playerLocalPos.clone();
            headTarget.y += 2.0; 

            if (isFPS) {
                camera.position.copy(playerLocalPos);
                camera.position.y += 2.2; 
                const lookDir = new THREE.Vector3(
                    -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                    Math.sin(cameraPitch),
                    -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                );
                camera.lookAt(camera.position.clone().add(lookDir));
            } else {
                // TPS時のカメラ距離を微調整
                const distance = 4.5; 
                
                // 【重要】右寄りのズレを解消。常に背面の真後ろ（Yaw角）を基準に球面上を移動する
                // 球面座標系でのオフセット計算 (pitch角を考慮してY軸とXZ平面の距離を配分)
                const horizontalDist = Math.cos(cameraPitch) * distance;
                const verticalDist = Math.sin(cameraPitch) * distance;

                const offset = new THREE.Vector3(
                    Math.sin(cameraYaw) * horizontalDist,
                    -verticalDist, // ピッチが上の時(見上げる時)、カメラは下に潜り込む
                    Math.cos(cameraYaw) * horizontalDist
                );
                
                // カメラ位置を決定
                camera.position.copy(headTarget).add(offset);
                
                // 【重要】見上げた際（pitch > 0）のカメラめり込み防止処理を強化
                // カメラが頭にめり込まないよう、pitchの角度に比例してY軸（高さ）の下限を上げる
                if (cameraPitch > 0) {
                    // 見上げるほど、カメラを背中側に引きつつ、わずかに上に持ち上げる
                    const pushBack = cameraPitch * 2.0; 
                    const fwdVec = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
                    camera.position.addScaledVector(fwdVec, -pushBack);
                    
                    // キャラクターの頭（Y=2.4付近）に食い込まないよう最低高度を保証
                    if (camera.position.y < playerLocalPos.y + 0.5) {
                        camera.position.y = playerLocalPos.y + 0.5;
                    }
                }

                // 地面にめり込まないガード
                if (camera.position.y < playerLocalPos.y + 0.2) {
                    camera.position.y = playerLocalPos.y + 0.2;
                }

                // カメラは常に顔の中心（headTarget）を確実に見つめる
                camera.lookAt(headTarget);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
