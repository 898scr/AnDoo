<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Cyber Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; user-select: none; }
        
        /* ログイン画面 */
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 40px rgba(0, 255, 255, 0.3); width: 340px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 3px; font-weight: 900;}
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.6); color: #fff; outline: none; transition: 0.2s;}
        .panel input:focus { border-color: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.5); }
        .panel label { font-size: 0.8rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer;}
        .panel button { width: 100%; padding: 12px; margin: 15px 0 5px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1.1rem; letter-spacing: 1px;}
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; box-shadow: 0 0 15px rgba(0,255,255,0.5); }
        .btn-primary:hover { filter: brightness(1.2); }
        .btn-success { background: transparent; border: 1px solid #f472b6; color: #f472b6; }
        .btn-success:hover { background: rgba(244, 114, 182, 0.2); }
        .error-msg { color: #f43f5e; font-size: 0.9rem; text-align: center; min-height: 20px; font-weight: bold;}

        /* メインUI */
        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; background: rgba(0,0,0,0.5);}
        
        #sidebar { position: absolute; top: 20px; left: 20px; width: 260px; background: rgba(10, 15, 30, 0.85); border-left: 4px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto; backdrop-filter: blur(5px);}
        .money { font-size: 1.8rem; color: #00ffff; font-weight: 900; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        
        /* アドミンパネル */
        #admin-panel { display: none; position: absolute; top: 20px; right: 20px; width: 260px; background: rgba(30, 10, 40, 0.9); border-right: 4px solid #ff00ff; padding: 15px; border-radius: 8px 0 0 8px; pointer-events: auto; backdrop-filter: blur(5px);}
        #admin-panel h3 { color: #ff00ff; margin: 0 0 15px 0; font-size: 1.2rem; text-shadow: 0 0 10px rgba(255,0,255,0.5);}
        .admin-input-group { margin-bottom: 10px; }
        .admin-input-group label { display: block; font-size: 0.8rem; color: #d8b4e2; margin-bottom: 3px; }
        #admin-panel input[type="number"], #admin-panel input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #ff00ff; border-radius: 4px; outline: none; }
        #admin-panel button { width: 100%; padding: 8px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; transition: 0.2s;}
        .btn-admin { background: #ff00ff; color: #000; }
        .btn-admin:hover { filter: brightness(1.2); box-shadow: 0 0 10px rgba(255,0,255,0.8); }

        /* パフォーマンス表示 */
        #perf-panel { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); border: 1px solid #334155; padding: 10px; border-radius: 8px; font-family: monospace; color: #38bdf8; pointer-events: auto; display: flex; align-items: center; gap: 15px;}
        .perf-val { color: #00ffff; font-weight: bold; font-size: 1.1rem;}

        /* 設定モーダル */
        #settings-btn { background: transparent; border: none; cursor: pointer; font-size: 1.5rem; transition: transform 0.3s; }
        #settings-btn:hover { transform: rotate(90deg); }
        #settings-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,23,42,0.95); border: 2px solid #38bdf8; padding: 25px; border-radius: 12px; z-index: 50; width: 300px; pointer-events: auto; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #settings-modal h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        /* ミニマップ */
        #minimap-container { position: absolute; bottom: 80px; right: 20px; width: 180px; height: 180px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(5,10,25,0.8); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.3); pointer-events: none;}
        #minimap { width: 100%; height: 100%; }

        /* インタラクション */
        #interaction-prompt { position: absolute; bottom: 25vh; left: 50%; transform: translateX(-50%); background: rgba(0, 10, 20, 0.9); border: 2px solid #00ffff; padding: 12px 25px; border-radius: 30px; color: #00ffff; font-weight: bold; font-size: 1.3rem; display: none; box-shadow: 0 0 20px rgba(0,255,255,0.6); pointer-events: none;}
        .key-btn { background: #fff; color: #000; padding: 2px 10px; border-radius: 6px; margin-right: 12px; font-family: monospace; }

        /* チャット */
        #chat-container { position: absolute; bottom: 20px; left: 20px; width: 340px; background: rgba(10, 15, 30, 0.85); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; border: 1px solid #1e293b; backdrop-filter: blur(5px);}
        #chat-messages { height: 180px; overflow-y: auto; padding: 12px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 6px; }
        #chat-messages div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; word-wrap: break-word;}
        .chat-input-row { display: flex; border-top: 1px solid #334155; }
        #chat-input { flex-grow: 1; padding: 10px; border: none; background: transparent; color: white; outline: none; font-size: 0.95rem;}
        #chat-input:focus { background: rgba(0,255,255,0.1); }
        .btn-action-small { width: 45px; background: #0ea5e9; color: #fff; border: none; cursor: pointer; font-weight: bold; font-size: 1.2rem; transition: 0.2s;}
        .btn-action-small:hover { background: #00ffff; color: #000; }

        /* アバターエディタ (UI層の上) */
        #avatar-editor { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,23,42,0.95); border: 2px solid #00ff00; padding: 25px; border-radius: 12px; z-index: 50; width: 320px; pointer-events: auto; box-shadow: 0 0 40px rgba(0,255,0,0.4); }
        #avatar-editor h3 { margin-top: 0; color: #00ff00; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        .edit-group { margin-bottom: 15px; }
        .edit-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        .edit-group input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; background: transparent; }
        .edit-group input[type="range"] { width: 100%; cursor: pointer; }
        .val-disp { float: right; color: #00ff00; font-family: monospace; }
        
        #fade-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; z-index: 90; display: none; opacity: 0; transition: opacity 0.5s; pointer-events: none;}
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <!-- ログイン画面 -->
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <div id="auth-error" class="error-msg"></div>
            <input type="text" id="username" placeholder="Username" required>
            
            <!-- 通常はパスワードを要求。特定ユーザーのみアドミンパスとして機能する -->
            <input type="password" id="password" placeholder="Password" required>
            
            <label id="admin-check-container" style="display:none;">
                <input type="checkbox" id="login-as-admin"> アドミンモードでログイン
            </label>

            <button class="btn-primary" onclick="attemptAuth('login')">ENTER SYSTEM</button>
            <button class="btn-success" onclick="attemptAuth('register')">REGISTER</button>
        </div>
    </div>

    <!-- UIレイヤー -->
    <div id="ui-layer">
        <div id="crosshair"></div>
        
        <!-- 左上: ステータス -->
        <div id="sidebar">
            <div style="font-size: 0.85rem; color:#94a3b8; margin-bottom: 5px;">ID: <span id="ui-username" style="color:#fff; font-weight:bold;">---</span> <span id="ui-admin-badge" style="color:#ff00ff; display:none; font-weight:bold;">[ADMIN]</span></div>
            <div class="money">CR: <span id="ui-money">0</span></div>
            <div style="font-size: 0.85rem; color:#94a3b8; margin-top:8px; display:flex; justify-content:space-between;">
                <span>株保有: <strong id="ui-stocks" style="color:#fff;">0</strong></span>
                <span>Speed: <strong id="ui-speed" style="color:#fff;">x1.0</strong></span>
            </div>
        </div>
        
        <!-- 右上: アドミン専用パネル -->
        <div id="admin-panel">
            <h3>Admin Override</h3>
            <div class="admin-input-group">
                <label>Speed Multiplier:</label>
                <input type="number" id="admin-speed" value="3.0" step="0.5">
                <button class="btn-admin" onclick="applyAdminSpeed()">Apply Speed</button>
            </div>
            <div class="admin-input-group">
                <label>Set CR:</label>
                <input type="number" id="admin-cr" value="100000">
                <button class="btn-admin" onclick="applyAdminCR()">Set CR</button>
            </div>
            <div class="admin-input-group">
                <label style="margin-top: 10px; cursor: pointer; color:#fff; font-weight:bold; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="admin-fly" style="width:16px; height:16px;"> FLY MODE (No Clip)
                </label>
            </div>
            <div class="admin-input-group" style="margin-top: 15px; border-top: 1px solid #ff00ff; padding-top:10px;">
                <input type="text" id="admin-target" placeholder="Target Username">
                <button class="btn-admin" style="background:#00ffff;" onclick="adminGrant()">GRANT ADMIN</button>
                <button class="btn-admin" style="background:#ff3333; color:#fff;" onclick="adminBan()">BAN USER</button>
                <button class="btn-admin" style="background:#aaaaaa; color:#000;" onclick="adminUnban()">UNBAN</button>
            </div>
        </div>

        <!-- 左下: チャット -->
        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Message... (Enter to send)">
                <button class="btn-action-small" title="送金する" onclick="promptSendMoney()">💸</button>
            </div>
        </div>

        <!-- 右下: ミニマップとパフォーマンス -->
        <div id="minimap-container">
            <canvas id="minimap" width="180" height="180"></canvas>
        </div>
        
        <div id="perf-panel">
            <div>FPS: <span id="ui-fps" class="perf-val">--</span></div>
            <div>PING: <span id="ui-ping" class="perf-val">--</span><span style="font-size:0.7rem;">ms</span></div>
            <button id="settings-btn" title="設定">⚙️</button>
        </div>

        <!-- 中央下: インタラクション -->
        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal">
        <h3>Graphic Settings</h3>
        <div class="setting-row">
            <label style="color:#94a3b8;">Resolution</label>
            <select id="set-res" onchange="applySettings()" style="background:#000; color:#fff; padding:5px; border:1px solid #38bdf8; outline:none;">
                <option value="1.0">High (Native)</option>
                <option value="0.75" selected>Medium</option>
                <option value="0.5">Low (Fast)</option>
            </select>
        </div>
        <div class="setting-row">
            <label style="color:#94a3b8;">Shadows</label>
            <input type="checkbox" id="set-shadow" checked onchange="applySettings()">
        </div>
        <button style="width:100%; padding:10px; background:#38bdf8; color:#000; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-top:10px;" onclick="closeSettings()">CLOSE</button>
    </div>

    <!-- アバターエディタ -->
    <div id="avatar-editor">
        <h3>Avatar Customization</h3>
        <div class="edit-group">
            <label>Body Color</label>
            <input type="color" id="edit-color-body" value="#00ffff" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Head Color</label>
            <input type="color" id="edit-color-head" value="#ffcc99" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Visor Color</label>
            <input type="color" id="edit-color-visor" value="#000000" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Width <span class="val-disp" id="val-sx">1.0</span></label>
            <input type="range" id="edit-sx" min="0.5" max="2.0" step="0.1" value="1.0" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Height <span class="val-disp" id="val-sy">1.0</span></label>
            <input type="range" id="edit-sy" min="0.5" max="1.5" step="0.1" value="1.0" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Depth <span class="val-disp" id="val-sz">1.0</span></label>
            <input type="range" id="edit-sz" min="0.5" max="2.0" step="0.1" value="1.0" oninput="previewAvatar()">
        </div>
        <button style="width:100%; padding:12px; background:#00ff00; color:#000; border:none; border-radius:6px; font-weight:bold; font-size:1.1rem; cursor:pointer;" onclick="saveAvatar()">APPLY & CLOSE</button>
    </div>
    
    <div id="fade-overlay"></div>
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // グローバル変数
        // ==========================================
        let socket = null;
        
        // プレイヤー自身のデータ (サーバーから取得したものを正とする)
        let myData = {
            username: 'Guest',
            cr: 0,
            stocks: 0,
            color: 0x00ffff,
            headColor: 0xffcc99,
            visorColor: 0x000000,
            bodyScale: {x:1, y:1, z:1},
            accessory: 'none',
            speedMult: 1.0,
            isAdmin: false,
            activeAdmin: false
        };

        let scene, camera, renderer, clock;
        const MAP_RADIUS = 2500; // 島サイズを調整（大きめだが広すぎない）
        
        // 入力・カメラ制御
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isFPS = false, vKeyWasPressed = false;
        let isGameFocus = false; // ミニゲーム中の移動ロック
        let gameCameraTarget = null;
        let gameLookAt = null;

        // 物理・移動
        let playerLocalPos = new THREE.Vector3(0, 1.5, 300); 
        let playerVelocityY = 0; 
        
        // オブジェクト管理
        const trains = [], personalDrones = [], warpPads = [], stationAreas = []; 
        const otherPlayers = {}; 
        let ridingTrain = null, ridingDrone = null, localAvatar = null;
        let isWarping = false, fKeyWasPressed = false;
        
        // ミニマップ・パフォーマンス
        let minimapCtx;
        let frameCount = 0, lastFpsTime = 0, pingStart = 0;
        let settings = { resolution: 0.75, shadows: true };

        // 経済・ゲーム
        const interactables = []; 
        const slotMachines = [];
        let hockeyPuck = null, hockeyPuckVel = new THREE.Vector3();
        let craneGameData = { state: 'idle', clawPos: 0, armMesh: null };
        
        let stockHistory = Array(50).fill(100);
        const stockCanvas = document.createElement('canvas');
        stockCanvas.width = 512; stockCanvas.height = 256;
        const stockCtx = stockCanvas.getContext('2d');
        const stockTex = new THREE.CanvasTexture(stockCanvas);

        // ==========================================
        // 認証とUI初期化
        // ==========================================

        document.getElementById('username').addEventListener('input', (e) => {
            const val = e.target.value.trim();
            const chkBox = document.getElementById('admin-check-container');
            if (val === '898scr' || val === '898sct') {
                chkBox.style.display = 'block';
            } else {
                chkBox.style.display = 'none';
                document.getElementById('login-as-admin').checked = false;
            }
        });

        async function attemptAuth(action) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const asAdmin = document.getElementById('login-as-admin').checked;

            if (!username) {
                showAuthError("Usernameを入力してください");
                return;
            }

            const endpoint = action === 'login' ? '/api/login' : '/api/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, asAdmin })
                });
                const data = await res.json();

                if (data.success) {
                    if (action === 'register') {
                        showAuthError("登録完了！ LOGINしてください", "#00ff00");
                    } else {
                        // ログイン成功: データをセット
                        myData.username = data.username;
                        myData.cr = data.cr;
                        myData.stocks = data.stocks;
                        myData.color = data.color;
                        myData.headColor = data.headColor;
                        myData.visorColor = data.visorColor;
                        myData.bodyScale = data.bodyScale;
                        myData.accessory = data.accessory;
                        myData.speedMult = data.speedMult;
                        myData.isAdmin = data.isAdmin;
                        myData.activeAdmin = data.activeAdmin;

                        updateUI();
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('ui-layer').style.display = 'block';

                        if (myData.activeAdmin) {
                            document.getElementById('admin-panel').style.display = 'block';
                            document.getElementById('ui-admin-badge').style.display = 'inline';
                            addChatMessage("SYSTEM", "Administrator Override Active.");
                        }

                        // Socket接続
                        socket = io({ 
                            auth: { 
                                username: myData.username, 
                                activeAdmin: myData.activeAdmin 
                            } 
                        });
                        setupSocketEvents();

                        // 3D初期化
                        initThreeJS();
                        document.body.requestPointerLock();
                    }
                } else {
                    showAuthError(data.message);
                }
            } catch (err) {
                console.error(err);
                showAuthError("サーバーに接続できません");
            }
        }

        function showAuthError(msg, color = "#f43f5e") {
            const el = document.getElementById('auth-error');
            el.innerText = msg;
            el.style.color = color;
        }

        function updateUI() {
            document.getElementById('ui-username').innerText = myData.username;
            document.getElementById('ui-money').innerText = myData.cr;
            document.getElementById('ui-stocks').innerText = myData.stocks;
            document.getElementById('ui-speed').innerText = `x${myData.speedMult.toFixed(1)}`;
        }

        function addChatMessage(sender, text, isAdmin = false) {
            const msg = document.createElement('div');
            let color = '#00ffff'; // default
            if (sender === 'SYSTEM' || sender === 'CASINO') color = '#ff00ff';
            else if (isAdmin) color = '#ffaa00';
            
            msg.innerHTML = `<strong style="color:${color}">${sender}</strong>: ${text}`;
            document.getElementById('chat-messages').appendChild(msg);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        // ==========================================
        // Socket.IO イベント
        // ==========================================

        let lastSentPos = new THREE.Vector3();
        let lastSentRot = 0;

        function setupSocketEvents() {
            // Ping計測
            setInterval(() => { pingStart = performance.now(); socket.emit('ping'); }, 2000);
            socket.on('pong', () => { 
                document.getElementById('ui-ping').innerText = Math.round(performance.now() - pingStart); 
            });

            // 初期データ
            socket.on('initData', (data) => {
                stockHistory = data.stockHistory;
                currentStockPrice = data.stockPrice;
                updateStockChart();

                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (info.username !== myData.username && !otherPlayers[info.id]) {
                        addOtherPlayer(info);
                    }
                });
            });

            // 市場更新
            socket.on('marketUpdate', (data) => {
                stockHistory = data.history;
                currentStockPrice = data.price;
                updateStockChart();
            });

            // プレイヤー入退室と移動
            socket.on('newPlayer', (info) => { 
                if (info.username !== myData.username && !otherPlayers[info.id]) addOtherPlayer(info); 
            });
            
            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    const mesh = otherPlayers[info.id];
                    mesh.position.set(info.x, info.y, info.z);
                    mesh.rotation.y = info.rotation;
                    mesh.userData.ridingTrainIndex = info.ridingTrainIndex;
                    mesh.userData.ridingDroneIndex = info.ridingDroneIndex;
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) { 
                    scene.remove(otherPlayers[id]); 
                    delete otherPlayers[id]; 
                }
            });

            // チャットとシステムメッセージ
            socket.on('chatMessage', (data) => addChatMessage(data.username, data.text, data.isAdmin));
            socket.on('sysMessage', (data) => addChatMessage("SYSTEM", data.text));

            // アバター更新の同期
            socket.on('avatarChanged', (data) => {
                if (data.id === socket.id) {
                    // 自分自身の更新 (サーバーからの確定データ)
                    myData.color = data.avatar.color;
                    myData.headColor = data.avatar.headColor;
                    myData.visorColor = data.avatar.visorColor;
                    myData.bodyScale = data.avatar.bodyScale;
                    myData.accessory = data.avatar.accessory;
                    updateAvatarMesh(localAvatar, myData);
                } else if (otherPlayers[data.id]) {
                    // 他人の更新
                    updateAvatarMesh(otherPlayers[data.id], data.avatar);
                }
            });

            // 経済・アイテム処理の結果
            socket.on('purchaseSuccess', (data) => {
                myData.cr = data.cr;
                if(data.type === 'speed') myData.speedMult = data.speedMult;
                updateUI();
                addChatMessage("SYSTEM", `${data.itemName} を購入・適用しました！`);
            });

            socket.on('tradeSuccess', (data) => {
                myData.cr = data.cr;
                myData.stocks = data.stocks;
                updateUI();
                addChatMessage("SYSTEM", data.msg);
            });

            socket.on('crUpdated', (newCr) => {
                myData.cr = newCr;
                updateUI();
            });

            // Adminの強制アクション
            socket.on('banned', () => {

        // アバターメッシュの生成（独立したマテリアルを使用）
        function createAvatarMesh(config) {
            const group = new THREE.Group();
            const s = 2.5; 
            
            // 安全なデフォルト値
            const bCol = config.color !== undefined ? config.color : 0x00ffff;
            const hCol = config.headColor !== undefined ? config.headColor : 0xffcc99;
            const vCol = config.visorColor !== undefined ? config.visorColor : 0x000000;
            const sx = config.bodyScale ? config.bodyScale.x : 1;
            const sy = config.bodyScale ? config.bodyScale.y : 1;
            const sz = config.bodyScale ? config.bodyScale.z : 1;

            const bodyMat = new THREE.MeshStandardMaterial({color: bCol, roughness: 0.2, metalness: 0.8});
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8*s, 1.2*s, 0.5*s), bodyMat);
            body.position.y = 0.6*s * sy;
            body.scale.set(sx, sy, sz);
            body.name = "body";
            
            const headMat = new THREE.MeshStandardMaterial({color: hCol});
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6*s, 0.6*s, 0.6*s), headMat);
            head.position.y = 1.5*s * sy;
            head.scale.set(sx, sx, sx); // 頭は等方スケール
            head.name = "head";
            
            const visorMat = new THREE.MeshBasicMaterial({color: vCol});
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.65*s, 0.2*s, 0.65*s), visorMat);
            visor.position.y = 1.5*s * sy;
            visor.scale.set(sx, sx, sx);
            visor.name = "visor";
            
            group.add(body, head, visor);

            // アクセサリ (頭のスケールと位置に追従させるため、頭用のコンテナを作成)
            const headContainer = new THREE.Group();
            headContainer.position.y = 1.5*s * sy;
            headContainer.scale.set(sx, sx, sx);
            group.add(headContainer);

            // 猫耳
            const earGeo = new THREE.ConeGeometry(0.2*s, 0.4*s, 4);
            const earL = new THREE.Mesh(earGeo, bodyMat); earL.position.set(-0.2*s, 0.4*s, 0);
            const earR = new THREE.Mesh(earGeo, bodyMat); earR.position.set(0.2*s, 0.4*s, 0);
            const catEars = new THREE.Group(); catEars.add(earL, earR);
            catEars.userData = { isAccessory: true, accType: 'cat_ears' };
            catEars.visible = (config.accessory === 'cat_ears');
            headContainer.add(catEars);

            // シルクハット
            const hatGrp = new THREE.Group();
            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.4*s, 0.4*s, 0.1*s, 16), new THREE.MeshStandardMaterial({color:0x222222})).translateY(0.3*s));
            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25*s, 0.25*s, 0.5*s, 16), new THREE.MeshStandardMaterial({color:0x111111})).translateY(0.6*s));
            hatGrp.userData = { isAccessory: true, accType: 'hat' };
            hatGrp.visible = (config.accessory === 'hat');
            headContainer.add(hatGrp);

            // ヘッドホン
            const hpGrp = new THREE.Group();
            const band = new THREE.Mesh(new THREE.TorusGeometry(0.45*s, 0.08*s, 8, 16, Math.PI), new THREE.MeshStandardMaterial({color:0x111111}));
            band.position.set(0, 0.3*s, 0);
            const earPadL = new THREE.Mesh(new THREE.CylinderGeometry(0.2*s, 0.2*s, 0.15*s), new THREE.MeshStandardMaterial({color:0x333333}));
            earPadL.rotation.z = Math.PI/2; earPadL.position.set(-0.45*s, 0, 0);
            const earPadR = earPadL.clone(); earPadR.position.x = 0.45*s;
            hpGrp.add(band, earPadL, earPadR);
            hpGrp.userData = { isAccessory: true, accType: 'headphone' };
            hpGrp.visible = (config.accessory === 'headphone');
            headContainer.add(hpGrp);

            // ユーザー名表示
            if (config.username) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(config.username, 128, 40);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
                sprite.position.y = 2.5 * s * sy; 
                sprite.scale.set(12, 3, 1);
                sprite.name = "nameTag";
                group.add(sprite);
            }
            
            group.userData.headContainer = headContainer;
            return group;
        }

        // アバターの見た目更新関数
        function updateAvatarMesh(mesh, config) {
            if(!mesh) return;
            const s = 2.5;
            const sy = config.bodyScale ? config.bodyScale.y : 1;
            const sx = config.bodyScale ? config.bodyScale.x : 1;

            mesh.children.forEach(child => {
                if (child.name === "body") {
                    child.material.color.setHex(config.color);
                    child.scale.copy(config.bodyScale || {x:1, y:1, z:1});
                    child.position.y = 0.6 * s * sy;
                } else if (child.name === "head") {
                    child.material.color.setHex(config.headColor);
                    child.scale.set(sx, sx, sx);
                    child.position.y = 1.5 * s * sy;
                } else if (child.name === "visor") {
                    child.material.color.setHex(config.visorColor);
                    child.scale.set(sx, sx, sx);
                    child.position.y = 1.5 * s * sy;
                } else if (child.name === "nameTag") {
                    child.position.y = 2.5 * s * sy;
                }
            });

            if(mesh.userData.headContainer) {
                mesh.userData.headContainer.position.y = 1.5 * s * sy;
                mesh.userData.headContainer.scale.set(sx, sx, sx);
                mesh.userData.headContainer.children.forEach(acc => {
                    if (acc.userData.isAccessory) {
                        acc.visible = (acc.userData.accType === config.accessory);
                    }
                });
            }
        }

        function createEnvironment() {
            // ベース地面
            const ground = new THREE.Mesh(new THREE.CircleGeometry(MAP_RADIUS, 128), new THREE.MeshStandardMaterial({ color: 0x050a15, roughness: 0.9 }));
            ground.rotation.x = -Math.PI / 2; 
            ground.receiveShadow = true;
            scene.add(ground);

            const gridHelper = new THREE.GridHelper(MAP_RADIUS * 2, 300, 0x00ffff, 0x020617);
            gridHelper.position.y = 0.1; gridHelper.material.transparent = true; gridHelper.material.opacity = 0.15;
            scene.add(gridHelper);

            // 巨大なドームバリア (島全体を覆う)
            const barrierGeo = new THREE.SphereGeometry(MAP_RADIUS + 200, 64, 32, 0, Math.PI*2, 0, Math.PI/2);
            const barrierMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.05, wireframe: true});
            const barrier = new THREE.Mesh(barrierGeo, barrierMat);
            scene.add(barrier);

            // 空のサイバーエフェクト（降下するキューブ）
            for(let i=0; i<300; i++){
                const c = new THREE.Mesh(new THREE.BoxGeometry(6, 6, 6), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.6, wireframe: true}));
                c.position.set((Math.random()-0.5)*MAP_RADIUS*1.5, 200 + Math.random()*2000, (Math.random()-0.5)*MAP_RADIUS*1.5);
                c.userData.fallSpeed = 15 + Math.random()*30;
                scene.add(c);
                stationAreas.push({ mesh: c, type: 'effect_cube' }); // アニメループで処理
            }

            // 放射状の大通り
            const roadMat = new THREE.MeshStandardMaterial({color: 0x11111a});
            const lineMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.7});
            
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const roadGrp = new THREE.Group();
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(100, MAP_RADIUS), roadMat);
                plane.rotation.x = -Math.PI/2; plane.position.z = MAP_RADIUS/2; plane.position.y = 0.2; 
                plane.receiveShadow = true;
                roadGrp.add(plane);
                
                const line = new THREE.Mesh(new THREE.PlaneGeometry(6, MAP_RADIUS), lineMat);
                line.rotation.x = -Math.PI/2; line.position.z = MAP_RADIUS/2; line.position.y = 0.3; 
                roadGrp.add(line);
                
                roadGrp.rotation.y = angle; scene.add(roadGrp);
            }
        }

        // ==========================================
        // 巨大施設の構築 (外観 兼 内部)
        // ==========================================
        function createMegaFacilities() {
            // --- 1. ランドマークタワー (サイバーコア) ---
            const towerGroup = new THREE.Group();
            const TOWER_Y = 1600; // 高さアップ
            
            const legMat = new THREE.MeshStandardMaterial({color: 0x0f172a, roughness: 0.3, metalness: 0.8});
            const frameMat = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.3});
            
            // 太い足
            const legHeight = 600;
            for(let i=0; i<4; i++) {
                const angle = i * Math.PI/2 + Math.PI/4; 
                const legGrp = new THREE.Group();
                const legGeo = new THREE.CylinderGeometry(40, 150, legHeight, 16); 
                const leg = new THREE.Mesh(legGeo, legMat);
                const legFrame = new THREE.Mesh(legGeo, frameMat); 
                leg.position.y = legHeight/2; legFrame.position.y = legHeight/2;
                leg.rotation.x = -Math.PI/6; legFrame.rotation.x = -Math.PI/6;

            // メインタワー胴体
            const towerGeo = new THREE.CylinderGeometry(80, 200, TOWER_Y - 400, 32);
            const tower = new THREE.Mesh(towerGeo, legMat);
            const towerFrame = new THREE.Mesh(towerGeo, frameMat);
            tower.position.y = 400 + (TOWER_Y - 400) / 2;
            towerFrame.position.y = 400 + (TOWER_Y - 400) / 2;
            towerGroup.add(tower, towerFrame);

            // 中腹の巨大エネルギーリング
            const ringGeo = new THREE.TorusGeometry(450, 20, 16, 64);

            // --- 円盤型展望台 ---

            coreGrp.position.y = TOWER_Y + 80;

            // 外周の4つの小空中庭園ドーム (イメージ図再現)
            for(let i=0; i<4; i++) {

        // 【施設内部ジェネレータ】
        // モール（2階建てスロープ付き。島の上に露出する巨大建築）
        function createMallComplex(x, z, rot) {
            const grp = new THREE.Group();
            grp.position.set(x, 0, z);
            grp.rotation.y = rot; // 正面（大通り）を向く

            const width = 600, depth = 500;
            
            // 外壁・土台
            const base = new THREE.Mesh(new THREE.BoxGeometry(width, 10, depth), new THREE.MeshStandardMaterial({color: 0x112233}));
            base.position.y = 5; grp.add(base);

            // 1F・2Fの床
            const fMat = new THREE.MeshStandardMaterial({color: 0x051a24});
            const f1 = new THREE.Mesh(new THREE.PlaneGeometry(width-20, depth-20), fMat); f1.rotation.x = -Math.PI/2; f1.position.y = 10.5; grp.add(f1);
            
            // 2F床はドーナツ状（中央吹き抜け）
            const f2Geo = new THREE.Shape();
            f2Geo.moveTo(-width/2+10, -depth/2+10); f2Geo.lineTo(width/2-10, -depth/2+10); f2Geo.lineTo(width/2-10, depth/2-10); f2Geo.lineTo(-width/2+10, depth/2-10);
            const hole = new THREE.Path(); hole.absarc(0, 0, 150, 0, Math.PI*2, false); f2Geo.holes.push(hole);
            const f2 = new THREE.Mesh(new THREE.ShapeGeometry(f2Geo), fMat); f2.rotation.x = -Math.PI/2; f2.position.y = 80; grp.add(f2);
            
            // コリジョン登録 (2階)
            stationAreas.push({ type: 'rect', x: x, z: z, angle: rot, width: width-20, depth: depth-20, y: 80, holeRadius: 150 });

            // ガラスの巨大ドーム屋根 (イメージ図再現)
            for(let i=0; i<3; i++) {
                const dx = -150 + i*150;
                const dome = new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3, side:THREE.DoubleSide}));
                dome.position.set(dx, 80, -100); grp.add(dome);
            }

            // 壁と柱
            const wallMat = new THREE.MeshStandardMaterial({color: 0x0a2a4a, side:THREE.DoubleSide});
            const wallB = new THREE.Mesh(new THREE.PlaneGeometry(width, 150), wallMat); wallB.position.set(0, 75, -depth/2); grp.add(wallB);
            const wallL = new THREE.Mesh(new THREE.PlaneGeometry(depth, 150), wallMat); wallL.rotation.y = Math.PI/2; wallL.position.set(-width/2, 75, 0); grp.add(wallL);
            const wallR = new THREE.Mesh(new THREE.PlaneGeometry(depth, 150), wallMat); wallR.rotation.y = -Math.PI/2; wallR.position.set(width/2, 75, 0); grp.add(wallR);

            // 1F-2F スロープ
            const slopeGeo = new THREE.TorusGeometry(150, 30, 16, 64, Math.PI*1.5);
            const slope = new THREE.Mesh(slopeGeo, new THREE.MeshStandardMaterial({color: 0x112233}));
            slope.rotation.x = Math.PI/2; slope.position.y = 45; // 10〜80の中間
            grp.add(slope);
            // グローバル座標でスロープコリジョンを登録
            stationAreas.push({ type: 'slope', x: x, z: z, radius: 150, width: 30, topY: 80, bottomY: 10, angleEnd: Math.PI*1.5 });

            // ショップエリア
            const createDisplay = (dx, dy, dz, label) => {
                const area = new THREE.Group(); area.position.set(dx, dy, dz);
                const counter = new THREE.Mesh(new THREE.BoxGeometry(150, 5, 30), new THREE.MeshStandardMaterial({color: 0x113344, transparent:true, opacity:0.9}));
                counter.position.y = 2.5; area.add(counter);
                for(let i=0; i<3; i++) {
                    const px = -50 + i*50;
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(12, 15, 2, 16), new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x005555}));
                    base.position.set(px, 6, 0); area.add(base);
                }
                return area;
            };

            const colorArea = createDisplay(0, 10, -100, "Colors (1F)"); grp.add(colorArea);
            const accArea = createDisplay(0, 80, -200, "Accessories (2F)"); grp.add(accArea);
            const speedArea = createDisplay(200, 80, 0, "Boosts (2F)"); speedArea.rotation.y = -Math.PI/2; grp.add(speedArea);

            // アバター再編集エリア（緑の魔法陣）
            const editPad = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 1, 32), new THREE.MeshBasicMaterial({color: 0x00ff00, transparent:true, opacity:0.5}));
            editPad.position.set(-200, 10.5, 0); grp.add(editPad);
            
            // グローバル座標へ変換してインタラクト登録
            const gx = x, gz = z; // 回転が関係するため、簡易的に中心付近で計算（本来は正確な行列変換が必要ですが、今回は単純化）
            
            // ゲート
            const gateL = new THREE.Mesh(new THREE.BoxGeometry(20, 80, 20), wallMat); gateL.position.set(-60, 40, depth/2); grp.add(gateL);
            const gateR = new THREE.Mesh(new THREE.BoxGeometry(20, 80, 20), wallMat); gateR.position.set(60, 40, depth/2); grp.add(gateR);
            const gateT = new THREE.Mesh(new THREE.BoxGeometry(140, 20, 20), new THREE.MeshBasicMaterial({color: 0x00ffff})); gateT.position.set(0, 90, depth/2); grp.add(gateT);

            scene.add(grp);

            // コリジョン用（大まかな外壁）
            stationAreas.push({ type: 'wall', x: x, z: z, radius: Math.max(width, depth)/2, height: 150 });

        // ==========================================
        // 交通網 (モノレール・ドローン)
        // ==========================================
        function createMonorails() {
            const rInner = 800, rOuter = 1600, trackY = 120; // 高く・広く
            const railMat = new THREE.MeshBasicMaterial({color: 0xcccccc});
            const neonMatCyan = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent:true, opacity:0.4});
            
            const drawTrack = (radius) => {
                const grp = new THREE.Group();
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius, 3, 8, 128), railMat).rotateX(Math.PI/2));
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius+2, 5, 4, 128), neonMatCyan).rotateX(Math.PI/2));
                grp.position.y = trackY; scene.add(grp);
            };
            drawTrack(rInner); drawTrack(rOuter);

            const addStation = (radius, angle) => {
                const rotY = -angle; 
                const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
                const group = new THREE.Group();
                
                const pWidth = 80, pDepth = 200;
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 4, pDepth), new THREE.MeshStandardMaterial({color: 0x334455})).translateY(-2));
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 4, pDepth), new THREE.MeshStandardMaterial({color: 0x222233})).translateY(25));
                
                const glass = new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3, side:THREE.DoubleSide});
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 20), glass).rotateY(Math.PI/2).translateZ(-pWidth/2).translateY(10));
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 20), glass).rotateY(Math.PI/2).translateZ(pWidth/2).translateY(10));

                group.position.set(x, trackY, z); group.rotation.y = rotY; scene.add(group);

                const dirX = Math.cos(angle), dirZ = Math.sin(angle);
                const offset = (radius === rInner) ? -30 : 30; 
                const groundOffset = 60; 
                
                createWarpPad(x + dirX*offset, trackY, z + dirZ*offset, 0xff00ff, x + dirX*groundOffset, 1.5, z + dirZ*groundOffset, "地上へ");
                createWarpPad(x + dirX*groundOffset, 1, z + dirZ*groundOffset, 0x00ffff, x + dirX*offset, trackY+1.5, z + dirZ*offset, "駅ホームへ");

                stationAreas.push({ type: 'rect', x, z, angle: rotY, width: pWidth, depth: pDepth, y: trackY });
            };

            for(let i=0; i<4; i++) addStation(rInner, i * Math.PI/2);
            for(let i=0; i<8; i++) addStation(rOuter, i * Math.PI/4);

            const spawnTrain = (radius, initAngle) => {
                const car = new THREE.Group();
                car.add(new THREE.Mesh(new THREE.BoxGeometry(18, 2, 50), new THREE.MeshStandardMaterial({color: 0x111122})));
                car.add(new THREE.Mesh(new THREE.BoxGeometry(18, 2, 50), new THREE.MeshStandardMaterial({color: 0x111122})).translateY(22));
                
                const wGlass = new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3, side:THREE.DoubleSide});
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(50, 20), wGlass).rotateY(Math.PI/2).translateZ(-9).translateY(11));
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(12, 20), wGlass).rotateY(Math.PI/2).translateZ(9).translateY(11).translateX(19));
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(12, 20), wGlass).rotateY(Math.PI/2).translateZ(9).translateY(11).translateX(-19));
                
                scene.add(car);
                
                const numStops = (radius === rOuter) ? 8 : 4;
                trains.push({ mesh: car, radius, initialAngle: initAngle, angle: initAngle, numStops: numStops, state: 'stopped', timer: 0, progress: 0 });
            };
            
            spawnTrain(rInner, 0); spawnTrain(rInner, Math.PI);
            spawnTrain(rOuter, 0); spawnTrain(rOuter, Math.PI);
        }

        // ==========================================
        // 入力・UIハンドラ
        // ==========================================

        function setupInputHandlers() {
            window.addEventListener('keydown', e => {
                const chatInput = document.getElementById('chat-input');
                if (e.key === 'Enter') {
                    if (document.activeElement === chatInput) {
                        if (chatInput.value.trim() !== '') {
                            if (socket) socket.emit('chatMessage', chatInput.value);
                            chatInput.value = '';
                        }
                        chatInput.blur(); 
                    } else chatInput.focus(); 
                    return; 
                }
                if (document.activeElement !== chatInput) keysPressed[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
            
            document.getElementById('canvas-container').addEventListener('mousedown', () => { 
                if (!isGameFocus) { isDragging = true; try { document.body.requestPointerLock(); } catch(e){} }
            });
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            
            document.addEventListener('mousemove', e => {
                if ((isLocked || isDragging) && !isGameFocus) {
                    cameraYaw -= e.movementX * 0.002;
                    cameraPitch -= e.movementY * 0.002;
                    cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                }
            });
            window.addEventListener('resize', applySettings);
        }

        function applySettings() {
            settings.resolution = parseFloat(document.getElementById('set-res').value);
            settings.shadows = document.getElementById('set-shadow').checked;
            
            if(renderer && camera) {
                renderer.setPixelRatio(window.devicePixelRatio * settings.resolution);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = settings.shadows;
                scene.traverse(child => { if(child.isLight && child.shadow) child.castShadow = settings.shadows; });
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
        }

        // ==========================================
        // メインループ (描画と物理)
        // ==========================================

        function animate() {
            requestAnimationFrame(animate);
            frameCount++;
            const nowTime = performance.now();
            if (nowTime - lastFpsTime >= 1000) {
                document.getElementById('ui-fps').innerText = frameCount;
                frameCount = 0; lastFpsTime = nowTime;
            }

            const delta = Math.min(clock.getDelta(), 0.1);
            const nowSec = Date.now() / 1000;

            const vPressed = keysPressed['v'];
            if (vPressed && !vKeyWasPressed && !isGameFocus) { isFPS = !isFPS; updateAvatarMesh(localAvatar, myData); localAvatar.visible = !isFPS; }
            vKeyWasPressed = vPressed;

            const fPressed = keysPressed['f'];
            let tryInteract = fPressed && !fKeyWasPressed;
            fKeyWasPressed = fPressed;

            const isFlyMode = document.getElementById('admin-fly') && document.getElementById('admin-fly').checked;

            // クレーンゲームのアーム挙動
            if (craneGameData.state === 'moving') {
                craneGameData.clawPos += 30 * delta * (Math.sin(nowSec * 5) > 0 ? 1 : -1);
                craneGameData.clawPos = Math.max(-20, Math.min(20, craneGameData.clawPos));
                if (craneGameData.armMesh) craneGameData.armMesh.position.x = craneGameData.clawPos;
            }

            // エフェクト降下
            stationAreas.forEach(area => {
                if (area.type === 'effect_cube') {
                    area.mesh.position.y -= area.mesh.userData.fallSpeed * delta;
                    area.mesh.rotation.x += delta; area.mesh.rotation.y += delta;
                    if (area.mesh.position.y < -100) area.mesh.position.y = 2000;
                }
            });

            // 列車同期 (サーバーを使わない簡易ローカル絶対時間同期)
            trains.forEach(t => {
                const stopInterval = (Math.PI * 2) / t.numStops;
                const moveTime = stopInterval / TRAIN_BASE_SPEED;
                const sectionTotalTime = moveTime + TRAIN_STOP_TIME;
                const totalCycleTime = sectionTotalTime * t.numStops;
                
                const timeOffset = (t.initialAngle / stopInterval) * sectionTotalTime;
                const currentT = (nowSec + timeOffset) % totalCycleTime;
                
                const section = Math.floor(currentT / sectionTotalTime);
                const timeInSection = currentT % sectionTotalTime;
                
                let easeProgress = 0;
                if (timeInSection < moveTime) {
                    const p = timeInSection / moveTime;
                    easeProgress = (1 - Math.cos(p * Math.PI)) / 2;
                    t.state = 'moving';
                } else {
                    easeProgress = 1.0; 
                    t.state = 'stopped';
                }

                t.angle = (section * stopInterval) + easeProgress * stopInterval;
                const pt = new THREE.Vector3(Math.cos(t.angle) * t.radius, 120, Math.sin(t.angle) * t.radius);
                const rot = -t.angle; // 円運動の接線

                t.mesh.position.copy(pt); t.mesh.rotation.y = rot;
            });

            // ドローンの30秒待機＆安全帰還ロジック
            personalDrones.forEach((d, i) => {
                let isOccupied = (ridingDrone === d);
                Object.values(otherPlayers).forEach(p => { if (p.userData.ridingDroneIndex === i) isOccupied = true; });
                
                if (isOccupied) {
                    d.returnTimer = 0; d.returnState = 'none';
                } else if (d.mesh.position.distanceTo(d.initialPos) > 2) {
                    d.returnTimer += delta;
                    if (d.returnTimer > 30) {
                        if (d.returnState === 'none') d.returnState = 'up';
                        
                        if (d.returnState === 'up') {
                            d.mesh.position.y += 100 * delta;
                            if (d.mesh.position.y > 800) d.returnState = 'move';
                        } else if (d.returnState === 'move') {
                            const target = new THREE.Vector3(d.initialPos.x, d.mesh.position.y, d.initialPos.z);
                            d.mesh.position.lerp(target, 2 * delta);
                            if (d.mesh.position.distanceTo(target) < 5) d.returnState = 'down';
                        } else if (d.returnState === 'down') {
                            d.mesh.position.y -= 100 * delta;
                            if (d.mesh.position.y <= d.initialPos.y) {
                                d.mesh.position.copy(d.initialPos);
                                d.returnState = 'none'; d.returnTimer = 0;
                            }
                        }
                    }
                }
            });

            // インタラクション判定
            let promptText = "", interactTarget = null;
            
            if (isGameFocus) {
                promptText = "ゲーム中...";
            } else if (ridingDrone) {
                promptText = "ドローンから降りる";
                if (tryInteract) { ridingDrone = null; playerLocalPos.y += 2; }
            } else if (ridingTrain) {
                const pt = ridingTrain.mesh.position;
                playerLocalPos.set(pt.x, pt.y + 2, pt.z); 

                let canAlight = false, nearestStation = null;
                for (let st of stationAreas) { if (st.type === 'rect' && Math.hypot(pt.x - st.x, pt.z - st.z) < 80) { canAlight = true; nearestStation = st; break; } }
                if (canAlight) {
                    promptText = "駅で降りる";
                    if (tryInteract) {
                        const isOuter = nearestStation.x*nearestStation.x + nearestStation.z*nearestStation.z > 1000*1000;
                        const offset = isOuter ? -30 : -30; 
                        const dirX = Math.cos(nearestStation.angle), dirZ = Math.sin(nearestStation.angle);
                        playerLocalPos.set(nearestStation.x + dirX*offset, 121.5, nearestStation.z + dirZ*offset);
                        ridingTrain = null;
                    }
                } else promptText = "走行中... (駅で降りられます)";
            } else if (!isWarping) {
                let foundInteract = false;
                for (let t of trains) {
                    if (t.state === 'stopped' && Math.abs(playerLocalPos.y - t.mesh.position.y) < 20 && playerLocalPos.distanceTo(t.mesh.position) < 50) {
                        promptText = "列車に乗る"; interactTarget = () => { ridingTrain = t; }; foundInteract = true; break;
                    }
                }
                if (!foundInteract) {
                    for (let i = 0; i < personalDrones.length; i++) {
                        const d = personalDrones[i];
                        if (playerLocalPos.distanceTo(d.mesh.position) < 20 && Math.abs(playerLocalPos.y - d.mesh.position.y) < 10) {
                            let isOccupied = false; Object.values(otherPlayers).forEach(p => { if (p.userData.ridingDroneIndex === i) isOccupied = true; });
                            if (!isOccupied) {
                                promptText = "ドローンに乗る"; 
                                interactTarget = () => { ridingDrone = d; playerLocalPos.copy(d.mesh.position); playerLocalPos.y += 5; }; 
                                foundInteract = true; break;
                            }
                        }
                    }
                }
                if (!foundInteract) {
                    for (let item of interactables) {
                        if (playerLocalPos.distanceTo(item.pos) < item.radius && Math.abs(playerLocalPos.y - item.pos.y) < 20) {
                            promptText = item.label; interactTarget = item.action; break;
                        }
                    }
                }
                if (interactTarget && tryInteract) interactTarget();
            }

            const promptEl = document.getElementById('interaction-prompt');
            if (promptText) { document.getElementById('prompt-text').innerText = promptText; promptEl.style.display = 'block'; }
            else promptEl.style.display = 'none';

            // WASD 移動処理
            if (!isWarping && !ridingTrain && !isGameFocus && document.activeElement !== document.getElementById('chat-input')) {
                const speed = (keysPressed['shift'] ? 250 : 100) * myData.speedMult * delta; 
                
                const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
                const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
                
                let mv = new THREE.Vector3();
                if (keysPressed['w']) mv.add(fwd);
                if (keysPressed['s']) mv.sub(fwd);
                if (keysPressed['a']) mv.sub(right); 
                if (keysPressed['d']) mv.add(right); 
                if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed);

                let nextPos = new THREE.Vector3(playerLocalPos.x + mv.x, playerLocalPos.y, playerLocalPos.z + mv.z);

                if (!ridingDrone && !ridingTrain && !isWarping && !isFlyMode) {
                    let y = playerLocalPos.y;
                    
                    // 駅ホームの壁
                    if (Math.abs(y - 120) < 20) {
                        let currentSt = null;
                        for (let st of stationAreas) {
                            if (st.type !== 'rect') continue;
                            const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                            const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                            const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { currentSt = st; break; }
                        }
                        if (currentSt) {
                            const dx = nextPos.x - currentSt.x, dz = nextPos.z - currentSt.z;
                            const cos = Math.cos(-currentSt.angle), sin = Math.sin(-currentSt.angle);
                            let lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            const hw = currentSt.width/2 - 2, hd = currentSt.depth/2 - 2;
                            if (lx > hw) lx = hw; if (lx < -hw) lx = -hw; if (lz > hd) lz = hd; if (lz < -hd) lz = -hd;
                            nextPos.x = currentSt.x + lx * Math.cos(currentSt.angle) - lz * Math.sin(currentSt.angle); 
                            nextPos.z = currentSt.z + lx * Math.sin(currentSt.angle) + lz * Math.cos(currentSt.angle);
                        }
                    }

                    // 施設の円形/四角形壁
                    for (let st of stationAreas) {
                        if (st.type === 'wall' && y >= 0 && y < (st.height || 300)) {
                            const dist = Math.hypot(nextPos.x - st.x, nextPos.z - st.z);
                            if (dist < st.radius + 5) {
                                const angle = Math.atan2(nextPos.z - st.z, nextPos.x - st.x);
                                nextPos.x = st.x + Math.cos(angle) * (st.radius + 5);
                                nextPos.z = st.z + Math.sin(angle) * (st.radius + 5);
                            }
                        }
                    }

                    // 島の落下防止壁（バリア）
                    if (Math.hypot(nextPos.x, nextPos.z) > MAP_RADIUS) {
                        const angle = Math.atan2(nextPos.z, nextPos.x);
                        nextPos.x = Math.cos(angle) * MAP_RADIUS;
                        nextPos.z = Math.sin(angle) * MAP_RADIUS;
                    }
                }
                
                if (ridingDrone || isFlyMode) {
                    let nextY = playerLocalPos.y;
                    if (keysPressed['e']) nextY += 150 * delta; 
                    if (keysPressed['q']) nextY -= 150 * delta; 
                    if (!isFlyMode) nextY = Math.max(1, nextY);
                    playerLocalPos.set(nextPos.x, nextY, nextPos.z);
                    if(ridingDrone){ ridingDrone.mesh.position.copy(playerLocalPos); ridingDrone.mesh.position.y -= 5; }
                } else {
                    playerLocalPos.x = nextPos.x; playerLocalPos.z = nextPos.z;
                }
            }

            // 高さ・重力計算
            if (!ridingDrone && !ridingTrain && !isWarping && !isFlyMode && !isGameFocus) {
                let groundY = -5000; // 落下を許容
                
                if (Math.hypot(playerLocalPos.x, playerLocalPos.z) <= MAP_RADIUS) groundY = 1.5; 
                
                for (let st of stationAreas) {
                    if (st.type === 'circle' && Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z) < st.radius && Math.abs(playerLocalPos.y - st.y) < 20) {
                        if (st.y > groundY) groundY = st.y; 
                    }
                    if (st.type === 'rect' && Math.abs(playerLocalPos.y - st.y) < 20) {
                        const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                        const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                        const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                        if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { 
                            // 穴がある場合 (モールの2階吹き抜け)
                            if (st.holeRadius && Math.hypot(lx, lz) < st.holeRadius) continue;
                            if (st.y > groundY) groundY = st.y; 
                        }
                    }
                    if (st.type === 'slope') {
                        const dist = Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z);
                        if (Math.abs(dist - st.radius) < st.width) {
                            let ang = Math.atan2(playerLocalPos.z - st.z, playerLocalPos.x - st.x);
                            if (ang < 0) ang += Math.PI*2;
                            if (ang <= st.angleEnd) {
                                const sy = st.bottomY + (ang / st.angleEnd) * (st.topY - st.bottomY);
                                if (Math.abs(playerLocalPos.y - sy) < 15 && sy > groundY) groundY = sy;
                            }
                        }
                    }
                }

                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 60 * delta; // 重力
                    playerLocalPos.y += playerVelocityY * delta;
                    if (playerLocalPos.y <= groundY) { playerLocalPos.y = groundY; playerVelocityY = 0; }
                } else {
                    playerLocalPos.y = groundY; playerVelocityY = 0;
                }

                // リスポーン処理
                if (playerLocalPos.y < -100) {
                    playerLocalPos.set(0, 50, 500); playerVelocityY = 0;
                    addChatMessage("SYSTEM", "落下限界を越えたため中央へ転送されました。");
                }
            }

            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.visible = !isFPS && !isGameFocus;
                
                if (ridingTrain) localAvatar.rotation.y = ridingTrain.mesh.rotation.y;
                else if (!isWarping && !ridingDrone && !isGameFocus && document.activeElement !== document.getElementById('chat-input')) {
                    if (keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d']) {
                        let targetYaw = cameraYaw;
                        if (keysPressed['s']) targetYaw += Math.PI; else if (keysPressed['a']) targetYaw += Math.PI/2; else if (keysPressed['d']) targetYaw -= Math.PI/2;
                        localAvatar.rotation.y = targetYaw;
                    } else localAvatar.rotation.y = cameraYaw;
                }

                if (socket) {
                    const distSq = lastSentPos.distanceToSquared(playerLocalPos);
                    const rotDiff = Math.abs(lastSentRot - localAvatar.rotation.y);
                    if (distSq > 0.1 || rotDiff > 0.1) {
                        socket.emit('playerMovement', { 
                            x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, 
                            rotation: localAvatar.rotation.y,
                            ridingTrainIndex: ridingTrain ? trains.indexOf(ridingTrain) : -1,
                            ridingDroneIndex: ridingDrone ? personalDrones.indexOf(ridingDrone) : -1
                        });
                        lastSentPos.copy(playerLocalPos); lastSentRot = localAvatar.rotation.y;
                    }
                }
            }

            Object.values(otherPlayers).forEach(mesh => {
                if (mesh.userData.ridingTrainIndex >= 0) {
                    const t = trains[mesh.userData.ridingTrainIndex];
                    if (t) { mesh.position.set(t.mesh.position.x, t.mesh.position.y + 2, t.mesh.position.z); mesh.rotation.y = t.mesh.rotation.y; }
                }
                if (mesh.userData.ridingDroneIndex >= 0) {
                    const d = personalDrones[mesh.userData.ridingDroneIndex];
                    if (d) { d.mesh.position.copy(mesh.position); d.mesh.position.y -= 5; }
                }
            });

            // カメラ更新
            if (isGameFocus && gameCameraTarget && gameLookAt) {
                camera.position.lerp(gameCameraTarget, 5 * delta);
                const targetRot = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(camera.position, gameLookAt, camera.up));
                camera.quaternion.slerp(targetRot, 5 * delta);
            } else {
                const camTarget = playerLocalPos.clone();
                if (isFPS) {
                    camera.position.copy(camTarget); camera.position.y += 1.6 * 2.5 * myData.bodyScale.y;
                } else {
                    const offset = new THREE.Vector3(Math.sin(cameraYaw)*35, 20 + Math.sin(cameraPitch)*20, Math.cos(cameraYaw)*35);
                    camera.position.copy(camTarget).add(offset); camTarget.y += 4; 
                }
                const lookDir = new THREE.Vector3(-Math.sin(cameraYaw) * Math.cos(cameraPitch), Math.sin(cameraPitch), -Math.cos(cameraYaw) * Math.cos(cameraPitch));
                camera.lookAt(camera.position.clone().add(lookDir));
            }

            if(minimapCtx) {
                minimapCtx.clearRect(0, 0, 180, 180);
                minimapCtx.fillStyle = '#00ffff'; minimapCtx.beginPath(); minimapCtx.arc(90, 90, 5, 0, Math.PI*2); minimapCtx.fill();
                minimapCtx.strokeStyle = 'rgba(136, 204, 255, 0.4)'; minimapCtx.lineWidth = 1;
                minimapCtx.beginPath(); minimapCtx.arc(90, 90, (800/MAP_RADIUS)*90, 0, Math.PI*2); minimapCtx.stroke();
                minimapCtx.beginPath(); minimapCtx.arc(90, 90, (1600/MAP_RADIUS)*90, 0, Math.PI*2); minimapCtx.stroke();
                const px = 90 + (playerLocalPos.x / MAP_RADIUS) * 90; const py = 90 + (playerLocalPos.z / MAP_RADIUS) * 90;
                minimapCtx.fillStyle = '#ff0055'; minimapCtx.beginPath(); minimapCtx.arc(px, py, 4, 0, Math.PI*2); minimapCtx.fill();
                minimapCtx.strokeStyle = '#ff0055'; minimapCtx.lineWidth = 2; minimapCtx.beginPath(); minimapCtx.moveTo(px, py); minimapCtx.lineTo(px - Math.sin(cameraYaw)*10, py - Math.cos(cameraYaw)*10); minimapCtx.stroke();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
