<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Cyber Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; user-select: none; }
        
        /* ログイン画面 */
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 40px rgba(0, 255, 255, 0.3); width: 340px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 3px; font-weight: 900;}
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.6); color: #fff; outline: none; transition: 0.2s;}
        .panel input:focus { border-color: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.5); }
        .panel label { font-size: 0.8rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer;}
        .panel button { width: 100%; padding: 12px; margin: 15px 0 5px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1.1rem; letter-spacing: 1px;}
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; box-shadow: 0 0 15px rgba(0,255,255,0.5); }
        .btn-primary:hover { filter: brightness(1.2); }
        .btn-success { background: transparent; border: 1px solid #f472b6; color: #f472b6; }
        .btn-success:hover { background: rgba(244, 114, 182, 0.2); }
        .error-msg { color: #f43f5e; font-size: 0.9rem; text-align: center; min-height: 20px; font-weight: bold;}

        /* メインUI */
        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; background: rgba(0,0,0,0.5);}
        #sidebar { position: absolute; top: 20px; left: 20px; width: 260px; background: rgba(10, 15, 30, 0.85); border-left: 4px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto; backdrop-filter: blur(5px);}
        .money { font-size: 1.8rem; color: #00ffff; font-weight: 900; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        
        /* アドミンパネル */
        #admin-panel { display: none; position: absolute; top: 20px; right: 20px; width: 260px; background: rgba(30, 10, 40, 0.9); border-right: 4px solid #ff00ff; padding: 15px; border-radius: 8px 0 0 8px; pointer-events: auto; backdrop-filter: blur(5px);}
        #admin-panel h3 { color: #ff00ff; margin: 0 0 15px 0; font-size: 1.2rem; text-shadow: 0 0 10px rgba(255,0,255,0.5);}
        .admin-input-group { margin-bottom: 10px; }
        .admin-input-group label { display: block; font-size: 0.8rem; color: #d8b4e2; margin-bottom: 3px; }
        #admin-panel input { width: 100%; box-sizing: border-box; padding: 8px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #ff00ff; border-radius: 4px; outline: none; }
        #admin-panel button { width: 100%; padding: 8px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; transition: 0.2s;}
        .btn-admin { background: #ff00ff; color: #000; }
        .btn-admin:hover { filter: brightness(1.2); box-shadow: 0 0 10px rgba(255,0,255,0.8); }

        /* パフォーマンスと設定 */
        #perf-panel { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); border: 1px solid #334155; padding: 10px; border-radius: 8px; font-family: monospace; color: #38bdf8; pointer-events: auto; display: flex; align-items: center; gap: 15px;}
        .perf-val { color: #00ffff; font-weight: bold; font-size: 1.1rem;}
        #settings-btn { background: transparent; border: none; cursor: pointer; font-size: 1.5rem; transition: transform 0.3s; }
        #settings-btn:hover { transform: rotate(90deg); }
        #settings-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,23,42,0.95); border: 2px solid #38bdf8; padding: 25px; border-radius: 12px; z-index: 50; width: 300px; pointer-events: auto; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #settings-modal h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        /* ミニマップとインタラクション */
        #minimap-container { position: absolute; bottom: 80px; right: 20px; width: 180px; height: 180px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(5,10,25,0.8); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.3); pointer-events: none;}
        #minimap { width: 100%; height: 100%; }
        #interaction-prompt { position: absolute; bottom: 25vh; left: 50%; transform: translateX(-50%); background: rgba(0, 10, 20, 0.9); border: 2px solid #00ffff; padding: 12px 25px; border-radius: 30px; color: #00ffff; font-weight: bold; font-size: 1.3rem; display: none; box-shadow: 0 0 20px rgba(0,255,255,0.6); pointer-events: none;}
        .key-btn { background: #fff; color: #000; padding: 2px 10px; border-radius: 6px; margin-right: 12px; font-family: monospace; }

        /* チャット */
        #chat-container { position: absolute; bottom: 20px; left: 20px; width: 340px; background: rgba(10, 15, 30, 0.85); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; border: 1px solid #1e293b; backdrop-filter: blur(5px);}
        #chat-messages { height: 180px; overflow-y: auto; padding: 12px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 6px; }
        #chat-messages div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; word-wrap: break-word;}
        .chat-input-row { display: flex; border-top: 1px solid #334155; }
        #chat-input { flex-grow: 1; padding: 10px; border: none; background: transparent; color: white; outline: none; font-size: 0.95rem;}
        #chat-input:focus { background: rgba(0,255,255,0.1); }
        .btn-action-small { width: 45px; background: #0ea5e9; color: #fff; border: none; cursor: pointer; font-weight: bold; font-size: 1.2rem; transition: 0.2s;}
        .btn-action-small:hover { background: #00ffff; color: #000; }

        /* アバターエディタ */
        #avatar-editor { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,23,42,0.95); border: 2px solid #00ff00; padding: 25px; border-radius: 12px; z-index: 50; width: 320px; pointer-events: auto; box-shadow: 0 0 40px rgba(0,255,0,0.4); }
        #avatar-editor h3 { margin-top: 0; color: #00ff00; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        .edit-group { margin-bottom: 15px; }
        .edit-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        .edit-group input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; background: transparent; }
        .edit-group input[type="range"] { width: 100%; cursor: pointer; }
        .val-disp { float: right; color: #00ff00; font-family: monospace; }
        
        #fade-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; z-index: 90; display: none; opacity: 0; transition: opacity 0.5s; pointer-events: none;}
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <div id="auth-error" class="error-msg"></div>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <label id="admin-check-container" style="display:none;">
                <input type="password" id="admin-pass" placeholder="Admin Password (Optional)">
            </label>

            <button class="btn-primary" onclick="attemptAuth('login')">ENTER SYSTEM</button>
            <button class="btn-success" onclick="attemptAuth('register')">REGISTER</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="sidebar">
            <div style="font-size: 0.85rem; color:#94a3b8; margin-bottom: 5px;">ID: <span id="ui-username" style="color:#fff; font-weight:bold;">---</span> <span id="ui-admin-badge" style="color:#ff00ff; display:none; font-weight:bold;">[ADMIN]</span></div>
            <div class="money">CR: <span id="ui-money">0</span></div>
            <div style="font-size: 0.85rem; color:#94a3b8; margin-top:8px; display:flex; justify-content:space-between;">
                <span>株保有: <strong id="ui-stocks" style="color:#fff;">0</strong></span>
                <span>Speed: <strong id="ui-speed" style="color:#fff;">x1.0</strong></span>
            </div>
        </div>
        
        <div id="admin-panel">
            <h3>Admin Override</h3>
            <div class="admin-input-group">
                <label>Speed Multiplier:</label>
                <input type="number" id="admin-speed" value="3.0" step="0.5">
                <button class="btn-admin" onclick="applyAdminSpeed()">Apply Speed</button>
            </div>
            <div class="admin-input-group">
                <label>Set CR:</label>
                <input type="number" id="admin-cr" value="100000">
                <button class="btn-admin" onclick="applyAdminCR()">Set CR</button>
            </div>
            <div class="admin-input-group">
                <label style="margin-top: 10px; cursor: pointer; color:#fff; font-weight:bold; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="admin-fly" style="width:16px; height:16px;"> FLY MODE (No Clip)
                </label>
            </div>
            <div class="admin-input-group" style="margin-top: 15px; border-top: 1px solid #ff00ff; padding-top:10px;">
                <input type="text" id="admin-target" placeholder="Target Username">
                <button class="btn-admin" style="background:#00ffff;" onclick="adminGrant()">GRANT ADMIN</button>
                <button class="btn-admin" style="background:#ff3333; color:#fff;" onclick="adminBan()">BAN USER</button>
                <button class="btn-admin" style="background:#aaaaaa; color:#000;" onclick="adminUnban()">UNBAN</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Message... (Enter to send)">
                <button class="btn-action-small" title="送金する" onclick="promptSendMoney()">💸</button>
            </div>
        </div>

        <div id="minimap-container"><canvas id="minimap" width="180" height="180"></canvas></div>
        
        <div id="perf-panel">
            <div>FPS: <span id="ui-fps" class="perf-val">--</span></div>
            <div>PING: <span id="ui-ping" class="perf-val">--</span><span style="font-size:0.7rem;">ms</span></div>
            <button id="settings-btn" title="設定">⚙️</button>
        </div>

        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>

    <div id="settings-modal">
        <h3>Graphic Settings</h3>
        <div class="setting-row">
            <label style="color:#94a3b8;">Resolution</label>
            <select id="set-res" onchange="applySettings()" style="background:#000; color:#fff; padding:5px; border:1px solid #38bdf8; outline:none;">
                <option value="1.0">High (Native)</option>
                <option value="0.75" selected>Medium</option>
                <option value="0.5">Low (Fast)</option>
            </select>
        </div>
        <div class="setting-row">
            <label style="color:#94a3b8;">Shadows</label>
            <input type="checkbox" id="set-shadow" checked onchange="applySettings()">
        </div>
        <button style="width:100%; padding:10px; background:#38bdf8; color:#000; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-top:10px;" onclick="closeSettings()">CLOSE</button>
    </div>

    <div id="avatar-editor">
        <h3>Avatar Customization</h3>
        <div class="edit-group">
            <label>Body Color</label>
            <input type="color" id="edit-color-body" value="#00ffff" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Head Color</label>
            <input type="color" id="edit-color-head" value="#ffcc99" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Visor Color</label>
            <input type="color" id="edit-color-visor" value="#000000" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Width <span class="val-disp" id="val-sx">1.0</span></label>
            <input type="range" id="edit-sx" min="0.5" max="2.0" step="0.1" value="1.0" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Height <span class="val-disp" id="val-sy">1.0</span></label>
            <input type="range" id="edit-sy" min="0.5" max="1.5" step="0.1" value="1.0" oninput="previewAvatar()">
        </div>
        <div class="edit-group">
            <label>Depth <span class="val-disp" id="val-sz">1.0</span></label>
            <input type="range" id="edit-sz" min="0.5" max="2.0" step="0.1" value="1.0" oninput="previewAvatar()">
        </div>
        <button style="width:100%; padding:12px; background:#00ff00; color:#000; border:none; border-radius:6px; font-weight:bold; font-size:1.1rem; cursor:pointer;" onclick="saveAvatar()">APPLY & CLOSE</button>
    </div>
    
    <div id="fade-overlay"></div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        let myData = {
            username: 'Guest', cr: 0, stocks: 0,
            color: '#00ffff', headColor: '#ffcc99', visorColor: '#000000',
            bodyScale: {x:1, y:1, z:1}, accessory: 'none',
            speedMult: 1.0, isAdmin: false, activeAdmin: false
        };

        let scene, camera, renderer, clock;
        const MAP_RADIUS = 2500; 
        const BASE_Y = 100; // 高架都市の基本高度
        const GROUND_Y = 0; // アンダーシティ（下層）の高度
        
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isFPS = false, vKeyWasPressed = false;
        let isGameFocus = false; 
        let gameCameraTarget = null, gameLookAt = null;

        let playerLocalPos = new THREE.Vector3(0, BASE_Y + 1.5, 500); 
        let playerVelocityY = 0; 
        
        const trains = [], personalDrones = [], warpPads = [], stationAreas = []; 
        const otherPlayers = {}; 
        let ridingTrain = null, ridingDrone = null, localAvatar = null;
        let isWarping = false, fKeyWasPressed = false;
        
        let minimapCtx;
        let frameCount = 0, lastFpsTime = 0, pingStart = 0;
        let settings = { resolution: 0.75, shadows: true };

        const interactables = []; 
        let craneGameData = { state: 'idle', clawPos: 0, armMesh: null };
        
        let stockHistory = Array(50).fill(100);
        let currentStockPrice = 100;
        const stockCanvas = document.createElement('canvas');
        stockCanvas.width = 512; stockCanvas.height = 256;
        const stockCtx = stockCanvas.getContext('2d');
        const stockTex = new THREE.CanvasTexture(stockCanvas);

        document.getElementById('username').addEventListener('input', (e) => {
            const val = e.target.value.trim();
            const chkBox = document.getElementById('admin-check-container');
            if (val === '898scr' || val === '898sct') chkBox.style.display = 'block';
            else { chkBox.style.display = 'none'; document.getElementById('admin-pass').value = ''; }
        });

        async function attemptAuth(action) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const adminPass = document.getElementById('admin-pass').value;
            const asAdmin = (adminPass === 'admin'); 

            if (!username) return showAuthError("Usernameを入力してください");
            const endpoint = action === 'login' ? '/api/login' : '/api/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, asAdmin })
                });
                const data = await res.json();

                if (data.success) {
                    if (action === 'register') showAuthError("登録完了！ LOGINしてください", "#00ff00");
                    else {
                        myData = {
                            username: data.username, cr: data.cr, stocks: data.stocks,
                            color: data.color || '#00ffff', headColor: data.headColor || '#ffcc99',
                            visorColor: data.visorColor || '#000000', bodyScale: data.bodyScale || {x:1, y:1, z:1},
                            accessory: data.accessory || 'none', speedMult: data.speedMult || 1.0,
                            isAdmin: data.isAdmin, activeAdmin: data.activeAdmin
                        };

                        updateUI();
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('ui-layer').style.display = 'block';

                        if (myData.activeAdmin) {
                            document.getElementById('admin-panel').style.display = 'block';
                            document.getElementById('ui-admin-badge').style.display = 'inline';
                            addChatMessage("SYSTEM", "Administrator Override Active.");
                        }

                        socket = io({ auth: { username: myData.username, activeAdmin: myData.activeAdmin } });
                        setupSocketEvents();
                        initThreeJS();
                        document.body.requestPointerLock();
                    }
                } else showAuthError(data.message);
            } catch (err) { showAuthError("サーバーに接続できません"); }
        }

        function showAuthError(msg, color = "#f43f5e") {
            const el = document.getElementById('auth-error');
            el.innerText = msg; el.style.color = color;
        }

        function updateUI() {
            document.getElementById('ui-username').innerText = myData.username;
            document.getElementById('ui-money').innerText = myData.cr;
            document.getElementById('ui-stocks').innerText = myData.stocks;
            document.getElementById('ui-speed').innerText = `x${myData.speedMult.toFixed(1)}`;
        }

        function addChatMessage(sender, text, isAdmin = false) {
            const msg = document.createElement('div');
            let color = '#00ffff'; 
            if (sender === 'SYSTEM' || sender === 'CASINO') color = '#ff00ff';
            else if (isAdmin) color = '#ffaa00';
            msg.innerHTML = `<strong style="color:${color}">${sender}</strong>: ${text}`;
            document.getElementById('chat-messages').appendChild(msg);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        function updateStockChart() {
            stockCtx.fillStyle = '#010501'; stockCtx.fillRect(0, 0, 512, 256);
            stockCtx.strokeStyle = '#00ff00'; stockCtx.lineWidth = 4;
            stockCtx.beginPath();
            const w = 512 / 50;
            const max = Math.max(...stockHistory, 200), min = Math.min(...stockHistory, 0);
            const range = max - min || 1;
            for(let i=0; i<stockHistory.length; i++) {
                const x = i * w; const y = 256 - ((stockHistory[i] - min) / range * 200 + 20);
                if(i===0) stockCtx.moveTo(x, y); else stockCtx.lineTo(x, y);
            }
            stockCtx.stroke();
            stockCtx.fillStyle = '#fff'; stockCtx.font = '24px sans-serif';
            stockCtx.fillText(`CURRENT: ${currentStockPrice} CR`, 20, 40);
            stockTex.needsUpdate = true;
        }

        let lastSentPos = new THREE.Vector3(), lastSentRot = 0;

        function setupSocketEvents() {
            setInterval(() => { pingStart = performance.now(); socket.emit('ping'); }, 2000);
            socket.on('pong', () => document.getElementById('ui-ping').innerText = Math.round(performance.now() - pingStart) );

            socket.on('initData', (data) => {
                stockHistory = data.stockHistory; currentStockPrice = data.stockPrice;
                updateStockChart();
                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (info.username !== myData.username && !otherPlayers[info.id]) addOtherPlayer(info);
                });
            });

            socket.on('marketUpdate', (data) => {
                stockHistory = data.history; currentStockPrice = data.price; updateStockChart();
            });

            socket.on('newPlayer', (info) => { 
                if (info.username !== myData.username && !otherPlayers[info.id]) addOtherPlayer(info); 
            });
            
            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    const mesh = otherPlayers[info.id];
                    mesh.position.set(info.x, info.y, info.z);
                    mesh.rotation.y = info.rotation;
                    mesh.userData.ridingTrainIndex = info.ridingTrainIndex;
                    mesh.userData.ridingDroneIndex = info.ridingDroneIndex;
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
            });

            socket.on('chatMessage', (data) => addChatMessage(data.username, data.text, data.isAdmin));
            socket.on('sysMessage', (data) => addChatMessage("SYSTEM", data.text));

            socket.on('avatarChanged', (data) => {
                if (data.id === socket.id) {
                    myData.color = data.avatar.color; myData.headColor = data.avatar.headColor;
                    myData.visorColor = data.avatar.visorColor; myData.bodyScale = data.avatar.bodyScale;
                    myData.accessory = data.avatar.accessory;
                    updateAvatarMesh(localAvatar, myData);
                } else if (otherPlayers[data.id]) updateAvatarMesh(otherPlayers[data.id], data.avatar);
            });

            socket.on('purchaseSuccess', (data) => {
                myData.cr = data.cr; if(data.type === 'speed') myData.speedMult = data.speedMult;
                updateUI(); addChatMessage("SYSTEM", `${data.itemName} を購入・適用しました！`);
            });

            socket.on('tradeSuccess', (data) => {
                myData.cr = data.cr; myData.stocks = data.stocks;
                updateUI(); addChatMessage("SYSTEM", data.msg);
            });

            socket.on('crUpdated', (newCr) => { myData.cr = newCr; updateUI(); });
            socket.on('banned', () => { alert("アカウント凍結(BAN)されました。"); location.reload(); });
            socket.on('grantedAdmin', () => {
                myData.isAdmin = true; myData.activeAdmin = true; socket.activeAdmin = true; 
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('ui-admin-badge').style.display = 'inline';
                addChatMessage("SYSTEM", "管理者権限が付与されました。Override Enabled.");
            });
        }

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(info);
            mesh.position.set(info.x, info.y, info.z); mesh.rotation.y = info.rotation;
            scene.add(mesh); otherPlayers[info.id] = mesh;
        }

        function createAvatarMesh(config) {
            const group = new THREE.Group();
            const s = 2.5; 
            
            const parseColor = (col, def) => {
                if(typeof col === 'string' && col.startsWith('#')) return parseInt(col.replace('#', '0x'));
                if(typeof col === 'number') return col;
                return def;
            };

            const bCol = parseColor(config.color, 0x00ffff);
            const hCol = parseColor(config.headColor, 0xffcc99);
            const vCol = parseColor(config.visorColor, 0x000000);
            const sx = config.bodyScale ? config.bodyScale.x : 1;
            const sy = config.bodyScale ? config.bodyScale.y : 1;
            const sz = config.bodyScale ? config.bodyScale.z : 1;

            hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25*s, 0.25*s, 0.5*s, 16), new THREE.MeshStandardMaterial({color:0x111111})).translateY(0.6*s));

        function updateAvatarMesh(mesh, config) {
            if(!mesh) return;
            const s = 2.5; const sy = config.bodyScale ? config.bodyScale.y : 1; const sx = config.bodyScale ? config.bodyScale.x : 1;
            const parseColor = (col, def) => {
                if(typeof col === 'string' && col.startsWith('#')) return parseInt(col.replace('#', '0x'));
                if(typeof col === 'number') return col;
                return def;
            };
            mesh.children.forEach(child => {
                if (child.name === "body") { child.material.color.setHex(parseColor(config.color, 0x00ffff)); child.scale.copy(config.bodyScale || {x:1, y:1, z:1}); child.position.y = 0.6 * s * sy; }
                else if (child.name === "head") { child.material.color.setHex(parseColor(config.headColor, 0xffcc99)); child.scale.set(sx, sx, sx); child.position.y = 1.5 * s * sy; }
                else if (child.name === "visor") { child.material.color.setHex(parseColor(config.visorColor, 0x000000)); child.scale.set(sx, sx, sx); child.position.y = 1.5 * s * sy; }
                else if (child.name === "nameTag") child.position.y = 2.5 * s * sy;
            });
            if(mesh.userData.headContainer) {
                mesh.userData.headContainer.position.y = 1.5 * s * sy; mesh.userData.headContainer.scale.set(sx, sx, sx);
                mesh.userData.headContainer.children.forEach(acc => { if (acc.userData.isAccessory) acc.visible = (acc.userData.accType === config.accessory); });
            }
        }

        function createWindowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#050a15'; ctx.fillRect(0,0,64,64);
            ctx.fillStyle = '#00ffff';
            for(let i=2; i<64; i+=8) {
                for(let j=2; j<64; j+=12) {
                    if(Math.random()>0.7) {
                        ctx.fillStyle = Math.random() > 0.5 ? '#00ffff' : '#ff00ff';
                        ctx.fillRect(i,j,4,8);
                    }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createBackgroundCity() {
            const bGeo = new THREE.BoxGeometry(1, 1, 1);
            const winTex = createWindowTexture();
            const bMat = new THREE.MeshStandardMaterial({ map: winTex, color: 0x1a2030, roughness: 0.8 });
            
            const count = 1500;
            const iMesh = new THREE.InstancedMesh(bGeo, bMat, count);
            
            const dummy = new THREE.Object3D();
            let idx = 0;
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                // メインの島（半径1500程度）の外側に配置
                const dist = 1600 + Math.random() * 1200; 
                const w = 40 + Math.random() * 100;
                const d = 40 + Math.random() * 100;
                const h = 200 + Math.random() * 1000;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                
                dummy.position.set(x, GROUND_Y + h/2, z);
                dummy.scale.set(w, h, d);
                dummy.rotation.y = angle;
                dummy.updateMatrix();
                iMesh.setMatrixAt(idx++, dummy.matrix);
            }
            scene.add(iMesh);
        }

        function createEnvironment() {
            // ベース地面（奈落ではなく、強固な基盤）
            const groundMat = new THREE.MeshStandardMaterial({color: 0x050a10, roughness: 0.9});
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(MAP_RADIUS * 2, MAP_RADIUS * 2), groundMat);
            ground.rotation.x = -Math.PI/2; ground.position.y = GROUND_Y; ground.receiveShadow = true;
            scene.add(ground);

            const gridHelper = new THREE.GridHelper(MAP_RADIUS * 2, 400, 0x00ffff, 0x020617);
            gridHelper.position.y = GROUND_Y + 0.5; gridHelper.material.transparent = true; gridHelper.material.opacity = 0.15;
            scene.add(gridHelper);

            // 高架を支える巨大ピラー群
            const pillarMat = new THREE.MeshStandardMaterial({color: 0x11111a, metalness: 0.5});
            const pGeo = new THREE.CylinderGeometry(20, 20, BASE_Y, 8);
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                for(let dist=300; dist<MAP_RADIUS; dist+=300) {
                    const pillar = new THREE.Mesh(pGeo, pillarMat);
                    pillar.position.set(Math.cos(angle)*dist + (Math.random()*100-50), BASE_Y/2, Math.sin(angle)*dist + (Math.random()*100-50));
                    scene.add(pillar);
                }
            }

            const roadMat = new THREE.MeshStandardMaterial({color: 0x1a2030, roughness: 0.8});
            const lineMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.7});
            
            // 放射状の高架道路（8方向）
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const roadGrp = new THREE.Group();
                const roadWidth = 120;
                
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, MAP_RADIUS), roadMat);
                plane.rotation.x = -Math.PI/2; plane.position.z = MAP_RADIUS/2; plane.receiveShadow = true;
                roadGrp.add(plane);
                
                const line = new THREE.Mesh(new THREE.PlaneGeometry(6, MAP_RADIUS), lineMat);
                line.rotation.x = -Math.PI/2; line.position.z = MAP_RADIUS/2; line.position.y = 0.5; roadGrp.add(line);
                
                roadGrp.position.y = BASE_Y;
                roadGrp.rotation.y = -angle; 
                scene.add(roadGrp);

                stationAreas.push({ type: 'rect', x: Math.sin(angle)*MAP_RADIUS/2, z: Math.cos(angle)*MAP_RADIUS/2, angle: -angle, width: roadWidth, depth: MAP_RADIUS, y: BASE_Y });
            }
            
            // 多重リング状高架道路 (イメージ図再現)
            const ringRadii = [500, 1000];
            ringRadii.forEach(r => {
                const ringGrp = new THREE.Group();
                const rPlane = new THREE.Mesh(new THREE.RingGeometry(r - 60, r + 60, 64), roadMat);
                rPlane.rotation.x = -Math.PI/2; ringGrp.add(rPlane);
                const rLine = new THREE.Mesh(new THREE.RingGeometry(r - 3, r + 3, 64), lineMat);
                rLine.rotation.x = -Math.PI/2; rLine.position.y = 0.5; ringGrp.add(rLine);
                ringGrp.position.y = BASE_Y; scene.add(ringGrp);
                
                stationAreas.push({ type: 'ring', x: 0, z: 0, innerRadius: r - 60, outerRadius: r + 60, y: BASE_Y });
            });

            // 中央広場
            stationAreas.push({ type: 'circle', x: 0, z: 0, radius: 450, y: BASE_Y });

            // 島全体を覆う巨大バリア
            const barrierGeo = new THREE.SphereGeometry(MAP_RADIUS + 300, 64, 32, 0, Math.PI*2, 0, Math.PI/2);
            const barrierMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.05, wireframe: true, side: THREE.BackSide});
            const barrier = new THREE.Mesh(barrierGeo, barrierMat);
            barrier.position.y = BASE_Y - 200; scene.add(barrier);

            // 降ってくるサイバーキューブ
            for(let i=0; i<300; i++){
                const c = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.6, wireframe: true}));
                c.position.set((Math.random()-0.5)*MAP_RADIUS*1.5, BASE_Y + 500 + Math.random()*2000, (Math.random()-0.5)*MAP_RADIUS*1.5);
                c.userData.fallSpeed = 20 + Math.random()*40; scene.add(c);

        function createMegaFacilities() {
            // --- ランドマークタワー (イメージ図のサイバーコア風) ---
            const towerGroup = new THREE.Group();
            const TOWER_Y = BASE_Y + 1400; 
            const octMat = new THREE.MeshStandardMaterial({color: 0x0f172a, roughness: 0.3, metalness: 0.8});
            const frameMat = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.3});
            
            const createOct = (rt, rb, h, y) => {
                const geo = new THREE.CylinderGeometry(rt, rb, h, 8);
                geo.rotateY(Math.PI/8);
                const mesh = new THREE.Mesh(geo, octMat); const frame = new THREE.Mesh(geo, frameMat);
                mesh.position.y = y; frame.position.y = y;
                towerGroup.add(mesh, frame);
            };

            const plazaGeo = new THREE.CylinderGeometry(450, 450, 10, 8);
            plazaGeo.rotateY(Math.PI/8);
            const plaza = new THREE.Mesh(plazaGeo, octMat);

            // 胴体：極太（下）→ 細（中）→ 中太（上）
            createOct(250, 600, 400, BASE_Y + 200); // Base

            createOct(350, 150, 400, BASE_Y + 1200); // Top

            // 重厚な垂直ピラー (道路を避ける22.5度ズレ)
            for(let i=0; i<8; i++) {
                const angle = i * Math.PI/4 + Math.PI/8; 
                const pillarGeo = new THREE.BoxGeometry(80, 600, 150);
                const pillar = new THREE.Mesh(pillarGeo, octMat);
                pillar.position.set(Math.cos(angle)*400, BASE_Y + 300, Math.sin(angle)*400);
                pillar.rotation.y = -angle; 
                pillar.lookAt(0, BASE_Y + 800, 0);
                pillar.rotation.x -= Math.PI/2;
                towerGroup.add(pillar);
            }

            // 中腹のエネルギーリング
            const ringGeo = new THREE.TorusGeometry(450, 40, 16, 8);
            ringGeo.rotateY(Math.PI/8);
            const eRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.8}));
            eRing.rotation.x = Math.PI/2; eRing.position.y = BASE_Y + 800; towerGroup.add(eRing);

            // 展望台 (八角形ベース) -> イメージ図のように強調

            disk.position.y = TOWER_Y - 50; towerGroup.add(disk);

            floorTop.rotateY(Math.PI/8); floorTop.position.y = TOWER_Y; towerGroup.add(floorTop);
            
            // 中央エネルギーコア
            const coreGrp = new THREE.Group();
            coreGrp.add(new THREE.Mesh(new THREE.OctahedronGeometry(150, 2), new THREE.MeshBasicMaterial({color: 0xffaa00})));
            coreGrp.add(new THREE.Mesh(new THREE.OctahedronGeometry(160, 2), new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true})));
            coreGrp.position.y = TOWER_Y + 200; towerGroup.add(coreGrp);

            // 4つの空中庭園ドーム (イメージ図再現)
            for(let i=0; i<4; i++) {
                const angle = i * Math.PI/2 + Math.PI/4;

                sDome.position.set(dx, TOWER_Y, dz); towerGroup.add(sDome);

            }

        function createMallComplex(x, z, rot, baseY) {
            const grp = new THREE.Group(); grp.position.set(x, baseY, z); grp.rotation.y = rot;
            const width = 1200, depth = 900; 
            
            // 階段状構造と屋上緑化
            const extMat = new THREE.MeshStandardMaterial({color: 0x112233});
            const grassMat = new THREE.MeshStandardMaterial({color: 0x22aa22});
            
            const b1 = new THREE.Mesh(new THREE.BoxGeometry(width+40, 150, depth+40), extMat);
            b1.position.y = 75; grp.add(b1);
            const r1 = new THREE.Mesh(new THREE.PlaneGeometry(width+40, depth+40), grassMat);
            r1.rotation.x = -Math.PI/2; r1.position.y = 150.5; grp.add(r1);

            const b2 = new THREE.Mesh(new THREE.BoxGeometry(width-200, 150, depth-200), extMat);
            b2.position.set(0, 225, -100); grp.add(b2);
            const r2 = new THREE.Mesh(new THREE.PlaneGeometry(width-200, depth-200), grassMat);

            const hole = new THREE.Path(); hole.absarc(0, 0, 300, 0, Math.PI*2, false); f2Geo.holes.push(hole);
            const f2 = new THREE.Mesh(new THREE.ShapeGeometry(f2Geo), fMat); f2.rotation.x = -Math.PI/2; f2.position.y = 100; grp.add(f2);
            
            stationAreas.push({ type: 'rect', x: x, z: z, angle: rot, width: width, depth: depth, y: baseY + 100, holeRadius: 300 });
            stationAreas.push({ type: 'rect', x: x, z: z, angle: rot, width: width, depth: depth, y: baseY + 10.5 }); 

            // 屋上の空中庭園ドーム群
            for(let i=0; i<3; i++) {
                const dx = -400 + i*400;

            // 直線スロープ (1F -> 2F)

            slopeMesh.position.set(400, 55.25, 0); 
            slopeMesh.rotation.x = -Math.atan2(slopeH, slopeLen);
            grp.add(slopeMesh);

            const slopeWorldPt = new THREE.Vector3(400, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), rot).add(new THREE.Vector3(x, 0, z));
            stationAreas.push({ type: 'slope_rect', x: slopeWorldPt.x, z: slopeWorldPt.z, angle: rot, width: slopeWid, depth: slopeLen, bottomY: baseY + 10.5, topY: baseY + 100 });

            const createDisplay = (dx, dy, dz, label) => {

                const counter = new THREE.Mesh(new THREE.BoxGeometry(150, 5, 30), new THREE.MeshStandardMaterial({color: 0x113344, transparent:true, opacity:0.9}));
                counter.position.y = 2.5; area.add(counter);
                for(let i=0; i<3; i++) {

        function setupInputHandlers() {
            window.addEventListener('keydown', e => {

                        if (chatInput.value.trim() !== '') { if (socket) socket.emit('chatMessage', chatInput.value); chatInput.value = ''; }
                        chatInput.blur(); 
                    } else chatInput.focus(); return; 
                }
                if (document.activeElement !== chatInput) keysPressed[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
            
            document.getElementById('canvas-container').addEventListener('mousedown', () => { if (!isGameFocus) { try { document.body.requestPointerLock(); } catch(e){} } });
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            document.addEventListener('mousemove', e => {
                if (isLocked && !isGameFocus) {
                    cameraYaw -= e.movementX * 0.002; cameraPitch -= e.movementY * 0.002;
                    cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                }
            });
            window.addEventListener('resize', () => {
                if(camera && renderer){
                    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!camera || !renderer) return;

            frameCount++;
            const nowTime = performance.now();
            if (nowTime - lastFpsTime >= 1000) { document.getElementById('ui-fps').innerText = frameCount; frameCount = 0; lastFpsTime = nowTime; }

            const delta = Math.min(clock.getDelta(), 0.1);
            const nowSec = Date.now() / 1000;

            const vPressed = keysPressed['v'];
            if (vPressed && !vKeyWasPressed && !isGameFocus) { isFPS = !isFPS; updateAvatarMesh(localAvatar, myData); localAvatar.visible = !isFPS; }
            vKeyWasPressed = vPressed;

            const fPressed = keysPressed['f']; let tryInteract = fPressed && !fKeyWasPressed; fKeyWasPressed = fPressed;
            const isFlyMode = document.getElementById('admin-fly') && document.getElementById('admin-fly').checked;

            if (craneGameData.state === 'moving') {
                craneGameData.clawPos += 45 * delta * (Math.sin(nowSec * 5) > 0 ? 1 : -1);
                craneGameData.clawPos = Math.max(-30, Math.min(30, craneGameData.clawPos));
                if (craneGameData.armMesh) craneGameData.armMesh.position.x = craneGameData.clawPos;
            }

            stationAreas.forEach(area => {
                if (area.type === 'effect_cube') {
                    area.mesh.position.y -= area.mesh.userData.fallSpeed * delta;
                    area.mesh.rotation.x += delta; area.mesh.rotation.y += delta;
                    if (area.mesh.position.y < BASE_Y - 200) area.mesh.position.y = BASE_Y + 2000;
                }
            });

            const TRAIN_BASE_SPEED = 0.05; 
            trains.forEach(t => {
                if (t.state === 'moving') {
                    t.progress += TRAIN_BASE_SPEED * delta;
                    if (t.progress >= 1.0) t.progress -= 1.0;
                    
                    const stops = [0.5, 0.1, 0.9];
                    for (let s of stops) {
                        if (Math.abs(t.progress - s) < 0.005) {
                            t.progress = s; t.state = 'stopped'; t.timer = 5.0; break;
                        }
                    }
                } else {
                    t.timer -= delta;
                    if (t.timer <= 0) { t.state = 'moving'; t.progress += 0.01; }
                }

                let pt = new THREE.Vector3(), rotY = 0;
                const curPos = -MAP_RADIUS + (MAP_RADIUS*2) * t.progress;
                if (t.axis === 'x') {
                    pt.set(curPos, BASE_Y + 150, 0); rotY = -Math.PI/2;
                } else if (t.axis === 'z') {
                    pt.set(0, BASE_Y + 150, curPos); rotY = 0;
                }
                
                t.mesh.position.copy(pt); t.mesh.rotation.y = rotY;
            });

            // ドローンの安全帰還（30秒待機）
            personalDrones.forEach((d, i) => {
                let isOccupied = (ridingDrone === d);
                Object.values(otherPlayers).forEach(p => { if (p.userData && p.userData.ridingDroneIndex === i) isOccupied = true; });
                
                if (isOccupied) { d.returnTimer = 0; d.returnState = 'none'; } 
                else if (d.mesh.position.distanceTo(d.initialPos) > 2) {
                    d.returnTimer += delta;
                    if (d.returnTimer > 30) {
                        if (d.returnState === 'none') d.returnState = 'up';
                        
                        if (d.returnState === 'up') {
                            d.mesh.position.y += 100 * delta; if (d.mesh.position.y > BASE_Y + 800) d.returnState = 'move';
                        } else if (d.returnState === 'move') {
                            const target = new THREE.Vector3(d.initialPos.x, d.mesh.position.y, d.initialPos.z);
                            d.mesh.position.lerp(target, 2 * delta);
                            if (d.mesh.position.distanceTo(target) < 5) d.returnState = 'down';
                        } else if (d.returnState === 'down') {
                            d.mesh.position.y -= 100 * delta;
                            if (d.mesh.position.y <= d.initialPos.y) { d.mesh.position.copy(d.initialPos); d.returnState = 'none'; d.returnTimer = 0; }
                        }
                    }
                }
            });

            // インタラクション
            let promptText = "", interactTarget = null;
            if (isGameFocus) {
                promptText = "ゲーム中...";
            } else if (ridingDrone) { 
                promptText = "ドローンから降りる"; if (tryInteract) { ridingDrone = null; playerLocalPos.y += 2; } 
            } else if (ridingTrain) {
                const pt = ridingTrain.mesh.position; playerLocalPos.set(pt.x, pt.y + 2, pt.z); 
                let canAlight = false, nearestStation = null;
                for (let st of stationAreas) { if (st.type === 'rect' && Math.hypot(pt.x - st.x, pt.z - st.z) < 200 && Math.abs(pt.y - st.y) < 200) { canAlight = true; nearestStation = st; break; } }
                if (canAlight) {
                    promptText = "駅で降りる";
                    if (tryInteract) {
                        playerLocalPos.set(nearestStation.x + 50, nearestStation.y + 1.5, nearestStation.z + 50); ridingTrain = null;
                    }
                } else promptText = "走行中... (駅で降りられます)";
            } else if (!isWarping) {
                let foundInteract = false;
                for (let t of trains) {
                    if (t.state === 'stopped' && Math.abs(playerLocalPos.y - t.mesh.position.y) < 40 && playerLocalPos.distanceTo(t.mesh.position) < 100) {
                        promptText = "列車に乗る"; interactTarget = () => { ridingTrain = t; }; foundInteract = true; break;
                    }
                }
                if (!foundInteract) {
                    for (let i = 0; i < personalDrones.length; i++) {
                        const d = personalDrones[i];
                        if (playerLocalPos.distanceTo(d.mesh.position) < 40 && Math.abs(playerLocalPos.y - d.mesh.position.y) < 20) {
                            let isOccupied = false; Object.values(otherPlayers).forEach(p => { if (p.userData && p.userData.ridingDroneIndex === i) isOccupied = true; });
                            if (!isOccupied) {
                                promptText = "ドローンに乗る"; interactTarget = () => { ridingDrone = d; playerLocalPos.copy(d.mesh.position); playerLocalPos.y += 5; }; 
                                foundInteract = true; break;
                            }
                        }
                    }
                }
                if (!foundInteract) {
                    for (let item of interactables) {
                        if (playerLocalPos.distanceTo(item.pos) < item.radius && Math.abs(playerLocalPos.y - item.pos.y) < 30) {
                            promptText = item.label; interactTarget = item.action; break;
                        }
                    }
                }
                if (!foundInteract) {
                    for (let w of warpPads) {
                        if (playerLocalPos.distanceTo(w.mesh.position) < 30 && Math.abs(playerLocalPos.y - w.mesh.position.y) < 20) {
                            promptText = w.label; interactTarget = () => { isWarping = true; playerLocalPos.copy(w.target); setTimeout(() => { isWarping = false; }, 500); };
                            break;
                        }
                    }
                }
                if (interactTarget && tryInteract) interactTarget();
            }

            const promptEl = document.getElementById('interaction-prompt');
            if (promptText) { document.getElementById('prompt-text').innerText = promptText; promptEl.style.display = 'block'; }
            else promptEl.style.display = 'none';

            if (!isWarping && !ridingTrain && !isGameFocus && document.activeElement !== document.getElementById('chat-input')) {
                const speed = (keysPressed['shift'] ? 250 : 100) * myData.speedMult * delta; 
                const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
                const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
                
                let mv = new THREE.Vector3();
                if (keysPressed['w']) mv.add(fwd); if (keysPressed['s']) mv.sub(fwd);
                if (keysPressed['a']) mv.sub(right); if (keysPressed['d']) mv.add(right); 
                if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed);

                let nextPos = new THREE.Vector3(playerLocalPos.x + mv.x, playerLocalPos.y, playerLocalPos.z + mv.z);

                if (ridingDrone || isFlyMode) {
                    let nextY = playerLocalPos.y;
                    if (keysPressed['e']) nextY += 150 * delta; if (keysPressed['q']) nextY -= 150 * delta; 
                    playerLocalPos.set(nextPos.x, nextY, nextPos.z);
                    if(ridingDrone){ ridingDrone.mesh.position.copy(playerLocalPos); ridingDrone.mesh.position.y -= 5; }
                } else {
                    let nextX = nextPos.x;
                    let nextZ = nextPos.z;

                    // 1. 壁(X, Z)のコリジョン判定と滑り処理
                    for (let st of stationAreas) {
                        if (playerLocalPos.y >= st.minY && playerLocalPos.y < st.maxY) {
                            if (st.type === 'solid_circle') {
                                const dist = Math.hypot(nextX - st.x, nextZ - st.z);
                                if (dist < st.radius) {
                                    const angle = Math.atan2(nextZ - st.z, nextX - st.x);
                                    nextX = st.x + Math.cos(angle) * st.radius; 
                                    nextZ = st.z + Math.sin(angle) * st.radius;
                                }
                            } else if (st.type === 'room_circle') {
                                const dist = Math.hypot(nextX - st.x, nextZ - st.z);
                                if (dist > st.radius) {
                                    const angle = Math.atan2(nextZ - st.z, nextX - st.x);
                                    nextX = st.x + Math.cos(angle) * st.radius; 
                                    nextZ = st.z + Math.sin(angle) * st.radius;
                                }
                            } else if (st.type === 'solid_rect' || st.type === 'room_rect') {
                                const dx = nextX - st.x; const dz = nextZ - st.z;
                                const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                                let lx = dx * cos - dz * sin;
                                let lz = dx * sin + dz * cos;
                                const hw = st.width / 2; const hd = st.depth / 2;
                                
                                if (st.type === 'solid_rect') {
                                    if (Math.abs(lx) < hw && Math.abs(lz) < hd) {
                                        const distLeft = lx - (-hw); const distRight = hw - lx;
                                        const distTop = lz - (-hd); const distBottom = hd - lz;
                                        const min = Math.min(distLeft, distRight, distTop, distBottom);
                                        if (min === distLeft) lx = -hw; else if (min === distRight) lx = hw;
                                        else if (min === distTop) lz = -hd; else if (min === distBottom) lz = hd;
                                    }
                                } else if (st.type === 'room_rect') {
                                    if (lx < -hw) lx = -hw; if (lx > hw) lx = hw;
                                    if (lz < -hd) lz = -hd; if (lz > hd) lz = hd;
                                }
                                const rcos = Math.cos(st.angle), rsin = Math.sin(st.angle);
                                nextX = st.x + (lx * rcos - lz * rsin);
                                nextZ = st.z + (lx * rsin + lz * rcos);
                            }
                        }
                    }
                    playerLocalPos.x = nextX;
                    playerLocalPos.z = nextZ;
                }
            }

            // 2. 重力・落下・床判定 (X, Z 確定後)
            if (!ridingDrone && !ridingTrain && !isWarping && !isFlyMode && !isGameFocus) {
                let groundY = -5000; 
                
                if (Math.hypot(playerLocalPos.x, playerLocalPos.z) <= MAP_RADIUS) groundY = GROUND_Y + 1.5; 
                
                for (let st of stationAreas) {
                    if (st.type === 'floor_circle' && Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z) < st.radius && Math.abs(playerLocalPos.y - st.y) < 40) {
                        if (st.y > groundY) groundY = st.y; 
                    }
                    if (st.type === 'floor_rect' && Math.abs(playerLocalPos.y - st.y) < 40) {
                        const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                        const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                        const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                        if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { 
                            if (st.holeRadius && Math.hypot(lx, lz) < st.holeRadius) continue;
                            if (st.y > groundY) groundY = st.y; 
                        }
                    }
                    if (st.type === 'floor_ring') {
                        const dist = Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z);
                        if (dist >= st.innerRadius && dist <= st.outerRadius && Math.abs(playerLocalPos.y - st.y) < 40) {
                            if (st.y > groundY) groundY = st.y;
                        }
                    }
                    if (st.type === 'wall' && playerLocalPos.y >= st.baseY && playerLocalPos.y < st.baseY + st.height) {
                        const dist = Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z);
                        if (dist < st.radius + 5) {
                            const angle = Math.atan2(playerLocalPos.z - st.z, playerLocalPos.x - st.x);
                            playerLocalPos.x = st.x + Math.cos(angle) * (st.radius + 5); 
                            playerLocalPos.z = st.z + Math.sin(angle) * (st.radius + 5);
                        }
                    }
                    if (st.type === 'slope_rect') {
                        const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                        const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                        const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                        if (Math.abs(lx) < st.width/2 && Math.abs(lz) < st.depth/2) {
                            const progress = (lz + st.depth/2) / st.depth; 
                            const sy = st.bottomY + progress * (st.topY - st.bottomY);
                            if (Math.abs(playerLocalPos.y - sy) < 50 && sy > groundY) groundY = sy;
                        }
                    }
                }

                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 150 * delta; 
                    playerLocalPos.y += playerVelocityY * delta;
                    if (playerLocalPos.y <= groundY) { playerLocalPos.y = groundY; playerVelocityY = 0; }
                } else { playerLocalPos.y = groundY; playerVelocityY = 0; }

                if (playerLocalPos.y < GROUND_Y - 200) { 
                    playerLocalPos.set(0, BASE_Y + 1.5, 300); 
                    playerVelocityY = 0; 
                    addChatMessage("SYSTEM", "島から落下したため、高架へ転送されました。"); 
                }
            }

            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos); localAvatar.visible = !isFPS && !isGameFocus;
                if (ridingTrain) localAvatar.rotation.y = ridingTrain.mesh.rotation.y;
                else if (!isWarping && !ridingDrone && !isGameFocus && document.activeElement !== document.getElementById('chat-input')) {
                    if (keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d']) {
                        let targetYaw = cameraYaw;
                        if (keysPressed['s']) targetYaw += Math.PI; else if (keysPressed['a']) targetYaw += Math.PI/2; else if (keysPressed['d']) targetYaw -= Math.PI/2;
                        localAvatar.rotation.y = targetYaw;
                    } else localAvatar.rotation.y = cameraYaw;
                }

                if (socket) {
                    const distSq = lastSentPos.distanceToSquared(playerLocalPos);
                    const rotDiff = Math.abs(lastSentRot - localAvatar.rotation.y);
                    if (distSq > 0.1 || rotDiff > 0.1) {
                        socket.emit('playerMovement', { 
                            x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, rotation: localAvatar.rotation.y,
                            ridingTrainIndex: ridingTrain ? trains.indexOf(ridingTrain) : -1, ridingDroneIndex: ridingDrone ? personalDrones.indexOf(ridingDrone) : -1
                        });
                        lastSentPos.copy(playerLocalPos); lastSentRot = localAvatar.rotation.y;
                    }
                }
            }

            Object.values(otherPlayers).forEach(mesh => {
                if (mesh.userData && mesh.userData.ridingTrainIndex >= 0) {
                    const t = trains[mesh.userData.ridingTrainIndex];
                    if (t) { mesh.position.set(t.mesh.position.x, t.mesh.position.y + 2, t.mesh.position.z); mesh.rotation.y = t.mesh.rotation.y; }
                }
                if (mesh.userData && mesh.userData.ridingDroneIndex >= 0) {
                    const d = personalDrones[mesh.userData.ridingDroneIndex];
                    if (d) { d.mesh.position.copy(mesh.position); d.mesh.position.y -= 5; }
                }
            });

            if (isGameFocus && gameCameraTarget && gameLookAt) {
                camera.position.lerp(gameCameraTarget, 5 * delta);
                const targetRot = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(camera.position, gameLookAt, camera.up));
                camera.quaternion.slerp(targetRot, 5 * delta);
            } else {
                const camTarget = playerLocalPos.clone();
                if (isFPS) { camera.position.copy(camTarget); camera.position.y += 1.6 * 2.5 * myData.bodyScale.y; } 
                else {
                    const offset = new THREE.Vector3(Math.sin(cameraYaw)*45, 25 + Math.sin(cameraPitch)*25, Math.cos(cameraYaw)*45);
                    camera.position.copy(camTarget).add(offset); camTarget.y += 5; 
                }
                const lookDir = new THREE.Vector3(-Math.sin(cameraYaw) * Math.cos(cameraPitch), Math.sin(cameraPitch), -Math.cos(cameraYaw) * Math.cos(cameraPitch));
                camera.lookAt(camera.position.clone().add(lookDir));
            }

            if(minimapCtx) {
                minimapCtx.clearRect(0, 0, 180, 180);
                minimapCtx.fillStyle = '#00ffff'; minimapCtx.beginPath(); minimapCtx.arc(90, 90, 5, 0, Math.PI*2); minimapCtx.fill();
                minimapCtx.strokeStyle = 'rgba(136, 204, 255, 0.4)'; minimapCtx.lineWidth = 1;
                minimapCtx.beginPath(); minimapCtx.arc(90, 90, (1000/MAP_RADIUS)*90, 0, Math.PI*2); minimapCtx.stroke();
                const px = 90 + (playerLocalPos.x / MAP_RADIUS) * 90; const py = 90 + (playerLocalPos.z / MAP_RADIUS) * 90;
                minimapCtx.fillStyle = '#ff0055'; minimapCtx.beginPath(); minimapCtx.arc(px, py, 4, 0, Math.PI*2); minimapCtx.fill();
                minimapCtx.strokeStyle = '#ff0055'; minimapCtx.lineWidth = 2; minimapCtx.beginPath(); minimapCtx.moveTo(px, py); minimapCtx.lineTo(px - Math.sin(cameraYaw)*10, py - Math.cos(cameraYaw)*10); minimapCtx.stroke();
            }
            renderer.render(scene, camera);
        }
    </script>
