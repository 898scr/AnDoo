<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse - Cyberpunk Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #020108; color: #fff; }
        
        /* ログイン画面 */
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1a0b2e 0%, #020108 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(10, 10, 25, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 40px rgba(0, 255, 255, 0.3); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px #00ffff;}
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ff00ff; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; transition: 0.3s;}
        .panel input:focus { box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0088ff); color: #000; } .btn-primary:hover { box-shadow: 0 0 20px #00ffff; }
        .btn-success { background: transparent; border: 1px solid #ff00ff !important; color: #ff00ff; } .btn-success:hover { background: rgba(255,0,255,0.2); box-shadow: 0 0 20px #ff00ff; }
        .error-msg { color: #ff0055; font-size: 0.9rem; text-align: center; min-height: 20px; }

        /* サイドバー */
        #sidebar { display: none; position: absolute; top: 0; left: 0; width: 280px; height: 100vh; background: linear-gradient(180deg, rgba(10,10,25,0.9) 0%, rgba(0,0,0,0.8) 100%); border-right: 1px solid #00ffff; z-index: 10; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 20px; box-shadow: 5px 0 20px rgba(0,255,255,0.1);}
        .sidebar-section { border-bottom: 1px solid rgba(0,255,255,0.3); padding-bottom: 15px; }
        .sidebar-section h3 { margin: 0 0 10px 0; font-size: 0.85rem; color: #ff00ff; text-transform: uppercase; letter-spacing: 1px;}
        .user-email { font-size: 1.2rem; font-weight: bold; color: #fff; word-break: break-all; text-shadow: 0 0 5px #fff;}
        .money { font-size: 1.8rem; color: #00ffff; font-weight: bold; margin-top: 5px; text-shadow: 0 0 10px #00ffff;}
        .area-name { font-size: 1.1rem; color: #fff; font-weight: bold; display: flex; align-items: center; gap: 8px;}

        /* インタラクションUI (Eキー) */
        #interaction-prompt { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 1px solid #00ffff; padding: 10px 25px; border-radius: 30px; color: #00ffff; font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 10px #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.3); z-index: 20; display: none; pointer-events: none; transition: opacity 0.2s;}
        .key-btn { display: inline-block; background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; font-family: monospace;}

        /* ブティックUI */
        #boutique-panel { position: absolute; right: 20px; top: 20px; z-index: 10; background: rgba(10, 10, 25, 0.95); padding: 20px; border-radius: 12px; width: 260px; display: none; border: 1px solid #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
        #boutique-panel h3 { color: #00ffff; margin-top: 0; text-transform: uppercase; text-shadow: 0 0 10px #00ffff;}
        .color-picker-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem;}
        .color-picker-group input[type="color"] { background: none; border: none; cursor: pointer; height: 30px; width: 40px; padding: 0;}
        .accessory-select { width: 100%; padding: 8px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #00ffff; border-radius: 4px; outline: none; margin-top: 5px;}

        /* 通知 */
        #notification-container { position: absolute; top: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { padding: 12px 20px; border-radius: 8px; font-weight: bold; background: rgba(10,10,25,0.9); border-left: 4px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); animation: slideIn 0.3s ease-out forwards, fadeOut 0.5s ease-in 3.5s forwards; opacity: 0; transform: translateX(100%); }
        .toast.success { border-color: #00ffff; color: #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.2);}
        .toast.error { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.2);}
        .toast.info { border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.2);}
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } } @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }

        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <div id="auth-error" class="error-msg"></div>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button class="btn-primary" onclick="attemptAuth('/api/login')">ENTER SYSTEM</button>
            <button class="btn-success" onclick="attemptAuth('/api/register')">REGISTER</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-section">
            <h3>Identity</h3>
            <div class="user-email" id="ui-username">---</div>
            <div class="money">CREDIT: <span id="ui-money">0</span></div>
            <div class="money" style="font-size:1.1rem; color:#fff; text-shadow: none;">STOCK: <span id="ui-stocks">0</span></div>
        </div>
        <div class="sidebar-section">
            <h3>Location</h3>
            <div class="area-name" id="ui-area">📍 SECTOR-01</div>
            <p style="font-size: 0.75rem; color:#888; margin-top:5px;">WASD: Move / Mouse: Look</p>
        </div>
    </div>

    <div id="interaction-prompt"><span class="key-btn">E</span><span id="prompt-text">アクション</span></div>

    <div id="boutique-panel">
        <h3>Cyber Avatar</h3>
        <div class="color-picker-group"><label>Suit</label><input type="color" id="color-body" value="#00ffff" onchange="updateAvatarConfig()"></div>
        <div class="color-picker-group"><label>Skin</label><input type="color" id="color-skin" value="#ffcc99" onchange="updateAvatarConfig()"></div>
        <div class="color-picker-group"><label>Visor</label><input type="color" id="color-visor" value="#ff00ff" onchange="updateAvatarConfig()"></div>
        <div class="color-picker-group"><label>ID Color</label><input type="color" id="color-name" value="#ffffff" onchange="updateAvatarConfig()"></div>
        <div style="margin-top: 10px;">
            <label style="font-size:0.9rem;">Hardware</label>
            <select id="select-accessory" class="accessory-select" onchange="updateAvatarConfig()">
                <option value="none">None</option>
                <option value="headphones">Audio Gear</option>
                <option value="cyberGlasses">Holo Visor</option>
                <option value="catEars">Neko Ears</option>
                <option value="hat">Top Hat</option>
            </select>
        </div>
    </div>

    <div id="notification-container"></div>
    <div id="canvas-container"></div>

    <script>
        let currentUsername = null, socket = null, adminSpeedMult = 1.0;
        let scene, camera, renderer, clock;
        const otherPlayers = {};
        let localPlayerMesh = null;
        
        // 物理演算（超高速グリッド衝突判定）
        const gridCollisions = {};
        const GRID_SIZE = 100;
        
        function addCollisionBox(x, z, width, depth) {
            const minX = x - width/2, maxX = x + width/2, minZ = z - depth/2, maxZ = z + depth/2;
            for(let gx = Math.floor(minX/GRID_SIZE); gx <= Math.floor(maxX/GRID_SIZE); gx++) {
                for(let gz = Math.floor(minZ/GRID_SIZE); gz <= Math.floor(maxZ/GRID_SIZE); gz++) {
                    const key = `${gx},${gz}`;
                    if (!gridCollisions[key]) gridCollisions[key] = [];
                    gridCollisions[key].push({ minX, maxX, minZ, maxZ });
                }
            }
        }

        function getCollision(x, z, r = 1.5) {
            const gx = Math.floor(x/GRID_SIZE), gz = Math.floor(z/GRID_SIZE);
            const boxes = gridCollisions[`${gx},${gz}`];
            if (boxes) {
                for(let b of boxes) {
                    if (x+r > b.minX && x-r < b.maxX && z+r > b.minZ && z-r < b.maxZ) return true;
                }
            }
            return false;
        }

        const warps = [];
        function addWarp(x, y, z, targetX, targetY, targetZ, label, color) {
            const group = new THREE.Group();
            const ring = new THREE.Mesh(new THREE.RingGeometry(3, 4, 32), new THREE.MeshBasicMaterial({color: color, side: THREE.DoubleSide, transparent:true, opacity:0.8}));
            ring.rotation.x = Math.PI/2;
            group.add(ring);
            const beam = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 20, 16, 1, true), new THREE.MeshBasicMaterial({color: color, transparent:true, opacity:0.2, side: THREE.DoubleSide, blending: THREE.AdditiveBlending}));
            beam.position.y = 10;
            group.add(beam);
            group.position.set(x, y+0.1, z);
            scene.add(group);
            warps.push({x, y, z, targetX, targetY, targetZ, label});
        }

        function showNotification(type, text) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div'); toast.className = `toast ${type}`; toast.innerText = text;
            container.appendChild(toast); setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 4000);
        }

        function createNameLabel(name, color) {
            const cvs = document.createElement('canvas'); cvs.width = 512; cvs.height = 128; const ctx = cvs.getContext('2d');
            ctx.font = 'bold 72px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 12; ctx.strokeStyle = '#000000'; ctx.strokeText(name, 256, 64);
            ctx.fillStyle = color; ctx.fillText(name, 256, 64);
            const tex = new THREE.CanvasTexture(cvs);
            const spriteMat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(3, 0.75, 1); 
            sprite.position.y = 5.5; 
            sprite.renderOrder = 999; 
            return sprite;
        }

        function createAvatarMesh(config) {
            const grp = new THREE.Group();
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1), new THREE.MeshStandardMaterial({ color: config.body, metalness:0.3, roughness:0.7 })).translateY(1.0)); 
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: config.skin })).translateY(2.6)); 
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: config.visor })).translateY(2.7).translateZ(0.55)); 
            
            if (config.accessory === 'hat') {
                grp.add(new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x111 })).translateY(3.3));
                grp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x111 })).translateY(4.0));
            } else if (config.accessory === 'catEars') {
                const ear = new THREE.MeshStandardMaterial({ color: config.body }), geo = new THREE.ConeGeometry(0.3, 0.8, 4);
                const e1 = new THREE.Mesh(geo, ear); e1.position.set(-0.4, 3.4, 0); e1.rotation.z = Math.PI/8;
                const e2 = new THREE.Mesh(geo, ear); e2.position.set(0.4, 3.4, 0); e2.rotation.z = -Math.PI/8;
                grp.add(e1, e2);
            } else if (config.accessory === 'headphones') {
                const hpMat = new THREE.MeshStandardMaterial({ color: 0x222, metalness:0.8 });
                const pad = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16); pad.rotateZ(Math.PI/2);
                const p1 = new THREE.Mesh(pad, hpMat); p1.position.set(0.65, 2.6, 0);
                const p2 = new THREE.Mesh(pad, hpMat); p2.position.set(-0.65, 2.6, 0);
                const band = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.1, 8, 16, Math.PI), hpMat); band.position.set(0, 2.6, 0);
                grp.add(p1, p2, band);
            } else if (config.accessory === 'cyberGlasses') {
                const glassMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });
                const g = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.4, 0.1), glassMat); g.position.set(0, 2.7, 0.65);
                grp.add(g);
            }
            return grp;
        }

        function updateAvatarConfig() {
            const cfg = { body: document.getElementById('color-body').value, skin: document.getElementById('color-skin').value, visor: document.getElementById('color-visor').value, nameColor: document.getElementById('color-name').value, accessory: document.getElementById('select-accessory').value };
            socket.emit('changeAvatarConfig', cfg);
        }

        // 画像のような完璧な放射状と環状の都市構造を作る
        const RING_INNER = 500;
        const RING_OUTER = 1100;
        const LM_DIST = 1100; // Landmark distance from center

        const landmarkCenters = [
            {x: LM_DIST*Math.cos(Math.PI/4), z: LM_DIST*Math.sin(Math.PI/4), type: 'mall', name: "Shopping Mall"},
            {x: LM_DIST*Math.cos(3*Math.PI/4), z: LM_DIST*Math.sin(3*Math.PI/4), type: 'dome', name: "Entertainment Dome"},
            {x: LM_DIST*Math.cos(-3*Math.PI/4), z: LM_DIST*Math.sin(-3*Math.PI/4), type: 'security', name: "Security Center"},
            {x: LM_DIST*Math.cos(-Math.PI/4), z: LM_DIST*Math.sin(-Math.PI/4), type: 'exchange', name: "Stock Exchange"}
        ];

        function isOnRoad(x, z) {
            let r = Math.hypot(x, z);
            if (r < 250) return true; // Central Plaza
            if (Math.abs(r - RING_INNER) < 50) return true;
            if (Math.abs(r - RING_OUTER) < 60) return true;
            
            // 8 Radial Roads
            let angle = Math.atan2(z, x) * 180 / Math.PI;
            let modAngle = Math.abs(angle % 45);
            if (modAngle > 22.5) modAngle = 45 - modAngle;
            let distToRadial = r * Math.sin(modAngle * Math.PI / 180);
            if (distToRadial < 40) return true;
            
            return false;
        }

        function inLandmarkZone(x, z) {
            for(let lm of landmarkCenters) {
                if (Math.hypot(x - lm.x, z - lm.z) < 220) return true;
            }
            return false;
        }

        function buildCity() {
            const matDark = new THREE.MeshStandardMaterial({color: 0x050508, roughness: 0.9});
            const matGlass = new THREE.MeshStandardMaterial({color: 0x111115, roughness: 0.1, metalness: 0.8});
            
            const bGeo = new THREE.BoxGeometry(1,1,1);
            const nGeo = new THREE.BoxGeometry(1,1,1);
            
            const bData = [], nCyan = [], nPink = [];
            
            // Generate standard buildings
            for(let x = -1500; x <= 1500; x += 60) {
                for(let z = -1500; z <= 1500; z += 60) {
                    if(Math.hypot(x, z) > 1500) continue;
                    if(isOnRoad(x, z)) continue;
                    if(inLandmarkZone(x, z)) continue;
                    
                    let h = 40 + Math.random() * 120;
                    if (Math.hypot(x,z) < 400) h += 80;
                    
                    bData.push({x: x, y: h/2, z: z, sx: 45, sy: h, sz: 45});
                    addCollisionBox(x, z, 45, 45);
                    
                    // Add Cyber Neon Strips
                    if(Math.random() > 0.4 && h > 60) {
                        if(Math.random() > 0.5) {
                            nCyan.push({x: x+22.6, y: h/2, z: z, sx: 1, sy: h*0.8, sz: 6});
                        } else {
                            nPink.push({x: x, y: h/2, z: z+22.6, sx: 6, sy: h*0.8, sz: 1});
                        }
                    }
                }
            }

            // Instanced Meshes
            const dummy = new THREE.Object3D();
            const buildInstanced = (geo, mat, data) => {
                const mesh = new THREE.InstancedMesh(geo, mat, data.length);
                data.forEach((d, i) => {
                    dummy.position.set(d.x, d.y, d.z); dummy.scale.set(d.sx, d.sy, d.sz);
                    dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
                });
                scene.add(mesh);
            };
            
            buildInstanced(bGeo, matDark, bData);
            buildInstanced(nGeo, new THREE.MeshBasicMaterial({color: 0x00ffff}), nCyan);
            buildInstanced(nGeo, new THREE.MeshBasicMaterial({color: 0xff00ff}), nPink);

            // 1. Central Tower (0,0)
            const cGroup = new THREE.Group();
            cGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(150, 200, 100, 16), matDark).translateY(50));
            cGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(80, 120, 500, 16), matGlass).translateY(350));
            // Glow beam to space
            const beam = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 4000, 16), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending}));
            beam.position.y = 2000; cGroup.add(beam);
            scene.add(cGroup);
            addCollisionBox(0,0, 250, 250);
            
            // Warp into Central Tower
            addWarp(0, 0, 180, 0, 300, 0, "展望タワーへ", 0x00ffff);
            addWarp(0, 300, 30, 0, 0, 200, "地上へ戻る", 0xff00ff);
            
            // Tower Interior/Observation deck
            const obs = new THREE.Mesh(new THREE.CylinderGeometry(100, 100, 10, 32), new THREE.MeshStandardMaterial({color: 0x222222, side: THREE.DoubleSide}));
            obs.position.set(0, 299, 0); scene.add(obs);

            // 2. Outer Landmarks
            landmarkCenters.forEach(lm => {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(new THREE.BoxGeometry(200, 40, 200), matDark).translateY(20));
                
                if (lm.type === 'mall') {
                    g.add(new THREE.Mesh(new THREE.SphereGeometry(60, 16, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true})).translateY(40));
                    addWarp(lm.x, 0, lm.z+120, 5000, 2, 0, "モール内へ", 0xff00ff);
                } else if (lm.type === 'exchange') {
                    g.add(new THREE.Mesh(new THREE.BoxGeometry(100, 80, 100), matGlass).translateY(80));
                    addWarp(lm.x, 0, lm.z+120, 6000, 2, 0, "取引所へ", 0xffff00);
                } else if (lm.type === 'dome') {
                    g.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe: true})).translateY(40));
                } else if (lm.type === 'security') {
                    g.add(new THREE.Mesh(new THREE.BoxGeometry(250, 10, 250), matDark).translateY(100));
                }
                
                g.position.set(lm.x, 0, lm.z);
                scene.add(g);
                addCollisionBox(lm.x, lm.z, 200, 200);
            });

            // 3. Interiors (far away)
            // Mall Interior
            const mallInt = new THREE.Group();
            mallInt.add(new THREE.Mesh(new THREE.BoxGeometry(200, 60, 200), new THREE.MeshStandardMaterial({color: 0x111111, side: THREE.BackSide})).translateY(30));
            mallInt.add(new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color: 0x222222})).rotateX(-Math.PI/2));
            const boutique = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshBasicMaterial({color: 0x000055}));
            boutique.rotation.x = -Math.PI/2; boutique.position.set(0, 0.1, -50); mallInt.add(boutique);
            mallInt.position.set(5000, 0, 0); scene.add(mallInt);
            addWarp(5000, 2, 80, landmarkCenters[0].x, 0, landmarkCenters[0].z+140, "外へ戻る", 0x00ffff);

            // Exchange Interior
            const exInt = new THREE.Group();
            exInt.add(new THREE.Mesh(new THREE.BoxGeometry(150, 50, 150), new THREE.MeshStandardMaterial({color: 0x111111, side: THREE.BackSide})).translateY(25));
            exInt.add(new THREE.Mesh(new THREE.PlaneGeometry(150,150), new THREE.MeshStandardMaterial({color: 0x333333})).rotateX(-Math.PI/2));
            const screen = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.MeshBasicMaterial({color: 0x00ff00, wireframe: true}));
            screen.position.set(0, 20, -74); exInt.add(screen);
            exInt.position.set(6000, 0, 0); scene.add(exInt);
            addWarp(6000, 2, 60, landmarkCenters[3].x, 0, landmarkCenters[3].z+140, "外へ戻る", 0x00ffff);
        }

        const trains = [];
        function createTrainMesh() {
            const grp = new THREE.Group();
            const matDark = new THREE.MeshStandardMaterial({color: 0x111111});
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(10, 1, 30), matDark)); // floor
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(10, 1, 30), matDark).translateY(10)); // roof
            
            const glass = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide});
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 9, 30), glass).translateY(5).translateX(-4.8));
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 9, 10), glass).translateY(5).translateX(4.8).translateZ(10));
            grp.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 9, 10), glass).translateY(5).translateX(4.8).translateZ(-10));
            
            const nose = new THREE.Mesh(new THREE.ConeGeometry(5, 8, 16), matDark);
            nose.rotation.x = Math.PI/2;
            grp.add(nose.clone().translateZ(19).translateY(5));
            grp.add(nose.clone().rotateX(Math.PI).translateZ(-19).translateY(5));
            return grp;
        }

        function initTrains() {
            const trackMat = new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.8});
            
            // Inner Loop
            scene.add(new THREE.Mesh(new THREE.TorusGeometry(RING_INNER, 2, 8, 128), trackMat).setRotationFromEuler(new THREE.Euler(Math.PI/2,0,0)).translateZ(-58));
            for(let i=0; i<2; i++) {
                let mesh = createTrainMesh(); scene.add(mesh);
                trains.push({ r: RING_INNER, y: 60, angle: i*Math.PI, speed: 0.25, state: 'moving', timer: 0, mesh: mesh });
            }
            
            // Outer Loop
            scene.add(new THREE.Mesh(new THREE.TorusGeometry(RING_OUTER, 2, 8, 256), trackMat).setRotationFromEuler(new THREE.Euler(Math.PI/2,0,0)).translateZ(-88));
            for(let i=0; i<4; i++) {
                let mesh = createTrainMesh(); scene.add(mesh);
                trains.push({ r: RING_OUTER, y: 90, angle: i*Math.PI/2, speed: 0.15, state: 'moving', timer: 0, mesh: mesh });
            }

            // Stations & Warps
            for(let i=0; i<4; i++) {
                let a = i * Math.PI/2;
                // Inner stations
                let ix = RING_INNER * Math.cos(a), iz = RING_INNER * Math.sin(a);
                addWarp(ix, 0, iz, ix+10, 60, iz+10, "プラットフォームへ", 0x00ffff);
                addWarp(ix+10, 60, iz+10, ix, 0, iz, "地上へ", 0xff00ff);
                
                // Outer stations
                let ox = RING_OUTER * Math.cos(a), oz = RING_OUTER * Math.sin(a);
                addWarp(ox, 0, oz, ox+10, 90, oz+10, "プラットフォームへ", 0x00ffff);
                addWarp(ox+10, 90, oz+10, ox, 0, oz, "地上へ", 0xff00ff);
            }
        }

        const drones = [];
        function initDrones() {
            const geo = new THREE.BoxGeometry(4, 1, 6);
            const mat = new THREE.MeshBasicMaterial({color: 0x00ffff});
            for(let i=0; i<50; i++) {
                let d = new THREE.Mesh(geo, mat);
                d.position.set((Math.random()-0.5)*3000, 100+Math.random()*400, (Math.random()-0.5)*3000);
                d.userData = { speed: 50 + Math.random()*100, angle: Math.random()*Math.PI*2 };
                scene.add(d);
                drones.push(d);
            }
        }

        async function attemptAuth(endpoint) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            // mock network delay
            setTimeout(() => {
                currentUsername = username;
                document.getElementById('ui-username').innerText = currentUsername;
                startGame();
            }, 500);
        }

        function startGame() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            
            // Mock socket
            socket = { on: ()=>{}, emit: ()=>{} }; 
            
            initThreeJS();
        }

        // カメラ制御変数
        let cameraYaw = 0, cameraPitch = 0.2;
        let isDragging = false, prevMouse = {x:0, y:0};
        const keysPressed = {};

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020108); // 漆黒の宇宙
            scene.fog = new THREE.FogExp2(0x1a0b2e, 0.0008); // ダークパープルの霧

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // サイバーパンク・ライティング
            scene.add(new THREE.AmbientLight(0x111122, 1.0));
            const hemi = new THREE.HemisphereLight(0x00ffff, 0xff00ff, 0.8);
            hemi.position.set(0, 500, 0);
            scene.add(hemi);
            
            // Ground
            const ground = new THREE.Mesh(new THREE.CylinderGeometry(1500, 1000, 800, 64), new THREE.MeshStandardMaterial({color: 0x050505}));
            ground.position.y = -400.1; scene.add(ground);
            
            // Cyber Grid
            const grid = new THREE.GridHelper(3000, 150, 0x00ffff, 0x003333);
            grid.position.y = 0.1; scene.add(grid);

            // Particles (Stars/Dust)
            const pts = new Float32Array(10000 * 3);
            for(let i=0; i<30000; i++) pts[i] = (Math.random()-0.5)*4000;
            const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
            const pMat = new THREE.PointsMaterial({color: 0xffffff, size: 2, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending});
            scene.add(new THREE.Points(pGeo, pMat));

            // Generate World
            buildCity();
            initTrains();
            initDrones();

            // Setup Player
            localPlayerMesh = createAvatarMesh({ body: '#00ffff', skin: '#ffcc99', visor: '#ff00ff', nameColor: '#ffffff', accessory: 'none' });
            localPlayerMesh.position.set(0, 0, 100);
            localPlayerMesh.add(createNameLabel(currentUsername, '#ffffff'));
            scene.add(localPlayerMesh);

            clock = new THREE.Clock();

            // Controls
            window.addEventListener('keydown', e => keysPressed[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
            
            renderer.domElement.addEventListener('mousedown', () => isDragging = true);
            renderer.domElement.addEventListener('mouseup', () => isDragging = false);
            renderer.domElement.addEventListener('mousemove', (e) => {
                if(isDragging) {
                    cameraYaw -= (e.clientX - prevMouse.x) * 0.005;
                    cameraPitch -= (e.clientY - prevMouse.y) * 0.005;
                    cameraPitch = Math.max(0.1, Math.min(Math.PI/2 - 0.1, cameraPitch)); 
                }
                prevMouse = {x: e.clientX, y: e.clientY};
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const p = localPlayerMesh.position;

            // Update Drones
            for(let d of drones) {
                d.position.x += Math.cos(d.userData.angle) * d.userData.speed * delta;
                d.position.z += Math.sin(d.userData.angle) * d.userData.speed * delta;
                d.rotation.y = -d.userData.angle;
                if(Math.hypot(d.position.x, d.position.z) > 1600) d.userData.angle += Math.PI;
            }

            // Update Trains & Handle Riding
            let isRiding = false;
            for(let train of trains) {
                if(train.state === 'moving') {
                    train.angle += train.speed * delta;
                    let mod = train.angle % (Math.PI/2);
                    if(mod < train.speed*delta || mod > (Math.PI/2)-train.speed*delta) {
                        train.angle = Math.round(train.angle / (Math.PI/2)) * (Math.PI/2);
                        train.state = 'stopped'; train.timer = 5.0;
                    }
                } else {
                    train.timer -= delta;
                    if(train.timer <= 0) train.state = 'moving';
                }
                
                let nextX = train.r * Math.cos(train.angle);
                let nextZ = train.r * Math.sin(train.angle);
                
                // If player is inside train
                if(Math.abs(p.y - train.y) < 5 && Math.hypot(p.x - train.mesh.position.x, p.z - train.mesh.position.z) < 15) {
                    isRiding = true;
                    p.x += (nextX - train.mesh.position.x);
                    p.z += (nextZ - train.mesh.position.z);
                    // Add rotational centrifugal force offset
                    if(train.state === 'moving') localPlayerMesh.rotation.y -= (train.speed * delta);
                }
                
                train.mesh.position.set(nextX, train.y, nextZ);
                train.mesh.rotation.y = -train.angle; // Face tangent
            }

            // Player Movement (TPS relative to camera)
            if(!isRiding) {
                const speed = keysPressed['shift'] ? 45 : 15;
                const forward = new THREE.Vector3(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
                const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
                let move = new THREE.Vector3();
                
                if(keysPressed['w'] || keysPressed['arrowup']) move.add(forward);
                if(keysPressed['s'] || keysPressed['arrowdown']) move.sub(forward);
                if(keysPressed['a'] || keysPressed['arrowleft']) move.sub(right); // A = left
                if(keysPressed['d'] || keysPressed['arrowright']) move.add(right); // D = right
                
                if(move.lengthSq() > 0) {
                    move.normalize();
                    let nextX = p.x + move.x * speed * delta;
                    let nextZ = p.z + move.z * speed * delta;
                    
                    if(!getCollision(nextX, p.z)) p.x = nextX;
                    if(!getCollision(p.x, nextZ)) p.z = nextZ;
                    
                    localPlayerMesh.rotation.y = Math.atan2(move.x, move.z);
                }
            }

            // Interactable Warps
            let activeWarp = null;
            for(let w of warps) {
                if(Math.hypot(p.x - w.x, p.z - w.z) < 4 && Math.abs(p.y - w.y) < 3) {
                    activeWarp = w; break;
                }
            }
            if(activeWarp) {
                document.getElementById('interaction-prompt').style.display = 'block';
                document.getElementById('prompt-text').innerText = activeWarp.label;
                if(keysPressed['e']) {
                    p.set(activeWarp.targetX, activeWarp.targetY, activeWarp.targetZ);
                    keysPressed['e'] = false;
                }
            } else {
                document.getElementById('interaction-prompt').style.display = 'none';
            }

            // UI Zone updates
            if (p.x > 4900 && p.x < 5100 && p.z < 100 && p.z > -100) {
                document.getElementById('boutique-panel').style.display = 'block';
                document.getElementById('ui-area').innerText = '📍 BOUTIQUE';
            } else {
                document.getElementById('boutique-panel').style.display = 'none';
                let area = '📍 NEO-AETHERIA';
                if(Math.hypot(p.x, p.z) < 200) area = '📍 CYBERCORE';
                document.getElementById('ui-area').innerText = area;
            }

            // Camera Follow
            const dist = 30;
            const camY = p.y + dist * Math.sin(cameraPitch) + 3;
            const xz = dist * Math.cos(cameraPitch);
            const camX = p.x - xz * Math.sin(cameraYaw);
            const camZ = p.z - xz * Math.cos(cameraYaw);
            
            camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.2);
            camera.lookAt(p.x, p.y + 4, p.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
