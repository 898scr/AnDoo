<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse (IMMERSIVE完全版)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; color: #fff; }
        
        /* ログイン画面 */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .panel { background: rgba(30, 41, 59, 0.9); padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 300px;}
        .panel h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        .panel input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; }
        .panel button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .error-msg { color: #f43f5e; font-size: 0.9rem; text-align: center; min-height: 20px; }

        /* ロード画面 */
        #loading-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 90;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #00ffff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ゲーム開始オーバーレイ */
        #start-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 80;
            justify-content: center; align-items: center; backdrop-filter: blur(2px);
        }
        .start-btn { padding: 15px 30px; font-size: 1.2rem; background: #00ffff; color: #000; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,255,0.5); transition: 0.2s;}
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,255,255,0.8); }

        /* UIレイヤー */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 10; display: none;
            background: rgba(15, 23, 42, 0.7); padding: 15px; border-radius: 8px; backdrop-filter: blur(5px); border: 1px solid #334155;
        }
        .ui-text { margin: 5px 0; font-size: 0.9rem; color: #cbd5e1; }
        .ui-value { font-weight: bold; color: #fff; font-size: 1.1rem; }
        
        #admin-panel { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #475569; }
        .admin-title { color: #facc15; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px; background: rgba(255,255,255,0.8); border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC SYSTEM</h2>
            <div id="auth-error" class="error-msg"></div>
            <input type="text" id="username" placeholder="UserID" required>
            <input type="password" id="password" placeholder="Password" required>
            <button class="btn-primary" onclick="attemptAuth('/api/login')">ENTER SYSTEM</button>
            <button class="btn-success" onclick="attemptAuth('/api/register')">REGISTER</button>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="color: #00ffff; font-weight: bold; letter-spacing: 2px;">INITIALIZING WORLD...</div>
    </div>

    <div id="start-overlay">
        <button class="start-btn" onclick="lockMouse()">システムにダイブする</button>
    </div>

    <div id="ui-layer">
        <div class="ui-text">ID: <span id="ui-id" class="ui-value">---</span></div>
        <div class="ui-text">CR: <span id="ui-money" class="ui-value" style="color:#fbbf24;">0</span></div>
        
        <div id="admin-panel">
            <div class="admin-title">👑 ADMIN CONTROLS</div>
            <div class="ui-text" style="font-size: 0.75rem;">[Z] Toggle Fly Mode</div>
            <div class="ui-text" style="font-size: 0.75rem;">[Q]/[E] Down / Up</div>
        </div>

        <div style="margin-top:15px; font-size: 0.75rem; color: #94a3b8;">
            [W][A][S][D]: Move<br>
            [Shift]: Sprint<br>
            [Space]: Jump<br>
            [V]: Toggle Camera (FPS/TPS)<br>
            [Esc]: Free Mouse
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script>
        let currentUser = null;
        let isAdmin = false;
        let socket = null;

        let scene, camera, renderer, clock;
        let mapGroup = null; 
        
        let localAvatar = null;
        const otherPlayers = {};
        
        // 物理・移動用
        let playerLocalPos = new THREE.Vector3(0, 5, 0); 
        let playerVelocity = new THREE.Vector3(0, 0, 0);
        let isGrounded = false;
        
        let cameraYaw = 0; 
        let cameraPitch = 0;
        let isLocked = false;
        let isFPS = false; 
        
        let isGodMode = false; 
        
        const keysPressed = {};
        const collisionBoxes = []; 
        
        const speedWalk = 5.0;
        const speedRun = 10.0;
        const jumpForce = 8.0;
        const gravity = -20.0;
        
        let targetAvatarRotation = 0;

        async function attemptAuth(endpoint) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if(!username || !password) return showError('IDとパスワードを入力してください');

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    if(endpoint === '/api/login') {
                        currentUser = data.username;
                        isAdmin = data.isAdmin;
                        
                        document.getElementById('ui-id').innerText = currentUser;
                        document.getElementById('ui-money').innerText = data.cr;
                        if(isAdmin) document.getElementById('admin-panel').style.display = 'block';
                        
                        document.getElementById('login-screen').style.display = 'none';
                        initGame();
                    } else {
                        showError(data.message, '#10b981'); 
                    }
                } else {
                    showError(data.message);
                }
            } catch (e) {
                showError('サーバーに接続できません');
            }
        }

        function showError(msg, color = '#f43f5e') {
            const errEl = document.getElementById('auth-error');
            errEl.innerText = msg;
            errEl.style.color = color;
        }

        function setupThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x050814);
            scene.fog = new THREE.FogExp2(0x050814, 0.005);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x223344, 1.5));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(50, 100, 70);
            dirLight.castShadow = true;
            scene.add(dirLight);

            mapGroup = new THREE.Group();
            scene.add(mapGroup);

            clock = new THREE.Clock();
            setupInputHandlers();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        window.createAvatarMesh = function(colorHex) {
            const group = new THREE.Group();
            
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0xa0aab5, metalness: 0.8, roughness: 0.3, flatShading: true
            });
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: colorHex
            });
            const darkMaterial = new THREE.MeshStandardMaterial({
                color: 0x111622, metalness: 0.5, roughness: 0.5, flatShading: true
            });

            // 浮遊アニメーション用に全体を包むグループ
            const baseGroup = new THREE.Group();
            baseGroup.rotation.y = Math.PI; // ★アバターの正面(顔)をZ-方向に向ける
            group.add(baseGroup);
            
            // 体の傾き（前傾姿勢）を制御するグループ
            const tiltGroup = new THREE.Group();
            tiltGroup.position.y = 0.6;
            baseGroup.add(tiltGroup);

            // 【頭部】
            const headGroup = new THREE.Group();
            headGroup.position.y = 0.7; 
            tiltGroup.add(headGroup);

            const headMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), bodyMaterial);
            headMesh.position.y = 0.2; 
            headMesh.castShadow = true;
            headGroup.add(headMesh);

            const visorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.08, 0.05), glowMaterial);
            visorMesh.position.set(0, 0.22, 0.32);
            headGroup.add(visorMesh);

            const sensorGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.1, 6);
            const leftSensor = new THREE.Mesh(sensorGeo, darkMaterial);
            leftSensor.rotation.z = Math.PI / 2;
            leftSensor.position.set(0.32, 0.2, 0);
            headGroup.add(leftSensor);

            const rightSensor = leftSensor.clone();
            rightSensor.position.set(-0.32, 0.2, 0);
            headGroup.add(rightSensor);

            // 【胴体】
            const torsoGroup = new THREE.Group();
            tiltGroup.add(torsoGroup);

            const chestMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), bodyMaterial);
            chestMesh.position.y = 0.3;
            chestMesh.castShadow = true;
            torsoGroup.add(chestMesh);

            const lineMesh = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.04, 0.32), glowMaterial);
            lineMesh.position.y = 0.25;
            torsoGroup.add(lineMesh);

            const waistMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.05, 0.4, 5), bodyMaterial);
            waistMesh.position.y = -0.15;
            waistMesh.castShadow = true;
            torsoGroup.add(waistMesh);

            // 【腕】
            const armGeo = new THREE.BoxGeometry(0.1, 0.5, 0.12);
            
            const armLGroup = new THREE.Group();
            armLGroup.position.set(0.35, 0.55, 0); 
            const leftArm = new THREE.Mesh(armGeo, bodyMaterial);
            leftArm.position.y = -0.25;
            leftArm.castShadow = true;
            armLGroup.add(leftArm);
            tiltGroup.add(armLGroup);

            const armRGroup = new THREE.Group();
            armRGroup.position.set(-0.35, 0.55, 0); 
            const rightArm = new THREE.Mesh(armGeo, bodyMaterial);
            rightArm.position.y = -0.25;
            rightArm.castShadow = true;
            armRGroup.add(rightArm);
            tiltGroup.add(armRGroup);

            armLGroup.rotation.z = -0.15;
            armRGroup.rotation.z = 0.15;

            group.userData = { 
                base: baseGroup, head: headGroup, tilt: tiltGroup, 
                armL: armLGroup, armR: armRGroup, 
                walkTime: 0, movingTimer: 0, currentYaw: 0 
            };
            return group;
        };

        // 角度の差分を -PI から PI の範囲に収める関数
        function deltaAngle(a, b) {
            let diff = a - b;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return diff;
        }

        function updateAvatarAnim(avatar, isMoving, delta, camYaw, camPitch) {
            if (!avatar || !avatar.userData.head) return;
            const ud = avatar.userData;
            
            const time = clock.getElapsedTime();
            const phaseOffset = avatar.uuid ? avatar.uuid.charCodeAt(0) : 0;
            ud.base.position.y = Math.sin(time * 2 + phaseOffset) * 0.05;

            // --- 体の向きと顔の向きの制御 ---
            // カメラのYaw（向いている方向）とアバターの体の向き（currentYaw）の差分を計算
            let yawDiff = deltaAngle(camYaw, ud.currentYaw);
            
            // 左右90度 (Math.PI/2) が限界
            const limit = Math.PI / 2;
            
            if (isMoving) {
                // 移動中は体全体を進行方向（targetAvatarRotation）に滑らかに向ける
                ud.currentYaw = ud.currentYaw + deltaAngle(targetAvatarRotation, ud.currentYaw) * 0.15;
                
                // 体が進行方向を向くため、顔の左右のねじれはゼロ（正面）に戻す
                ud.head.rotation.y = THREE.MathUtils.lerp(ud.head.rotation.y, 0, 0.1);
            } else {
                // 停止時
                if (yawDiff > limit) {
                    // 右に90度以上向いた場合、体ごと右に回す
                    ud.currentYaw += (yawDiff - limit) * 0.1;
                    ud.head.rotation.y = limit;
                } else if (yawDiff < -limit) {
                    // 左に90度以上向いた場合、体ごと左に回す
                    ud.currentYaw += (yawDiff + limit) * 0.1;
                    ud.head.rotation.y = -limit;
                } else {
                    // 制限内の場合は顔だけを動かす
                    ud.head.rotation.y = yawDiff;
                }
            }
            
            // アバターの親グループの回転を更新
            avatar.rotation.y = ud.currentYaw;

            // 頭の上下（ピッチ）制御
            const clampedPitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camPitch));
            ud.head.rotation.x = -clampedPitch; 

            // --- 移動アニメーション（傾きと腕の振り） ---
            if (isMoving) {
                ud.walkTime += delta * 10; 
                ud.tilt.rotation.x = THREE.MathUtils.lerp(ud.tilt.rotation.x, 0.25, 0.1);
                
                const swing = Math.sin(ud.walkTime);
                ud.armL.rotation.x = swing * 0.2 - 0.2;
                ud.armR.rotation.x = -swing * 0.2 - 0.2;
            } else {
                ud.walkTime = 0; 
                ud.tilt.rotation.x = THREE.MathUtils.lerp(ud.tilt.rotation.x, 0, 0.1);
                ud.armL.rotation.x = THREE.MathUtils.lerp(ud.armL.rotation.x, 0, 0.1);
                ud.armR.rotation.x = THREE.MathUtils.lerp(ud.armR.rotation.x, 0, 0.1);
            }
        }

        function initGame() {
            document.getElementById('loading-screen').style.display = 'flex';
            socket = io(); 
            
            setupThreeJS();
            loadMapData(); 
            
            localAvatar = createAvatarMesh(0x00f3ff);
            scene.add(localAvatar);

            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('start-overlay').style.display = 'flex';
            
            setupSocketEvents();
            animate(); 
        }

        async function loadMapData() {
            try {
                const res = await fetch('/test_map.json');
                if (!res.ok) throw new Error("Map file not found");
                const mapData = await res.json();
                buildMap(mapData);
            } catch(e) {
                console.warn("test_map.jsonが見つからないため、仮の地面を生成します。");
                buildFallbackMap();
            }
        }

        function buildMap(mapData) {
            if (mapData.environment && mapData.environment.groundColor) {
                scene.background = new THREE.Color(mapData.environment.groundColor);
                scene.fog.color.set(mapData.environment.groundColor);
            }

            const matFloor = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 });
            const floor = new THREE.Mesh(new THREE.CylinderGeometry(500, 500, 1, 64), matFloor);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            mapGroup.add(floor);
            collisionBoxes.push(new THREE.Box3().setFromObject(floor));

            if (mapData.floors) {
                mapData.floors.forEach(f => {
                    let mesh;
                    const mat = new THREE.MeshStandardMaterial({ color: f.color });
                    if (f.type === 'rect') {
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(f.width, 1, f.depth), mat);
                        mesh.position.set(f.x, f.y - 0.5, f.z);
                    } else if (f.type === 'circle') {
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(f.radius, f.radius, 1, 32), mat);
                        mesh.position.set(f.x, f.y - 0.5, f.z);
                    }
                    if (mesh) {
                        mesh.receiveShadow = true;
                        mapGroup.add(mesh);
                        collisionBoxes.push(new THREE.Box3().setFromObject(mesh));
                    }
                });
            }

            if (mapData.walls) {
                mapData.walls.forEach(w => {
                    let mesh;
                    const mat = new THREE.MeshStandardMaterial({ color: w.color, roughness: 0.7 });
                    const height = w.maxY - w.minY;
                    const centerY = w.minY + height / 2;

                    if (w.type === 'rect') {
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(w.width, height, w.depth), mat);
                        mesh.position.set(w.x, centerY, w.z);
                    } else if (w.type === 'circle') {
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(w.radius, w.radius, height, 32), mat);
                        mesh.position.set(w.x, centerY, w.z);
                    }
                    if (mesh) {
                        mesh.castShadow = true; mesh.receiveShadow = true;
                        mapGroup.add(mesh);
                        collisionBoxes.push(new THREE.Box3().setFromObject(mesh));
                    }
                });
            }
        }

        function buildFallbackMap() {
            const matFloor = new THREE.MeshStandardMaterial({ color: 0x113355, roughness: 0.9 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), matFloor);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            mapGroup.add(floor);
            
            const colBox = new THREE.Box3(new THREE.Vector3(-500, -10, -500), new THREE.Vector3(500, 0, 500));
            collisionBoxes.push(colBox);
        }

        function setupInputHandlers() {
            window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                const sensitivity = 0.002;
                cameraYaw -= e.movementX * sensitivity;
                
                // カメラの上下（ピッチ）制限を大幅に緩和し、ほぼ真上を見れるように
                cameraPitch -= e.movementY * sensitivity;
                cameraPitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.1, cameraPitch));
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
                document.getElementById('ui-layer').style.display = isLocked ? 'block' : 'none';
                if(!isLocked) {
                    document.getElementById('start-overlay').style.display = 'flex';
                    document.getElementById('start-overlay').innerHTML = '<button class="start-btn" onclick="lockMouse()">画面をクリックして再開</button>';
                }
            });
        }

        window.lockMouse = function() {
            document.body.requestPointerLock();
            document.getElementById('start-overlay').style.display = 'none';
        }

        function checkCollision(pos) {
            if (isGodMode) return { collided: false, safeY: pos.y };

            const playerRadius = 0.3; 
            const playerHeight = 1.5;
            const pBox = new THREE.Box3(
                new THREE.Vector3(pos.x - playerRadius, pos.y, pos.z - playerRadius),
                new THREE.Vector3(pos.x + playerRadius, pos.y + playerHeight, pos.z + playerRadius)
            );

            let collided = false;
            let highestFloorY = -Infinity;

            for (const box of collisionBoxes) {
                if (pBox.intersectsBox(box)) {
                    if (box.max.y > pos.y + 0.3) {
                        collided = true;
                    }
                    if (box.max.y <= pos.y + 0.5 && box.max.y > highestFloorY) {
                        highestFloorY = box.max.y;
                    }
                }
            }
            return { collided, safeY: highestFloorY };
        }

        function setupSocketEvents() {
            socket.emit('joinGame', { username: currentUser });

            socket.on('initData', (data) => {
                Object.keys(data.players).forEach(id => {
                    if (id !== socket.id) addOtherPlayer(data.players[id]);
                });
            });

            socket.on('newPlayer', (info) => addOtherPlayer(info));

            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    otherPlayers[info.id].position.set(info.x, info.y, info.z);
                    otherPlayers[info.id].userData.targetYaw = info.rotation; 
                    otherPlayers[info.id].userData.targetPitch = info.pitch || 0;
                    otherPlayers[info.id].userData.movingTimer = 0.1; 
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            });
        }

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(info.color || 0xffaa00);
            mesh.position.set(info.x, info.y, info.z);
            mesh.userData.currentYaw = info.rotation;
            mesh.userData.targetYaw = info.rotation;
            scene.add(mesh);
            otherPlayers[info.id] = mesh;
        }

        let vKeyWasPressed = false, zKeyWasPressed = false;

        function animate() {
            requestAnimationFrame(animate);
            if (!isLocked) { renderer.render(scene, camera); return; }
            
            const delta = Math.min(clock.getDelta(), 0.1); 

            if (keysPressed['v']) { if (!vKeyWasPressed) isFPS = !isFPS; vKeyWasPressed = true; } else { vKeyWasPressed = false; }
            if (isAdmin && keysPressed['z']) { if (!zKeyWasPressed) { isGodMode = !isGodMode; playerVelocity.y = 0; } zKeyWasPressed = true; } else { zKeyWasPressed = false; }

            // --- 移動計算 ---
            // 移動計算
            let moveSpeed = keysPressed['shift'] ? speedRun : speedWalk;
            const mv = new THREE.Vector3(0, 0, 0);
            
            const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
            const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));

            if (keysPressed['w']) mv.add(forward);
            if (keysPressed['s']) mv.sub(forward);
            if (keysPressed['a']) mv.sub(right);
            if (keysPressed['d']) mv.add(right);

            let moved = false;
            if (mv.lengthSq() > 0) {
                mv.normalize().multiplyScalar(moveSpeed * delta);
                moved = true;
                
                // 進行方向の角度を計算して targetAvatarRotation に保存
                targetAvatarRotation = Math.atan2(-mv.x, -mv.z);
            }

            let nextX = playerLocalPos.x + mv.x;
            let nextZ = playerLocalPos.z + mv.z;

            let testPos = playerLocalPos.clone(); testPos.x = nextX;
            if (!checkCollision(testPos).collided) playerLocalPos.x = nextX;

            testPos = playerLocalPos.clone(); testPos.z = nextZ;
            if (!checkCollision(testPos).collided) playerLocalPos.z = nextZ;

            // Y軸（ジャンプと重力）
            if (isGodMode) {
                if (keysPressed['e']) playerLocalPos.y += 10 * delta;
                if (keysPressed['q']) playerLocalPos.y -= 10 * delta;
            } else {
                if (isGrounded && keysPressed[' ']) {
                    playerVelocity.y = jumpForce;
                    isGrounded = false;
                }
                playerVelocity.y += gravity * delta;
                playerLocalPos.y += playerVelocity.y * delta;

                const col = checkCollision(playerLocalPos);
                if (playerLocalPos.y <= col.safeY) {
                    playerLocalPos.y = col.safeY;
                    playerVelocity.y = 0;
                    isGrounded = true;
                } else {
                    isGrounded = false;
                }
                if (playerLocalPos.y < -50) playerLocalPos.set(0, 20, 0);
            }

            // アバターの同期
            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.visible = !isFPS; 
                
                // updateAvatarAnim には、targetAvatarRotation ではなく cameraYaw を渡す
                // (顔をカメラの方向に向けるため)
                updateAvatarAnim(localAvatar, moved && !isGodMode && isGrounded, delta, cameraYaw, cameraPitch);
            }

            Object.values(otherPlayers).forEach(op => {
                let isOpMoving = false;
                if (op.userData.movingTimer > 0) {
                    isOpMoving = true;
                    op.userData.movingTimer -= delta;
                }
                updateAvatarAnim(op, isOpMoving, delta, op.userData.targetYaw || 0, op.userData.targetPitch || 0);
            });

            if (moved && socket) {
                socket.emit('playerMovement', { 
                    x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, 
                    rotation: targetAvatarRotation, pitch: cameraPitch 
                });
            }

            // --- カメラ制御 (軌道の大改修) ---
            const headTarget = playerLocalPos.clone();
            headTarget.y += 1.4; // アバターの頭の高さ

            if (isFPS) {
                camera.position.copy(playerLocalPos);
                camera.position.y += 1.5; 
                const lookDir = new THREE.Vector3(
                    -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                    Math.sin(cameraPitch),
                    -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                );
                camera.lookAt(camera.position.clone().add(lookDir));
            } else {
                // TPSの基本距離
                const distance = 4.0;
                
                // ピッチ角度に応じてカメラの位置を球面的に計算 (見上げた時に上空へ回り込む)
                const horizontalDist = Math.cos(cameraPitch) * distance;
                const verticalDist = Math.sin(cameraPitch) * distance;

                const offset = new THREE.Vector3(
                    Math.sin(cameraYaw) * horizontalDist,
                    -verticalDist, 
                    Math.cos(cameraYaw) * horizontalDist
                );
                
                camera.position.copy(headTarget).add(offset);
                
                // 地面にカメラがめり込まないように最低高度を保証
                if (camera.position.y < playerLocalPos.y + 0.1) {
                    camera.position.y = playerLocalPos.y + 0.1;
                }

                // 常に頭周辺を注視
                camera.lookAt(headTarget);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
