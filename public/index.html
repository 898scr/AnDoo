<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #020617; color: #fff; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 12px; border: 1px solid #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); width: 320px; backdrop-filter: blur(10px);}
        .panel h2 { margin-top: 0; color: #00ffff; text-align: center; letter-spacing: 2px; }
        .panel input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #38bdf8; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; outline: none; }
        .panel button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #00ffff, #0284c7); color: #000; }
        
        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; }
        
        #sidebar { position: absolute; top: 20px; left: 20px; width: 250px; background: rgba(15,23,42,0.8); border-left: 3px solid #00ffff; padding: 15px; border-radius: 0 8px 8px 0; pointer-events: auto;}
        .money { font-size: 1.5rem; color: #00ffff; font-weight: bold; }
        #inventory { margin-top: 10px; font-size: 0.85rem; color: #f472b6; }

        #minimap-container { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(2,6,23,0.8); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        #minimap { width: 100%; height: 100%; }

        #interaction-prompt { position: absolute; bottom: 20vh; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); border: 2px solid #00ffff; padding: 12px 24px; border-radius: 30px; color: #00ffff; font-weight: bold; font-size: 1.2rem; display: none; box-shadow: 0 0 15px rgba(0,255,255,0.5); }
        .key-btn { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }

        #controls-help { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 0.8rem; line-height: 1.6; }

        #chat-container { position: absolute; bottom: 120px; left: 20px; width: 300px; background: rgba(15,23,42,0.8); border-radius: 8px; pointer-events: auto; display: flex; flex-direction: column; }
        #chat-messages { height: 120px; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 5px; }
        #chat-messages div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        #chat-input { padding: 8px; border: none; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); color: white; outline: none; transition: 0.2s;}
        #chat-input:focus { background: rgba(0, 255, 255, 0.1); border-top: 1px solid #00ffff; }

        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="panel">
            <h2>HAKUYARC</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password (Optional)">
            <button class="btn-primary" onclick="attemptAuth()">ENTER SYSTEM</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="sidebar">
            <div style="font-size: 0.8rem; color:#94a3b8;">ID: <span id="ui-username">---</span></div>
            <div class="money">CR: <span id="ui-money">500</span></div>
            <div id="inventory">Equipment: [Normal]</div>
        </div>
        
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Enterでチャット開始 / 送信">
        </div>

        <div id="controls-help">
            [Click/Drag] 視点移動<br>
            [W A S D] 移動<br>
            [V] FPS/TPS切替<br>
            [F] アクション/購入/乗降<br>
            [E]上昇 / [Q]下降 (ドローン)<br>
            [Enter] チャット切替
        </div>

        <div id="minimap-container">
            <canvas id="minimap" width="200" height="200"></canvas>
        </div>
        
        <div id="interaction-prompt"><span class="key-btn">F</span><span id="prompt-text">アクション</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let currentUsername = 'Guest', socket = null;
        let scene, camera, renderer, clock;
        const MAP_RADIUS = 1800; 
        
        const keysPressed = {};
        let cameraYaw = 0, cameraPitch = 0, isLocked = false, isDragging = false, isFPS = false;
        
        let playerLocalPos = new THREE.Vector3(0, 1.5, 100); 
        let playerVelocityY = 0; 
        
        const trains = [], personalDrones = [], warpPads = [], stationAreas = []; 
        const otherPlayers = {}; // 他プレイヤーを保持
        
        // --- 追加: ショップとゲーム用変数 ---
        const shopItems = [], slotMachinesData = [];
        let puckData = null;
        let playerColor = 0x00ffff, playerAccessory = 'none', playerSpeedMult = 1.0;
        const HOCKEY_P1_Z = -5180, HOCKEY_P2_Z = -4820;

        let ridingTrain = null, ridingDrone = null, localAvatar = null;
        let isWarping = false, fKeyWasPressed = false, vKeyWasPressed = false;
        let minimapCtx;
        
        // 同期用タイマー
        let lastSentPos = new THREE.Vector3();
        let lastSentRot = 0;

        // モノレール加減速同期用の定数 (速度倍増)
        const TRAIN_MAX_SPEED = 0.16; 
        const TRAIN_STOP_TIME = 4.0; 
        const TRAIN_SECTION_ANGLE = Math.PI / 2;
        // 平均速度を積分計算して1セクションの時間を算出 (約 1.57 / 0.08 = 19.6秒)
        const TRAIN_SECTION_MOVE_TIME = TRAIN_SECTION_ANGLE / (TRAIN_MAX_SPEED / 2); 
        const TRAIN_SECTION_TOTAL_TIME = TRAIN_SECTION_MOVE_TIME + TRAIN_STOP_TIME;
        const TRAIN_CYCLE_TIME = TRAIN_SECTION_TOTAL_TIME * 4; 

        async function attemptAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value || 'nopass';
            
            if (!username) return alert("Usernameを入力してください");

            try {
                let res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                let data = await res.json();
                
                if (!data.success) {
                    res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                    data = await res.json();
                    if (!data.success) { alert(data.message); return; }
                    res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                    data = await res.json();
                }

        // --- 乗車・降車状態を同期する関数 ---
        function updateAvatarState() {
            if (!socket) return;
            const config = {
                ridingTrainIndex: ridingTrain ? trains.indexOf(ridingTrain) : -1,
                ridingDroneIndex: ridingDrone ? personalDrones.indexOf(ridingDrone) : -1,
                color: playerColor,
                accessory: playerAccessory
            };
            socket.emit('changeAvatarConfig', config);
        }

        function setupSocketEvents() {
            if (!socket) return;
            socket.on('initData', (data) => {
                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info);
                });
            });
            socket.on('newPlayer', (info) => {
                if (info.username !== currentUsername && !otherPlayers[info.id]) addOtherPlayer(info);
            });
            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    otherPlayers[info.id].position.set(info.x, info.y, info.z);
                    otherPlayers[info.id].rotation.y = info.rotation;
                }
            });
            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
            });
            socket.on('chatMessage', (data) => {
                const msg = document.createElement('div');
                msg.innerHTML = `<strong style="color:#00ffff">${data.username}</strong>: ${data.text}`;
                document.getElementById('chat-messages').appendChild(msg);
                document.getElementById('chat-messages').scrollTop = 9999;
            });
            socket.on('avatarChanged', (data) => {
                if (otherPlayers[data.id] && data.avatar) {
                    otherPlayers[data.id].userData.ridingTrainIndex = data.avatar.ridingTrainIndex !== undefined ? data.avatar.ridingTrainIndex : -1;
                    otherPlayers[data.id].userData.ridingDroneIndex = data.avatar.ridingDroneIndex !== undefined ? data.avatar.ridingDroneIndex : -1;
                    
                    // 色とアクセサリーの同期更新
                    if (data.avatar.color !== undefined || data.avatar.accessory !== undefined) {
                        const oldPos = otherPlayers[data.id].position.clone();
                        const oldRot = otherPlayers[data.id].rotation.y;
                        scene.remove(otherPlayers[data.id]);
                        
                        const newMesh = createAvatarMesh(data.avatar.color || 0x0284c7, data.username, data.avatar.accessory || 'none');
                        newMesh.position.copy(oldPos);
                        newMesh.rotation.y = oldRot;
                        newMesh.userData = otherPlayers[data.id].userData;
                        
                        scene.add(newMesh);
                        otherPlayers[data.id] = newMesh;
                    }
                }
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x0a2a4a);
            scene.fog = new THREE.FogExp2(0x0a2a4a, 0.0006); 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 4000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x223355, 1.5));
            const hemiLight = new THREE.HemisphereLight(0x00ffff, 0xff00ff, 0.8);
            hemiLight.position.set(0, 1000, 0);
            scene.add(hemiLight);

            createEnvironment();
            createLandmarkTower();
            createMonorails();
            createDrones();
            
            // 地下空間の生成
            createShoppingMall();
            createEntertainmentRoom();
            
            // 自分用アバター作成（スケール2.5倍）
            localAvatar = createAvatarMesh(playerColor, currentUsername, playerAccessory);
            scene.add(localAvatar);

            minimapCtx = document.getElementById('minimap').getContext('2d');
            clock = new THREE.Clock();
            
            setupInputHandlers();
            animate();
        }

        function createAvatarMesh(colorHex = 0x00ffff, username = null, accessoryType = 'none') {
            const group = new THREE.Group();
            const s = 2.5; // キャラサイズを2.5倍に拡大
            
            const bodyMat = new THREE.MeshStandardMaterial({color: colorHex, roughness: 0.2, metalness: 0.8});
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8*s, 1.2*s, 0.5*s), bodyMat);
            body.position.y = 0.6*s;
            
            const headMat = new THREE.MeshStandardMaterial({color: 0xffcc99});
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6*s, 0.6*s, 0.6*s), headMat);
            head.position.y = 1.5*s;
            
            const visorMat = new THREE.MeshBasicMaterial({color: 0x000000});
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.65*s, 0.2*s, 0.65*s), visorMat);
            visor.position.y = 1.5*s;
            
            group.add(body, head, visor);

            // アクセサリーの装着
            if (accessoryType === 'cat_ears') {
                const earMat = new THREE.MeshStandardMaterial({color: colorHex});
                const earL = new THREE.Mesh(new THREE.ConeGeometry(0.2*s, 0.4*s, 4), earMat);
                earL.position.set(-0.25*s, 1.9*s, 0); group.add(earL);
                const earR = new THREE.Mesh(new THREE.ConeGeometry(0.2*s, 0.4*s, 4), earMat);
                earR.position.set(0.25*s, 1.9*s, 0); group.add(earR);
            } else if (accessoryType === 'top_hat') {
                const hatMat = new THREE.MeshStandardMaterial({color: 0x111111});
                const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.6*s, 0.6*s, 0.1*s, 16), hatMat);
                brim.position.set(0, 1.85*s, 0); group.add(brim);
                const top = new THREE.Mesh(new THREE.CylinderGeometry(0.4*s, 0.4*s, 0.8*s, 16), hatMat);
                top.position.set(0, 2.2*s, 0); group.add(top);
            } else if (accessoryType === 'headphones') {
                const hpMat = new THREE.MeshStandardMaterial({color: 0x555555});
                const padL = new THREE.Mesh(new THREE.CylinderGeometry(0.25*s, 0.25*s, 0.1*s, 16), hpMat);
                padL.rotation.z = Math.PI/2; padL.position.set(-0.35*s, 1.5*s, 0); group.add(padL);
                const padR = new THREE.Mesh(new THREE.CylinderGeometry(0.25*s, 0.25*s, 0.1*s, 16), hpMat);
                padR.rotation.z = Math.PI/2; padR.position.set(0.35*s, 1.5*s, 0); group.add(padR);
                const band = new THREE.Mesh(new THREE.TorusGeometry(0.35*s, 0.05*s, 8, 16, Math.PI), hpMat);
                band.position.set(0, 1.5*s, 0); group.add(band);
            }

            // 他人の場合はネームタグを頭上に追加
            if (username) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(username, 128, 40);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
                sprite.position.y = 2.2 * s; sprite.scale.set(12, 3, 1);
                group.add(sprite);
            }

            return group;
        }

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(0x0284c7, info.username); 
            mesh.position.set(info.x, info.y, info.z);
            mesh.rotation.y = info.rotation;
            if (info.avatar) {
                mesh.userData.ridingTrainIndex = info.avatar.ridingTrainIndex !== undefined ? info.avatar.ridingTrainIndex : -1;
                mesh.userData.ridingDroneIndex = info.avatar.ridingDroneIndex !== undefined ? info.avatar.ridingDroneIndex : -1;
                if(info.avatar.color) mesh.children[0].material.color.setHex(info.avatar.color);
            } else {
                mesh.userData.ridingTrainIndex = -1; mesh.userData.ridingDroneIndex = -1;
            }
            scene.add(mesh);
            otherPlayers[info.id] = mesh;
        }

        function createEnvironment() {
            const ground = new THREE.Mesh(new THREE.CircleGeometry(MAP_RADIUS, 64), new THREE.MeshStandardMaterial({ color: 0x050a15, roughness: 0.9 }));
            ground.rotation.x = -Math.PI / 2; scene.add(ground);

            const gridHelper = new THREE.GridHelper(MAP_RADIUS * 2, 200, 0x00ffff, 0x020617);
            gridHelper.position.y = 0.1;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.2;
            scene.add(gridHelper);

            const roadMat = new THREE.MeshStandardMaterial({color: 0x1a1a24});
            const lineMat = new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.8});
            
            for(let i=0; i<8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const roadGrp = new THREE.Group();
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(80, MAP_RADIUS), roadMat);
                plane.rotation.x = -Math.PI/2; plane.position.z = MAP_RADIUS/2; plane.position.y = 0.15; roadGrp.add(plane);
                const line = new THREE.Mesh(new THREE.PlaneGeometry(4, MAP_RADIUS), lineMat);
                line.rotation.x = -Math.PI/2; line.position.z = MAP_RADIUS/2; line.position.y = 0.2; roadGrp.add(line);
                roadGrp.rotation.y = angle; scene.add(roadGrp);
            }

            // 巨大施設 (円柱土台に変更し、ゲートとワープを追加)
            const corners = [
                {x: 1000, z: 1000, col: 0x00ffff, type: "mall", name: "ショッピングモール"}, 
                {x: -1000, z: 1000, col: 0xff00ff, type: "dome", name: "居住区ドーム"},
                {x: 1000, z: -1000, col: 0xffff00, type: "ent", name: "エンタメドーム"}, 
                {x: -1000, z: -1000, col: 0xff0000, type: "drone", name: "ドローンステーション"}
            ];
            
            corners.forEach(c => {
                const group = new THREE.Group();
                group.position.set(c.x, 0, c.z);
                const lookAngle = Math.atan2(-c.x, -c.z); // タワー(中央)を向く角度

                const baseRad = 220;
                
                if (c.type === 'ent') {
                    // エンタメドーム (ワイヤーフレームの半球)
                    const dome = new THREE.Mesh(new THREE.SphereGeometry(baseRad, 32, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.2}));
                    group.add(dome);
                    const wireDome = new THREE.Mesh(new THREE.SphereGeometry(baseRad+2, 16, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshBasicMaterial({color: c.col, wireframe: true, transparent:true, opacity:0.3}));
                    group.add(wireDome);
                    createWarpPad(c.x + Math.sin(lookAngle)*(baseRad+20), 0, c.z + Math.cos(lookAngle)*(baseRad+20), c.col, 5000, 1.5, -4850, "エンタメ空間へ入る");
                } else if (c.type === 'mall') {
                    // モール外観
                    const b = new THREE.Mesh(new THREE.CylinderGeometry(baseRad, baseRad, 250, 32), new THREE.MeshStandardMaterial({color: 0x111122, roughness: 0.2}));
                    b.position.y = 125; group.add(b);
                    const glassW = new THREE.Mesh(new THREE.CylinderGeometry(baseRad+3, baseRad+3, 80, 32), new THREE.MeshStandardMaterial({color: c.col, transparent: true, opacity: 0.5, side: THREE.DoubleSide}));
                    glassW.position.y = 40; group.add(glassW);
                    createWarpPad(c.x + Math.sin(lookAngle)*(baseRad+20), 0, c.z + Math.cos(lookAngle)*(baseRad+20), c.col, -5000, 1.5, -4850, "モールへ入る");
                } else {
                    // 通常の円柱施設
                    const b = new THREE.Mesh(new THREE.CylinderGeometry(baseRad, baseRad, 250, 32), new THREE.MeshStandardMaterial({color: 0x111122, roughness: 0.2}));
                    b.position.y = 125; group.add(b);
                    const edge = new THREE.Mesh(new THREE.CylinderGeometry(baseRad+2, baseRad+2, 255, 32), new THREE.MeshBasicMaterial({color: c.col, wireframe: true, transparent:true, opacity:0.3}));
                    edge.position.y = 125; group.add(edge);
                }

                // ドローンパッドの追加と歩行エリア登録
                if (c.type === 'drone') {
                    for(let i=0; i<4; i++) {
                        const angle = i * Math.PI/2 + Math.PI/4;
                        const padX = Math.cos(angle) * 120;
                        const padZ = Math.sin(angle) * 120;
                        
                        const subPad = new THREE.Mesh(new THREE.CylinderGeometry(40, 30, 10, 16), new THREE.MeshStandardMaterial({color: 0x331111}));
                        subPad.position.set(padX, 55, padZ); group.add(subPad);
                        const subRing = new THREE.Mesh(new THREE.RingGeometry(25, 35, 32), new THREE.MeshBasicMaterial({color: 0xff4400, side: THREE.DoubleSide}));
                        subRing.rotation.x = -Math.PI/2; subRing.position.set(padX, 60.1, padZ); group.add(subRing);

                        // 絶対座標に変換して落下防止判定に登録
                        const absX = c.x + Math.cos(lookAngle)*padX + Math.sin(lookAngle)*padZ;
                        const absZ = c.z - Math.sin(lookAngle)*padX + Math.cos(lookAngle)*padZ;
                        stationAreas.push({ type: 'circle', x: absX, z: absZ, radius: 40, y: 60 });
                        
                        createWarpPad(absX + 20, 60, absZ, c.col, c.x + Math.sin(lookAngle)*(baseRad+20), 1.5, c.z + Math.cos(lookAngle)*(baseRad+20), "地上へ降りる");
                    }
                    // 地上から上空のパッド1へ
                    const p1AbsX = c.x + Math.cos(lookAngle)*(Math.cos(Math.PI/4)*120) + Math.sin(lookAngle)*(Math.sin(Math.PI/4)*120);
                    const p1AbsZ = c.z - Math.sin(lookAngle)*(Math.cos(Math.PI/4)*120) + Math.cos(lookAngle)*(Math.sin(Math.PI/4)*120);
                    createWarpPad(c.x + Math.sin(lookAngle)*(baseRad+20), 0, c.z + Math.cos(lookAngle)*(baseRad+20), c.col, p1AbsX, 60.5, p1AbsZ, "発着パッドへ昇る");
                }

                // 入り口ゲート
                const gateGroup = new THREE.Group();
                const gateMat = new THREE.MeshStandardMaterial({color: 0x333333});
                const gL = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 10), gateMat); gL.position.set(-40, 30, 0);
                const gR = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 10), gateMat); gR.position.set(40, 30, 0);
                const gT = new THREE.Mesh(new THREE.BoxGeometry(90, 10, 10), new THREE.MeshBasicMaterial({color: c.col})); gT.position.set(0, 65, 0);
                gateGroup.add(gL, gR, gT);
                gateGroup.position.set(0, 0, baseRad + 5); 
                group.add(gateGroup);

                group.rotation.y = lookAngle;
                scene.add(group);
            });
        }

        // --- 地下空間の構築 ---
        function createShoppingMall() {
            const grp = new THREE.Group();
            grp.position.set(-5000, 0, -5000);
            
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({color: 0x001a1a}));
            floor.rotation.x = -Math.PI/2; floor.position.y = 0.1; grp.add(floor);
            
            const createShelf = (x, z, title, price, action, colorHex) => {
                const shelf = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(40, 15, 20), new THREE.MeshStandardMaterial({color: 0x222222}));
                base.position.y = 7.5;
                const glass = new THREE.Mesh(new THREE.BoxGeometry(38, 20, 18), new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3}));
                glass.position.y = 25;
                const item = new THREE.Mesh(new THREE.OctahedronGeometry(5, 0), new THREE.MeshBasicMaterial({color: colorHex || 0xffffff, wireframe: true}));
                item.position.y = 25;

        // --- ゲームロジック ---
        const REEL_COLORS = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0x00ffff, 0xff00ff];
        function playSlotMachine(slot) {
            if (slot.isSpinning) return;
            let moneyElem = document.getElementById('ui-money');
            let money = parseInt(moneyElem.innerText) || 0;
            if (money < 10) { alert("CRが足りません！"); return; }
            
            money -= 10;
            moneyElem.innerText = money;
            slot.isSpinning = true;
            
            let spinCount = 0;
            const spinInterval = setInterval(() => {
                slot.reels.forEach(r => r.material.color.setHex(REEL_COLORS[Math.floor(Math.random()*REEL_COLORS.length)]));
                spinCount++;
                if (spinCount > 30) {
                    clearInterval(spinInterval);
                    finishSlot(slot, money);
                }
            }, 100);
        }

        function finishSlot(slot, currentMoney) {
            const res = [ REEL_COLORS[Math.floor(Math.random()*6)], REEL_COLORS[Math.floor(Math.random()*6)], REEL_COLORS[Math.floor(Math.random()*6)] ];
            if(Math.random() < 0.2) { res[1] = res[0]; res[2] = res[0]; } // 当たり補正

            slot.reels[0].material.color.setHex(res[0]); slot.reels[1].material.color.setHex(res[1]); slot.reels[2].material.color.setHex(res[2]);

            let msg = "", win = 0, colorStr = "#ffffff";
            if (res[0] === res[1] && res[1] === res[2]) {
                if (res[0] === 0xffff00) { win = 1000; msg = "🎰 777 BIG JACKPOT!! +1000 CR 🎰"; colorStr = "#ffff00"; }
                else { win = 150; msg = "🎊 絵柄揃い！ +150 CR"; colorStr = "#00ffff"; }
            } else if (res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
                win = 10; msg = "✨ リーチ！ +10 CR"; colorStr = "#00ff00";
            } else { msg = "ハズレ..."; colorStr = "#888888"; }
            
            document.getElementById('ui-money').innerText = currentMoney + win;
            
            const chatMsg = document.createElement('div');
            chatMsg.innerHTML = `<strong style="color:${colorStr}">[CASINO]</strong> ${msg}`;
            document.getElementById('chat-messages').appendChild(chatMsg);
            document.getElementById('chat-messages').scrollTop = 9999;
            slot.isSpinning = false;
        }

        function createMonorails() {
            const rInner = 600, rOuter = 1200, trackY = 80;
            const railMat = new THREE.MeshBasicMaterial({color: 0xcccccc});
            const neonMatCyan = new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe: true, transparent:true, opacity:0.4});
            const neonMatPink = new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe: true, transparent:true, opacity:0.4});
            const neonMatOrange = new THREE.MeshBasicMaterial({color: 0xffaa00, wireframe: true, transparent:true, opacity:0.4});
            
            const drawTrack = (radius, isOuter) => {
                const grp = new THREE.Group();
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius, 2, 8, 128), railMat).rotateX(Math.PI/2));
                grp.add(new THREE.Mesh(new THREE.TorusGeometry(radius+1, 3, 4, 128), isOuter ? neonMatPink : neonMatCyan).rotateX(Math.PI/2));
                grp.position.y = trackY; scene.add(grp);
            };
            drawTrack(rInner, false); drawTrack(rOuter, true);

            // 第3の軌道: 内周と外周を完全に行き来するピーナッツ型
            const curvePts = [];
            for (let i = 0; i <= 128; i++) {
                const a = (i / 128) * Math.PI * 2;
                const r = 900 - 300 * Math.cos(4 * a);
                curvePts.push(new THREE.Vector3(Math.cos(a) * r, trackY, Math.sin(a) * r));
            }
            const curveSpline = new THREE.CatmullRomCurve3(curvePts, true);
            const curveGeo = new THREE.TubeGeometry(curveSpline, 128, 2, 8, true);
            const curveNeonGeo = new THREE.TubeGeometry(curveSpline, 128, 3, 4, true);
            scene.add(new THREE.Mesh(curveGeo, railMat));
            scene.add(new THREE.Mesh(curveNeonGeo, neonMatOrange));

            const addStation = (radius, angle) => {
                const rotY = -angle; 
                const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
                const group = new THREE.Group();
                
                const pWidth = 60, pDepth = 150;
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 2, pDepth), new THREE.MeshStandardMaterial({color: 0x334455})).translateY(-1));
                group.add(new THREE.Mesh(new THREE.BoxGeometry(pWidth, 2, pDepth), new THREE.MeshStandardMaterial({color: 0x222233})).translateY(20));
                
                const glass = new THREE.MeshStandardMaterial({color: 0x00ffff, transparent:true, opacity:0.3, side:THREE.DoubleSide});
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 15), glass).rotateY(Math.PI/2).translateZ(-pWidth/2).translateY(7.5));
                group.add(new THREE.Mesh(new THREE.PlaneGeometry(pDepth, 15), glass).rotateY(Math.PI/2).translateZ(pWidth/2).translateY(7.5));

                group.position.set(x, trackY, z); group.rotation.y = rotY; scene.add(group);

                const dirX = Math.cos(angle), dirZ = Math.sin(angle);
                const offset = (radius === rInner) ? -20 : 20; 
                
                createWarpPad(x + dirX*offset, trackY, z + dirZ*offset, 0xff00ff, x + dirX*30, 1.5, z + dirZ*30, "地上へ");
                createWarpPad(x + dirX*30, 1, z + dirZ*30, 0x00ffff, x + dirX*offset, trackY+1.5, z + dirZ*offset, "駅ホームへ");

                stationAreas.push({ type: 'rect', x, z, angle: rotY, width: pWidth, depth: pDepth });
            };

            // 駅の配置（内周4駅、外周4駅）
            for(let i=0; i<4; i++) {
                addStation(rInner, i * Math.PI/2);
                addStation(rOuter, i * Math.PI/2 + Math.PI/4);
            }

            const spawnTrain = (radius, initialSection, type, sectionAngle, phaseOffset) => {
                const carColor = type === 'curve' ? 0xffaa00 : (type === 'outer' ? 0xff00ff : 0x00ffff);

                car.add(new THREE.Mesh(new THREE.PlaneGeometry(10, 16), wGlass).rotateY(Math.PI/2).translateZ(7).translateY(9).translateX(15));
                car.add(new THREE.Mesh(new THREE.PlaneGeometry(10, 16), wGlass).rotateY(Math.PI/2).translateZ(7).translateY(9).translateX(-15));
                
                scene.add(car);
                trains.push({ mesh: car, radius, initialSection, sectionAngle, phaseOffset, type: type, state: 'moving' });
            };
            
            // 速度アップ＆加減速設定を反映した列車のスポーン
            spawnTrain(rInner, 0, 'inner', Math.PI/2, 0);

        function setupInputHandlers() {
            window.addEventListener('keydown', e => {
                const chatInput = document.getElementById('chat-input');
                if (e.key === 'Enter') {
                    if (document.activeElement === chatInput) {
                        if (chatInput.value.trim() !== '') {
                            if (socket) socket.emit('chatMessage', chatInput.value);
                            else {
                                const msg = document.createElement('div');
                                msg.innerHTML = `<strong>${currentUsername}</strong>: ${chatInput.value}`;
                                document.getElementById('chat-messages').appendChild(msg);
                                document.getElementById('chat-messages').scrollTop = 9999;
                            }
                            chatInput.value = '';
                        }
                        chatInput.blur(); 
                    } else { chatInput.focus(); }
                    return; 
                }
                if (document.activeElement !== chatInput) keysPressed[e.key.toLowerCase()] = true;
            });

            window.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
            
            const canvas = document.getElementById('canvas-container');
            canvas.addEventListener('mousedown', () => { isDragging = true; try { document.body.requestPointerLock(); } catch(e){} });
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('pointerlockchange', () => isLocked = document.pointerLockElement === document.body);
            
            document.addEventListener('mousemove', e => {
                if (isLocked || isDragging) {
                    cameraYaw -= e.movementX * 0.002; cameraPitch -= e.movementY * 0.002;
                    cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                }
            });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }

        function updateMinimap() {
            if (!minimapCtx) return;
            const ctx = minimapCtx; ctx.clearRect(0, 0, 200, 200);
            
            ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(100, 100, 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(136, 204, 255, 0.4)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(100, 100, (600/MAP_RADIUS)*100, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(100, 100, (1200/MAP_RADIUS)*100, 0, Math.PI*2); ctx.stroke();

            const px = 100 + (playerLocalPos.x / MAP_RADIUS) * 100;
            const py = 100 + (playerLocalPos.z / MAP_RADIUS) * 100;
            ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.sin(cameraYaw)*12, py - Math.cos(cameraYaw)*12); ctx.stroke();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            const vPressed = keysPressed['v'];
            if (vPressed && !vKeyWasPressed) { isFPS = !isFPS; }
            vKeyWasPressed = vPressed;

            const fPressed = keysPressed['f'];
            let tryInteract = fPressed && !fKeyWasPressed;
            fKeyWasPressed = fPressed;

            // --- 列車の絶対時間同期（加減速イージング対応） ---
            const nowSec = Date.now() / 1000;
            const TRAIN_BASE_SPEED = 0.08;
            const TRAIN_STOP_TIME = 5.0; 

            trains.forEach(t => {
                const moveTime = t.sectionAngle / TRAIN_BASE_SPEED; 
                const sectionTotalTime = moveTime + TRAIN_STOP_TIME;
                const cycleTime = sectionTotalTime * (Math.PI * 2 / t.sectionAngle);
                
                const initOffsetTime = t.initialSection * sectionTotalTime;
                const currentT = (nowSec + initOffsetTime) % cycleTime;
                
                const currentSection = Math.floor(currentT / sectionTotalTime);
                const timeInSection = currentT % sectionTotalTime;
                
                let newAngle = t.phaseOffset + currentSection * t.sectionAngle;
                
                if (timeInSection < moveTime) {
                    // サイン波イージング
                    const progress = timeInSection / moveTime;
                    const eased = (1 - Math.cos(progress * Math.PI)) / 2;
                    newAngle += eased * t.sectionAngle;
                    t.state = 'moving';
                } else {
                    newAngle += t.sectionAngle;
                    t.state = 'stopped';
                }
                
                t.angle = newAngle % (Math.PI * 2);

                let r = t.radius;
                let dr = 0;
                if (t.type === 'curve') {
                    r = 900 - 300 * Math.cos(4 * t.angle);
                    dr = 1200 * Math.sin(4 * t.angle); 
                    t.radius = r;
                }
                const pt = new THREE.Vector3(Math.cos(t.angle) * r, 80, Math.sin(t.angle) * r);
                
                const dx = dr * Math.cos(t.angle) - r * Math.sin(t.angle);
                const dz = dr * Math.sin(t.angle) + r * Math.cos(t.angle);
                const rot = Math.atan2(dx, dz);

                t.mesh.position.copy(pt); t.mesh.rotation.y = rot;
            });

            // ショップアイテムとホッケーの更新
            shopItems.forEach(item => item.mesh.rotation.y += delta);

            if (puckData) {
                let p1Ready = false, p2Ready = false;
                if (playerLocalPos.z < -4500 && playerLocalPos.x > 4500) {
                    if (Math.hypot(playerLocalPos.x - 5100, playerLocalPos.z - HOCKEY_P1_Z) < 15) p1Ready = true;
                    if (Math.hypot(playerLocalPos.x - 5100, playerLocalPos.z - HOCKEY_P2_Z) < 15) p2Ready = true;
                }
                Object.values(otherPlayers).forEach(p => {
                    if (Math.hypot(p.position.x - 5100, p.position.z - HOCKEY_P1_Z) < 15) p1Ready = true;
                    if (Math.hypot(p.position.x - 5100, p.position.z - HOCKEY_P2_Z) < 15) p2Ready = true;
                });

                if (p1Ready && p2Ready) {
                    puckData.x += puckData.vx * delta; puckData.z += puckData.vz * delta;
                    puckData.vx *= 0.98; puckData.vz *= 0.98;
                    if (puckData.x < puckData.tableX - 35) { puckData.x = puckData.tableX - 35; puckData.vx *= -1; }
                    if (puckData.x > puckData.tableX + 35) { puckData.x = puckData.tableX + 35; puckData.vx *= -1; }
                    if (puckData.z < puckData.tableZ - 65) { puckData.z = puckData.tableZ - 65; puckData.vz *= -1; }
                    if (puckData.z > puckData.tableZ + 65) { puckData.z = puckData.tableZ + 65; puckData.vz *= -1; }
                    puckData.mesh.position.set(puckData.x, 16, puckData.z);
                    puckData.mesh.material.color.setHex(0xff0000); 
                } else {
                    puckData.vx = 0; puckData.vz = 0;
                    puckData.x = puckData.tableX; puckData.z = puckData.tableZ; 
                    puckData.mesh.position.set(puckData.x, 16, puckData.z);
                    puckData.mesh.material.color.setHex(0x555555); 
                }
            }

            // インタラクション判定
            let promptText = "", interactTarget = null;
            
            if (ridingDrone) {
                promptText = "ドローンから降りる";
                if (tryInteract) { ridingDrone = null; playerLocalPos.y += 2; updateAvatarState(); }
            } else if (ridingTrain) {
                const pt = ridingTrain.mesh.position;
                playerLocalPos.set(pt.x, pt.y + 2, pt.z); 

                let canAlight = false; let nearestStation = null;
                for (let st of stationAreas) {
                    if (st.type === 'rect' && Math.hypot(pt.x - st.x, pt.z - st.z) < 60) {
                        canAlight = true; nearestStation = st; break;
                    }
                }

                if (canAlight) {
                    promptText = "駅で降りる";
                    if (tryInteract) {
                        const offset = (ridingTrain.radius === 600) ? -20 : 20;
                        const dirX = Math.cos(nearestStation.angle);
                        const dirZ = Math.sin(nearestStation.angle);
                        playerLocalPos.set(nearestStation.x + dirX*offset, 81.5, nearestStation.z + dirZ*offset);
                        ridingTrain = null;
                        updateAvatarState();
                    }
                } else {
                    promptText = "走行中... (駅で降りられます)";
                }
            } else if (!isWarping) {
                let foundInteract = false;
                
                // ホッケー
                if (puckData && puckData.mesh.material.color.getHex() === 0xff0000) {
                    if (Math.hypot(playerLocalPos.x - puckData.x, playerLocalPos.z - puckData.z) < 25) {
                        promptText = "パックを打つ (F)";
                        interactTarget = () => { puckData.vx = -Math.sin(cameraYaw) * 400; puckData.vz = -Math.cos(cameraYaw) * 400; };
                        foundInteract = true;
                    }
                }

                // スロット & ショップ
                if (!foundInteract) {
                    for (let s of slotMachinesData) {
                        if (playerLocalPos.distanceTo(s.pos) < 25 && Math.abs(playerLocalPos.y - s.pos.y) < 10) {
                            promptText = s.label; interactTarget = () => { playSlotMachine(s); }; foundInteract = true; break;
                        }
                    }
                }
                if (!foundInteract) {
                    for (let item of shopItems) {
                        if (playerLocalPos.distanceTo(item.pos) < 25 && Math.abs(playerLocalPos.y - item.pos.y) < 10) {
                            promptText = item.label; 
                            interactTarget = () => { 
                                let moneyElem = document.getElementById('ui-money');
                                let money = parseInt(moneyElem.innerText) || 0;
                                if(money >= item.price) { money -= item.price; moneyElem.innerText = money; item.action(); } 
                                else { alert("CRが足りません！"); }
                            }; 
                            foundInteract = true; break;
                        }
                    }
                }

                // 列車
                if (!foundInteract) {
                    for (let t of trains) {
                        if (t.state === 'stopped' && Math.abs(playerLocalPos.y - t.mesh.position.y) < 15 && playerLocalPos.distanceTo(t.mesh.position) < 40) {
                            promptText = "列車に乗る"; interactTarget = () => { ridingTrain = t; updateAvatarState(); }; foundInteract = true; break;
                        }
                    }
                }

                // ワープ
                if (!foundInteract) {
                    for (let w of warpPads) {
                        if (playerLocalPos.distanceTo(w.mesh.position) < 15 && Math.abs(playerLocalPos.y - w.mesh.position.y) < 10) {
                            promptText = w.label; 
                            interactTarget = () => { 
                                isWarping = true; 
                                playerLocalPos.copy(w.target); 
                                setTimeout(() => { isWarping = false; playerVelocityY = 0; }, 500); 
                            }; 
                            foundInteract = true; break;
                        }
                    }
                }

                // ドローン
                if (!foundInteract) {
                    for (let i = 0; i < personalDrones.length; i++) {
                        const d = personalDrones[i];
                        if (playerLocalPos.distanceTo(d.position) < 15 && Math.abs(playerLocalPos.y - d.position.y) < 10) {
                            let isOccupied = false;
                            Object.values(otherPlayers).forEach(p => { if (p.userData.ridingDroneIndex === i) isOccupied = true; });
                            if (!isOccupied) {
                                promptText = "ドローンに乗る"; 
                                interactTarget = () => { ridingDrone = d; playerLocalPos.copy(d.position); playerLocalPos.y += 4; updateAvatarState(); }; 
                                break;
                            }
                        }
                    }
                }
                
                if (interactTarget && tryInteract) interactTarget();
            }

            const promptEl = document.getElementById('interaction-prompt');
            if (promptText) { document.getElementById('prompt-text').innerText = promptText; promptEl.style.display = 'block'; }
            else promptEl.style.display = 'none';

            // WASD移動とコリジョン
            if (!isWarping && !ridingTrain && document.activeElement !== document.getElementById('chat-input')) {
                const speed = (keysPressed['shift'] ? 120 : 50) * playerSpeedMult * delta;
                
                const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
                const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
                
                let mv = new THREE.Vector3();
                if (keysPressed['w']) mv.add(fwd);
                if (keysPressed['s']) mv.sub(fwd);
                if (keysPressed['a']) mv.sub(right); 
                if (keysPressed['d']) mv.add(right); 
                if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed);

                let nextPos = new THREE.Vector3(playerLocalPos.x + mv.x, playerLocalPos.y, playerLocalPos.z + mv.z);

                // --- 物理コリジョン（壁）によるクランプ処理 ---
                if (!ridingDrone && !ridingTrain && !isWarping) {
                    let y = playerLocalPos.y;
                    
                    if (Math.abs(y - 1350) < 20) {
                        const dist = Math.hypot(nextPos.x, nextPos.z);
                        if (dist > 245) { 
                            const angle = Math.atan2(nextPos.z, nextPos.x);
                            nextPos.x = Math.cos(angle) * 245; nextPos.z = Math.sin(angle) * 245;
                        }
                    } else if (Math.abs(y - 80) < 20) {
                        let currentSt = null;
                        for (let st of stationAreas) {
                            if (st.type === 'rect') {
                                const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                                const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                                const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                                if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { currentSt = st; break; }
                            }
                        }
                        
                        if (currentSt) {
                            const dx = nextPos.x - currentSt.x, dz = nextPos.z - currentSt.z;
                            const cos = Math.cos(-currentSt.angle), sin = Math.sin(-currentSt.angle);
                            let lx = dx * cos - dz * sin; let lz = dx * sin + dz * cos;
                            
                            const hw = currentSt.width/2 - 1.5; const hd = currentSt.depth/2 - 1.5;
                            if (lx > hw) lx = hw; if (lx < -hw) lx = -hw;
                            if (lz > hd) lz = hd; if (lz < -hd) lz = -hd;
                            
                            const cosInv = Math.cos(currentSt.angle), sinInv = Math.sin(currentSt.angle);
                            nextPos.x = currentSt.x + lx * cosInv - lz * sinInv;
                            nextPos.z = currentSt.z + lx * sinInv + lz * cosInv;
                        }
                    } else if (y < 10) {
                        // 地上の巨大施設の壁コリジョン
                        const corners = [{x: 1000, z: 1000}, {x: -1000, z: 1000}, {x: 1000, z: -1000}, {x: -1000, z: -1000}];
                        for(let c of corners) {
                            if (Math.hypot(nextPos.x - c.x, nextPos.z - c.z) < 225) {
                                const angle = Math.atan2(nextPos.z - c.z, nextPos.x - c.x);
                                nextPos.x = c.x + Math.cos(angle) * 225;
                                nextPos.z = c.z + Math.sin(angle) * 225;
                            }
                        }
                    }
                }
                
                if (ridingDrone) {
                    let nextY = playerLocalPos.y;
                    if (keysPressed['e']) nextY += 60 * delta; 
                    if (keysPressed['q']) nextY -= 60 * delta; 
                    nextY = Math.max(1, nextY);
                    playerLocalPos.set(nextPos.x, nextY, nextPos.z);
                    ridingDrone.position.copy(playerLocalPos); ridingDrone.position.y -= 4;
                } else {
                    playerLocalPos.x = nextPos.x; playerLocalPos.z = nextPos.z;
                }
            }

            // 重力と落下処理
            if (!ridingDrone && !ridingTrain && !isWarping) {
                let groundY = 1.5; 
                
                if (Math.abs(playerLocalPos.y - 1350) < 20 && Math.hypot(playerLocalPos.x, playerLocalPos.z) < 245) {
                    groundY = 1350;
                } else if (Math.abs(playerLocalPos.y - 80) < 20) {
                    let onStation = false;
                    for (let st of stationAreas) {
                        if (st.type === 'rect') {
                            const dx = playerLocalPos.x - st.x, dz = playerLocalPos.z - st.z;
                            const cos = Math.cos(-st.angle), sin = Math.sin(-st.angle);
                            const lx = dx * cos - dz * sin, lz = dx * sin + dz * cos;
                            if (Math.abs(lx) < (st.width/2) && Math.abs(lz) < (st.depth/2)) { onStation = true; break; }
                        }
                    }
                    if (onStation) groundY = 80;
                } else if (Math.abs(playerLocalPos.y - 60) < 10) {
                    // ドローンパッドの正確な床判定
                    let onPad = false;
                    for (let st of stationAreas) {
                        if (st.type === 'circle' && Math.hypot(playerLocalPos.x - st.x, playerLocalPos.z - st.z) < st.radius) {
                            onPad = true; break;
                        }
                    }
                    if (onPad) groundY = 60;
                }

                if (playerLocalPos.y > groundY + 0.1) {
                    playerVelocityY -= 40 * delta; 
                    playerLocalPos.y += playerVelocityY * delta;
                    if (playerLocalPos.y <= groundY) { playerLocalPos.y = groundY; playerVelocityY = 0; }
                } else {
                    playerLocalPos.y = groundY; playerVelocityY = 0;
                }
            }

            // 自キャラアバターの更新と通信
            if (localAvatar) {
                localAvatar.position.copy(playerLocalPos);
                localAvatar.visible = !isFPS;
                localAvatar.children[0].material.color.setHex(playerColor);
                
                if (ridingTrain) {
                    localAvatar.rotation.y = ridingTrain.mesh.rotation.y;
                } else if (!isWarping && !ridingDrone && document.activeElement !== document.getElementById('chat-input')) {
                    if (keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d']) {
                        let targetYaw = cameraYaw;
                        if (keysPressed['s']) targetYaw += Math.PI;
                        else if (keysPressed['a']) targetYaw += Math.PI/2;
                        else if (keysPressed['d']) targetYaw -= Math.PI/2;
                        localAvatar.rotation.y = targetYaw;
                    } else { localAvatar.rotation.y = cameraYaw; }
                }

                if (socket) {
                    const distSq = lastSentPos.distanceToSquared(playerLocalPos);
                    const rotDiff = Math.abs(lastSentRot - localAvatar.rotation.y);
                    if (distSq > 0.05 || rotDiff > 0.05) {
                        socket.emit('playerMovement', { x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, rotation: localAvatar.rotation.y });
                        lastSentPos.copy(playerLocalPos); lastSentRot = localAvatar.rotation.y;
                    }
                }
            }

            Object.values(otherPlayers).forEach(mesh => {
                if (mesh.userData.ridingTrainIndex >= 0) {
                    const t = trains[mesh.userData.ridingTrainIndex];
                    if (t) { mesh.position.set(t.mesh.position.x, t.mesh.position.y + 2, t.mesh.position.z); mesh.rotation.y = t.mesh.rotation.y; }
                }
                if (mesh.userData.ridingDroneIndex >= 0) {
                    const d = personalDrones[mesh.userData.ridingDroneIndex];
                    if (d) { d.position.copy(mesh.position); d.position.y -= 4; }
                }
            });

            const camTarget = playerLocalPos.clone();
            if (isFPS) {
                camera.position.copy(camTarget); camera.position.y += 1.6 * 2.5;
            } else {
                const offset = new THREE.Vector3(Math.sin(cameraYaw)*35, 20 + Math.sin(cameraPitch)*20, Math.cos(cameraYaw)*35);
                camera.position.copy(camTarget).add(offset);
                camTarget.y += 4; 
            }
            const lookDir = new THREE.Vector3(-Math.sin(cameraYaw) * Math.cos(cameraPitch), Math.sin(cameraPitch), -Math.cos(cameraYaw) * Math.cos(cameraPitch));
            camera.lookAt(camera.position.clone().add(lookDir));

            updateMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
