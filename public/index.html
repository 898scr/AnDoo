<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUYARC Metaverse</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; color: #fff; }
        
        /* ログイン画面 (Kanazawa Metaverse風) */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .panel { background: rgba(30, 41, 59, 0.9); padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 300px;}
        .panel h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        .panel input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; }
        .panel button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #f43f5e; color: white; }
        .btn-danger:hover { background: #e11d48; }
        .error-msg { color: #f43f5e; font-size: 0.9rem; text-align: center; min-height: 20px; }

        /* アバター選択 */
        .color-picker { display: flex; justify-content: space-between; margin-bottom: 15px; margin-top: 10px;}
        .color-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .color-btn.selected { box-shadow: 0 0 10px #fff, 0 0 15px currentColor; transform: scale(1.1); }

        /* 左側固定サイドバーUI */
        #sidebar {
            display: none;
            position: absolute; top: 0; left: 0; width: 280px; height: 100vh;
            background: rgba(10, 15, 30, 0.7); backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0,255,255,0.2); z-index: 10;
            padding: 20px; box-sizing: border-box;
            flex-direction: column; gap: 20px;
        }
        .sidebar-section { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .sidebar-section h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #00ffff; text-transform: uppercase; letter-spacing: 1px;}
        
        .user-id { font-size: 1.2rem; font-weight: bold; color: #fff; word-break: break-all;}
        .money { font-size: 1.8rem; color: #facc15; font-weight: bold; margin-top: 5px; text-shadow: 0 0 10px rgba(250,204,21,0.5);}
        .coords { font-size: 0.9rem; color: #94a3b8; font-family: monospace; }
        
        /* チャットUI */
        #chat-container { display: flex; flex-direction: column; height: 100%; }
        #chat-log { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 5px; padding-right: 5px;}
        #chat-log::-webkit-scrollbar { width: 4px; }
        #chat-log::-webkit-scrollbar-thumb { background: #00ffff; border-radius: 4px; }
        .chat-msg { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 6px; border-left: 2px solid #00ffff; word-break: break-all;}
        .chat-msg.system { border-left-color: #facc15; color: #cbd5e1; font-style: italic; }
        .chat-msg span.name { color: #00ffff; font-weight: bold; margin-right: 5px; }
        #chat-input-wrapper { display: flex; gap: 5px; }
        #chat-input { flex-grow: 1; padding: 8px; border: 1px solid #334155; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; }
        #chat-send { padding: 8px 12px; background: #00ffff; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* クロスヘア (FPS/TPS 視点用) */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px; background: rgba(0,255,255,0.8); border-radius: 50%;
            pointer-events: none; z-index: 5; display: none; box-shadow: 0 0 5px #00ffff;
        }

        /* 操作ヒント */
        #controls-help {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px;
            font-size: 0.85rem; color: #94a3b8; line-height: 1.6; border: 1px solid rgba(0,255,255,0.2);
            display: none;
        }

        /* 管理者パネル */
        #admin-btn { display: none; margin-top: 10px; background: #f43f5e; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;}
        #admin-btn:hover { background: #e11d48; }

        #admin-dashboard-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center;
        }
        .admin-panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 2px solid #f43f5e; width: 600px; max-width: 90vw; color: white; }
        .admin-panel h2 { color: #f43f5e; margin-top: 0; }
        .admin-section { margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 6px; }
        .admin-log-box { height: 150px; overflow-y: auto; background: #000; padding: 10px; font-family: monospace; font-size: 0.8rem; border: 1px solid #333; margin-top: 10px;}

        /* 通知 */
        #notification-container {
            position: absolute; top: 20px; right: 20px; z-index: 50;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            padding: 12px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease-out forwards, fadeOut 0.5s ease-in 4.5s forwards;
            opacity: 0; transform: translateX(100%); background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;
        }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #f43f5e; }
        .toast.info { border-left: 4px solid #00ffff; }

        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }

        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1;}
    </style>
    <!-- Three.js & Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- 1. ログイン & 登録フロー画面 (STEP方式を完全復元) -->
    <div id="login-screen">
        <!-- STEP 1: アカウント入力 -->
        <div class="panel" id="login-panel">
            <h2>HAKUYARC</h2>
            <div id="login-error" class="error-msg"></div>
            <input type="text" id="login-username" placeholder="UserID" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button class="btn-primary" onclick="attemptLogin()">ログイン / START</button>
            
            <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px; text-align: center;">
                <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;">初めての方はこちら</p>
                <button class="btn-success" onclick="switchPanel('register-panel')">新規登録 (無料)</button>
            </div>
        </div>

        <!-- STEP 2: 新規登録 アカウント作成 -->
        <div class="panel" id="register-panel" style="display: none;">
            <h2>新規登録 (STEP 1/4)</h2>
            <div id="reg-error" class="error-msg"></div>
            <input type="text" id="reg-username" placeholder="希望のUserID" required>
            <input type="password" id="reg-password" placeholder="パスワード" required>
            
            <label style="display: flex; align-items: center; gap: 5px; font-size: 0.8rem; margin: 10px 0; color: #cbd5e1; cursor: pointer;">
                <input type="checkbox" id="terms-checkbox" style="width: auto;">
                <span style="color:#38bdf8; text-decoration: underline;" onclick="document.getElementById('terms-modal').style.display='flex'">利用規約とプライバシーポリシー</span>に同意する
            </label>
            
            <button class="btn-success" onclick="goToTypeSetup()">次へ (機体選択)</button>
            <button class="btn-danger" style="margin-top: 10px; background: transparent; border: 1px solid #475569;" onclick="switchPanel('login-panel')">キャンセル</button>
        </div>

        <!-- STEP 3: 機体タイプ選択 -->
        <div class="panel" id="avatar-type-panel" style="display: none;">
            <h2>機体選択 (STEP 2/4)</h2>
            <p style="font-size: 0.8rem; color: #94a3b8; text-align: center;">ベースとなる機体フレームを選択してください。</p>
            
            <button class="btn-primary" style="margin-top: 10px; padding: 15px;" onclick="goToVisorSetup('typeA')">
                TYPE-A (Standard)<br><small style="color: #bae6fd;">バランス型 多面体フレーム</small>
            </button>
            <button class="btn-primary" style="margin-top: 10px; padding: 15px; background: #3b82f6;" onclick="goToVisorSetup('typeB')">
                TYPE-B (Heavy)<br><small style="color: #bfdbfe;">重装甲 円柱ベースフレーム</small>
            </button>
            <button class="btn-primary" style="margin-top: 10px; padding: 15px; background: #6366f1;" onclick="goToVisorSetup('typeC')">
                TYPE-C (Slim)<br><small style="color: #c7d2fe;">スピード型 流線型フレーム</small>
            </button>
            
            <button class="btn-danger" style="margin-top: 15px; background: transparent; border: 1px solid #475569;" onclick="switchPanel('register-panel')">戻る</button>
        </div>

        <!-- STEP 4: 発光色選択 -->
        <div class="panel" id="avatar-visor-panel" style="display: none;">
            <h2>発光色 (STEP 3/4)</h2>
            <p style="font-size: 0.8rem; color: #94a3b8; text-align: center;">バイザーとホログラムの発光色</p>
            <div class="color-picker" id="visor-color-picker"></div>
            <button class="btn-success" onclick="goToBodySetup()">次へ (装甲色)</button>
            <button class="btn-danger" style="margin-top: 10px; background: transparent; border: 1px solid #475569;" onclick="switchPanel('avatar-type-panel')">戻る</button>
        </div>

        <!-- STEP 5: 装甲色選択 -->
        <div class="panel" id="avatar-body-panel" style="display: none;">
            <h2>装甲色 (STEP 3/4)</h2>
            <p style="font-size: 0.8rem; color: #94a3b8; text-align: center;">メイン装甲(ボディ)のカラー</p>
            <div class="color-picker" id="body-color-picker"></div>
            <button class="btn-success" onclick="goToShapeSetup()">次へ (体形調整)</button>
            <button class="btn-danger" style="margin-top: 10px; background: transparent; border: 1px solid #475569;" onclick="switchPanel('avatar-visor-panel')">戻る</button>
        </div>

        <!-- STEP 6: 体形調整 & 完了 -->
        <div class="panel" id="avatar-shape-panel" style="display: none; width: 350px;">
            <h2>最終調整 (STEP 4/4)</h2>
            <div id="setup-preview-box" style="width: 100%; height: 200px; background: #000; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; position: relative; overflow: hidden;">
                <span style="position: absolute; top:5px; left:5px; font-size:0.7rem; color:#94a3b8; z-index: 5;">Preview</span>
            </div>
            
            <div class="setup-slider">
                <label>身長 (Height) : <span id="val-height">1.00</span></label>
                <input type="range" id="shape-height" min="0.5" max="1.5" step="0.05" value="1.0" oninput="updateShapeParams()">
            </div>
            <div class="setup-slider">
                <label>横幅 (Width) : <span id="val-width">1.00</span></label>
                <input type="range" id="shape-width" min="0.5" max="1.5" step="0.05" value="1.0" oninput="updateShapeParams()">
            </div>
            <div id="setup-error" class="error-msg"></div>
            
            <button class="btn-success" style="margin-top: 15px; padding: 15px; font-size: 1.1rem;" onclick="attemptRegister()">HAKUYARCにダイブする</button>
            <button class="btn-danger" style="margin-top: 10px; background: transparent; border: 1px solid #475569;" onclick="switchPanel('avatar-body-panel')">戻る</button>
        </div>
    </div>
    
    <!-- 利用規約モーダル (変更なし) -->
        <b>Space</b> : ジャンプ<br>
        <b>マウス</b> : 視点移動<br>
        <b>V</b> : FPS/TPS 切替<br>
        <b>Enter</b> : チャット入力<br>
        <b>Esc</b> : 操作ロック解除
    </div>

    <div id="notification-container"></div>
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // ★ 登録・設定フローのUIロジック
        // ==========================================
        let regData = {
            username: '', password: '', avatarType: 'typeA', 
            colorBody: '#dddddd', colorVisor: '#00f3ff', scaleH: 1.0, scaleW: 1.0
        };
        let selectedBodyColor = regData.colorBody;
        let selectedVisorColor = regData.colorVisor;
        
        function switchPanel(panelId) {
            ['login-panel', 'register-panel', 'avatar-type-panel', 'avatar-visor-panel', 'avatar-body-panel', 'avatar-shape-panel'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById('login-error').innerText = '';
            document.getElementById('reg-error').innerText = '';
            document.getElementById('setup-error').innerText = '';
            document.getElementById(panelId).style.display = 'block';
        }

        // --- STEP 1 -> 2 ---
        async function goToTypeSetup() {
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value;
            const terms = document.getElementById('terms-checkbox').checked;
            
            if(!user || !pass) return document.getElementById('reg-error').innerText = 'IDとパスワードを入力してください';
            if(!terms) return document.getElementById('reg-error').innerText = '利用規約への同意が必要です';
            if(!/^[a-zA-Z0-9_]+$/.test(user)) return document.getElementById('reg-error').innerText = 'IDは半角英数字と_のみ使用可能です';
            
            try {
                const res = await fetch('/api/check-username', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user })
                });
                const data = await res.json();
                if (!data.success) {
                    return document.getElementById('reg-error').innerText = data.message;
                }
                
                regData.username = user; 
                regData.password = pass;
                switchPanel('avatar-type-panel');
            } catch (e) {
                document.getElementById('reg-error').innerText = 'サーバー通信エラーが発生しました';
            }
        }

        // --- STEP 2 -> 3 ---
        function goToVisorSetup(type) {
            regData.avatarType = type;
            switchPanel('avatar-visor-panel');
        }

        // --- STEP 3 -> 4 ---
        function goToBodySetup() {
            regData.colorVisor = selectedVisorColor;
            switchPanel('avatar-body-panel');
        }

        // --- STEP 4 -> 5 (Preview) ---
        function goToShapeSetup() {
            regData.colorBody = selectedBodyColor;
            switchPanel('avatar-shape-panel');
            // パネルが表示されてからプレビューを初期化 (DOMの幅を取得するため)
            setTimeout(initPreview, 50);
        }

        // カラーピッカー (バイザー)
        const visorColors = ['#00f3ff', '#ff0055', '#00ff66', '#facc15', '#a855f7', '#ffffff'];
        const visorContainer = document.getElementById('visor-color-picker');
        visorColors.forEach(color => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = color;
            if (color === selectedVisorColor) btn.classList.add('selected');
            btn.onclick = () => {
                document.querySelectorAll('#visor-color-picker .color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedVisorColor = color;
            };
            visorContainer.appendChild(btn);
        });

        // カラーピッカー (装甲/ボディ)
        const bodyColors = ['#dddddd', '#555555', '#1a1a1a', '#1e3a8a', '#7f1d1d', '#14532d', '#78350f', '#d97706'];
        const bodyContainer = document.getElementById('body-color-picker');
        bodyColors.forEach(color => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = color;
            if (color === selectedBodyColor) btn.classList.add('selected');
            btn.onclick = () => {
                document.querySelectorAll('#body-color-picker .color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedBodyColor = color;
            };
            bodyContainer.appendChild(btn);
        });

        // --- プレビューレンダラー ---
        let previewScene, previewCamera, previewRenderer, previewAvatar, previewReqId;
        
        function initPreview() {
            const container = document.getElementById('setup-preview-box');
            if(!previewRenderer) {
                previewScene = new THREE.Scene();
                previewScene.add(new THREE.AmbientLight(0x445566, 2.0));
                const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
                dirLight.position.set(2, 5, 3);
                previewScene.add(dirLight);

                previewCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
                previewCamera.position.set(0, 1.2, 3.5);

                previewRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                previewRenderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(previewRenderer.domElement);

                function renderPreview() {
                    previewReqId = requestAnimationFrame(renderPreview);
                    if(previewAvatar) {
                        previewAvatar.rotation.y += 0.015; // ゆっくり回転
                    }
                    previewRenderer.render(previewScene, previewCamera);
                }
                renderPreview();
            }
            
            // 既存のアバターがあれば削除して再生成 (選んだ色が反映されるように)
            if(previewAvatar) previewScene.remove(previewAvatar);
            
            // プレビュー用に新規生成
            previewAvatar = createAvatarMesh(selectedVisorColor, selectedBodyColor, regData.avatarType);
            previewAvatar.position.y = -0.5; 
            previewScene.add(previewAvatar);
            
            // スライダーの初期値を適用
            updateShapeParams();
        }

        function updateShapeParams() {
            const h = parseFloat(document.getElementById('shape-height').value);
            const w = parseFloat(document.getElementById('shape-width').value);
            document.getElementById('val-height').innerText = h.toFixed(2);
            document.getElementById('val-width').innerText = w.toFixed(2);
            
            regData.scaleH = h;
            regData.scaleW = w;
            
            if(previewAvatar) {
                previewAvatar.scale.set(w, h, w);
            }
        }

        function showAuthError(msg, isSuccess = false) {
            const el = document.getElementById('auth-error');
            el.style.color = isSuccess ? '#10b981' : '#f43f5e';
            el.innerText = msg;
        }

        function showNotification(type, text) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = text;
            container.appendChild(toast);
            setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 5000);
        }

        function addChatLog(name, text, isSystem = false) {
            const log = document.getElementById('chat-log');
            const msg = document.createElement('div');
            msg.className = 'chat-msg' + (isSystem ? ' system' : '');
            if (isSystem) {
                msg.innerText = text;
            } else {
                msg.innerHTML = `<span class="name">${name}:</span> ${text}`;
            }
            log.appendChild(msg);
            log.scrollTop = log.scrollHeight;
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text && socket) {
                socket.emit('chatMessage', text);
                input.value = '';
            }
        }

        // ==========================================
        // ★ エラー修正: 要素が存在するか確認してからイベントリスナーを追加
        // ==========================================
        const chatInputEl = document.getElementById('chat-input');
        if (chatInputEl) {
            chatInputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChat();
            });
        }

        // Admin機能
        function openAdminDashboard() { 
            document.getElementById('admin-dashboard-modal').style.display = 'flex'; 
            fetchAdminLogs();
        }
        function fetchAdminLogs() {
            if (socket && isAdmin) socket.emit('adminCmd', { action: 'getLogs' });
        }
        function adminAction(actionType) {
            const target = document.getElementById('admin-target-user').value.trim();
            if (!target) return alert("対象ユーザーIDを入力してください。");
            
            let amount = 0;
            if (actionType === 'setMoney') {
                amount = document.getElementById('admin-target-cr').value;
                if (!amount) return alert("金額を入力してください。");
            }
            if (confirm(`本当に ${target} に対して ${actionType} を実行しますか？`)) {
                socket.emit('adminCmd', { action: actionType, target: target, amount: amount });
                alert("コマンドを送信しました。");
            }
        }

        function setupSocketEvents() {
            socket.on('initData', (data) => {
                if (data.customMap) buildMap(data.customMap); // 外部JSONマップがあれば読み込み
                
                Object.keys(data.players).forEach(id => {
                    const info = data.players[id];
                    if (id !== socket.id) addOtherPlayer(info);
                });
            });

            socket.on('newPlayer', (info) => {
                addChatLog('SYSTEM', `${info.username} がログインしました`, true);
                addOtherPlayer(info);
            });

            socket.on('playerMoved', (info) => {
                if (otherPlayers[info.id]) {
                    // 位置情報を更新（補間用に目標値を設定）
                    otherPlayers[info.id].userData.targetPos = new THREE.Vector3(info.x, info.y, info.z);
                    otherPlayers[info.id].userData.targetYaw = info.rotation;
                    otherPlayers[info.id].userData.targetPitch = info.pitch;
                    otherPlayers[info.id].userData.isGrounded = info.isGrounded;
                    otherPlayers[info.id].userData.movingTimer = 0.1; // 動いている判定用
                }
            });

            socket.on('chatMessage', (data) => {
                addChatLog(data.username, data.text);
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            });

            socket.on('forceUpdateCR', (data) => {
                if (data.user === currentUser) {
                    userCR = data.cr;
                    document.getElementById('ui-cr').innerText = userCR;
                    showNotification('info', `管理者によってCRが ${userCR} に設定されました`);
                }
            });
            
            socket.on('banned', (targetUser) => {
                if (targetUser === currentUser) {
                    alert("このアカウントは管理者によりBANされました。");
                    window.location.reload();
                } else {
                    addChatLog('SYSTEM', `${targetUser} はサーバーから追放されました`, true);
                }
            });

            socket.on('adminLogs', (logs) => {
                if (!isAdmin) return;
                
                const chatBox = document.getElementById('admin-log-chat');
                chatBox.innerHTML = logs.chat.reverse().map(l => `[${new Date(l.time).toLocaleTimeString()}] <b>${l.user}</b>: ${l.text}`).join('<br>');
                
                const authBox = document.getElementById('admin-log-auth');
                authBox.innerHTML = logs.auth.reverse().map(l => `[${new Date(l.time).toLocaleTimeString()}] <b>${l.user}</b>: ${l.action}`).join('<br>');
            });

            socket.on('disconnect', () => {
                showNotification('error', 'サーバーから切断されました');
            });
        }


        // ==========================================
        // ★ 3D エンジン & ゲームロジック
        // ==========================================
        let scene, camera, renderer, clock;
        let mapGroup = null;
        let collisionBoxes = []; // 当たり判定用のBox3配列
        
        let localAvatar = null;
        const otherPlayers = {};
        
        // プレイヤー状態
        let playerLocalPos = new THREE.Vector3(0, 3, 0);
        let playerVelocity = new THREE.Vector3(0, 0, 0);
        let isGrounded = false;
        
        // カメラ・操作状態
        let cameraYaw = 0; 
        let cameraPitch = 0;
        let targetAvatarRotation = 0;
        let isLocked = false;
        let isFPS = false;
        const keysPressed = {};

        function startGame() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';

            socket = io();
            socket.emit('joinGame', { username: currentUser, avatar: selectedAvatarColor });

            initThreeJS();
            setupSocketEvents();
        }

        // --- 次世代シンプル・スタイリッシュアバター生成 ---
        function createRoundedBox(width, height, depth, radius0, smoothness) {
            let shape = new THREE.Shape();
            let eps = 0.00001;
            let radius = radius0 - eps;
            shape.absarc(eps, eps, eps, -Math.PI / 2, -Math.PI, true);
            shape.absarc(eps, height - radius * 2, eps, Math.PI, Math.PI / 2, true);
            shape.absarc(width - radius * 2, height - radius * 2, eps, Math.PI / 2, 0, true);
            shape.absarc(width - radius * 2, eps, eps, 0, -Math.PI / 2, true);
            let geometry = new THREE.ExtrudeGeometry(shape, {
                depth: depth - radius0 * 2,
                bevelEnabled: true, bevelSegments: smoothness * 2, steps: 1, bevelSize: radius, bevelThickness: radius0, curveSegments: smoothness
            });
            geometry.center();
            return geometry;
        }

        function createAvatarMesh(colorHex) {
            const group = new THREE.Group();
            
            const matBody = new THREE.MeshStandardMaterial({ 
                color: colorHex, roughness: 0.2, metalness: 0.8, transparent: true, opacity: 0.9
            }); 
            const matDark = new THREE.MeshStandardMaterial({ color: 0x1a202c, roughness: 0.9 }); 
            
            // 胴体
            const torsoGeo = createRoundedBox(0.8, 1.2, 0.5, 0.1, 2);
            const torso = new THREE.Mesh(torsoGeo, matBody);
            torso.position.y = 1.3;
            torso.castShadow = true;
            group.add(torso);

            // 頭部
            const headGroup = new THREE.Group();
            headGroup.position.y = 2.0; 
            const headGeo = createRoundedBox(0.6, 0.6, 0.6, 0.1, 2);
            const head = new THREE.Mesh(headGeo, matBody);
            head.position.y = 0.3; 
            head.castShadow = true;
            
            const matVisor = new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0x00ffff, emissiveIntensity: 1.0});
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.1), matVisor);
            visor.position.set(0, 0.35, -0.32);
            
            headGroup.add(head, visor);
            group.add(headGroup);

            // 腕
            const armGeo = createRoundedBox(0.25, 1.0, 0.25, 0.08, 2);
            const armLGroup = new THREE.Group();
            armLGroup.position.set(-0.55, 1.8, 0); 
            const armL = new THREE.Mesh(armGeo, matDark);
            armL.position.y = -0.4; armL.castShadow = true;
            armLGroup.add(armL);
            group.add(armLGroup);

            const armRGroup = new THREE.Group();
            armRGroup.position.set(0.55, 1.8, 0); 
            const armR = new THREE.Mesh(armGeo, matDark);
            armR.position.y = -0.4; armR.castShadow = true;
            armRGroup.add(armR);
            group.add(armRGroup);

            // 足
            const legGeo = createRoundedBox(0.3, 1.1, 0.3, 0.08, 2);
            const legLGroup = new THREE.Group();
            legLGroup.position.set(-0.2, 0.9, 0); 
            const legL = new THREE.Mesh(legGeo, matDark);
            legL.position.y = -0.45; legL.castShadow = true;
            legLGroup.add(legL);
            group.add(legLGroup);

            const legRGroup = new THREE.Group();
            legRGroup.position.set(0.2, 0.9, 0); 
            const legR = new THREE.Mesh(legGeo, matDark);
            legR.position.y = -0.45; legR.castShadow = true;
            legRGroup.add(legR);
            group.add(legRGroup);

            group.userData = { head: headGroup, armL: armLGroup, armR: armRGroup, legL: legLGroup, legR: legRGroup, walkTime: 0, movingTimer: 0 };
            return group;
        }

        function updateAvatarAnim(avatar, isMoving, isGrounded, delta, targetYaw, camPitch) {
            if (!avatar || !avatar.userData.head) return;
            const ud = avatar.userData;
            
            // スムーズな回転
            let diff = targetYaw - avatar.rotation.y;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            avatar.rotation.y += diff * 10 * delta;

            if (isMoving && isGrounded) {
                ud.walkTime += delta * 15; 
                const swing = Math.sin(ud.walkTime);
                ud.armL.rotation.x = swing * 0.8;
                ud.armR.rotation.x = -swing * 0.8;
                ud.legL.rotation.x = -swing * 0.8;
                ud.legR.rotation.x = swing * 0.8;
            } else if (!isGrounded) {
                // ジャンプ/落下モーション
                ud.armL.rotation.x = THREE.MathUtils.lerp(ud.armL.rotation.x, -Math.PI/6, 0.1);
                ud.armR.rotation.x = THREE.MathUtils.lerp(ud.armR.rotation.x, -Math.PI/6, 0.1);
                ud.legL.rotation.x = THREE.MathUtils.lerp(ud.legL.rotation.x, -Math.PI/8, 0.1);
                ud.legR.rotation.x = THREE.MathUtils.lerp(ud.legR.rotation.x, Math.PI/8, 0.1);
            } else {
                ud.walkTime = 0; 
                ud.armL.rotation.x = THREE.MathUtils.lerp(ud.armL.rotation.x, 0, 0.1);
                ud.armR.rotation.x = THREE.MathUtils.lerp(ud.armR.rotation.x, 0, 0.1);
                ud.legL.rotation.x = THREE.MathUtils.lerp(ud.legL.rotation.x, 0, 0.1);
                ud.legR.rotation.x = THREE.MathUtils.lerp(ud.legR.rotation.x, 0, 0.1);
            }
            
            const clampedPitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, camPitch));
            ud.head.rotation.x = clampedPitch;
        }

        // --- HAKUYARC 本格景観の生成 ---
        let trackSpline = null;
        const monorailCars = [];
        const monorailSpeed = 0.001; 
        let monorailProgress = [0, 0.015, 0.03]; 

        function buildHakuyarcCity() {
            // 土台
            const plazaGeo = new THREE.BoxGeometry(800, 2, 800);
            const plazaMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.8 });
            const plaza = new THREE.Mesh(plazaGeo, plazaMat);
            plaza.position.set(0, -1, 0);
            plaza.receiveShadow = true;
            mapGroup.add(plaza);
            collisionBoxes.push(new THREE.Box3().setFromObject(plaza));

            const lmGroup = new THREE.Group();
            
            const baseGeo = new THREE.CylinderGeometry(60, 90, 50, 4); 
            baseGeo.rotateY(Math.PI / 4);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.3, roughness: 0.4 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.set(0, 25, 0);
            base.castShadow = true; base.receiveShadow = true;
            lmGroup.add(base);
            collisionBoxes.push(new THREE.Box3().setFromObject(base));

            // ビルテクスチャ
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#113355'; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#66aadd'; 
            for(let i=0; i<128; i+=8) {
                for(let j=0; j<128; j+=16) {
                    if(Math.random() > 0.1) ctx.fillRect(i+1, j+2, 6, 12);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            const matSky = new THREE.MeshStandardMaterial({ map: tex, color: 0x88bbff, roughness: 0.3 });

            const mainTowerGeo = new THREE.BoxGeometry(50, 600, 50);
            const mainTower = new THREE.Mesh(mainTowerGeo, matSky); 
            mainTower.position.set(0, 350, 0); 
            mainTower.castShadow = true; mainTower.receiveShadow = true;
            lmGroup.add(mainTower);
            collisionBoxes.push(new THREE.Box3().setFromObject(mainTower));

            // エネルギーリング
            const neonMatCyan = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9 });
            const neonMatPink = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.9 });
            for (let i = 0; i < 4; i++) {
                const ringGeo = new THREE.TorusGeometry(55 + i * 8, 2, 16, 4); 
                ringGeo.rotateX(Math.PI / 2);
                ringGeo.rotateZ(Math.PI / 4);
                ringGeo.rotateX(Math.PI / 16 * (i % 2 === 0 ? 1 : -1));
                const ring = new THREE.Mesh(ringGeo, i % 2 === 0 ? neonMatCyan : neonMatPink);
                ring.position.set(0, 200 + i * 140, 0);
                lmGroup.add(ring);
            }
            mapGroup.add(lmGroup);

            // モノレールと駅
            const w = 350; const h = 300; const r = 80; const y = 60;  
            const points = [
                new THREE.Vector3(0, y, -h), new THREE.Vector3(w-r, y, -h),
                new THREE.Vector3(w, y, -h+r), new THREE.Vector3(w, y, 0),
                new THREE.Vector3(w, y, h-r), new THREE.Vector3(w-r, y, h),
                new THREE.Vector3(0, y, h), new THREE.Vector3(-w+r, y, h),
                new THREE.Vector3(-w, y, h-r), new THREE.Vector3(-w, y, 0),
                new THREE.Vector3(-w, y, -h+r), new THREE.Vector3(-w+r, y, -h),
            ];
            trackSpline = new THREE.CatmullRomCurve3(points, true);
            trackSpline.curveType = 'centripetal';
            trackSpline.tension = 0.5;

            const tubeGeo = new THREE.TubeGeometry(trackSpline, 200, 1.5, 8, true);
            const tubeMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.5 });
            const track = new THREE.Mesh(tubeGeo, tubeMat);
            track.castShadow = true; track.receiveShadow = true;
            mapGroup.add(track);

            for (let i = 0; i < 4; i++) {
                let t = (i * 3) / 12;
                const pt = trackSpline.getPoint(t);
                const tangent = trackSpline.getTangent(t);
                const stGroup = new THREE.Group();
                
                const pLen = 80; const pWid = 30;

                const platGeo = new THREE.BoxGeometry(pWid, 2, pLen);
                const platMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8 });
                const platform = new THREE.Mesh(platGeo, platMat);
                platform.position.set(0, -2, 0);
                stGroup.add(platform);
                
                const glassGeo = new THREE.BoxGeometry(0.5, 16, pLen);
                const glassMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
                const glassL = new THREE.Mesh(glassGeo, glassMat);
                glassL.position.set(pWid/2 - 0.5, 6, 0);
                const glassR = new THREE.Mesh(glassGeo, glassMat);
                glassR.position.set(-pWid/2 + 0.5, 6, 0);
                stGroup.add(glassL, glassR);

                const pillarGeo = new THREE.BoxGeometry(10, pt.y, 10);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(0, -pt.y/2, 0);
                pillar.castShadow = true;
                stGroup.add(pillar);
                
                // 柱の当たり判定
                const pillarBox = new THREE.Mesh(pillarGeo, pillarMat);
                pillarBox.position.copy(pt).add(new THREE.Vector3(0, -pt.y/2, 0));
                collisionBoxes.push(new THREE.Box3().setFromObject(pillarBox));

                stGroup.position.copy(pt);
                stGroup.rotation.y = Math.atan2(tangent.x, tangent.z);
                mapGroup.add(stGroup);
            }

            const carGeo = new THREE.BoxGeometry(6, 8, 20);
            const carMat = new THREE.MeshStandardMaterial({ color: 0xff3333, metalness: 0.3 });
            for(let i=0; i<3; i++) {
                const car = new THREE.Mesh(carGeo, carMat);
                car.castShadow = true;
                mapGroup.add(car);
                monorailCars.push(car);
            }
        }

        // --- 外部JSONマップの構築 ---
        function buildMap(mapData) {
            if (mapData.environment && mapData.environment.groundColor) {
                scene.background = new THREE.Color(mapData.environment.groundColor);
                scene.fog.color.set(mapData.environment.groundColor);
            }

            if (mapData.floors) {
                mapData.floors.forEach(f => {
                    let mesh;
                    const mat = new THREE.MeshStandardMaterial({ color: f.color });
                    if (f.type === 'rect') {
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(f.width, 1, f.depth), mat);
                        mesh.position.set(f.x, f.y - 0.5, f.z);
                    } else if (f.type === 'circle') {
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(f.radius, f.radius, 1, 32), mat);
                        mesh.position.set(f.x, f.y - 0.5, f.z);
                    }
                    if (mesh) {
                        mesh.receiveShadow = true;
                        mapGroup.add(mesh);
                        collisionBoxes.push(new THREE.Box3().setFromObject(mesh));
                    }
                });
            }

            if (mapData.walls) {
                mapData.walls.forEach(w => {
                    let mesh;
                    const mat = new THREE.MeshStandardMaterial({ color: w.color, roughness: 0.7 });
                    const height = w.maxY - w.minY;
                    const centerY = w.minY + height / 2;

                    if (w.type === 'rect') {
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(w.width, height, w.depth), mat);
                        mesh.position.set(w.x, centerY, w.z);
                    } else if (w.type === 'circle') {
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(w.radius, w.radius, height, 32), mat);
                        mesh.position.set(w.x, centerY, w.z);
                    }
                    if (mesh) {
                        mesh.castShadow = true; mesh.receiveShadow = true;
                        mapGroup.add(mesh);
                        collisionBoxes.push(new THREE.Box3().setFromObject(mesh));
                    }
                });
            }
        }

        function initThreeJS() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x0a1e3f);
            scene.fog = new THREE.FogExp2(0x0a1e3f, 0.003);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            mapGroup = new THREE.Group();
            scene.add(mapGroup);

            // ★追加: 起動時にHAKUYARC景観を生成する呼び出し
            buildHakuyarcCity();

            localAvatar = createAvatarMesh(selectedAvatarColor);
            scene.add(localAvatar);

            clock = new THREE.Clock();
            setupInputHandlers();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function addOtherPlayer(info) {
            const mesh = createAvatarMesh(info.avatar || 0xffffff);
            mesh.position.set(info.x, info.y, info.z);
            mesh.rotation.y = info.rotation;
            
            // 補間用データ
            mesh.userData.targetPos = new THREE.Vector3(info.x, info.y, info.z);
            mesh.userData.targetYaw = info.rotation;
            
            scene.add(mesh);
            otherPlayers[info.id] = mesh;
        }

        function togglePointerLock() {
            if (!isLocked) {
                document.body.requestPointerLock();
            } else {
                document.exitPointerLock();
            }
        }

        function setupInputHandlers() {
            window.addEventListener('keydown', (e) => {
                // チャット入力中や入力フィールドフォーカス時は操作を無効化
                if (document.activeElement.tagName === 'INPUT') return;
                keysPressed[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', (e) => {
                if (document.activeElement.tagName === 'INPUT') return;
                keysPressed[e.key.toLowerCase()] = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                const sensitivity = 0.002;
                cameraYaw -= e.movementX * sensitivity;
                cameraPitch -= e.movementY * sensitivity;
                cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
                document.getElementById('crosshair').style.display = (isLocked && isFPS) ? 'block' : 'none';
                document.getElementById('controls-help').style.display = isLocked ? 'block' : 'none';
            });
        }

        // 当たり判定 (シンプルなAABB)
        function checkCollision(newPos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(newPos.x, newPos.y + 1, newPos.z), 
                new THREE.Vector3(1, 2, 1)
            );
            for (let box of collisionBoxes) {
                if (playerBox.intersectsBox(box)) return true;
            }
            return false;
        }

        let vKeyWasPressed = false;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); 

            if (keysPressed['v'] && !vKeyWasPressed) {
                isFPS = !isFPS;
                document.getElementById('crosshair').style.display = (isLocked && isFPS) ? 'block' : 'none';
            }
            vKeyWasPressed = keysPressed['v'];

            if (localAvatar) {
                let moved = false;
                
                // 重力とジャンプ
                playerVelocity.y -= 30 * delta; 
                
                if (isLocked) {
                    const speed = keysPressed['shift'] ? 15.0 : 6.0;
                    const mv = new THREE.Vector3(0, 0, 0);
                    
                    const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
                    const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));

                    if (keysPressed['w']) mv.add(forward);
                    if (keysPressed['s']) mv.sub(forward);
                    if (keysPressed['a']) mv.sub(right);
                    if (keysPressed['d']) mv.add(right);

                    if (mv.lengthSq() > 0) {
                        mv.normalize().multiplyScalar(speed * delta);
                        moved = true;
                        
                        targetAvatarRotation = Math.atan2(mv.x, mv.z);
                    }

                    // 水平移動の衝突判定
                    const nextPosX = playerLocalPos.clone().add(new THREE.Vector3(mv.x, 0, 0));
                    if (!checkCollision(nextPosX)) playerLocalPos.x = nextPosX.x;
                    
                    const nextPosZ = playerLocalPos.clone().add(new THREE.Vector3(0, 0, mv.z));
                    if (!checkCollision(nextPosZ)) playerLocalPos.z = nextPosZ.z;

                    // ジャンプ
                    if (keysPressed[' ']) {
                        if (isGrounded) {
                            playerVelocity.y = 12;
                            isGrounded = false;
                            moved = true;
                        }
                    }
                }

                // 垂直移動の衝突判定 (落下・上昇)
                playerLocalPos.y += playerVelocity.y * delta;
                isGrounded = false;
                
                if (playerLocalPos.y < 0) { // 仮の床 (-1 + radius)
                    playerLocalPos.y = 0;
                    playerVelocity.y = 0;
                    isGrounded = true;
                } else {
                    // 下方向へのレイキャストの代用 (Box判定)
                    if (playerVelocity.y <= 0 && checkCollision(playerLocalPos)) {
                         // 足元がめり込んだら押し上げる (簡易実装)
                         playerLocalPos.y -= playerVelocity.y * delta; // 戻す
                         playerVelocity.y = 0;
                         isGrounded = true;
                    }
                }

                document.getElementById('ui-coords').innerText = `${playerLocalPos.x.toFixed(1)}, ${playerLocalPos.z.toFixed(1)}`;

                // アバター同期
                localAvatar.position.copy(playerLocalPos);
                updateAvatarAnim(localAvatar, moved, isGrounded, delta, targetAvatarRotation, cameraPitch);
                localAvatar.visible = !isFPS; 

                // モノレールアニメーション
                if (trackSpline && monorailCars.length > 0) {
                    for(let i = 0; i < monorailCars.length; i++) {
                        monorailProgress[i] += monorailSpeed * (delta * 60); 
                        if (monorailProgress[i] > 1) monorailProgress[i] -= 1;
                        
                        const pt = trackSpline.getPoint(monorailProgress[i]);
                        const tangent = trackSpline.getTangent(monorailProgress[i]);
                        
                        monorailCars[i].position.copy(pt);
                        monorailCars[i].rotation.y = Math.atan2(tangent.x, tangent.z);
                    }
                }

                // 他プレイヤーの補間移動とアニメーション
                Object.values(otherPlayers).forEach(op => {
                    let isOpMoving = false;
                    if (op.userData.movingTimer > 0) {
                        isOpMoving = true;
                        op.userData.movingTimer -= delta;
                    }
                    
                    if (op.userData.targetPos) {
                        op.position.lerp(op.userData.targetPos, 0.2); // スムーズな補間
                    }
                    
                    updateAvatarAnim(op, isOpMoving, op.userData.isGrounded, delta, op.userData.targetYaw || 0, op.userData.targetPitch || 0);
                });

                if ((moved || !isGrounded) && socket) {
                    socket.emit('playerMovement', { 
                        x: playerLocalPos.x, y: playerLocalPos.y, z: playerLocalPos.z, 
                        rotation: targetAvatarRotation, pitch: cameraPitch,
                        isGrounded: isGrounded
                    });
                }

                // カメラ制御
                const headTarget = playerLocalPos.clone();
                headTarget.y += 2.2; 

                if (isFPS) {
                    camera.position.copy(playerLocalPos);
                    camera.position.y += 2.2; 
                    const lookDir = new THREE.Vector3(
                        -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                        Math.sin(cameraPitch),
                        -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                    );
                    camera.lookAt(camera.position.clone().add(lookDir));
                } else {
                    const distance = 5.0; 
                    const horizontalDist = Math.cos(cameraPitch) * distance;
                    const verticalDist = Math.sin(cameraPitch) * distance;

                    const offset = new THREE.Vector3(
                        Math.sin(cameraYaw) * horizontalDist,
                        -verticalDist, 
                        Math.cos(cameraYaw) * horizontalDist
                    );
                    
                    camera.position.copy(headTarget).add(offset);
                    
                    if (cameraPitch > 0) {
                        const pushBack = cameraPitch * 3.0; 
                        const fwdVec = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
                        camera.position.addScaledVector(fwdVec, -pushBack);
                        
                        const minHeight = playerLocalPos.y + 1.0 + (cameraPitch * 1.5);
                        if (camera.position.y < minHeight) camera.position.y = minHeight;
                    }

                    if (camera.position.y < playerLocalPos.y + 0.2) {
                        camera.position.y = playerLocalPos.y + 0.2;
                    }
                    camera.lookAt(headTarget);
                }
            }

            renderer.render(scene, camera);
        }
    </script>
